metadata:
  testmo_id: null
  id: TC007
  name: "Tesla Pricing - Legacy Data Conflict Prevention"
  feature: tesla-pricing
  priority: critical
  state: draft
  platforms: [iOS, Android]
  regions: [NNA]
  tags: [data-integrity, regression, ios-bug]
  custom_references: "Slack bug report - iOS showing both data sources"
  created_at: "2026-01-29"

description: |
  Verify that when TariffPricing (V3) is enabled and succeeds, fees from
  legacy PricingDetails are NOT displayed. Regression test for iOS bug where
  both data sources were shown simultaneously on Charge Station Details screen.

  Context: Two pricing data sources exist:
  - PricingDetails (legacy/old UI)
  - TariffPricing (new Tesla Pricing V3)

  Business rule: When TariffPricing succeeds, ONLY show TariffPricing data.
  Do NOT mix or show duplicate fees from PricingDetails.

preconditions:
  - description: User is on Charge Station Details screen
  - description: Vehicle enrolled with EmpAccountStatusEnum.ACTIVE
  - description: Feature flag "EnablePlugAndChargeFoundational" is enabled
  - description: Feature flag "EnablePlugAndCharge" is enabled
  - description: Feature flag "EnableTariffPricingV3" is enabled
  - description: Station has BOTH PricingDetails and TariffPricing data available
  - description: TariffPricing API call succeeds with valid response

steps:
  - id: 1
    action: Load Charge Station Details for station with both data sources
    expected: TariffPricing fees display (energy, session, idling, congestion) | PricingDetails fees NOT visible anywhere | No duplicate fee information

  - id: 2
    action: Verify pricing breakdown modal shows TariffPricing data only
    expected: All fee breakdowns from TariffPricing V3 | No legacy PricingDetails data mixed in | Single source of truth displayed

  - id: 3
    action: Test iOS specifically (regression validation)
    expected: iOS behavior matches Android | No PricingDetails fees shown on iOS | Bug does not reoccur

  - id: 4
    action: Inspect station card collapsed view pricing
    expected: Pricing summary derived from TariffPricing only | Consistent with expanded view | No legacy data leakage

  - id: 5
    action: Test TariffPricing API failure scenario
    expected: Falls back to PricingDetails gracefully | Shows legacy pricing as fallback | Clear indication of fallback state (if any)

  - id: 6
    action: Verify data source indicator (if implemented)
    expected: UI indicates data source (V3 vs legacy) if designed | Consistent labeling across screens

notes: |
  Critical iOS bug discovered via Slack (2026-01-26):
  - iOS was displaying fees from PricingDetails even when TariffPricing V3 succeeded
  - This created confusion: users saw duplicate or conflicting pricing
  - Android did not have this issue (correct behavior)

  Root cause: iOS wasn't properly suppressing PricingDetails when TariffPricing active

  Two distinct data sources:
  1. PricingDetails: Legacy pricing UI data (old)
  2. TariffPricing: New Tesla Pricing V3 data (current)

  Business rule (confirmed via Slack):
  - When EnableTariffPricingV3 = true AND TariffPricing API succeeds
  - ONLY show TariffPricing data
  - Do NOT show PricingDetails

  Fallback scenario:
  - If TariffPricing fails/unavailable → show PricingDetails as fallback

  Test account: nnaqa+2@bethinklabs.com (NNA STG)
  Platform focus: iOS (where bug occurred) but test both for parity

  Related: Collapsed state pricing issues mentioned in Slack (both platforms)
