metadata:
  testmo_id: null
  id: TC002
  name: "Tesla Pricing - Pricing Information & Details Modals"
  feature: tesla-pricing
  priority: high
  state: draft
  platforms: [iOS, Android]
  regions: [NNA]
  tags: []
  custom_references: "86b81ncag, 86b81q1hd, 86b81nexm, 86b81q1hv"
  created_at: "2026-01-29"

description: |
  Verify that the Pricing Information Modal and Additional Information Modal display tariffPricing V3 data correctly, including pricing breakdown, fee explanations, and terms, with proper navigation between modals

preconditions:
  - description: User is on Charge Station Details screen
  - description: Feature flag "EnableTeslaPricing" is enabled
  - description: User has selected a Tesla charging station with tariffPricing V3 data
  - description: Station has pricing data including energy fees, session fees, and additional information

steps:
  - id: 1
    action: Tap on the "Pricing Information" icon or button on station details
    expected: Pricing Information Modal opens | Modal displays title "Pricing Details" or similar | Modal shows tariffPricing V3 data including energy rates and fees

  - id: 2
    action: Review pricing breakdown in Pricing Information Modal
    expected: Energy rate is displayed with correct unit ($/kWh or $/minute) | Session fee is shown (if applicable) | Additional fees are listed (idling, congestion if present) | Total estimated cost is calculated | All amounts show currency symbol ($)

  - id: 3
    action: Tap on "Additional Information" or "Learn More" link/button within modal
    expected: Additional Information Modal opens | Modal displays fee explanations and terms | Content includes grace periods, fee conditions, and pricing policies | Text is readable and properly formatted

  - id: 4
    action: Navigate back from Additional Information Modal
    expected: Additional Information Modal closes | User returns to Pricing Information Modal | Pricing data remains visible

  - id: 5
    action: Close Pricing Information Modal using close button or tap outside modal
    expected: Modal closes | User returns to charging station details screen | Station details remain visible

  - id: 6
    action: Test with station where tariffPricing.additionalInfo is null or empty
    expected: Pricing Information Modal displays normally | "Additional Information" link is hidden or disabled | No errors occur with missing additionalInfo

notes: |
  Test with various pricing scenarios: flat rate, time-of-day pricing, with/without session fees
  Verify modal overlay prevents interaction with background content
  Test modal scroll behavior if content exceeds screen height
  Additional Information content may vary by station operator
