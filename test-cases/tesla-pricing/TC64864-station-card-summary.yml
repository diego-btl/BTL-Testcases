metadata:
  testmo_id: 64864
  id: TC64864
  name: Tesla Pricing - Station Card Pricing Summary
  feature: tesla-pricing
  priority: medium
  state: draft
  platforms:
  - iOS
  - Android
  regions:
  - NNA
  tags: []
  custom_references: 86b7uevkg
  created_at: '2026-01-29'
description: 'Verify that the collapsed pricing summary displays correctly on charging
  station cards in the station list view, showing the most relevant pricing information
  in a compact format

  '
preconditions:
- description: User is on Charge screen with station list view
- description: Feature flag "EnableTeslaPricing" is enabled
- description: Multiple Tesla charging stations with tariffPricing data are visible
    in the list
steps:
- id: 1
  action: View charging station cards in list view
  expected: Each Tesla station card displays pricing summary | Pricing is shown in
    collapsed/compact format | Most relevant rate is highlighted (e.g., lowest energy
    rate)
- id: 2
  action: Review pricing summary format on station card
  expected: Pricing displays rate with unit (e.g., "$0.42/kWh") | Format is compact
    and readable | Currency symbol is present | Pricing is visually distinct from
    other station info
- id: 3
  action: Compare pricing across multiple station cards
  expected: Each station shows its respective pricing | Different rates are displayed
    correctly per station | Pricing format is consistent across all cards
- id: 4
  action: Tap on a station card with pricing summary
  expected: Navigation to Station Details screen occurs | Full pricing breakdown becomes
    available | Collapsed summary transitions to expanded view
- id: 5
  action: View station card where tariffPricing is null or unavailable
  expected: Station card displays without pricing summary | No pricing information
    shown | Other station details (name, distance, availability) display normally
    | No error state or broken UI
- id: 6
  action: Test with station that has multiple pricing tiers or time-of-day pricing
  expected: Collapsed summary shows most useful pricing indicator (e.g., "From $0.35/kWh"
    or lowest rate) | Summary is clear despite complex pricing structure
notes: 'Pricing summary should prioritize user decision-making (typically lowest or
  base rate)

  Test with various pricing structures: flat rate, tiered, time-of-day

  Verify pricing updates when list is refreshed

  Performance: Pricing should not slow down list scrolling

  '
