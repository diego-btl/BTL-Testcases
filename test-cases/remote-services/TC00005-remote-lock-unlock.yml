metadata:
  id: TC00005
  name: "Remote Lock/Unlock Vehicle"
  feature: remote_services
  priority: critical
  platforms:
    - iOS
    - Android
  regions:
    - USA
    - Canada
    - Mexico
    - Brazil
  tags:
    - smoke
    - critical-path
    - telematics
    - security
  created: 2024-03-15
  updated: 2025-01-28
  author: diego.garcia
  testmo_id: null

preconditions:
  - description: "User is logged in with biometric authentication"
  - description: "Vehicle is enrolled and connected to telematics"
    automation_id: "setup_enrolled_vehicle"
  - description: "Vehicle is currently unlocked (for lock test) or locked (for unlock test)"
  - description: "Vehicle is in park with engine off"

steps:
  - id: 1
    action: "Navigate to vehicle dashboard"
    expected: "Dashboard displays current lock status (Unlocked)"
    element:
      id: "vehicle_dashboard"
      ios_identifier: "VehicleDashboardView"
      android_identifier: "com.nissan.connect:id/vehicle_dashboard"

  - id: 2
    action: "Tap 'Lock' button in quick actions"
    expected: "Biometric authentication prompt appears for security verification"
    element:
      ios_identifier: "LockButton"
      android_identifier: "btn_lock"

  - id: 3
    action: "Complete biometric authentication"
    expected: "Authentication succeeds, confirmation modal displays with vehicle info"
    timeout: 3s

  - id: 4
    action: "Tap 'Confirm Lock' in modal"
    expected: "Success message displays, button shows 'Locking...' state"
    api_call:
      mutation: "remoteLockVehicle"

  - id: 5
    action: "Wait for vehicle confirmation"
    expected: "Within 30 seconds: Lock status updates to 'Locked', horn chirps once (if enabled), headlights flash"
    timeout: 30s

  - id: 6
    action: "Verify push notification"
    expected: "Push notification received: 'Your Nissan is now locked'"

  - id: 7
    action: "Tap 'Unlock' button"
    expected: "Biometric authentication prompt appears"
    element:
      ios_identifier: "UnlockButton"
      android_identifier: "btn_unlock"

  - id: 8
    action: "Complete biometric and confirm unlock"
    expected: "Success message displays, vehicle unlocks within 30 seconds"
    api_call:
      mutation: "remoteUnlockVehicle"

  - id: 9
    action: "Verify unlock notification"
    expected: "Push notification: 'Your Nissan is now unlocked'"

regional_variations:
  Brazil:
    - step: 6
      note: "Notification in Portuguese: 'Seu Nissan esta trancado'"
    - step: 9
      note: "Notification in Portuguese: 'Seu Nissan esta destrancado'"

automation:
  framework: maestro
  test_file: "tests/remote-services/lock-unlock.yaml"
  coverage: partial
  notes: "Steps 1-4, 7-8 automated. Vehicle response (steps 5, 6, 9) requires integration with vehicle simulator"

traceability:
  clickup_task: "https://app.clickup.com/t/86c7zvhwk"
  user_story: "ONEAPP-3001"
  figma_link: "https://figma.com/file/ABC123/Remote-Services"

change_log:
  - date: 2025-01-28
    author: diego.garcia
    change: "Added unlock flow and push notification verification"
  - date: 2024-03-15
    author: diego.garcia
    change: "Initial test case creation"
