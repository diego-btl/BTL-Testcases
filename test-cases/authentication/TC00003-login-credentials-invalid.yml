metadata:
  id: TC00003
  name: "Login with Invalid Credentials - Error Handling"
  feature: authentication
  priority: high
  platforms:
    - iOS
    - Android
  regions:
    - USA
    - Canada
    - Mexico
    - Brazil
  tags:
    - regression
    - security
    - negative-test
  created: 2024-02-15
  updated: 2025-01-28
  author: diego.garcia
  testmo_id: null

preconditions:
  - description: "App is installed"
  - description: "User has a registered account"
  - description: "User is logged out"

steps:
  - id: 1
    action: "Launch the app and navigate to login screen"
    expected: "Login screen displays with email and password fields"
    element:
      id: "login_screen"
      ios_identifier: "LoginViewController"
      android_identifier: "com.nissan.connect:id/login_activity"

  - id: 2
    action: "Enter valid email address"
    expected: "Email field accepts input, no validation error"
    element:
      ios_identifier: "EmailTextField"
      android_identifier: "input_email"

  - id: 3
    action: "Enter incorrect password"
    expected: "Password field accepts input with masked characters"
    element:
      ios_identifier: "PasswordTextField"
      android_identifier: "input_password"

  - id: 4
    action: "Tap 'Sign In' button"
    expected: "Loading indicator appears while authentication is processed"
    api_call:
      mutation: "authenticateUser"

  - id: 5
    action: "Observe authentication failure"
    expected: "Error message displays: 'Invalid email or password. Please try again.' Login form remains visible with email preserved"

  - id: 6
    action: "Attempt login with wrong password 4 more times (5 total failures)"
    expected: "After 5th attempt, account is temporarily locked with message: 'Too many failed attempts. Please try again in 15 minutes or reset your password.'"

regional_variations:
  Mexico:
    - step: 5
      note: "Error message in Spanish: 'Correo electronico o contrasena incorrectos'"
  Brazil:
    - step: 5
      note: "Error message in Portuguese: 'E-mail ou senha invalidos'"

automation:
  framework: maestro
  test_file: "tests/authentication/invalid-credentials.yaml"
  coverage: partial
  notes: "Steps 1-5 automated. Step 6 (lockout) requires separate test to avoid account lockout in CI"

traceability:
  clickup_task: "https://app.clickup.com/t/86c7zvhwi"
  user_story: "ONEAPP-1002"

change_log:
  - date: 2025-01-28
    author: diego.garcia
    change: "Added account lockout verification step"
  - date: 2024-02-15
    author: diego.garcia
    change: "Initial test case creation"
