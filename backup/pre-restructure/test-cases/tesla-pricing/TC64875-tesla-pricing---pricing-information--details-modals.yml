metadata:
  id: TC64875
  name: Tesla Pricing - Pricing Information & Details Modals
  feature: tesla-pricing
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-29'
  updated: '2026-01-29'
  author: user_2
  testmo_id: 64875
description: Verify that the Pricing Information Modal and Additional Information
  Modal display tariffPricing V3 data correctly, including pricing breakdown, fee
  explanations, and terms, with proper navigation between modals
preconditions:
- description: User is on Charge Station Details screen
- description: Vehicle enrolled with EmpAccountStatusEnum.ACTIVE
- description: Feature flag "EnablePlugAndChargeFoundational" is enabled
- description: Feature flag "EnablePlugAndCharge" is enabled
- description: Feature flag "EnableTariffPricingV3" is enabled
- description: User has selected a Tesla charging station with tariffPricing V3 data
- description: Station has pricing data including energy fees, session fees, and additional
    information
steps:
- id: 1
  action: Tap on the "Pricing Information" icon or button on station details
  expected: Pricing Information Modal opens | Modal displays title "Pricing Details"
    or similar | Modal shows tariffPricing V3 data including energy rates and fees
- id: 2
  action: Review pricing breakdown in Pricing Information Modal
  expected: Energy rate is displayed with correct unit ($/kWh or $/minute) | Session
    fee is shown (if applicable) | Additional fees are listed (idling, congestion
    if present) | Total estimated cost is calculated | All amounts show currency symbol
    ($)
- id: 3
  action: Tap on "Additional Information" or "Learn More" link/button within modal
  expected: Additional Information Modal opens | Modal displays fee explanations and
    terms | Content includes grace periods, fee conditions, and pricing policies |
    Text is readable and properly formatted
- id: 4
  action: Navigate back from Additional Information Modal
  expected: Additional Information Modal closes | User returns to Pricing Information
    Modal | Pricing data remains visible
- id: 5
  action: Close Pricing Information Modal using close button or tap outside modal
  expected: Modal closes | User returns to charging station details screen | Station
    details remain visible
- id: 6
  action: Test with station where tariffPricing.additionalInfo is null or empty
  expected: Pricing Information Modal displays normally | "Additional Information"
    link is hidden or disabled | No errors occur with missing additionalInfo
