metadata:
  id: EDGE03
  name: "Login / Logout & \"Quoted\" Test | Special <chars> @ #hashtag"
  feature: login
  priority: high
  platforms:
    - iOS
  regions:
    - NNA
  tags: ["tag/with/slash", "tag:with:colon", "tag&ampersand"]
  created: '2026-01-29'
  updated: '2026-01-29'
  author: user_2
  testmo_id: null
description: |
  Test with special characters:
  - Slashes /
  - Quotes "double" and 'single'
  - Ampersands &
  - Less than < and greater than >
  - Pipes |
  - At symbols @
  - Hashtags #
preconditions:
  - description: "User has \"admin\" role & <super> privileges"
steps:
  - id: 1
    action: "Enter email: user@example.com"
    expected: "Email field accepts @ symbol"
  - id: 2
    action: "Enter password with special chars: P@ssw0rd!#$"
    expected: "Password accepts: !@#$%^&*()"
  - id: 3
    action: "Click <Login> | Verify redirect"
    expected: "User sees dashboard & profile"
