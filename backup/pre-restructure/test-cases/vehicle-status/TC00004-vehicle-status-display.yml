metadata:
  id: TC00004
  name: "Vehicle Status Display - Dashboard Overview"
  feature: vehicle_status
  priority: high
  platforms:
    - iOS
    - Android
  regions:
    - USA
    - Canada
    - Mexico
    - Brazil
  tags:
    - smoke
    - critical-path
    - telematics
  created: 2024-03-01
  updated: 2025-01-28
  author: diego.garcia
  testmo_id: null

preconditions:
  - description: "User is logged in"
  - description: "Vehicle is enrolled and connected to telematics"
    automation_id: "setup_enrolled_vehicle"
  - description: "Vehicle has reported status within last 24 hours"

steps:
  - id: 1
    action: "Navigate to vehicle dashboard from home screen"
    expected: "Dashboard loads within 3 seconds showing vehicle image and status cards"
    element:
      id: "vehicle_dashboard"
      ios_identifier: "VehicleDashboardView"
      android_identifier: "com.nissan.connect:id/vehicle_dashboard"
    timeout: 3s

  - id: 2
    action: "Verify vehicle information display"
    expected: "Vehicle name, model year, and VIN (last 4 digits) are displayed correctly"

  - id: 3
    action: "Check fuel/battery level indicator"
    expected: "Fuel gauge shows current level with percentage (e.g., '75%') and estimated range in miles"

  - id: 4
    action: "Verify door/lock status"
    expected: "Lock status indicator shows 'Locked' or 'Unlocked' with door diagram showing individual door states"
    element:
      ios_identifier: "DoorStatusView"
      android_identifier: "view_door_status"

  - id: 5
    action: "Check tire pressure display"
    expected: "All four tires show pressure readings in PSI with visual indicator (green=OK, yellow=low, red=critical)"

  - id: 6
    action: "Verify last updated timestamp"
    expected: "Timestamp shows when vehicle last reported status (e.g., 'Updated 5 minutes ago')"

  - id: 7
    action: "Tap refresh button"
    expected: "Status refreshes with loading indicator, timestamp updates to 'Updated just now'"
    api_call:
      query: "getVehicleStatus"

regional_variations:
  USA:
    - step: 3
      note: "Range displayed in miles"
    - step: 5
      note: "Tire pressure in PSI"
  Canada:
    - step: 3
      note: "Range displayed in kilometers"
    - step: 5
      note: "Tire pressure in kPa"
  Mexico:
    - step: 3
      note: "Range displayed in kilometers"
    - step: 5
      note: "Tire pressure in kPa"
  Brazil:
    - step: 3
      note: "Range displayed in kilometers"
    - step: 5
      note: "Tire pressure in kPa"

automation:
  framework: maestro
  test_file: "tests/vehicle-status/dashboard-display.yaml"
  coverage: partial
  notes: "Steps 1-4, 6-7 automated. Step 5 tire pressure requires vehicle simulator configuration"

traceability:
  clickup_task: "https://app.clickup.com/t/86c7zvhwj"
  user_story: "ONEAPP-2001"
  figma_link: "https://figma.com/file/GHI789/Vehicle-Dashboard"

change_log:
  - date: 2025-01-28
    author: diego.garcia
    change: "Added regional variations for metric/imperial units"
  - date: 2024-03-01
    author: diego.garcia
    change: "Initial test case creation"
