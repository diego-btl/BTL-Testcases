metadata:
  id: TC00002
  name: "Login with Biometric Authentication - Happy Path"
  feature: authentication
  priority: critical
  platforms:
    - iOS
    - Android
  regions:
    - USA
    - Canada
    - Mexico
    - Brazil
  tags:
    - smoke
    - critical-path
    - security
    - biometric
  created: 2024-02-10
  updated: 2025-01-28
  author: diego.garcia
  testmo_id: null

preconditions:
  - description: "App is installed and user is registered"
  - description: "Device has biometric authentication configured (Face ID/Touch ID or Fingerprint)"
  - description: "User has previously logged in and enabled biometric login"

steps:
  - id: 1
    action: "Launch the app from device home screen"
    expected: "App opens to login screen with biometric prompt"
    element:
      id: "login_screen"
      ios_identifier: "LoginViewController"
      android_identifier: "com.nissan.connect:id/login_activity"

  - id: 2
    action: "Tap 'Use Biometric' button or respond to automatic biometric prompt"
    expected: "Device biometric scanner activates (Face ID animation or fingerprint prompt)"
    element:
      ios_identifier: "BiometricLoginButton"
      android_identifier: "btn_biometric_login"

  - id: 3
    action: "Complete biometric authentication (face scan or fingerprint)"
    expected: "Authentication succeeds within 3 seconds"
    timeout: 3s

  - id: 4
    action: "Observe login completion"
    expected: "User is redirected to home dashboard, welcome message displays user's name"
    element:
      id: "home_dashboard"
      ios_identifier: "HomeDashboardView"
      android_identifier: "com.nissan.connect:id/home_dashboard"

  - id: 5
    action: "Verify session is established"
    expected: "User can access vehicle controls and account settings without re-authentication"

regional_variations:
  Brazil:
    - step: 4
      note: "Welcome message displays in Portuguese"

automation:
  framework: xctest
  test_file: "tests/authentication/biometric-login.swift"
  coverage: full
  notes: "Fully automated using XCTest biometric simulation"

traceability:
  clickup_task: "https://app.clickup.com/t/86c7zvhwh"
  user_story: "ONEAPP-1001"
  figma_link: "https://figma.com/file/DEF456/Authentication"

change_log:
  - date: 2025-01-28
    author: diego.garcia
    change: "Added biometric timeout verification"
  - date: 2024-02-10
    author: diego.garcia
    change: "Initial test case creation"
