metadata:
  id: TC28573
  name: Dealer Offers Card
  feature: dealer-offers
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2024-11-30'
  updated: '2025-12-19'
  author: user_2
  testmo_id: 28573
description: This test case should coverOffers and Promotions card displayDesign (Light
  / Dark Mode)Reordering the cardTap to navigate
preconditions:
- description: The user has a valid vehicle selected
- description: No Pending or Stolen vehicle
steps:
- id: 1
  action: 'The user reaches the Home screen ("EnableDealerOffers": "false")'
  expected: Not card for Offers and Promotions should be display
- id: 2
  action: 'The user reaches the Home Screen ("EnableDealerOffers": "true")'
  expected: The user should see a card at the bottom that reads Offers and Promotions
    as shown in the design
- id: 3
  action: The user taps on the card
  expected: The user should be taken to the Dealer Offers screen
- id: 4
  action: The user select one of the offers from the list
  expected: The user is redirect to Offer Details screen
- id: 5
  action: The user clicks the < arrow -> The user clicks the < arrow again
  expected: The user goes back to the previous screen > Dealer Offers | The user goes
    to the Home page
