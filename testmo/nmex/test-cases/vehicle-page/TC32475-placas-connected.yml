  - column_name: custom_steps
    id: 52908
    case_id: 32475
    text1: "<ol><li>Login in the app</li><li>Go to <code>Vehicle</code> option</li><li>Click\
      \ <code>Guantera</code></li><li>Tap <code>Placas</code> item</li><li>Edit the\
      \ <code>Placa</code> field</li><li>Change it end with <strong>even</strong>\
      \ number</li><li>Select a <code>Holograma</code> with <code>1</code> value</li><li>Click\
      \ the button <code>GUARDAR</code></li><li>Check the response if the value for:</li></ol><pre><code\
      \ class=\"editor-plain language-plain code-block\">          \"today\": {\n\
      \            \"allowed\": XXX\n          }</code></pre>"
    text2: null
    text3: '<p>A successful toast will be displaying  &gt; <code>Placa agregada</code></p><p>The
      card should be showing:</p><ul><li>If the value <code>"today": { "allowed":
      true }</code><ul><li>The placa value &gt; <code>XXXXXXX • <mark class="marker-green">Hoy
      circulas</mark></code> (in green)</li></ul></li><li>If the value <code>"today":
      { "allowed": false }</code><ul><li>The placa value &gt; <code>XXXXXXX • <mark
      class="marker-pink">Hoy no circulas</mark></code> (in red)</li></ul></li><li>The
      text underneath &gt;  <code>No circulas los días xxx(day of the week) ni el
      2do y 4to sábado del mes</code></li></ul>'
    text4: null
    display_order: 6
