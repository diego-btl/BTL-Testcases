    case_id: 32475
    text1: <ol><li>Login in the app</li><li>Go to <code>Vehicle</code> option</li><li>Click
      <code>Guantera</code></li><li>Tap <code>Placas</code> item</li><li>Edit the
      <code>Placa</code> field</li><li>Change it end with <strong>even</strong> number</li><li>Select
      a <code>Holograma</code> with <code>E</code> value</li><li>Click the button
      <code>GUARDAR</code></li></ol>
    text2: null
    text3: <p>A successful toast will be displaying  &gt; <code>Placa agregada</code></p><p>The
      card should be showing:</p><ul><li>The placa value &gt; <code>XXXXXXX • <mark
      class="marker-green">Hoy circulas</mark></code> (in green)</li><li>The text
      underneath &gt; <code>Circulas diario</code> </li></ul>
    text4: null
