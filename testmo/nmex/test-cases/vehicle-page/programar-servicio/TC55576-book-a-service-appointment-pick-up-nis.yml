    case_id: 55576
    text1: <ol><li>The see all the  options:<ol><li><code>Servicio de mantenimiento</code></li><li><code>Servicio
      Express</code></li><li><code>Servicio de reparación</code></li><li><code>Otro
      tipo de servicio</code></li></ol></li><li>Select the any of the previous options</li><li>In
      the <code>Selecciona el servicio requerido</code> select any of the options
      available</li><li>Click the <code>SIGUIENTE</code> button</li><li>Select the
      option &gt; <code>Servicio a mi puerta</code></li></ol>
    text2: null
    text3: <p>The dealer selected will show at under the title</p><ul><li><code>Tu
      distribuidor</code> &gt;</li><li><strong>XXXX</strong></li><li>The user will
      be able to select between:<ul><li><code>Llevaré mi vehículo al Distribuidor
      Nissan</code> <strong>(Default)</strong></li><li><code>Servicio a mi puerta</code>
      &gt; <strong>Checked</strong></li></ul></li><li><code>SIGUIENTE</code> button
      is enable </li></ul>
    text4: null
    display_order: 10
  - column_name: custom_steps
    id: 85631
    case_id: 55576
    text1: <ol><li>Select a valid date and time slot on the <code>Elige la fecha y
      hora</code> page</li><li>Tap on the <code>SIGUIENTE</code> button</li></ol>
    text2: null
    text3: <ul><li>The <code>Comentarios adicionales</code> screen will show</li><li>This
      is not a mandatory field it can be empty</li><li><code>SIGUIENTE</code> button
      is enable </li></ul>
    text4: null
    display_order: 11
  - column_name: custom_steps
    id: 85632
    case_id: 55576
    text1: <ol><li>Tap on the <code>SIGUIENTE</code> button</li></ol>
    text2: null
    text3: <ul><li>User is taken to the Preview screen:<ul><li><code>Servicio</code></li><li><code>Distribuidor</code></li><li><code>Fecha
      y Hora</code></li><li><code>¿Como quieres realizar tu servicio?</code></li><li><code>Comentarios
      adicionales</code></li></ul></li></ul>
    text4: null
    display_order: 12
  - column_name: custom_steps
    id: 85633
    case_id: 55576
    text1: <ol><li>Tap <code>AGENDAR CITA</code> on the Preview screen</li></ol>
    text2: null
    text3: <ul><li>Service booking request is sent to middleware</li><li>A loading
      state is shown while waiting for response</li><li>A confirmation screen will
      show:<ul><li><code>¡Cita agendada!</code></li><li><code>Recibirás un correo
      electrónico confirmando la cita con todos los detalles</code></li><li><code>AGREGAR
      A MI CALENDARIO</code> &gt; link to add it to you native calendar</li></ul></li></ul>
    text4: null
    display_order: 13
  - column_name: custom_steps
    id: 85634
    case_id: 55576
    text1: <ol><li>Booking is successful after tapping <code>AGENDAR CITA</code></li></ol>
    text2: null
    text3: <ul><li>User is redirected to Vehículo tab</li><li>Upcoming service card
      appears at the top</li><li>Card shows dealer, date, and time</li></ul>
    text4: null
    display_order: 14
  - column_name: custom_steps
    id: 85635
    case_id: 55576
    text1: <ol><li>Middleware responds with an error after tapping <code>AGENDAR CITA</code></li></ol>
    text2: null
    text3: <ul><li>User stays on the Preview screen</li><li>Toast error message appears
      with the mapped copy</li></ul>
    text4: null
    display_order: 15
  - column_name: custom_steps
    id: 85636
    case_id: 55576
    text1: <ol><li>Tap <code>CANCELAR</code> or <code>X</code> on any screen before
      successful booking</li></ol>
    text2: null
    text3: <ul><li>Native modal appears asking to confirm cancellation</li><li>If
      confirmed, user returns to Vehículo tab</li><li>If cancelled, modal dismisses
      and user stays in flow</li></ul>
    text4: null
    display_order: 16
  - column_name: custom_steps
    id: 85637
    case_id: 55576
    text1: <ol><li>Tap  <code>&lt;</code> button on any booking screen</li></ol>
    text2: null
    text3: <ul><li>User goes back to previous screen</li><li>Previously entered/selected
      data remains filled</li></ul>
    text4: null
    display_order: 17
  - column_name: custom_steps
    id: 85638
    case_id: 55576
    text1: <ol><li>Tap "Editar" on any section of Preview page</li></ol>
    text2: null
    text3: <ul><li>User is taken to correct page based on section:<ul><li><code>Distribuidor</code>
      → Shows warning dialog</li><li><code>Fecha y Hora </code>→ Back to date/time
      picker</li><li><code>Comentarios adicionales</code> → Comentarios page</li></ul></li></ul>
    text4: null
    display_order: 18
  - column_name: custom_steps
    id: 85639
    case_id: 55576
    text1: <ol><li>Tap "Editar" on Distribuidor section</li><li>Confirm dialog by
      tapping <code>Sí, reintentar</code></li></ol>
    text2: null
    text3: '<ul><li>Dialog shows:<ul><li>Title: <code>¿Reiniciar programación de servicio?</code></li><li>Body:
      <code>¿Estás seguro de que deseas cambiar esto? Tendrás que empezar de nuevo
      con una nueva cita de servicio.</code></li><li>CTAs: <code>Sí, reintentar</code>
      and <code>No, cancelar</code></li></ul></li><li>On confirmation, user is navigated
      to Mapa tab</li><li>On cancel, dialog is dismissed and user stays on Preview
      page</li></ul>'
    text4: null
    display_order: 19
  - column_name: custom_steps
    id: 85640
    case_id: 55576
    text1: <ol><li>Complete the service booking flow until the <code>Preview</code>
      page.</li><li>Select a time slot that becomes unavailable before booking.</li><li>Tap
      <code>AGENDAR CITA</code>.</li></ol>
    text2: null
    text3: <ul><li>The user remains on the <code>Preview</code> screen.</li><li>A
      <strong>toast error</strong> appears with the following message:<ul><li><code>La
      hora de cita elegida ya no está disponible.</code></li></ul></li></ul>
    text4: null
    display_order: 20
  - column_name: custom_steps
    id: 85641
    case_id: 55576
    text1: <ol><li>Complete the service booking flow until the <code>Preview</code>
      page.</li><li>Cause a generic failure (e.g., network issue, backend failure).</li><li>Tap
      <code>AGENDAR CITA</code>.</li></ol>
    text2: null
    text3: <ul><li>The user remains on the <code>Preview</code> screen.</li><li>A
      <strong>toast error</strong> appears with the following message:<ul><li><code>Se
      ha producido un error. Inténtelo de nuevo más tarde.</code></li></ul></li></ul>
    text4: null
    display_order: 21
