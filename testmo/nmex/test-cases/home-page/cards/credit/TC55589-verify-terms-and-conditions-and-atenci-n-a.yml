metadata:
  name: Verify Terms and Conditions and Atención a clientes links on Credits detail
    screen
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <ul><li>User is logged in with a valid account</li><li>A vehicle
    with an active credit service is selected</li><li>User is on the Credits detail
    screen where the <strong>Términos y condiciones</strong> and <strong>Atención
    a clientes</strong> links are visible</li></ul>
  steps:
  - column_name: custom_steps
    id: 85759
    case_id: 55589
    text1: <p>On the Credits detail screen, locate and tap the <strong>Atención a
      clientes</strong> link</p>
    text2: null
    text3: '<ul><li>The app opens the device dialer pre-filled with the correct phone
      number based on the vehicle brand and credit type:<ul><li>Infiniti: <code>8005463464</code></li><li>Nissan
      Tradicional/Leasing: <code>4491395871</code></li><li>Nissan Selectiviti: <code>4499944825</code></li></ul></li><li>The
      dialler opens successfully and awaits user action to place the call</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 85760
    case_id: 55589
    text1: <p>Locate and tap the <strong>Términos y condiciones</strong> link on the
      Credits detail screen</p>
    text2: null
    text3: '<ul><li>The app opens an in-app webview</li><li>The webview loads the
      correct URL based on the brand:<ul><li>Infiniti: <code>https://www.infinitifinance.mx/terminos-y-condiciones/infiniti</code></li><li>Nissan:
      <code>https://www.nrfm.mx/terminos-y-condiciones</code></li></ul></li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 85761
    case_id: 55589
    text1: <p>Use the back navigation in the webview</p>
    text2: null
    text3: <ul><li>The app navigates back to the Credits detail screen</li><li>The
      Credits detail screen remains functional and visible</li></ul>
    text4: null
    display_order: 3
