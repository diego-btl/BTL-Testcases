      or Red</li><li>Text - if you warranty is valid or expired</li><li>Text - when
      is your warranty expiring</li><li>Arrow - To access the <code>Warranty</code>
      screen</li></ul></li><li>Button - Schedule Service (<code>AGENDAR SERVICIO</code>)<ul><li>Open
