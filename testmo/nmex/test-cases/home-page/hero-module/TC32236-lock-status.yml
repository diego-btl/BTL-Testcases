  - column_name: custom_steps
    id: 52616
    case_id: 32236
    text1: <ol><li>Connect device to proxy</li><li>Login into the app</li><li>Wait
      for all initial APIs to finish loading</li><li>Modify <code>VehicleDynamicData</code>
      so that <code>vehicle.lockStatus.lockStatus</code> is <code>UNLOCKED</code>
      and modify <code>vehicle.doorStatus.overallLock.lock</code> is <code>LOCKED</code></li><li>Bg/Fg
      the app</li><li>Observe the lock status in the home hero</li></ol>
    text2: null
    text3: <ul><li>User should see the corresponding lock/unlock icon in the Hero
      Module</li><li>The app should be using vehicle.doorStatus data over vehicle.lockStatus
      data when available and should fall back to vehicle.lockStatus data when it
      is not available</li></ul>
