  - column_name: custom_steps
    id: 85369
    case_id: 32450
    text1: <ol><li>Go to the home page</li></ol>
    text2: null
    text3: '<ul><li>If the API <code>VehicleDynamicData</code> has the <code>fuelAutonomy</code>
      is lower than 20% the CTA <code>Buscar Gasolinera</code> will show</li><li>If
      the API <code>VehicleDynamicData</code> has the <code>MILS</code> with any value
      set as <code>TRUE</code>, the CTA for <code>Programar Servicio</code> will show</li><li>If
      <code>fuelAutonomy</code> is gather than 20% &amp; the vehicle doesn''t have
      any warning about <code>MILS</code> the CTA <code>Agregar Placas</code> will
      show if the values are:<ul><li>"plate": <code>NULL</code></li><li>"hologram":
      <code>NULL</code></li></ul></li><li>If none of the previous values meets, none
      of the cards will show</li><li>Any of the cards won''t appear together only
      separately </li></ul><figure class="image image_resized" style="width:48.9%;"><img
      src="/attachments/view/6691" alt="6691" /></figure>'
    text4: null
