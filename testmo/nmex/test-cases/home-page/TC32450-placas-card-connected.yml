test_case:
  preconditions: <p>The licence plate has some restrictions:</p><ul><li>Minimum of
    4 characters and max of 7</li><li>No special characters (Not able to type special
    characters)</li><li>The combination can be <strong>letters</strong> and <strong>numbers</strong></li><li>More
    info about Licence Plate for <a href="https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Mexico">NMEX</a> </li></ul>
  steps:
  - column_name: custom_steps
    id: 52832
    case_id: 32450
    text1: <p>1. See <code>Placas</code> card</p>
    text2: null
    text3: <ul><li>The Placa card should be at the top of the List</li><li>The Placas
      card shouldn't be editable (you can't reorganized)</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 52833
    case_id: 32450
    text1: <p>1. Tap <code>Placas</code> card</p>
    text2: null
    text3: '<p>User should see the <code>Placa</code> screen</p><ul><li>The Title
      should be displaying &gt; Placas</li><li>The title of the Vehicle should be
      displaying IE: <code>Mi 2024 QX80</code></li><li>The car placeholder should
      be showing</li><li>If the user doesn''t have Placa, the placeholder should be
      showing &gt; <code>#######</code></li><li>The field for placas should be editable</li><li>The
      subtitle <code>Holograma (Opcional)</code> should be showing</li><li>The list
      of Hologramas should be clickable and be able to selected and deselected  </li><li>The
      <code>GUARDAR</code> button won''t be enable till user types a license plate
      with the minimum requirements<br /> </li></ul><p><strong>Note: Fields should
      be empty if user has not previously saved license plate to app</strong></p>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 52834
    case_id: 32450
    text1: <ol><li>Tap <code>Placas</code> card</li><li>Edit the <code>Placa</code>
      field</li><li>Click the button <code>GUARDAR</code></li><li>Force the call to
      <strong>FAIL</strong></li></ol>
    text2: null
    text3: <p>A failing toast will be displaying  &gt; <code>Placa no agregada, por
      favor inténtalo de nuevo.</code></p>
    text4: null
    display_order: 3
