  preconditions: <ul><li>User has already preregistered accounts.  </li><li>User is
    on the first screen of registration page</li><li>User fills out First Name and
    Last Name fields</li></ul><p>Use  mocks attached in  ticket below  to get appropriate
    response from <code>ValidateNissanID</code></p><p> <a href="https://www.pivotaltracker.com/story/show/185493300"><u>https://www.pivotaltracker.com/story/show/185493300</u></a></p>
  steps:
  - column_name: custom_steps
    id: 52546
    case_id: 32164
    text1: <p>User Inputs an Email and Confirm Email of an account that already exists
      and taps on <code>Next</code>  button.  Verify typename response from <code>ValidateNissanID</code>
       is <code>NissanIdExists</code></p><p>User Inputs an Email and Confirm Email
      of an account that already exists and tap on<code>Next</code>  button.  Verify
       typename response from  <code>ValidateNissanID</code>  is <code>NissanIDRequiresOwnerPortalPwReset</code>
      or <code>NissanIDRequiresOwnerPortalProfileCompletion</code> or</p><p><code>NissanIdRequiresNMACPWReset</code></p><p>User
      taps on Confirm button</p>
    text2: null
    text3: '<p>Red asterisk "*" is displayed at the beginning of warning message<br
      />Warning  message is displayed as " <code>* Ya existe un usuario con esta dirección
      de correo electrónico. Por favor, INICIA SESIÓN en su lugar</code></p><p>Modal
      is displayed as below:<br />Header:  Action Required<br />Text:  We are improving
      our data security. Please reset your NISSAN ID password</p><p>CTA:   Cancel <br
      />CTA:   Confirm</p><p>User is redirected to  <code>link</code> on the response</p>'
    text4: null
