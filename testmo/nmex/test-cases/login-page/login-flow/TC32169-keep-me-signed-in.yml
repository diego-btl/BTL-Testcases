test_case:
  preconditions: <ul><li>Fresh installation or app cache cleared</li><li>User is already
    on the <code>Login</code> page</li><li>Biometric flow is not covered, must be
    skipped</li><li>Onboarding cards are not covered, must be skipped</li></ul>
  steps:
  - column_name: custom_steps
    id: 52551
    case_id: 32169
    text1: <ul><li>Enter a valid email on the <code>Email</code> text field</li><li>Enter
      a valid password on the <code>Password</code> text field</li><li>Select the
      <code>Keep me Signed in</code> checkmark below the <code>Password</code> text
      field</li></ul><p>With the <code>Keep me Signed in</code> checkmark selected,
      tap on the <code>SIGN IN</code> button</p><p>if <code>Terms of Service</code>
      page is displayed, select the <code>I have read and accept the <strong>App Terms
      of Service</strong></code> checkmark and tap on the <code>SAVE</code> button</p><ul><li>Close
      the app by triggering the Recent Apps interaction and closing swiping away the
      app</li><li>Reopen the app by tapping on the app icon</li><li>Go to the <code>Settings</code>
      page</li><li>At the bottom of the page tap on the <code>SIGN OUT</code> button</li></ul><p>Tap
      <code>Yes</code></p><ul><li>Close the app by triggering the Recent Apps interaction
      and closing swiping away the app</li><li>Reopen the app by tapping on the app
      icon</li></ul>
    text2: null
    text3: <p>The checkmark is selected or deselected depending of the user interaction</p><p>The
      Login flow is triggered</p><p>User is driven to the <code>Home</code> page</p><p>User
      is driven to the <code>Home</code> page without any interaction from the user</p><p>The
      Sign Out modal should be displayed</p><p>The user is driven to the <code>Login</code>
      page</p><p>User is driven to the <code>Login</code> page</p>
    text4: null
    display_order: 1
  notes: <ul><li>User should remain logged in until their token expires (after 90
    days)</li><li>Setting is disabled if user manually Signs Out</li></ul>
