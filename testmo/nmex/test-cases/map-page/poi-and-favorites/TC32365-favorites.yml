  steps:
  - column_name: custom_steps
    id: 52736
    case_id: 32365
    text1: <ol><li>Login into the app</li><li>Go to <code>Mapa</code> option</li><li>Scroll
      the map info drawer</li><li>Swipe on the swimlane</li><li>Check the <code>Favoritos</code>
      section</li></ol>
    text2: null
    text3: <ul><li>User should see a <code>Favoritos</code> section (maximum of 5)</li><li>User
      should be able to scroll horizontally</li><li>User should see search performed
      for the corresponding favourite, map centers on result and shows POI card</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 94811
    case_id: 32365
    text1: <ol><li>Login into the app</li><li>Go to <code>Mapa</code> option</li><li>Scroll
      the map info drawer</li><li>Swipe on the swimlane</li><li>Check the <code>Favoritos</code>
      section</li><li>Click <code>Ver más</code> button</li></ol>
    text2: null
    text3: <ul><li>The List View should show all the Favourite results with:<ul><li>Title
      &gt; <code>Favoritos</code><ul><li>Name</li><li>Address</li><li>Send to the
      car icon / Call icon</li><li>Favourite logo</li><li>Distance to the location
      in <code>KM</code></li></ul></li></ul></li><li>If there are no <code>Favoritos</code>,
      the See More button will be disabled or user should see a scrolling view of
      POI cards if there are <code>Favoritos</code>.</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
