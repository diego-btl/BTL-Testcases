test_case:
  preconditions: '<p>In Firebase (on proxyman), you should see the field <code>WhatsNew</code>
    is with some value against it. Below is an example. </p><p> <code>"WhatsNew":
    "{\"version\":\"6.4.27\",\"messages\":[\"This is the WNM For NNA Only!\",\"And
    just for Android 6.4.27\",\"We''re good!\"]}"</code></p><figure class="image"><img
    src="/attachments/view/3194" alt="3194" /></figure><figure class="image"><img
    src="/attachments/view/3193" alt="3193" /></figure><p>In Firebase console, under
    Remote Config, ensure  that there are parameters/conditions for the version you
    are testing on with new text. We are doing this to ensure that the app picks up
    new copy from Firebase dynamically. Example screenshots above. </p><figure class="image"><img
    src="/attachments/view/3195" alt="3195" /></figure>'
  steps:
  - column_name: custom_steps
    id: 52534
    case_id: 32152
    text1: '<p>Install an older version of app. app should be older than 6.4.X and
      3.7.X. </p>

      <p>Tap on Don''t show this again</p><p>And Ok, got it for Whats new Modal</p>

      <p>Exit out of app</p>

      <p>Go back to app</p>

      <p>You an also log out and log back in</p>

      <p>Now update the app version to the version that''s configured in Firebase
      Console (with the new copy)</p>'
    text2: null
    text3: '<p>Then Onboarding cards should show</p><p>Whats new Modal should show** </p><p>**NOTE:
      if the app is greater than 6.4.X or 3.7.X, you should not see the WNM modal.
      Only Onboarding cards should show</p>

      <p>You shouldn''t see onboarding cards and the What''s new Modal</p>

      <p>You shouldn''t see onboarding cards and the What''s new Modal</p>

      <p>You should not see onboarding cards</p><p>You should see the What''s new
      Modal with the new copy</p>'
    text4: null
    display_order: 1
