      back to the emergency contacts screen and see updated data when the deletion
      succeeds</li><li><code>DeleteEmergencycontacts </code>and <code>Emergencycontacts</code>
      apis are triggered<br /> </li></ul><p><strong>NOTE: If saving fails, there should
      no longer be a loading state and user should see fields become enabled with
      the next toast:</strong></p><p><code>Error al borrar el contacto de emergencia</code></p>'
