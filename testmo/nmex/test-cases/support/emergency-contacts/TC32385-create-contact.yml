test_case:
  preconditions: <p>User is on the <code>Contactos de Emergencia</code> sheet and
    has less than 4 emergency contacts already created</p>
  steps:
  - column_name: custom_steps
    id: 52754
    case_id: 32385
    text1: '<ol><li>Tap <code>AGREGAR UN CONTACTO</code></li><li>Fill in all the required
      information ensuring the criteria is met for each field</li><li>Tap <code>GUARDAR</code></li><li>Wait
      for saving to succeed</li></ol><p>Emergency Contact Criteria:</p><ul><li><strong><u>Nombre</u></strong>:
      At least 2 characters entered (letters only, no special characters)</li><li><strong><u>Apellido</u></strong>:
      At least 2 characters entered (letters  only, no special characters)</li><li><strong><u>Teléfono
      Principa</u></strong>l: Exactly 10 digits entered</li><li><strong><u>Teléfono
      Secundario (Opcional)</u></strong>: Exactly 10 digits entered</li><li><strong><u>Relación</u></strong>:
      An item selected</li></ul>'
    text2: null
    text3: '<ol><li>User should be taken to the <code>Agregar Contacto</code> sheet</li><li>User
      should see <code>GUARDAR</code> button should be enabled when they fill in all
      fields</li><li>User should see all fields become disabled and a loading state
      as the saving call is being made<ol><li><code>Contacto de emergencia guardado
      con éxito</code> (This text is different on both platforms)</li></ol></li><li>User
      should be brought back to the emergency contacts screen and see updated data
      when saving succeeds</li><li><code>CreateEmergencycontacts</code> and <code>Emergencycontacts</code>
      apis are triggered</li></ol><p><strong>NOTE: If saving fails, there should no
      longer be a loading state and user should see fields become enabled with the
      next toast:</strong></p><p><code>Error al guardar el contacto de emergencia</code></p>'
    text4: null
    display_order: 1
