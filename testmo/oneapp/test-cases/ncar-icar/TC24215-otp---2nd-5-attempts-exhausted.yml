metadata:
  id: TC24215
  name: OTP - 2nd 5 attempts exhausted
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2024-08-28'
  updated: '2024-10-17'
