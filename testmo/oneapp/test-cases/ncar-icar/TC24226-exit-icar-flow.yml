preconditions:
- description: User has an icar deeplink
steps:
- id: 1
  action: 1. Tap on the deeplink 2. Close out of the icar flow
  expected: 1. User should either be in the existing user or new user icar flows 2.
    Upon exiting the icar flow in anyway, the user should no longer be able to get
    into the icar flow unless they tap on a deeplink If the user was in the new user
    flow, they should be returned to the app landing screen If the user was in the
    add vehicle flow, they should be returned to the app home screen (without any
    vehicles added)
