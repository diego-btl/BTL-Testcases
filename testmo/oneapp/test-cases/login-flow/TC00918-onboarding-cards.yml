preconditions:
- description: Fresh installation or app cache cleared
- description: Use any account with a valid Vehicle added (list on the description)
- description: User is already on the Login page
- description: Biometric flow is not covered, must be skipped
steps:
- id: 1
  action: Enter a valid email on the Email text field -> Enter a valid password on
    the Password text field -> Tap on the SIGN IN button
  expected: The Login flow is triggered
- id: 2
  action: if Terms of Service page is displayed, select the I have read and accept
    the App Terms of Service checkmark and tap on the SAVE button
  expected: The Login flow is triggered and user should see the Onboarding Cards modal
- id: 3
  action: Use the bottom navigation carrots or swipe to see the next / previous card
  expected: User is able to cycle/navigate between the following cards:Controls |
    Ownership | Location | Support | EV card (N/A for Infiniti)
- id: 4
  action: Tap on the top right Close (x) button
  expected: User is driven to the Home page
- id: 5
  action: Close the app by triggering the Recent Apps interaction and closing swiping
    away the app -> Reopen the app by tapping on the app icon -> Login with the credentials
    used in Step 1
  expected: User is driven to the Login page | User should not see the Onboarding
    Cards on a subsequent login
