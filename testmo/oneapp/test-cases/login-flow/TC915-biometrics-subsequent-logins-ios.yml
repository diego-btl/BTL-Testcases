metadata:
  name: Biometrics - Subsequent Logins (iOS)
  priority: 2
  type: functional
  status: active
  estimate: 300000000
  automation: 'no'
  tags: []
test_case:
  preconditions: <ul><li>User has already logged into the app for the first time</li><li>User
    have previously enabled Biometric login with the app</li><li>This is the second
    time the user opens the app</li><li>User has Biometrics enabled on their device</li><li>App
    must be closed</li><li>Onboarding cards are not covered, must be skipped</li></ul>
  steps:
  - column_name: custom_steps
    id: 1209
    case_id: 915
    text1: <p>Open the app by tapping on the app icon</p>
    text2: null
    text3: <p>A <code>Face ID</code> modal with title "Do you want to allow <strong>${App
      Name} </strong>to use Face ID?" is displayed with two options:</p><ul><li>Do
      Not Allow</li><li>Ok</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 1210
    case_id: 915
    text1: <p>Tap <code>Ok</code> on the Modal</p>
    text2: null
    text3: <p>The <code>Face ID</code> recognition is triggered</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 1211
    case_id: 915
    text1: <p>Face away from the device to trigger an incorrect recognition</p>
    text2: null
    text3: <p><code>Face Not Recognized</code> modal is displayed with two options:</p><ul><li>Try
      Face ID Again</li><li>Cancel</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 1212
    case_id: 915
    text1: <p>Tap <code>Cancel</code></p>
    text2: null
    text3: <p>The app displays the Login page</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 1213
    case_id: 915
    text1: <p>Tap on the <code>Face ID</code> icon at the far right within the <code>Password</code>
      text field</p>
    text2: null
    text3: <p>The <code>Face ID</code> recognition is triggered</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 1216
    case_id: 915
    text1: <p>Face your device properly to get a positive recognition</p>
    text2: null
    text3: <p>User is driven to the Home page</p>
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 1217
    case_id: 915
    text1: <p>Close the app and reopen it again</p>
    text2: null
    text3: <p>The <code>Face ID</code> recognition is triggered without displaying
      the modal on <strong>Step 1</strong></p>
    text4: null
    display_order: 7
  notes: <p>On Step 1, if the user taps on <strong>Do Not Allow</strong> button, the
    <code>Face ID</code> will be disabled for the app, the only way to enable it again
    is by navigating to the App permissions</p>
