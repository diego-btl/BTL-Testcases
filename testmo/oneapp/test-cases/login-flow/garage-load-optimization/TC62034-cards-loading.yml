test_case:
  preconditions: <ul><li>Clean device without app installed.</li></ul>
  steps:
  - column_name: custom_steps
    id: 95711
    case_id: 62034
    text1: <ol><li>Do a fresh install of app</li><li>Log in with any valid account</li><li>Wait
      until all the APIs are loaded (spinning icon disappears)</li><li>Kill the app</li><li>Cold
      start (Reopen) the app</li><li>Observe the cards on Home screen</li></ol>
    text2: null
    text3: '<p>The  relevant cards should show right away. No loading indicators or
      placeholders should show. <br /><br /><strong>Note: </strong>You will see that
      compared to iOS, on android, some cards take a wee bit longer to load and some
      show right away. For e.g. MiL, Vehicle Status, Additional Driver card will show
      right away, the others will follow in a second or two. This is expected as android
      caching is a little slower than ios. </p><p>Also, Look at the sub text under
      Cards such as Climate, My Car Finder. The sub-text should show after a few seconds
      (having checked the latest update). it should not show cache value first, then
      disappear, and then show latest update. (in other words, it shouldn''t blink)</p>'
    text4: null
    display_order: 1
