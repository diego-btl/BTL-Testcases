preconditions:
- description: User has already logged into the app for the first time
- description: User have previously enabled Biometric login with the app
- description: This is the second time the user opens the app
- description: User has Biometrics enabled on their device
- description: App must be closed
- description: Onboarding cards are not covered, must be skipped
steps:
- id: 1
  action: Open the app by tapping on the app icon
  expected: Do Not Allow | Ok
- id: 2
  action: Tap Ok on the Modal
  expected: The Face ID recognition is triggered
- id: 3
  action: Face away from the device to trigger an incorrect recognition
  expected: Try Face ID Again | Cancel
- id: 4
  action: Tap Cancel
  expected: The app displays the Login page
- id: 5
  action: Tap on the Face ID icon at the far right within the Password text field
  expected: The Face ID recognition is triggered
- id: 6
  action: Face your device properly to get a positive recognition
  expected: User is driven to the Home page
- id: 7
  action: Close the app and reopen it again
  expected: The Face ID recognition is triggered without displaying the modal on Step
    1
