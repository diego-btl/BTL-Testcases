preconditions:
- description: Fresh installation or app cache cleared
- description: User is already on the Login page
- description: User has Biometrics enabled on their device
steps:
- id: 1
  action: Enter a valid email on the Email text field -> Enter a valid password on
    the Password text field
  expected: The text fields should display the input from the user | The SIGN IN button
    should remain inactive until both fields are filled
- id: 2
  action: Tap on the SIGN IN button
  expected: A loading spinner should be displayed on the screen | A Biometrics / Face
    ID modal is displayed on the screen
- id: 3
  action: Tap Yes on the Biometrics / Face ID modal
  expected: On Android devices, a Native Biometric Login prompt should appear | On
    iOS devices, the user should be driven to the Terms of Service page
- id: 4
  action: On Android devices, place the finger on the Fingerprint sensor
  expected: If the Fingerprint validation is incorrect, the Native Biometric Login
    prompt will display the proper error message | If the Fingerprint validation is
    correct the user should be driven to the Terms of Service page
