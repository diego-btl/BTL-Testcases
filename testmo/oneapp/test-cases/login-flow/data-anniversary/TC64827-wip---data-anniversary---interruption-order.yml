description: 'Validates that anniversary gift box appears last in the sequence of
  mandatory app interruptions and that each view persists until dismissed. Preconditions:
  Fresh install or clean cache EnableOwnerAnniversary FF = true User is eligible for
  multiple interruptions: What''s New modal is available Lite Account (Complete Profile)
  - NNA only, user missing address/phone 2nd Delivery eligible (SecondDeliveryEligibility
  = true) - NNA only PIN code not set IVI Profile not logged in App Key Features available
  Anniversary eligible (isAnniversary = true, anniversaryYear = 1-5) User logs in'
steps:
- id: 1
  action: Login to the app with VIN meeting all eligibility conditions
  expected: 'Interruptions appear in the following order (each must be dismissed before
    advancing): What''s New modal | Lite Account (Complete Profile) - if applicable
    (NNA only) | nd Delivery - NNA only | PIN code message | IVI Login | App Key Features
    | Anniversary gift box (appears LAST)'
- id: 2
  action: Dismiss each interruption one by one
  expected: Each view persists until dismissed | Next view appears only after previous
    is dismissed | Anniversary gift box appears LAST after all others are dismissed
