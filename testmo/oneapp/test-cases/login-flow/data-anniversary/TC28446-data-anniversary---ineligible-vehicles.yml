description: 'Validates that gift box animation does NOT appear for ineligible vehicle
  types (stolen, financial vehicles, additional driver). Preconditions: EnableOwnerAnniversary
  FF = true isAnniversary = true anniversaryYear = 1, 2, 3, 4, or 5'
steps:
- id: 1
  action: Login to the app with VIN marked as stolen
  expected: Gift box animation does NOT appear | User is taken to Home screen
- id: 2
  action: Login to the app with financial vehicle VIN
  expected: Gift box animation does NOT appear | User is taken to Home screen
- id: 3
  action: Login to the app as additional driver with VIN meeting anniversary conditions
  expected: Gift box animation does NOT appear | User is taken to Home screen
