metadata:
  id: TC64825
  name: Data Anniversary - 48 Hour Expiry
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-21'
  updated: '2026-01-21'
  author: user_23
  testmo_id: 65241
  folder_id: 7144
description: Validates that anniversary toggle disappears from Settings and animation
  stops after 48-hour expiry period.
preconditions:
- description: EnableOwnerAnniversary FF = true
- description: isAnniversary = true
- description: anniversaryYear = 1, 2, 3, 4, or 5
- description: VIN is NOT lost/stolen, finance vehicle, or pending
- description: User has NOT seen anniversary message for this VIN at current anniversary
    year
- description: User is logged in
- description: User is on welcome message screen
steps:
- id: 1
  action: Tap on gift box, then tap TURN ON ANNIVERSARY MODE button
  expected: User is redirected to Home screen | Animation plays | hour timer starts
- id: 2
  action: Wait for 48 hours to pass (or mock time to 48 hours + 1 minute after activation)
  expected: hour expiry period has passed
- id: 3
  action: Navigate to Settings screen
  expected: Anniversary theme toggle is NOT displayed (hidden/removed)
- id: 4
  action: Navigate to Home screen
  expected: No anniversary animation plays
