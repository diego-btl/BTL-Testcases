description: 'Validates anniversary theme toggle functionality in Settings screen.
  Preconditions: EnableOwnerAnniversary FF = true User has accepted anniversary mode
  OR skipped (toggle is visible in Settings)'
steps:
- id: 1
  action: Navigate to Settings screen and tap on Anniversary theme toggle to turn
    it ON
  expected: Toggle switches to ON position (green) | Expiry date text Expiring [date]
    is displayed in red below toggle label
- id: 2
  action: Navigate to Home screen
  expected: 'Anniversary animation plays based on time of day: Day time (6:01 AM -
    11:59 PM): Confetti animation plays once | Night time (12:00 AM - 6:00 AM): Fireworks
    animation loops 3 times'
- id: 3
  action: Navigate to Settings screen and tap on Anniversary theme toggle to turn
    it OFF
  expected: Toggle switches to OFF position (grey)
- id: 4
  action: Navigate to Home screen
  expected: No animation plays
