description: 'Validates gift box animation triggers on any screen when switching to
  an eligible anniversary VIN, and redirects to Home screen after interaction. Preconditions:
  EnableOwnerAnniversary FF = true User has multiple VINs in account'
steps:
- id: 1
  action: Navigate to any screen (e.g., Vehicle, Map, or Support screen), then switch
    to VIN with isAnniversary = true and anniversaryYear = 1-5
  expected: Gift box animation appears on current screen | Gift box animation screen
    is displayed
- id: 2
  action: Tap on gift box, then tap TURN ON ANNIVERSARY MODE button
  expected: 'User is redirected to Home screen | Animation plays based on time of
    day: Day time (6:01 AM - 11:59 PM): Confetti animation plays once | Night time
    (12:00 AM - 6:00 AM): Fireworks animation loops 3 times'
- id: 3
  action: Navigate to Settings screen
  expected: Anniversary theme toggle is displayed under Theme section | Toggle is
    in ON position (green) | Expiry date text Expiring [date] is displayed in red
    below toggle label
- id: 4
  action: Switch to another eligible VIN to trigger gift box, then tap SKIP button
  expected: User is redirected to Home screen | No animation plays
- id: 5
  action: Navigate to Settings screen
  expected: Anniversary theme toggle is displayed under Theme section | Toggle is
    in OFF position (grey)
