description: 'Validates welcome message screen UI elements display correctly with
  dynamic content from VehicleStaticData.Notes:Brand-specific animations:INFINITI:
  Curtain opens animationNISSAN: Confetti animationDynamic content from VehicleStaticData:firstName
  (user''s name)anniversaryYear (1-5)Vehicle image (dynamic based on VIN)Vehicle model
  (dynamic based on VIN)'
preconditions:
- description: EnableOwnerAnniversary FF = true
- description: isAnniversary = true
- description: anniversaryYear = 1, 2, 3, 4, or 5
- description: VIN is NOT lost/stolen, finance vehicle, or pending
- description: User has NOT seen anniversary message for this VIN at current anniversary
    year
- description: User is logged in
- description: User is on gift box animation screen
steps:
- id: 1
  action: Tap on the gift box
  expected: 'Opening animation plays:INFINITI: Curtain image displays and opens |
    NISSAN: Confetti animation plays | NISSAN only: Star background is displayed |
    Vehicle image is displayed (dynamic from VIN) | Welcome message copy is displayed:Title:
    Happy [anniversaryYear]-year Anniversary! | Message: [firstName], congratulations
    on a year of adventures with your [VehicleModel]! As you journey ahead, may each
    drive bring many more unforgettable experiences. | Signature: Your [Brand] Family
    | Buttons are displayed:TURN ON ANNIVERSARY MODE button | SKIP button'
