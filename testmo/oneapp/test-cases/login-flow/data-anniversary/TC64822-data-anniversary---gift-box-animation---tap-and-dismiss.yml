metadata:
  id: TC64822
  name: Data Anniversary - Gift Box Animation - Tap and Dismiss
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-21'
  updated: '2026-01-21'
  author: user_23
  testmo_id: 65248
  folder_id: 7144
description: Validates gift box animation UI elements display correctly and interaction
  behaviors (close button and tap gift box).
preconditions:
- description: EnableOwnerAnniversary FF = true
- description: isAnniversary = true
- description: anniversaryYear = 1, 2, 3, 4, or 5
- description: VIN is NOT lost/stolen, finance vehicle, or pending
- description: User has NOT seen anniversary message for this VIN at current anniversary
    year
- description: User is logged in
steps:
- id: 1
  action: Login to the app with VIN in focus meeting all precondition requirements
  expected: Gift box animation screen is triggered and displayed | Gift box with decorative
    elements (stars, circles) is displayed | Gift box animation plays smoothly | Text
    Tap the box to open is displayed below gift box | Close (X) button is displayed
    in top right corner
- id: 2
  action: Tap Close (X) button
  expected: User is redirected to Home screen
- id: 3
  action: Clear app cache or reinstall app, relaunch app, and login with same VIN
    meeting preconditions, then tap on the gift box
  expected: Gift box animation appears again | Opening animation plays | User is redirected
    to welcome message screen
