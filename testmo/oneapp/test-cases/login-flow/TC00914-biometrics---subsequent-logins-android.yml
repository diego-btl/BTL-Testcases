preconditions:
- description: User has already logged into the app
- description: User have previously enabled Biometric login with the app
- description: User has Biometrics enabled on their device
- description: App must be closed
- description: Onboarding cards are not covered, must be skipped
steps:
- id: 1
  action: Open the app by tapping on the app icon
  expected: The Biometric Login modal is displayed
- id: 2
  action: Interact with the Fingerprint sensor with the incorrect finger
  expected: After two incorrect tries a Biometric Error modal is displayed
- id: 3
  action: Tap on the Ok button
  expected: The Login page is displayed again
- id: 4
  action: Tap on the blue Fingerprint icon at the far right position within the Password
    text field
  expected: The Biometric Login modal is displayed
- id: 5
  action: Interact with the Fingerprint sensor with the correct finger
  expected: The user is driven to the Home page
