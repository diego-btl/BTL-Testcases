preconditions:
- description: Ensure the account you log in to have only 1 Vin that is NON-CONNECTED
    OR at least the first vin in garage (VehicleStaticData) is Non-connected
steps:
- id: 1
  action: Log in to account as per pre-condition above
  expected: The 4-5 apis i.e. staticdata, pendingvehicles, subscriptions, capabilities
    will be resolved | Modal will show
- id: 2
  action: Tap on Yes
  expected: 'The title of the card will read: Hello! | Continue CTA | There are more
    cards as you tap on Continue or Swipe through the dots found at the bottom of
    the screen | The Onboarding Features api is also triggered'
- id: 3
  action: Compare the title, image and order of the different onboarding features
    in the api response with what you see on the app
  expected: 'They should match. | NOTE: attached document 8_25_Onboarding_R3 has the
    copy for the Features card. But note, that the FE shows what''s sent via the api
    response | NOTE: no subscription card should show as the last onboarding card
    as an NC vehicle would have no subscriptions'
- id: 4
  action: Go to Support Screen
  expected: App Key Features card is shown on the screen
- id: 5
  action: Tap on the App Key Features card on support screen
  expected: The Status(Hello) card should be the same as seen when app is launched,
    with the same flow
