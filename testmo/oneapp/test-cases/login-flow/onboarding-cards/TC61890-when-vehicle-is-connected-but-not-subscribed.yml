metadata:
  name: When vehicle is Connected but not subscribed
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>Have a mock for Connected vehicle but not enrolled (capabilities
    = NOT_ENROLLED) </p><p>VehicleSubscriptions is empty</p><p>Also, ensure the account
    has only this 1 VIN if possible OR at least its the first vin on VehicleStaticData
    (garage) </p>
  steps:
  - column_name: custom_steps
    id: 94707
    case_id: 61890
    text1: <p>Launch app</p><p>Log in</p><p>After all 4-5 apis are resolved ie Static
      data, pendingvehicles, vehiclesubscriptions, vehiclecapabilities (and financialvehicles
      if NCI), the modal shoud show</p><p>Tap on Yes</p>
    text2: null
    text3: '<ul><li>The title of the card will read: Hello!</li></ul><p>         
         The body will read: </p><p>           Welcome to the [MyNISSAN / MyINFINITI]
      app!</p><p>          It looks like you''re currently not subscribed to [NissanConnect
                   Services / INFINITI InTouch Services]; you''ll need an active  
                  subscription to take full advantage of your connected car &amp;
      features.</p><p>Let''s take a tour of what you can do in the app!</p><p>Continue
      CTA</p><ul><li>There are more cards as you tap on Continue or Swipe through
      the dots found at the bottom of the screen</li><li>The Onboarding Features api
      is also triggered</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 94708
    case_id: 61890
    text1: <p>Compare the title, image and order of the different onboarding features
      in the api response with what you see on the app</p>
    text2: null
    text3: '<p>They should match. </p><p>NOTE: attached document 8_25_Onboarding_R3
      has the copy for the Features card. But note, that the FE shows what''s sent
      via the api response</p>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 94709
    case_id: 61890
    text1: <p>Swipe through to reach the last Onboarding card</p>
    text2: null
    text3: '<p>The title will read: Like what you see? Enroll now!</p><p>The body
      will read: </p><p><strong>To make full use of your &lt;VEHICLE MODEL&gt;, you''ll
      need a [NissanConnect Services subscription / INFINITI InTouch Services subscription]:</strong></p><p><strong>IF
      BSM: (BSM FF is on and vehicle is 2026+)</strong></p><p><strong>CTA 1: Explore
      Subscriptions (Take user to BSM flow)</strong></p><p>**For French translations,
      refer to the attached document, go to Subscriptions tab</p><p>IF SXM:</p><p>CTA
      2: Explore Subscriptions (Take user to Phone Number)</p>'
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 94721
    case_id: 61890
    text1: <p>Go to Support Screen</p>
    text2: null
    text3: <p>App Key Features card is shown on the screen </p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 94722
    case_id: 61890
    text1: <p>Tap on the App Key Features card on support screen</p>
    text2: null
    text3: <p>The Status(Hello) card should be the same as seen when app is launched,
      with the same flow </p>
    text4: null
    display_order: 5
