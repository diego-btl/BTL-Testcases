metadata:
  id: TC61890
  name: When vehicle is Connected but not subscribed
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-28'
  updated: '2025-10-28'
  author: user_24
  testmo_id: 61890
  folder_id: 6757
preconditions:
- description: Have a mock for Connected vehicle but not enrolled (capabilities =
    NOT_ENROLLED)
- description: VehicleSubscriptions is empty
- description: Also, ensure the account has only this 1 VIN if possible OR at least
    its the first vin on VehicleStaticData (garage)
steps:
- id: 1
  action: Launch app -> Log in -> After all 4-5 apis are resolved ie Static data,
    pendingvehicles, vehiclesubscriptions, vehiclecapabilities (and financialvehicles
    if NCI), the modal shoud show -> Tap on Yes
  expected: 'The title of the card will read: Hello! | There are more cards as you
    tap on Continue or Swipe through the dots found at the bottom of the screen |
    The Onboarding Features api is also triggered'
- id: 2
  action: Compare the title, image and order of the different onboarding features
    in the api response with what you see on the app
  expected: 'They should match. | NOTE: attached document 8_25_Onboarding_R3 has the
    copy for the Features card. But note, that the FE shows what''s sent via the api
    response'
- id: 3
  action: Swipe through to reach the last Onboarding card
  expected: 'The title will read: Like what you see? Enroll now! | The body will read:
    | To make full use of your <VEHICLE MODEL>, you''ll need a [NissanConnect Services
    subscription / INFINITI InTouch Services subscription]: | IF BSM: (BSM FF is on
    and vehicle is 2026+) | CTA 1: Explore Subscriptions (Take user to BSM flow) |
    For French translations, refer to the attached document, go to Subscriptions tab
    | IF SXM: | CTA 2: Explore Subscriptions (Take user to Phone Number)'
- id: 4
  action: Go to Support Screen
  expected: App Key Features card is shown on the screen
- id: 5
  action: Tap on the App Key Features card on support screen
  expected: The Status(Hello) card should be the same as seen when app is launched,
    with the same flow
