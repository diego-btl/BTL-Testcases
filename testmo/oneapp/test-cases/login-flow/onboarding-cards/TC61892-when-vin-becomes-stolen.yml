preconditions:
- description: Have 1 Vin in account (Connected and subscribed, or Connected and not
    subscribed, or Not_Connected)
- description: See the relevant onboarding modal as per the above conditions
- description: Now, mock the capabilities api to status = STOLEN
steps:
- id: 1
  action: Open app
  expected: Wait for all apis to be resolved | On home screen, you will see Vehicle
    Stolen message | NO Onboarding modal should show
- id: 2
  action: Go to Support tab
  expected: You shouldn't see the App Key Features card on Support screen
