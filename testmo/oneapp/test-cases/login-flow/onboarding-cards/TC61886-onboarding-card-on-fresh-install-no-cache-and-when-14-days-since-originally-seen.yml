metadata:
  id: TC61886
  name: Onboarding card on Fresh install (no cache) and when >=14 days since originally
    seen
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-28'
  updated: '2025-10-28'
  author: user_24
  testmo_id: 65260
  folder_id: 6757
description: 'For the new onboarding cards to show, the following 4-5 apis (depending
  on region) need to be resolved. Note: the condition is that the apis need to be
  resolved, even if it errors out.)Pending VehiclesVehicleSubscriptionsVehicleCapabilitiesVehicleStaticDataFinancialVehicles
  (only in case of NCI) **Ensure EnableFinanceCard is set to true in FirebaseSee attached
  document - Onboarding Animations - for copy on modal Nissan Figma fileInfiniti Figma
  file'
steps:
- id: 1
  action: Fresh install of app -> All 4-5 apis (mentioned above) are resolved
  expected: Onboarding modal should show | The copy of the modal should match the
    copy in the document attached (Onboarding Animations)
- id: 2
  action: Change date on phone to 14 or more days from originally seen -> Open app
    -> Wait until all 4-5 apis mentioned above are resolved
  expected: 'Onborading modal should show | NOTE: onboarding modal shouldn''t show
    when u bg/fg app, cold starting app. it should show once on fresh install and
    then >=14 days + from originally last seen or when the primary vin''s status (vin
    in focus) changes.'
- id: 3
  action: Change Vin in garage so another vin is in focus
  expected: No onboarding modal should be triggered as the modal pops up only when
    the primary Vin's status in account (first vin in VehicleStaticData) changes.
