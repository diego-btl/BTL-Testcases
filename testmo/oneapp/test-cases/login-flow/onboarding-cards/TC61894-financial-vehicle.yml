preconditions:
- description: Log in to an NCI that has only aa financial vehicle in the garage OR
    as the first vin in VehicleStaticData (first vin in garage)
- description: 'NOTE: the vin should be an only Financial Vehicle (in other words
    the Z vehicle Vin: "JN1BJ1CP6JW107883", in mock server.'
- description: NOT the ROGUE JAPA even though its a financial vehicle but since it
    was added normally as a telematics vehicle then it will have an associated value
    (financial vehicle) for onboarding card, this kind of vehicle won't be treated
    as Fin Vehicle
steps:
- id: 1
  action: Log in to an NCI account with Financial vehicle as primary
  expected: Once all 5 apis - vehiclestaticdata, financialVehicles, VehicleSubscriptions,
    VehicleCapabilities and PendingVehicles is resolved, the onboarding modal should
    show
- id: 2
  action: Tap on Yes
  expected: 'The title of the card will read: Hello! | No other cards show after this
    card'
- id: 3
  action: Tap on Add Vehicle CTA
  expected: It takes you to Add Vehicle Screen
- id: 4
  action: Tap back to exit out of Add Vehicle screen -> Tap on Support icon in navigation
    menu at the bottom of the screen
  expected: App Key Features card should show on Support Screen
- id: 5
  action: Tap on the App Key Features Card
  expected: It should show the same card and flow as you saw in Step 2 above
