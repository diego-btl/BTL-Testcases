metadata:
  id: TC61891
  name: When vehicle is Connected and Subscribed
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-28'
  updated: '2025-10-28'
  author: user_24
  testmo_id: 65261
  folder_id: 6757
preconditions:
- description: Ensure the account has only the 1 Connected and Subscribed(enrolled)
    Vin OR its the first Vin on VehicleStaticData that's Connected and Subscribed.
steps:
- id: 1
  action: Launch app -> Log in -> After all 4-5 apis are resolved ie Static data,
    pendingvehicles, vehiclesubscriptions, vehiclecapabilities (and financialvehicles
    if NCI), the modal shoud show -> Tap on Yes
  expected: The title will read Hello! | Continue CTA | There are more cards as you
    tap on Continue or Swipe through the dots found at the bottom of the screen |
    The Onboarding Features api is also triggered
- id: 2
  action: Compare the title, image and order of the different onboarding features
    in the api response with what you see on the app
  expected: 'They should match. | NOTE: attached document 8_25_Onboarding_R3 has the
    copy for the Features card. But note, that the FE shows what''s sent via the api
    response | NOTE: no subscription card should show as the last onboarding card
    as the Vin is already subscribed to)'
- id: 3
  action: Go to Support Screen
  expected: App Key Features card is shown on the screen
- id: 4
  action: Tap on the App Key Features card on support screen
  expected: The Status(Hello) card should be the same as seen when app is launched,
    with the same flow
