preconditions:
- description: Fresh installation or app cache cleared
- description: User is already on the Login page
- description: Biometric flow is not covered, must be skipped
- description: Onboarding cards are not covered, must be skipped
steps:
- id: 1
  action: Enter a valid email on the Email text field -> Enter a valid password on
    the Password text field -> Select the Keep me Signed in checkmark below the Password
    text field
  expected: The checkmark is selected or deselected depending of the user interaction
- id: 2
  action: With the Keep me Signed in checkmark selected, tap on the SIGN IN button
  expected: The Login flow is triggered
- id: 3
  action: if Terms of Service page is displayed, select the I have read and accept
    the App Terms of Service checkmark and tap on the SAVE button
  expected: User is driven to the Home page
- id: 4
  action: Close the app by triggering the Recent Apps interaction and closing swiping
    away the app -> Reopen the app by tapping on the app icon
  expected: User is driven to the Home page without any interaction from the user
- id: 5
  action: Go to the Settings page -> At the bottom of the page tap on the SIGN OUT
    button
  expected: The Sign Out modal should be displayed
- id: 6
  action: Tap Yes
  expected: The user is driven to the Login page
- id: 7
  action: Close the app by triggering the Recent Apps interaction and closing swiping
    away the app -> Reopen the app by tapping on the app icon
  expected: User is driven to the Login page
