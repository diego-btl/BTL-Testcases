preconditions:
- description: Login with an NCF account > https://www.notion.so/bethinklabs/d0f8f58385a94c51ab27ce3ee1ef1e51?v=caf06428a7ac41aa96541666be242cd7
steps:
- id: 1
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: 'The screen NCF Notification opens with the next text:'
- id: 2
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: The user can enable or disable the toggle options and a loading states
    appears till the changes are apply
- id: 3
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: The user can enable or disable the toggle options and a loading states
    appears till the changes are apply, if any error updating the changes the toggle
    option return to the previous state
- id: 4
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: The user changes the values and can return to the previous screen clicking
    over "<"
- id: 5
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: The user can collapse the NCF Reminder clicking the "^" symbol
- id: 6
  action: Login into the app -> Go to Settings -> Click Preferences under NCF section
  expected: The user can collapse the NCF Reminder clicking the "⌄" symbol
