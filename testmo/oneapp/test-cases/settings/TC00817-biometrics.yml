preconditions:
- description: User is on the Settings screen and has biometrics on
steps:
- id: 1
  action: Tap to toggle biometrics off
  expected: User should see biometrics toggled off and disabled
- id: 2
  action: Tap to toggle biometrics on
  expected: User should see an alert modal to enter their password
- id: 3
  action: Enter an incorrect password
  expected: User should see an error in the alert modal
- id: 4
  action: Enter correct password
  expected: User should see the biometrics prompt
- id: 5
  action: Accept the biometrics prompt
  expected: User should see biometrics toggled on and enabledUser should see the success
    toast <Biometric Sign In turned on>
