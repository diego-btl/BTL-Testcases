steps:
- id: 1
  action: Tap the security question CTA2. Tap the security answer field3. Tap the
    PIN field and enter a PIN4. Tap the Confirm PIN field and enter a PIN which does
    not match5. Tap either of the eye icons in the PIN fields6. Enter a matching PIN7.
    Tap SAVE
  expected: 'User should be able to select a question2. User should be able to enter
    an answer3. User should be able to enter a 4 digit PIN4. User should be able to
    re-enter a 4 digit PIN and see an error state for the unmatched PINs5. User should
    be able to toggle showing/hiding both PIN fields6. User should see see SAVE CTA
    become enabled7. User should be taken to the My Profile screen if the request
    is successful and see the success toastNote: If the request returns a failure,
    the user should see the error text and security answer field should turn redNOTE:
    removed for NCI'
