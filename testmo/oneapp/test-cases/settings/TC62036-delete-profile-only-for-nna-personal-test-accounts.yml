- description: ONLY TEST THIS ON NNA with your personal test account
steps:
- id: 1
  action: ONLY TEST THIS ON NNA PERSONAL TEST ACCOUNT -> Log in to account -> Go to
    Settings > Profile -> Tap on Delete Account -> You will get a modal confirming
    Request Account Deletion -> Tap on Yes
  expected: You should be taken to the Profile page on nissan portal within the system
    webview - you shouldn't be taken to the nissan portal sigin in page on an external
    webview | The url should match url on DeleteAccount parameter in ContactUs api
    response | you don't have to delete account.
