steps:
- id: 1
  action: Log in to app (browser login) -> Go to Settings>Profile -> Tap on Edit profile
  expected: You should be taken to the Profile page on nissan portal within the system
    webview - you shouldn't be taken to the nissan portal sig in in page on an external
    webview | The url should match url on "editContactInformationAndChangePassword"
    parameter in ContactUs api response | Edit address, name etc. | Save | Go back
    to app | You should see the edits you made under Settings > Profile
