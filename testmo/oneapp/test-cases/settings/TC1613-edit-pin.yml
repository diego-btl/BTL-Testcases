  steps:
  - column_name: custom_steps
    id: 1978
    case_id: 1613
    text1: <p>1. Tap the security question CTA<br />2. Tap the security answer field<br
      />3. Tap the PIN field and enter a PIN<br />4. Tap the Confirm PIN field and
      enter a PIN which does not match<br />5. Tap either of the eye icons in the
      PIN fields<br />6. Enter a matching PIN<br />7. Tap SAVE</p>
    text2: null
    text3: '<p>1. User should be able to select a question<br />2. User should be
      able to enter an answer<br />3. User should be able to enter a 4 digit PIN<br
      />4. User should be able to re-enter a 4 digit PIN and see an error state for
      the unmatched PINs<br />5. User should be able to toggle showing/hiding both
      PIN fields<br />6. User should see see SAVE CTA become enabled<br />7. User
      should be taken to the My Profile screen if the request is successful and see
      the success toast<br /><br />Note: If the request returns a failure, the user
      should see the error text and security answer field should turn red<br /><br
      />NOTE: removed for NCI</p>'
