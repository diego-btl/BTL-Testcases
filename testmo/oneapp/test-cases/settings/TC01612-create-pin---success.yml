preconditions:
- description: User has not set up their pin/voice code User is on the add PIN screen
    and has filled in the security question and answer fields
steps:
- id: 1
  action: 1. Tap the PIN field and enter a 4 digit number 2. Tap the confirm PIN field
    and re-enter the 4 digit number 3. Tap the eye icon 4. User has successfully selected
    a question, entered at least 1 character for the answer, and entered matching
    PINs 5. Tap the CREATE PIN/VOICE CODE CTA
  expected: '1. User should be able to enter a 4 digit number 2. User should be able
    to re-enter the 4 digit number 3. User should be able to toggle showing and hiding
    both PIN fields 4. User should see the CREATE PIN/VOICE CODE CTA become enabled
    5. User should be taken to the home screen and see the success toast NOTE: N/A
    for NCI'
