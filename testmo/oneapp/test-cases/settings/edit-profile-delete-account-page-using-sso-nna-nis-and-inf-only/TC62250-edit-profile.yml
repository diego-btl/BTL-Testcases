steps:
- id: 1
  action: Log in to account (Browser Login) -> Go to Settings -> Go to My Profile
    -> Tap on Edit on the Contact Information card
  expected: 'App should open a system browser context view (i.e. cannot be a webview,
    must be same method as browser login) going to the link specified by ContactUs
    (editContactInformationAndChangePassword) | It shouldn''t ask you to log in again.
    | NOTE: KNOWN ISSUE: our token expiry to keep this session open is 60 days but
    WSO2 is 20 mins! Client however, has accepted this mismatch so its possible you
    will see the sign in page when u tap on Delete account, if you logged in to account
    a while ago. | Try doing a fresh login and immediately go to My Profile and follow
    steps above.'
- id: 2
  action: Verify the page you are on has a Refresh and Close button6. Edit something
    on the profile like Postal code, phone no. etc7. Save Changes8. Go back to Profile
    screen in app
  expected: The edits you made should show on the Profile screen
