- description: 'Regions: NNA'
- description: 'Brands: NIS and INF'
steps:
- id: 1
  action: Log in to account (Browser Login) -> Go to Settings -> Go to My Profile
    -> Tap on Delete Account CTA -> Tap on Yes in the modal
  expected: 'Then: App should open a system browser context view (i.e. cannot be a
    webview, must be same method as browser login) going to the link specified by
    ContactUs (DeleteAccount) | It shouldn''t ask you to log in again. | NOTE: KNOWN
    ISSUE: our token expiry to keep this session open is 60 days but WSO2 is 20 mins!
    Client however, has accepted this mismatch so its possible you will see the sign
    in page when u tap on Delete account, if you logged in to account a while ago.
    | Try doing a fresh login and immediately go to My Profile and follow steps above.'
