preconditions:
- description: '"EnableNCIMarketingPreferences": "true" FF should be on'
- description: Connect the device to Proxyman to check the APIs calls
steps:
- id: 1
  action: Login to app > go to Settings > Marketing Preferences > Toggle ON/OFF any
    of the options from any of the sections
  expected: The request is sending the correct value for the particular toggle. |
    The response also retrieves the correct value for the same toggle which makes
    the UI updates accordingly
- id: 2
  action: Breakpoint the UpdateNCIMarketingPreferences api to fail
  expected: '(e.g: if initial state was ON, we turn it off but calls fails, then the
    toggle should remian ON)'
