  - column_name: custom_steps
    id: 97202
    case_id: 62250
    text1: <ol><li>Log in to account (Browser Login)</li><li>Go to Settings</li><li>Go
      to My Profile</li><li>Tap on Edit on the Contact Information card</li></ol>
    text2: null
    text3: '<ul><li>App should open a system browser context view (i.e. cannot be
      a webview, must be same method as browser login) going to the link specified
      by <code>ContactUs</code> (editContactInformationAndChangePassword)</li><li>It
      shouldn''t ask you to log in again.</li><li>NOTE: KNOWN ISSUE: our token expiry
      to keep this session open is 60 days but WSO2 is 20 mins! Client however, has
      accepted this mismatch so its possible you will see the sign in page when u
      tap on Delete account, if you logged in to account a while ago.</li><li>Try
      doing a fresh login and immediately go to My Profile and follow steps above. </li></ul>'
    text4: null
    display_order: 1
