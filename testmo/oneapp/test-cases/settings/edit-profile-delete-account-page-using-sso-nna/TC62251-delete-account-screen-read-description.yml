      in again.</li><li>NOTE: KNOWN ISSUE: our token expiry to keep this session open
      is 60 days but WSO2 is 20 mins! Client however, has accepted this mismatch so
      its possible you will see the sign in page when u tap on Delete account, if
      you logged in to account a while ago.</li><li>Try doing a fresh login and immediately
      go to My Profile and follow steps above. </li></ul>'
