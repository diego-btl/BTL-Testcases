steps:
- id: 1
  action: Tap Map in the bottom nav > Tap on Planned Routes card
  expected: Send Now option | Delete Route cta | View route cta
- id: 2
  action: Tap on Send Now or Delete route
  expected: User will see the Demo mode modal
- id: 3
  action: Tap on View route
  expected: Loading state icon is shown, and the user is led to the Estimated Route
    screen is
- id: 4
  action: Tap on Edit / Save button or Add Stop option
  expected: User will see the Demo mode modal
- id: 5
  action: Tap on the information icon
  expected: User taken to About Estimated Route screen
- id: 6
  action: User taps on Save Route cta or Add Stop option
  expected: Demo mode modal is shown
- id: 7
  action: Tap on the back arrow
  expected: User ois led to the Plannes Routes screen
