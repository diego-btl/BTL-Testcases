description: 'User Story: https://app.clickup.com/t/86b50t9at Verify that clicking
  any restricted action triggers the same Demo Info ModalVerify View Existing Trip
  in Planned Routes – Demo ModeAriya was replaced by LEAF in Demo Mode. Stories related
  to this implementation:https://app.clickup.com/t/86b5dywt0'
steps:
- id: 1
  action: Tap Map in the bottom nav
  expected: 'User should see the map screen with: user location, vehicle pins in fixed
    locations, scrolling POI categories, and Info Drawer'
- id: 2
  action: Tap on the search bar, POI categories, or buttons on the map
  expected: User should see the demo mode alert modal
- id: 3
  action: Tap on the user/vehicle location buttons
  expected: For user location, the map screen should be changed, | For vehicle location,
    vehicle pin in fixed locations should be shown.
- id: 4
  action: Draw the info drawer up
  expected: User should be able to scroll the contents
- id: 5
  action: Navigate to the Vehicle Location section -> Tap on the Directions button
  expected: User should see the demo mode alert modal
- id: 6
  action: Navigate to the Favorites section -> Tap on the See More
  expected: User should see the demo mode alert modal
- id: 7
  action: Navigate to the Recently Sent to Vehicle section -> Tap on the See More
  expected: User should see the demo mode alert modal
- id: 8
  action: Navigate to the Route Planner section
  expected: User should see the Route Planner, Planned Routes, Route History, and
    Connect Calendar cards
- id: 9
  action: Tap on the Route History / Connect to Calendar card
  expected: User should see the demo mode alert modal
- id: 10
  action: Tap on Route Planner card
  expected: User is led to Create a route screen, tapping on any field/element from
    the Destination card should trigger a modal
- id: 11
  action: Go to Depart at/Arrive by card
  expected: User should be able to interact with any of the dropdowns
- id: 12
  action: Go to Notification card
  expected: User should be able to interact with the dropdown
- id: 13
  action: Go to Plug In Options card
  expected: User should be able to interact with the dropdown, and the information
    icon should take the user to the respective screen
- id: 14
  action: Go to Avoid for All Drives card
  expected: User can interact with the toggles
- id: 15
  action: Go to Climate card
  expected: User can interact with the dropdown
- id: 16
  action: View the Planned Routes card -> Tap on the Planned Routes card -> Click
    Delete Route -> Click Delete Route / SEND NOW -> Click View Route -> Drag to expand
    the info drawer -> Click Add a stop /Edit Route -> Tap on the Back button
  expected: User should see a a Planned Routes card indicating the number of upcoming
    planned routes that week | User should be redirected to the Planned Routes screen
    and see a card of a planned route with the following elements:- Weather info-
    Route name- Departure date/time- Arrival date/time- Total distance- Delete Route
    button- View Route button-Send Now Button | Only the View Route button is active
    | Clicking Delete Route/SEND NOW shows a Demo Mode modal | User should be driven
    to the Estimated Route screen | User should see the info drawer maximize, showing
    additional information:- departure date/time- arrival date/time- charge time-
    POIs, EV waypoints, destination and their corresponding address, time, charge
    time (for EV waypoints), and battery level- Save route button | Clicking Add a
    stop /Edit Route shows a Demo Mode modal | User should be driven to the Planned
    Routes screen
