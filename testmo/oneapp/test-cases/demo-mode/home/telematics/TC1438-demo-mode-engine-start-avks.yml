    id: 1806
    case_id: 1438
    text1: <p>Tap the Engine Start button</p>
    text2: null
    text3: <p><code>Are you sure?</code> popup appears with <code>Yes </code>and <code>No</code>
      CTAs</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11745
    case_id: 1438
    text1: <p>Tap on <code>No</code> CTA</p>
    text2: null
    text3: <p>The popup dismisses.</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11746
    case_id: 1438
    text1: <p>Tap on <code>Yes</code> CTA</p>
    text2: null
    text3: <p>1. The Engine Start process triggered and the following toasts are displayed
      every second:</p><ul><li>Contacting <code>year, model</code> to start engine...</li><li>Waking
      <code>year, model</code> to start engine...</li><li>Initiating engine start
      on <code>year, model</code>...</li><li><code>year, model</code> engine started.</li></ul><p>2.'Engine
      Start' button becomes to 'Engine Start' with 'STOP' text</p><p>3.Engine timer
      should be 10 mins</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 25405
    case_id: 1438
    text1: <p>Tap on <code>Yes</code> CTA - AVK2</p>
    text2: null
    text3: <p>1. The Engine Start process triggered and the following toasts are displayed:</p><ul><li>Contacting
      <code>year, model</code> to start engine...</li><li>Waking <code>year, model</code>
      to start engine...</li><li>Initiating engine start on <code>year, model</code>...</li><li>Remote
      engine and climate was started for <code>year, model</code></li></ul><p>2.'Engine
      Start' button becomes to 'Engine Start' with 'STOP' text</p><p>3. Engine timer
      should be 20 mins</p>
    text4: null
    display_order: 4
