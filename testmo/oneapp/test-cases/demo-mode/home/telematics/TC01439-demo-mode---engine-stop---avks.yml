steps:
- id: 1
  action: Tap the Engine STOP button
  expected: Are you sure? popup appears with Yes and No CTAs
- id: 2
  action: Tap on No CTA
  expected: The popup dismisses.
- id: 3
  action: Tap on Yes CTA
  expected: Contacting year, model to stop engine... | Initiating engine stop on year,
    model... | year, model engine stopped
- id: 4
  action: Tap on Yes CTA - AVK2
  expected: Contacting year, model to stop engine... | Initiating engine stop on year,
    model... | Climate off, engine stopped for your year, model
