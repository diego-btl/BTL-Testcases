  steps:
  - column_name: custom_steps
    id: 96679
    case_id: 1446
    text1: <p>Navigate to <strong>Home</strong> screen &gt; Tap on the <code>Climate</code>
      card</p>
    text2: null
    text3: <p>The Climate screen is displayed:</p><ul><li>Climate Control card</li><li>Scheduled
      Card</li><li><code>TURN CLIMATE &amp; ACCESSORIES ON </code>CTA</li><li><code>CREATE
      DELAYED START</code> CTA</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96685
    case_id: 1446
    text1: <p>Validate the Climate dial and Current temp parameters</p>
    text2: null
    text3: <ul><li>The Current Int. Temp should be 70 <i><strong>(Fahrenheit)</strong></i></li><li>The
      Current Ext. Temp should be <i><strong>&lt;Dynamics value in Fahrenheit&gt;</strong></i></li><li><p>The
      Target Temp dial should be set to 75</p><figure class="image image_resized"
      style="width:49.57%;"><img src="/attachments/view/8983" alt="8983" /></figure></li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96686
    case_id: 1446
    text1: <p>Increase / decrease the target temperature by interacting with the dial
      or using the + or - buttons</p>
    text2: null
    text3: <p>The user should be able to set the desired temperature in Fahrenheit </p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 96687
    case_id: 1446
    text1: <p>Validate the climate accessories (defrost and deicer) and interact with
      them</p>
    text2: null
    text3: <p>The screen should display Off / On settings for:</p><ul><li>Defrost
      &amp; Deicer</li></ul><p>User should be able to toggle the displayed settings</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 96680
    case_id: 1446
    text1: <p>Tap on a climate schedule</p>
    text2: null
    text3: <p>User should see the climate schedule details screen</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 96681
    case_id: 1446
    text1: <p>Change details for the climate schedule</p>
    text2: null
