metadata:
  id: TC16003
  name: Demo Mode - Additional Driver
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2024-05-01'
  updated: '2026-01-13'
  author: user_2
  testmo_id: 16003
  folder_id: 6811
description: This TC is to validate the Rogue AVK2 and EV2 Demo Features
preconditions:
- description: Vehicle selected is the Rogue AVK2 (Rogue Platinum Demo) or LEAF vehicle
- description: User is already on the Home Page
steps:
- id: 1
  action: Tap on the Additional Driver card
  expected: Bob Smith (Invite Accepted) | James Smith (Invite Sent on $date) | Janeth
    Smith (Invite Accepted) | ADD A DRIVER CTA
- id: 2
  action: Tap on any of the Accepted Invitations (Bob Smith or Janet Smith)
  expected: User should be navigated to the Invitation Details, the title of the page
    should change to the Invitee name (Bob Smith or Janeth Smith)
- id: 3
  action: Validate the page details
  expected: 'Your invite for $user was accepted on $date | Selected Vehicle: Rogue
    Platinum | Additional Driver $user_data | Selected Configurations Section | DELETE
    DRIVER CTA Button'
- id: 4
  action: Tap on Selected Configurations section or caret
  expected: 'Allow all configurations? | Remote Vehicle Status | Navigation Support
    | Remote Vehicle Control | Vehicle Historical Data | Remote Status Notification
    | Additional Driver Notifications | Additional Driver History | Footer: "* Please
    upgrade your subscription to enable these options" | SAVE CHANGES CTA'
- id: 5
  action: Validate the toggles and SHOW LESS buttons on all sections
  expected: All the aforementioned sections should have a toggle | All the aforementioned
    sections, except for Additional Driver Notifications and `Additional Driver History`
    should have a SHOW LESS button
- id: 6
  action: Trigger the Allow all configurations? toggle
  expected: It should enable / disable all the different sections
- id: 7
  action: Trigger any of the remaining sections toggles
  expected: The specific section toggle should be enabled or disabled | If the Allow
    all configurations? was enabled, it should be disabled if any of the other configurations
    sections toggles are disabled
- id: 8
  action: Tap on the SHOW LESS button for any section
  expected: The entire section should collapse | The SHOW LESS button text is updated
    to SHOW MORE
- id: 9
  action: Tap on the SHOW MORE button for the collapsed section
  expected: The section should be expanded again
- id: 10
  action: Scroll down and tap on the SAVE CHANGES CTA Button
  expected: The Demo Mode modal should be displayed
