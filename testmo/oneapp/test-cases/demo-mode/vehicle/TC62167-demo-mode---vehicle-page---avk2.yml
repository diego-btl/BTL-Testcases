metadata:
  id: TC62167
  name: Demo Mode - Vehicle Page - AVK2
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-16'
  updated: '2025-12-18'
  author: user_15
  testmo_id: 62167
  folder_id: 6800
description: This TC is to validate the Rogue AVK2 Demo Features
preconditions:
- description: Vehicle selected is the Rogue AVK2 (Rogue Platinum Demo)
steps:
- id: 1
  action: Tap Vehicle in the bottom nav
  expected: MIL Icon | Vehicle Status Icon
- id: 2
  action: Tap on the MIL Status card (12-Volt Battery Warning) or the Vehicle Status
    card (Window Open)
  expected: The user should be navigated to the Vehicle Status Page showing the tab
    depending on the user selection
- id: 3
  action: On the Vehicle Status Page, tap on the MIL tab and click the 12-Volt Battery
    Warning card
  expected: The user should see the 12-Volt Battery Warning MIL Page, tapping on the
    Schedule Service CTA should trigger the demo mode alert modal
- id: 4
  action: Return to the Vehicle Status Page, tap on the Vehicle tab
  expected: User should se a card for Vehicle Status card (Front Window) without any
    caret, or being clickable
- id: 5
  action: Return to the Vehicle Page and Tap on the View Maintenance Schedule card
  expected: Driving Conditions | Mileage Until Next Service | Estimated Next Service
    | Maintenance Reminders | Vehicle Mileage
- id: 6
  action: Tap on any of the elements of the page except for the See All button on
    the Parts Replacement Reminder Section
  expected: User should see the demo mode alert modal
- id: 7
  action: Tap on the See All button on the Maintenance Reminders Section
  expected: The user should be navigated to the Maintenance Reminders page with data
    for future and overdue parts reminders
- id: 8
  action: Tap on any of the elements of the page except (i)
  expected: User should see the demo mode alert modal
