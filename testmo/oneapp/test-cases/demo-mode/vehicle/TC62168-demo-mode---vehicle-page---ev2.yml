description: This TC is to validate the LEAF Demo Features
preconditions:
- description: Vehicle selected is the LEAF(EVAVK2)
steps:
- id: 1
  action: Tap Vehicle in the bottom nav
  expected: User should see dummy data for the LEAF
- id: 2
  action: Tap on the Battery card
  expected: User is led to the Charge screen and data will not be displayed until
    the screen finishes loading
- id: 3
  action: Go back to Vehicle screen > Tap on Maintenance schedule card
  expected: Demo mode modal is displayed
- id: 4
  action: Tap on Driving History card
  expected: Day/Month/Year tabs are displayed | Information will change depending
    on the tab selected | Driver/VIN dropdown is present under all 3 tabs
