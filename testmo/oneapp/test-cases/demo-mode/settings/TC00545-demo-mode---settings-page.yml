steps:
- id: 1
  action: Scroll throughout the screen
  expected: 'Account Preferences:My Profile | Marketing Preferences | Theme:Light/Dark
    /System Default buttons | Security:Device Permissions | How to Disconnect Remote
    Vehicle Access | Legal:Terms of Service | Privacy Notice | Do Not Sell My Personal
    Information | EXIT DEMO MODE button | Text: Version X.Y.ZZ (e.g: Version 6.8.28)'
- id: 2
  action: Tap Settings in the bottom nav
  expected: User should be taken to the Settings screen
- id: 3
  action: Tap any item except for the "Exit Demo Mode" button and Theme section
  expected: User should see the demo mode alert modal
- id: 4
  action: Tap on Light/Dark/System Default buttons in the Theme section.
  expected: The app should be changed into Light/Dark/System modes
- id: 5
  action: Tap the "Exit Demo Mode" button
  expected: User should exit demo mode and be taken to the landing screen
