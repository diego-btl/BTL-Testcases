steps:
- id: 1
  action: 1. Tap on MIL status card 2. Tap on active MIL 3. Tap on Book a Service
    OIL AIRBAG ENGINE ABS BRAKE_FLUID TIRE_PRESSURE EMERGENCY_BRAKING
  expected: 1. User should see Vehicle Status screen with MIL tab 2. User should be
    able to view corresponding MIL description 3. User should enter into Book a Service
