preconditions:
- description: User is on Map tab with Info Drawer expanded User is a PRIMARY_DRIVER
    or SHARED_DRIVER (to be tested for both for AVK2)
steps:
- id: 1
  action: 1. Tap See More 2. Tap on Call button 3. Tap on Directions button 4. Tap
    the heart icon 5. Tap one of the favorite POI cards
  expected: 1. User should be taken to the Favorites screen. User should see the empty
    state if there are no Favorites, or they should see a scrolling view of POI cards
    if there are Favorites. 2. User should see call button function properly 3. User
    should see directions button function properly 4. User should see loading state
    while favorite is being removed On success, user should see card removed and success
    toast 5. User should see map pan to the corresponding favorite POI
