preconditions:
- description: User has performed a search User has DESTINATION_SEND_TO_CAR capability
    set to true User is a PRIMARY_DRIVER or SHARED_DRIVER (to be tested for both for
    AVK2)
steps:
- id: 1
  action: 1. Tap on Directions button 2. Tap on Send to Vehicle 3. Force an error
    and tap Send to Vehicle 4. Tap on Get Directions in Maps 5. Tap on Cancel
  expected: 1. User should see directions options 2. User should see a loading state
    on the POI card and a success toast when it has been sent successfully 3. User
    should see a failure toast 4. User should be redirected to their maps app with
    directions to POI 5. User should see direction options dismissed
