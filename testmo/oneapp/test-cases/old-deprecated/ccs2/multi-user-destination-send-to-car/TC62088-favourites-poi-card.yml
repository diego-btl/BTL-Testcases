preconditions:
- description: User is viewing POI search results User is a PRIMARY_DRIVER or SHARED_DRIVER
    (to be tested for both for AVK2)
steps:
- id: 1
  action: 1. Tap the heart icon on one of the POI cards 2. Enter at least one character
    in the name field 3. Tap Save Favorite 4. Force save to fail 5. Try to Save Favorite
    again and wait for save to succeed
  expected: 1. User should see a modal appear. Name field should be autofilled if
    POI has returned a name 2. User should see Save Favorite become enabled 3. User
    should see a loading spinner where the heart icon was 4. User should see a failure
    toast and the heart icon should show the non-saved state 5. User should see a
    success toast and the heart icon should show the saved state
