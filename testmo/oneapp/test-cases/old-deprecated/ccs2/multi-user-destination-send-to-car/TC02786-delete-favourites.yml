steps:
- id: 1
  action: 1. Tap the heart icon for a favorite that is already saved 2. Force deletion
    to fail 3. Tap the heart icon and wait for deletion to succeed
  expected: 1. User should see a loading spinner where the heart icon was 2. User
    should see a failure toast and the heart icon should show the saved state 3. User
    should see a success toast and the heart icon should show the non-saved state
