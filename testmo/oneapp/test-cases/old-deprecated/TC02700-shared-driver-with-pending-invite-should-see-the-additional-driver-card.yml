steps:
- id: 1
  action: '1. Mock the UserVehicles response with: 1.1. data.vehicles.driverType:
    "SHARED_DRIVER" 1.2. data.pendingDriverInvitations: "pendingDriverInvitations":
    { "__typename": "PendingDriverInvitationsSuccessResponse", "invites": [ { "__typename":
    "PendingDriverInvite", "inviteId": 999, "inviterFirstName": "FirstName", "inviterLastName":
    "LastName", "vin": "PN1FV7DP6NM371003", "vehicleModel": "ROGUE", "vehicleYear":
    2023, "inviteDateTime": "2023-04-26T10:49:30.033Z", "expiresIn": 2 } ] } 2. Login
    to the app'
  expected: 1. The Home Page should display the Additional Driver Card
