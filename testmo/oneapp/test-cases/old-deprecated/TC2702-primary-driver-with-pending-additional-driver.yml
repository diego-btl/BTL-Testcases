  preconditions: <p>User has a AVK2 vehicle<br />User is already on the Home Page<br
    />User is a PRIMARY_DRIVER with pending invitation(s) (1 to 3 invitations)</p>
  steps:
  - column_name: custom_steps
    id: 3067
    case_id: 2702
    text1: <p>1. The user is able to see the Additional Driver card, and then taps
      on the card<br />2. The user is able to see the pending invitations with status
      obtained from the driverInvites call:<br /><br />- ACCEPTED <br />- PENDING
      or RESEND<br />- DECLINE<br />- CANCEL</p>
    text2: null
    text3: <p>1. User is driven to the Additional Driver page, it should display as
      many cards as pending invitations there are.<br />2. Each card should show the
      First and Last Names of the invitee and the status of the invitation (Accepted,
      Pending, Declined, Canceled)<br />3. The button "ADD A DRIVER" should be displayed
      and enabled at the bottom</p>
