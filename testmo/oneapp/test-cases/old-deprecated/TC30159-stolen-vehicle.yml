preconditions:
- description: There is a vehicle in the account
steps:
- id: 1
  action: Mock capabilities.status value as ENROLLED or STOLEN
  expected: The user should see an enabled Stolen Vehicle button
- id: 2
  action: Mock capabilities.status value as FAILED, EXPIRED, or NOT_ENROLLED, tap
    the disabled button
  expected: The user should see a disabled Stolen Vehicle button and upon tapping,
    the user should see an alert modal with the option to call an agent (1-855-426-6628)
- id: 3
  action: Mock capabilities.status value as UNKNOWN
  expected: The user should not the Stolen Vehicle button
