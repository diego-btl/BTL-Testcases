    id: 3069
    case_id: 2704
    text1: '1. The user is able to see the Additional Driver card, and then taps on
      the card<br />

      2. The user is able to see the pending invitations<br />

      2.1 On the driverInvites call, for obtaining the expired invitation the parameter
      inviteExpiryDateTime should be before than the current system datetime.'
    text2: null
    text3: '1. User is driven to the Additional Driver page, it should display as
      many cards as pending invitations there are.<br />

      2. Each card should show the First and Last Names of the invitee and the status
      of the invitation should be "Invite Expired"'
