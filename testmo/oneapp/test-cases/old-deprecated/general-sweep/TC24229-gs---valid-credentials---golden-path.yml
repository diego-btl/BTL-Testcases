preconditions:
- description: Fresh installation or app cache cleared
- description: User is already on the Login page
- description: User has Biometrics enabled on their device
steps:
- id: 1
  action: Enter a valid email on the Email text field -> Enter a valid password on
    the Password text field
  expected: The text fields should display the input from the user | The SIGN IN button
    should remain inactive until both fields are filled
- id: 2
  action: Tap on the SIGN IN button
  expected: A loading spinner should be displayed on the screen | A Biometrics modal
    is displayed on the screen
- id: 3
  action: Tap No on the Biometrics modal
  expected: The Terms of Service page should be displayed
- id: 4
  action: Select the I have read and accept the App Terms of Service checkmark
  expected: The Save button at the bottom of the Terms of Service page should be enabled
    | The button is disabled / enabled if the user selects / unselects this checkmark
- id: 5
  action: Tap on the Save button
  expected: The Onboarding cards are displayed
- id: 6
  action: Tap on the top right (x) button
  expected: The user is driven to the Home page
