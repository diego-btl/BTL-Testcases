metadata:
  id: TC00891
  name: Set/update Mileage Value
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-04'
  updated: '2025-09-19'
  author: user_7
  testmo_id: 891
  folder_id: 105
preconditions:
- description: User has a non-connected/UNKNOWN vehicle
- description: if a vehicle returns telematicsProgram as NON_CONNECTED / UNKNOWN
- description: status as EXPIRED / UNKNOWN / NOT_ENROLLED / FAILED
steps:
- id: 1
  action: Tap on Vehicle tab
  expected: User should see Mileage card in empty state
- id: 2
  action: Tap on Mileage card
  expected: User should see Estimated Mileage screen with a field for manually entering
    Mileage
- id: 3
  action: Enter a value into the mileage field
  expected: User is able to enter a value into mileage field
- id: 4
  action: Tap Save
  expected: User is able to save their mileage and shows last updated date
- id: 5
  action: Update value in mileage field -> Tap on save
  expected: User is able to save the updated value | The updated value shows along
    with last updated date
- id: 6
  action: Tap Back button
  expected: User should see the corresponding mileage on the Mileage card | And also
    on the Schedule Service flow - the entered mileage should show on Additonal Information
    screen > Estimated Vehicle Milegage
