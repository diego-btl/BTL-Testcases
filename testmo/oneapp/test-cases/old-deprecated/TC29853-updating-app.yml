description: When user updates app to newer version (that has browser login enabled)
  and user was signed in to the older version, user stays signed in.
preconditions:
- description: User is signed in to an older version of app that didn't have browserLogin/EnableBrowserLogin
    ='false'.
- description: User had chosen `keep me signed in` on Login
steps:
- id: 1
  action: Update app
  expected: App gets updated to version that has Browser Login set to true | User
    stays signed in to new version of app
