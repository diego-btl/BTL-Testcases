description: This test case ensures that the static copy of the "Maintenance Care"
  card is displayed correctly when the user clicks on it. It verifies that the details
  of the maintenance plan are accurate and consistent with the design, including the
  screen title, copy, section titles, and links.
preconditions:
- description: User is logged in with an active account.
- description: 'For Nissan: complimentaryMaintenancePackage is set to "NISSAN" in
    VehiclesStaticData.'
- description: The vehicle is an ICE (Internal Combustion Engine) vehicle.
