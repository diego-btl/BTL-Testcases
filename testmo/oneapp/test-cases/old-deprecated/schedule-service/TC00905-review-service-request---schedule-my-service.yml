preconditions:
- description: User is in the process of scheduling service and is on the last screen
    of Review Service Request
steps:
- id: 1
  action: Tap on Schedule Service button
  expected: User should see Service Request Submitted screen with option to add to
    calendar
- id: 2
  action: Tap on Add to Calendar
  expected: User should be brought to their calendar app with all details matching
    their booking
- id: 3
  action: Return to the app and tap the close button
  expected: User should see the Vehicles tab with their Scheduled Service shown on
    screen
