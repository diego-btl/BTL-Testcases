metadata:
  id: TC00903
  name: Select Date and Time
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-04'
  updated: '2025-10-24'
  author: user_7
  testmo_id: 903
  folder_id: 7143
preconditions:
- description: User has selected at least one service and entered mileage if required
steps:
- id: 1
  action: Tap Next on Additional Information screen
  expected: User should see Select Date and Time screen as available date/time slots
    load
- id: 2
  action: Swipe through row of dates
  expected: User should see two weeks worth of days before it fetches more
- id: 3
  action: Tap on right/left arrows
  expected: User should see dates scroll to the end/beginning of the list (fetches
    when reaching the end) 4. User should see available time slots for that day
- id: 4
  action: Tap on a day
  expected: User should see available time slots for that day
- id: 5
  action: Tap on an available time slot
  expected: User should see the time slot in selected state
- id: 6
  action: Tap on Add
  expected: User should Optional Preferences screen with advisor and transportation
    options
- id: 7
  action: Tap on Next
  expected: User should see Review Service Request screen
