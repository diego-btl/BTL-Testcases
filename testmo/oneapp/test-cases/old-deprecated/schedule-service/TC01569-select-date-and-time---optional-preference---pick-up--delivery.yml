steps:
- id: 1
  action: Tap on Pick up & Delivery2. Tap on either address field3. Enter an address
    and select an autocomplete entry4. Tap on either 'I don't need' checkbox5. Tap
    on Save
  expected: 'User should see Pickup/dropoff fields enable and populate with user''s
    address2. User should be able to enter an address3. User should see their selected
    entry in the corresponding address field4. User should see address field cleared
    and disabled5. User should be brought back to Select Date and Time screen with
    updated time slots and pickup/dropoff addresses shownNote: Save button is disabled
    if both fields have ''I don''t need'' checked. If ''I don''t need'' is not checked,
    then an address must be filled in to proceed.'
