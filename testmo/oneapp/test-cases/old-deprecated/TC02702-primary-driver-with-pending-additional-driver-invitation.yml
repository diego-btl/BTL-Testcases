preconditions:
- description: User has a AVK2 vehicleUser is already on the Home PageUser is a PRIMARY_DRIVER
    with pending invitation(s) (1 to 3 invitations)
steps:
- id: 1
  action: The user is able to see the Additional Driver card, and then taps on the
    card2. The user is able to see the pending invitations with status obtained from
    the driverInvites call:- ACCEPTED - PENDING or RESEND- DECLINE- CANCEL
  expected: User is driven to the Additional Driver page, it should display as many
    cards as pending invitations there are.2. Each card should show the First and
    Last Names of the invitee and the status of the invitation (Accepted, Pending,
    Declined, Canceled)3. The button "ADD A DRIVER" should be displayed and enabled
    at the bottom
