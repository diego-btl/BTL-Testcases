metadata:
  id: TC32574
  name: Vehicle Selection screen for Small Sized widget
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-25'
  updated: '2025-04-29'
