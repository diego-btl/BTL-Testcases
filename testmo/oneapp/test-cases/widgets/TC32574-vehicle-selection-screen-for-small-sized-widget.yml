preconditions:
- description: Either Nissan and/or Infiniti app is installed on ios
- description: Related small Widget has been added on Device home screen.
steps:
- id: 1
  action: Long press Widget -> Choose Edit Widget option
  expected: 'For small sized widget: user seesVehicle Status | Name under header:
    MyNissan/ MyInfiniti | Description: "See your vehicle status at a glance" | Selector
    title: Vehicle | Button: Choose'
- id: 2
  action: Tap on Choose -> Select a vehicle
  expected: The front face of widget should show the vehicle chosen along with its
    relevant status
- id: 3
  action: Tap on the front face of widget
  expected: 'App should open with the vehicle chosen on widget as the selected behivle
    on garage | Along with all the APIs get triggered when app is launched, | wdgetdynamicdata
    api also gets triggered. (NOTE: this api gets triggered once every 30 mins)'
