preconditions:
- description: User is logged in
- description: User has added Small sized widget to device
- description: User ha following capabilties turned on in VehicleCapabilties api
- description: 'Turn on the follow caps: REMOTE_DOOR_LOCK_UNLOCK , REMOTE_VEHICLE_STATUS
    , REMOTE_CLIMATE_CONTROL ,and REMOTE_REMOTE_BATTERY_STATUS'
steps:
- id: 1
  action: On app, select EV vehicle -> Go to Widgets -> OR choose a vehicle on Widget
    by long pressing, tapping on Modify Widget -> Choose EV vehicle
  expected: 'EV vehicle should show as selected on the small widget | the user should
    see the model name and vehicle image available from GetVehicle call | AND: the
    user should see remaining mileage from GetBatteryStatus call and the remaining
    Battery percentage (if available) | Battery percentage should show in green if
    its 20% or higher | If remaining battery percentage is 19% or lower, it should
    show in red and in bigger font above the remaining mileage | AND: the user should
    see climate status from GetClimateStatus call | AND: the user should see lock
    status from LockStatus call | See attached ss for reference'
