metadata:
  id: TC32575
  name: Vehicle selection for Medium sized widget
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-25'
  updated: '2025-04-29'
  author: user_24
  testmo_id: 65177
  folder_id: 4176
preconditions:
- description: Preconditions
- description: Either Nissan and/or Infiniti app is installed on ios
- description: Related medium sized Widget has been added on Device home screen.
steps:
- id: 1
  action: Long press Widget -> Choose Edit Widget option
  expected: 'For medium sized widget: user seesRemote Controls | Name under header:
    MyNissan/ MyInfiniti | Description: "Conveniently access key remote controls with
    a single tap, without needing to open the app" | Selector title: Vehicle | Button:
    Choose'
- id: 2
  action: Tap on Choose -> Select a vehicle
  expected: The front face of widget should show the vehicle chosen along with its
    relevant status
- id: 3
  action: Tap on the front face of widget
  expected: 'App should open with the vehicle chosen on widget as the selected vehicle
    on garage | Along with other apis get triggered, when app is launched, | wdgetdynamicdata
    api also gets triggered. (NOTE: this api gets triggered once every 30 mins)'
