preconditions:
- description: Route Already Created with at least 3 stops
- description: Route is more than 48 hours away
- description: User is on Maps Screen
steps:
- id: 1
  action: Tap on Planned Routes -> Tap on View Route to Edit the route -> Validate
    the number of stops displayed according to VehicleEVWaypoints API response ->
    Tap on EDIT ROUTE button -> Tap on Any of the Stops -> After being navigated to
    address page search for the new address or tap on Use Vehicle Location -> After
    being navigated to the Edit Route screen check the stop that was modified and
    changed accordingly -> Scroll Down and tap on ESTIMATE NEW ROUTE -> After being
    navigated to the Estimated Route* page, validate the Stop that was modified is
    shown properly -> Tap on Save Route -> Check the Success toast is displayed
  expected: See expected results
