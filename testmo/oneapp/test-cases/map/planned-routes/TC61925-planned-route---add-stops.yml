preconditions:
- description: Route Already Created without stops
- description: Route is more than 48 hours away
- description: User is on Maps Screen
steps:
- id: 1
  action: Tap on Planned Routes -> Tap on View Route to Edit the route -> Validate
    the number of stops displayed -> Tap on + ADD A STOP button -> Select Shopping
    Category -> Select a proper POI and tap on + ADD A STOP -> After navigated back
    to the Add a Stop Page validate the POI was properly added as Stop and it's displayed
    on the list -> Tap on the Back Button to reach the Estimated Route* Page -> Validate
    the number of stops was increased by 1 -> Tap on Save Route -> Check the Success
    toast is displayed
  expected: See expected results
