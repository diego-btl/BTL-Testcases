preconditions:
- description: User is viewing the Planned Routes section
- description: The user selects an EV or EVAVK2 vehicles
- description: The user should have a Planned Route create
steps:
- id: 1
  action: Check Planned Routes section
  expected: The user should see the next:Icon | Title > Planned Routes | {numberoftrips}
    upcoming trips this week | Arrow icon
- id: 2
  action: Tap Planned Routes
  expected: User should be taken to the Planned Routes screen
- id: 3
  action: Tap Planned Routes -> Click over Delete Route button
  expected: A loading spinner starts till the Route it is deleted from the screen/UI
    | See the Toast:Route successfully delete
- id: 4
  action: Tap Planned Routes -> Click over Delete Route button (Error)
  expected: The user gets an error deleting the route | See the Toast:Failed to delete
    route
