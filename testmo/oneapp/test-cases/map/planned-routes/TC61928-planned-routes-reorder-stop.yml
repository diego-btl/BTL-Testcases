    text1: <ol><li>Tap on Planned Routes</li><li>Tap on <code>View Route</code> to
      Edit the route</li><li>Validate the number of stops displayed</li><li>Tap on
      <code>EDIT ROUTE</code> button</li><li>After the Edit Route page is displayed,
      Tap on the <code>Edit</code> button</li><li>The UI should display a hamburguer
