preconditions:
- description: User is viewing the Planned Routes screen
- description: The user selects an EV or EVAVK2 vehicles
- description: The user should have a Planned Route create
steps:
- id: 1
  action: Tap Send Now on a route that is scheduled within 15 mins -> Tap Ok
  expected: User should see an error modal and dismissed once press the OK buttonError
    - Routes cannot be changed or deleted 15 minutes or less before scheduled time.
- id: 2
  action: Tap Delete Route on a route that is scheduled within 15 mins
  expected: User should see an error modalError - Routes cannot be changed or deleted
    15 minutes or less before scheduled time.
- id: 3
  action: Tap on View Route -> Tap Edit Route on a route that is scheduled within
    15 mins
  expected: User should see an error modalError - Routes cannot be changed or deleted
    15 minutes or less before scheduled time.
