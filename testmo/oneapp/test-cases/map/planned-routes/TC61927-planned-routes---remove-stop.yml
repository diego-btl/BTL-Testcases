preconditions:
- description: Route Already Created with at least 3 stops
- description: Route is more than 48 hours away
- description: User is on Maps Screen
steps:
- id: 1
  action: Tap on Planned Routes -> Tap on View Route to Edit the route -> Validate
    the number of stops displayed -> Tap on EDIT ROUTE button -> After the Edit Route
    page is displayed, Tap on the Edit button -> The UI should display a hamburguer
    and a X button -> On any Stop, tap on the X button -> After the stop is deleted
    from the view, tap on the Done button -> Scroll Down and tap on ESTIMATE NEW ROUTE
    -> After being navigated to the Estimated Route* page, validate the Stop was properly
    removed -> Tap on Save Route -> Check the Success toast is displayed
  expected: See expected results
