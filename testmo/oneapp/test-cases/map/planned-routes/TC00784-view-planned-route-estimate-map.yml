preconditions:
- description: User is viewing the Planned Routes screen
- description: The user selects an EV or EVAVK2 vehicles
steps:
- id: 1
  action: Tap the View Route button on a planned route card -> Force VehicleEVWaypoints
    to fail -> Tap Cancel
  expected: User should see an error alert modal:Something went wrong with the route
    planner. Please try again with Cancel and Try Again options | The modal is dismissed,
    user remains on the Planned Routes screen
- id: 2
  action: Tap Try again and let API succeed
  expected: User is navigated to the Estimated Route screen
