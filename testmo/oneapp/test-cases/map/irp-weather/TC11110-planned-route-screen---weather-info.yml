description: https://www.pivotaltracker.com/story/show/186644040
preconditions:
- description: User has an EV
- description: User is on the Home Screen
- description: User has upcoming planned routes (within the next 30 days)
- description: 'Note: Keep in mind that the app retrieves weather data for each saved
    route individually, with a separate call for each location covering a 30-day data
    period'
steps:
- id: 1
  action: Tap on the My Car Finder card or the Map tab -> Scroll up on the Info Drawer
    and tap on the Planned Routes card
  expected: User should see the Map screen, VehiclePlannedRoutes and https://pro.openweathermap.org/
    APIs are triggered for upcoming routes | User should see Planned Routes screen
    with upcoming planned routes. The trip card should show weather info for the corresponding
    route with the following (starting from top):Destination location | Temperature
    - main, high, and low (based on arrival time) | Condition | Precipitation/Snowfall/Cloudiness
    | Wind | Humidity | Departure date and time | Arrival date and time | Total Distance
- id: 2
  action: Tap on View Route -> Scroll up on the Info Drawer
  expected: User should see the Estimate Route screen for the planned route | User
    should see info drawer expand with the weather info for the corresponding planned
    route (same as when user navigates to Estimate Route when creating a route)
- id: 3
  action: Mock the response for https://pro.openweathermap.org so that some fields
    are null -> Tap on another tab, then go back to Planned Routes again
  expected: User should see the Planned Routes screen with the trip card showing weather
    info with double dashes and a unit of measurement for the corresponding fields
