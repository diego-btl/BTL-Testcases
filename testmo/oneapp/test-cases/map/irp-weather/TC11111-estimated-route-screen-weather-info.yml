  - column_name: custom_steps
    id: 11736
    case_id: 11111
    text1: <ol><li>Mock the response for <a href="https://pro.openweathermap.org">https://pro.openweathermap.org</a>
      so that some fields are null</li><li>Estimate route again</li></ol><p><strong>Note:</strong>
