metadata:
  name: Planned Route Screen - Weather Info
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: '<p>User has an EV</p><p>User is on the Home Screen</p><p>User has
    upcoming planned routes (within the next 30 days)</p><p><strong>Note: </strong>Keep
    in mind that the app retrieves weather data for each saved route individually,
    with a separate call for each location covering a 30-day data period</p>'
  steps:
  - column_name: custom_steps
    id: 11738
    case_id: 11110
    text1: <ol><li>Tap on the My Car Finder card or the Map tab</li><li>Scroll up
      on the Info Drawer and tap on the Planned Routes card</li></ol>
    text2: null
    text3: <ol><li>User should see the Map screen, <code>VehiclePlannedRoutes</code>
      and <a href="https://pro.openweathermap.org/">https://pro.openweathermap.org/</a>
      APIs are triggered for upcoming routes</li><li> User should see Planned Routes
      screen with upcoming planned routes. The trip card should show weather info
      for the corresponding route with the following (starting from top):<ul><li>Destination
      location</li><li>Temperature - main, high, and low (based on arrival time)</li><li>Condition</li><li>Precipitation/Snowfall/Cloudiness</li><li>Wind</li><li>Humidity</li><li>Departure
      date and time</li><li>Arrival date and time</li><li>Total Distance</li></ul></li></ol>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11836
    case_id: 11110
    text1: <ol><li>Tap on View Route</li><li>Scroll up on the Info Drawer</li></ol>
    text2: null
    text3: <ol><li>User should see the Estimate Route screen for the planned route</li><li>User
      should see info drawer expand with the weather info for the corresponding planned
      route (same as when user navigates to Estimate Route when creating a route)</li></ol>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11741
    case_id: 11110
    text1: <ol><li>Mock the response for <a href="https://pro.openweathermap.org/">https://pro.openweathermap.org</a>
      so that some fields are null</li><li>Tap on another tab, then go back to Planned
      Routes again</li></ol><p><strong>Note:</strong> To find the weather object for
      the corresponding arrival time, search for humidity (this is a whole number
      and not a float), or use <a href="https://timestamp.online/">https://timestamp.online/</a>
      to convert the timestamp from the <code>dt</code> field</p>
    text2: null
    text3: <p>2. User should see the Planned Routes screen with the trip card showing
      weather info with double dashes and a unit of measurement for the corresponding
      fields</p>
    text4: null
    display_order: 3
