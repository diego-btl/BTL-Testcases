    mind that the app retrieves weather data for each saved route individually, with
    a separate call for each location covering a 30-day data period</p>'
  steps:
  - column_name: custom_steps
    id: 11817
    case_id: 11132
    text1: <ol><li>Tap on the My Car Finder card or the Map tab</li><li>Scroll up
      on the Info Drawer and tap on the Planned Routes card</li></ol>
    text2: null
    text3: <ol><li>User should see the Map screen, <code>VehiclePlannedRoutes</code>
      API is triggered and <a href="https://pro.openweathermap.org/">https://pro.openweathermap.org/</a>
      API is <strong>not </strong>triggered for route over 30 days away</li><li> User
      should see Planned Routes screen with upcoming planned routes. The trip card
      that is over 30 days away should see the following out of range message in place
      of the weather information:</li></ol><p><code>Weather data in &lt;location&gt;
      is only available within 30 days of a trip, please check back later</code></p>
