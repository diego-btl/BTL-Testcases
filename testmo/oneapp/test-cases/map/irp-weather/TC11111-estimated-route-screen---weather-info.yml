description: https://www.pivotaltracker.com/story/show/186638415
preconditions:
- description: User has an EV
- description: User has filled out the fields on the Create a Route Screen
steps:
- id: 1
  action: Tap on Estimate Route -> Scroll up on the Info Drawer
  expected: User should see the Estimate Route screen load and open, https://pro.openweathermap.org
    API is triggered | User should see info drawer expand with the weather info for
    the corresponding route with the following (starting from the top left):Arrival
    location | Weather icon and temperature (based on arrival time) | High and low
    temperatures | Condition | Precipitation/Snowfall/Cloudiness | Wind | Humidity
    | Departure time and date | Arrival time and date | Charge time
- id: 2
  action: Mock the response for https://pro.openweathermap.org so that some fields
    are null -> Estimate route again
  expected: User should see Estimate Route screen with the weather info in the info
    drawer showing double dashes and a unit of measurement for the corresponding fields
