test_case:
  preconditions: <ul><li>User is viewing POI search results</li><li>The user is in
    the Map screen</li><li>The user has one POI saved</li></ul>
  steps:
  - column_name: custom_steps
    id: 96526
    case_id: 62161
    text1: <ol><li>Scroll up the drawer</li><li>Click on any of the <strong>POI</strong>
      saved</li><li>Click the <code>heart</code> icon</li><li>Click again the <code>heart</code>
      icon</li><li>Input the new name</li><li>Click the the <code>Save Favorite</code>
      button</li></ol>
    text2: null
    text3: <ul><li>User should see Save Favorite become disabled</li><li>A new pop-up
      should show with the textfield to input the name</li><li>User should see a success
      toast, and the heart icon should show the saved state</li></ul>
    text4: null
    display_order: 1
