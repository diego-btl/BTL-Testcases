metadata:
  id: TC62158
  name: Save Favourites POI
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-16'
  updated: '2025-12-16'
  author: user_17
  testmo_id: 65419
  folder_id: 99
preconditions:
- description: User is viewing POI search results
- description: The user is in the Map screen
steps:
- id: 1
  action: Tap in the POI cards -> In the results tap to the heart icon -> Add the
    name of the POI saved -> Tap Save Favorite
  expected: User should see Save Favorite become enabled | A new pop-up should show
    with the textfield to input the name | User should see a success toast, and the
    heart icon should show the saved state
- id: 2
  action: Tap in the POI cards -> In the results tap to the heart icon -> Add the
    name of the POI saved -> Tap CANCEL
  expected: The pop-up should be dismissed
- id: 3
  action: Tap in the POI cards -> In the results tap to the heart icon -> Add the
    name of the POI saved -> Tap Save Favorite (Mock a failure)
  expected: User should see a failure toast, and the heart icon should show the non-saved
    state
