preconditions:
- description: User is viewing POI search results
- description: The user is in the Map screen
- description: The user has one POI saved
steps:
- id: 1
  action: Scroll up the drawer -> Click on any of the POI saved -> Click the heart
    icon
  expected: User should see Save Favorite become disabled | User should see a success
    toast, and the heart icon should show the unsaved state
- id: 2
  action: Scroll up the drawer -> Click on See More -> Click the heart icon
  expected: The POI previously saved should disappear from the list | User should
    see a success toast that the POI was removed
