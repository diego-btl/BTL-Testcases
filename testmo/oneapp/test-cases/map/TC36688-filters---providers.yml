metadata:
  id: TC36688
  name: Filters - Providers
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-05-08'
  updated: '2025-12-19'
  author: user_25
  testmo_id: 65094
  folder_id: 46
preconditions:
- description: 'FF "GrantFullPlugAndCharge": true'
- description: User is on the Map screen
- description: AccountStatus is ACTIVE
steps:
- id: 1
  action: User navigates the Filters splash screen from the Map tab
  expected: CpoDetails API is triggered | Providers displayed in the Preferred Providers
    and All sections are displayed in alphabetical order
- id: 2
  action: 'CpoDetails API returns "preferredProvider": "true" for a particular provider'
  expected: The exact provider is displayed in the Preferred Providers section
- id: 3
  action: 'CpoDetails API returns "preferredProvider": "false" for a particular provider'
  expected: The exact provider is displayed in the All section
- id: 4
  action: 'CpoDetails API returns all providers as "preferredProvider": "false"'
  expected: All the returned providers are displayed in the Providers section. | Both
    Preferred Providers and All titles are hidden.
- id: 5
  action: 'CpoDetails API returns all providers as "preferredProvider": "true"'
  expected: All the returned providers are displayed in the Providers section. | Both
    Preferred Providers and All titles are hidden.
