metadata:
  id: TC31304
  name: Error Messages on EVWaypoint failure
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-03-14'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 31304
  folder_id: 101
description: Feature ONLY for NissanNNA + NCI
preconditions:
- description: User has an EV2
- description: User is on the Creata a Route screen
steps:
- id: 1
  action: User fills all the necessary fields on the Create a Route screen and taps
    ESTIMATE ROUTE CTA
  expected: VehicleEVWaypoints API is triggered
- id: 2
  action: 'If VehicleEVWaypoints API returns:'
  expected: ENNo charge stations found. Change the search parameters (such as charge
    station plug-type) and search again. | FRAucune borne de recharge trouvée. Modifiez
    les paramètres de recherche (comme le type de prise de la station de recharge)
    et recherchez à nouveau.
- id: 3
  action: 'If VehicleEVWaypoints API returns:'
  expected: ENUnable to calculate route because charging time is in excess of 90 minutes.
    Change your plug type and recalculate. | FRImpossible de calculer l'itinéraire
    parce que le temps de recharge dépasse 90 minutes. Changez le type de prise et
    recalculer.
