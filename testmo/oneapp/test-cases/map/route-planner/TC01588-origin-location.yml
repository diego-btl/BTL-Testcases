preconditions:
- description: User is on Create a Route screen
steps:
- id: 1
  action: Vehicle location is being returned -> Tap on origin field and tap Use Vehicle
    Location
  expected: User should see the origin field say Your Vehicle's Location | User should
    see search screen with Use Vehicle Location option, origin field shows Your Vehicle's
    Location
- id: 2
  action: Vehicle location is not being returned but user location is available ->
    Tap on origin field and tap Use Current Location
  expected: User should see the origin field say Your Current Location | User should
    see search screen with Use Current Location option, origin field shows Your Current
    Location
- id: 3
  action: Vehicle location and user location are not available
  expected: The origin field should be blank
