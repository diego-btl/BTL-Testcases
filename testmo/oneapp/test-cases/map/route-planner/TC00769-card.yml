description: When the user triggers new actions and new APIs are loading, in the UI
  we are showing the loading state showing that the next screen is loading data or
  updating the changes made. This applies for the screens during the Planned Route
  flow (Create, Delete or Update)The state should be a loading spinner with the icon
  attached in the SS, and it should be visible the same way for Dark and Light mode.
preconditions:
- description: User's selected vehicle supports IRP
