preconditions:
- description: The user selects an EV or EVAVK2 vehicles
- description: The user is in the Create Route screen
steps:
- id: 1
  action: Tab on the +ADD A STOP button
  expected: User should see the Search field
- id: 2
  action: Type any destination to add to the Route -> Select an autocomplete result
  expected: The user should see the autocomplete result filled into the field and
    return to the Create Screen | The user should see the updated screen with the
    new stop added
- id: 3
  action: Tap on the +ADD A STOP button again to add more stops.
  expected: The user should see the updated screen with the new stops successfully
    added to the route | The stops added should be placed under the previous stop
    added
