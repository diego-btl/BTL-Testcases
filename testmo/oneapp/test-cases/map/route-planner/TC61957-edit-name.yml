steps:
- id: 1
  action: Edit Name field
  expected: User should see the name pre-filled with Trip 1 | User should be able
    to edit the name field | The user shouldn't be able to type special character
    | The user shouldn't be able to type more than 36 characters
- id: 2
  action: Edit Name field -> Click over DONE to save the changes
  expected: The changes should apply to the fields | The user shouldn't be able to
    edit it anymore if the DONE button is clicked
