    id: 941
    case_id: 772
    text1: <ol><li>Tap the <code>+ADD A STOP</code> button</li></ol>
    text2: null
    text3: <ul><li>User should be redirected to the screen <code>Add a Stop</code></li><li><strong>VehicleJourneys</strong>
      and <strong>VehiclePOIDestinations</strong> APIs are triggered</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95580
    case_id: 772
    text1: <ol><li>Tap the <code>+ADD A STOP</code> button</li><li>The user select
      one stop from the POI</li><li>Select one result and click <code>+ADD A STOP</code>
      button</li></ol>
    text2: null
    text3: <ul><li>User should see a <i>destination</i> field added under the last
      one</li><li>The list of results show in the UI</li><li>The user is able to add
      the stop selected</li><li><strong>VehicleEVWaypoints</strong> API is triggered</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95667
    case_id: 772
    text1: '<ol><li>Tap the <code>+ADD A STOP</code> button</li><li>Tap the search
      bar</li><li>Enter a new stop (IE: Santa Monica)</li><li>Select one result and
      click <code>+ADD A STOP</code> button</li></ol>'
    text2: null
    text3: <ul><li>User should see a <i>destination</i> field added under the last
      one</li><li>The list of results show in the UI</li><li>The user is able to add
      the stop selected</li><li><strong>LocationDetails</strong> and <strong>VehicleEVWaypoints</strong>
