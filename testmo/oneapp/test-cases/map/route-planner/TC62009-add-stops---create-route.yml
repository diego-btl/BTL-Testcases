preconditions:
- description: User is in the Create Route screen
- description: The user selects an EV or EVAVK2 vehicles
steps:
- id: 1
  action: Tap the +ADD A STOP button -> The user enter a stop
  expected: The user is taken to the Create Route screen and can search for a location
    | The Use Vehicle Location it is showing under the search bar field | The loop
    it is showing in the search bar field | The user can delete the results clicking
    the X button in the field | The autocomplete feature suggest the possible options
    | User should see a destination field added under the last one
- id: 2
  action: Tap the +ADD A STOP button -> The user enter the max number of stops (EV
    -4/EV2 - 6)
  expected: User should see +ADD A STOP button become disabled when there are (EV
    -4/EV2 - 6) stops (excluding Vehicle Location and Destination fields)
