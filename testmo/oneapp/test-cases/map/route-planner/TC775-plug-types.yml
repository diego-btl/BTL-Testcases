test_case:
  preconditions: <ul><li>User is on <strong>Create a Route</strong> screen</li></ul>
  steps:
  - column_name: custom_steps
    id: 944
    case_id: 775
    text1: <ol><li>Scroll to the <strong>Options</strong> section</li><li>Try to disable
      one of the plug types</li><li>Disable the other plug type</li></ol>
    text2: null
    text3: <ul><li>User should see both plug types enabled by default</li><li>User
      should be able to do so</li><li>User should see <strong>Estimate Route</strong>
      button become disabled when both plug types are disabled</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 61501
    case_id: 775
    text1: <ol><li>User navigates to the <strong>Plug In Option</strong>s sections
      (EV)</li></ol>
    text2: null
    text3: <p>User should see 2 Plug Types toggles:</p><ul><li>CCS (DC Fast) - ENG</li><li>J1772
      (AC Levels 1 and 2)  - ENG</li></ul><hr /><ul><li>CCS (CC Rapide) - FR</li><li>J1772
      (Niveaux CA 1 et 2) - FR</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 61502
    case_id: 775
    text1: <ol><li>User navigates to the <strong>Plug In Options</strong> sections
      (EV2)</li></ol>
    text2: null
    text3: <p>User should see 3 Plug Types toggles:</p><ul><li>CCS (DC Fast - Adapter
      Required) - ENG<br />J1772 (AC Levels 1 and 2) - ENG<br />NACS (DC Fast) - ENG</li></ul><hr
      /><ul><li>CCS (CC Rapide - Adaptateur requis) - FR<br />J1772 (Niveaux CA 1
      et 2) - FR<br />NACS (CC Rapide) - FR</li></ul>
    text4: null
    display_order: 3
  notes: "<p>When the user click the <code>Estimate Route</code> button the API is\
    \ calling <strong>VehicleEVWaypoints</strong> with the Plug Types in the Request:</p><pre><code\
