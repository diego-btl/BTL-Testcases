    \ $distanceUnit: DistanceUnit, $plugConnectorTypes: [PlugConnectorType]!, $estimatedBatteryLevelAtDeparture:\
    \ String) { vehicle(vin: $vin) { __typename ... on BaseElectricVehicle { evWaypoints(\
    \ routes: $routes departAt: $departAt arriveBy: $arriveBy socAtStop: $socAtStop\
    \ socAtDestination: $socAtDestination plugConnectorTypes: $plugConnectorTypes\
    \ minPower: $minPower estimatedBatteryLevelAtDeparture: $estimatedBatteryLevelAtDeparture\
    \ ) { __typename ... on EVWaypoint { __typename departureTime arrivalTime totalChargingTimeInSeconds\
