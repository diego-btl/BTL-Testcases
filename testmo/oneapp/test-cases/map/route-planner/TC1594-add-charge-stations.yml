  name: Add charge stations
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <ul><li>User is viewing the <strong>Estimate Route*</strong> section</li><li>The
    user selects an <code>EV</code> or <code>EVAVK2</code> vehicles</li></ul>
  steps:
  - column_name: custom_steps
    id: 1959
    case_id: 1594
    text1: <ol><li>Expanded info drawer positions</li></ol>
    text2: null
    text3: <ul><li>User should see all the Charging Stations that are along the Route
      to make it to the Destination</li><li>The percentage of the battery shows at
      the right side of the Stop/Charging Stop</li><li>The charging time necessary
      shows in the Charging Stop</li><li>The arrival time shows in the Charging Stop</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95339
    case_id: 1594
    text1: <ol><li>Click over <code>+ADD A STOP</code></li></ol>
    text2: null
    text3: <ul><li>The user is redirect to the <code>Add a Stop</code> screen</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95340
    case_id: 1594
    text1: <ol><li>Click over the POI <code>Charging Stations</code></li></ol>
    text2: null
    text3: <ul><li>A loading spinner shows</li><li>LocationDetails API is triggered</li><li>The
      Charging Stations in the radius distance display in the Map</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95341
    case_id: 1594
    text1: <ol><li>Zoom In in the area you wan to add the station</li><li>Click over
      <code>Search this area</code></li><li>Select one Charging Station</li><li>Click
      the option <code>+ADD A STOP</code></li></ol>
    text2: null
    text3: <ul><li>A loading spinner shows</li><li>VehicleEVWaypoints is triggered</li><li>The
      new Stop should be added to the Route</li><li>The new Stops shows in the Route
      with the name of the charging station</li></ul>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95383
    case_id: 1594
    text1: <ol><li>Click over the POI <code>Charging Stations</code></li><li>Zoom
      In in the area you wan to add the station</li><li>Click over <code>Search this
      area</code></li><li>Select another Charging Station</li><li>Click the option
      <code>+ADD A STOP</code></li></ol>
    text2: null
    text3: <ul><li>The new Charging Station should be added to the Route with the
      previous one</li></ul>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 95381
    case_id: 1594
    text1: <ol><li>Click the back button</li></ol>
    text2: null
    text3: <ul><li>The new Charging Station it is displaying in the Route</li><li>The
      Icon for the stop should be showing depending the letter of the alphabet order
      (A,B,C...)</li><li>The Charging Station added was successfully added </li></ul>
    text4: null
    display_order: 6
