metadata:
  id: TC00772
  name: Add stops - Estimate Route*
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2025-12-12'
  author: user_2
  testmo_id: 772
  folder_id: 101
description: The maximum numbers of stops (excluding Origin - Destination):EV - 4EVAVK2
  - 6
preconditions:
- description: User is in the Estimate Route* screen
- description: The user selects an EV or EVAVK2 vehicles
steps:
- id: 1
  action: Tap the +ADD A STOP button
  expected: User should be redirected to the screen Add a Stop | VehicleJourneys and
    VehiclePOIDestinations APIs are triggered
- id: 2
  action: Tap the +ADD A STOP button -> The user select one stop from the POI -> Select
    one result and click +ADD A STOP button
  expected: User should see a destination field added under the last one | The list
    of results show in the UI | The user is able to add the stop selected | VehicleEVWaypoints
    API is triggered
- id: 3
  action: 'Tap the +ADD A STOP button -> Tap the search bar -> Enter a new stop (IE:
    Santa Monica) -> Select one result and click +ADD A STOP button'
  expected: User should see a destination field added under the last one | The list
    of results show in the UI | The user is able to add the stop selected | LocationDetails
    and VehicleEVWaypoints APIs are triggered
- id: 4
  action: 'Tap the +ADD A STOP button -> Tap the search bar -> Enter a new stop (IE:
    Santa Monica) -> Select one result and click +ADD A STOP button (Error) - Add
    a Breakpoint the VehicleEVWaypoints API'
  expected: No stop is added to the Route | The UI still showing the stop | The card
    still showing the + ADD A STOP button as it wasn't added to the Route | A toast
    shows like a warning in the FESomething Went wrong - Something went wrong with
    the route planner. Please try again
- id: 5
  action: Tap the +ADD A STOP button -> Tap in any POI -> Add a Breakpoint the VehicleEVWaypoints
    API
  expected: No stop is added to the Route | The UI still showing the stop | The card
    still showing the + ADD A STOP button as it wasn't added to the Route | A toast
    shows like a warning in the FESomething Went wrong - Something went wrong with
    the route planner. Please try again
- id: 6
  action: Tap the +ADD A STOP button -> The user enter the maximum number of stops
    (EV -4/EV2 - 6)
  expected: User should see +ADD A STOP button become enable when there are (EV -4/EV2
    - 6) stops (excluding Vehicle Location and Destination fields) | The user should
    see the button disable for +ADD A STOP for any new search that is made or any
    POI chips selected in the Add a Stop screen
