preconditions:
- description: User is on Create a Route screen
steps:
- id: 1
  action: Scroll to the Options section -> Try to disable one of the plug types ->
    Disable the other plug type
  expected: User should see both plug types enabled by default | User should be able
    to do so | User should see Estimate Route button become disabled when both plug
    types are disabled
- id: 2
  action: User navigates to the Plug In Options sections (EV)
  expected: CCS (DC Fast) - ENG | J1772 (AC Levels 1 and 2) - ENG | CCS (CC Rapide)
    - FR | J1772 (Niveaux CA 1 et 2) - FR
- id: 3
  action: User navigates to the Plug In Options sections (EV2)
  expected: CCS (DC Fast - Adapter Required) - ENGJ1772 (AC Levels 1 and 2) - ENGNACS
    (DC Fast) - ENG | CCS (CC Rapide - Adaptateur requis) - FRJ1772 (Niveaux CA 1
    et 2) - FRNACS (CC Rapide) - FR
