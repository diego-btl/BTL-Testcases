test_case:
  preconditions: <ul><li>User is in the <strong>Create Route</strong> screen</li><li>The
    user selects an <code>EV</code> or <code>EVAVK2</code> vehicles</li></ul>
  steps:
  - column_name: custom_steps
    id: 947
    case_id: 778
    text1: <ol><li>Enter a destination field, date, and time</li><li>Tap <code>Estimate
      Route</code> button</li><li>Force an error</li></ol>
    text2: null
    text3: <ul><li>User should see <code>Estimate Route</code> button become enabled</li><li>User
      should see a loading state as the app makes a call to get EV waypoints</li><li>User
      should see an error alert modal and be able to cancel or try again<ul><li><strong>Error</strong>
      - <code>Something went wrong with the route planner. Please try again </code>-
      <strong>Cancel</strong> | <strong>Try Again</strong></li></ul></li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95317
    case_id: 778
    text1: <ol><li>Enter a destination field, date, and time</li><li>Tap <code>Estimate
      Route</code> button</li><li>Force an error</li><li>Tap Try Again on error alert
      modal and wait for call to succeed</li></ol>
    text2: null
    text3: <ul><li>User should see a map view of their origin, stops, and EV waypoints
      on a route</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95319
    case_id: 778
    text1: <ol><li>Enter a destination field, date, and time</li><li>Add different
      stops</li><li>Tap <code>Estimate Route</code> button</li><li>Check the Charging
      Icons</li></ol>
    text2: null
    text3: <ul><li>The Charging Icons should be showing in the left side of the Charging
      Stop</li><li>The color should be light blue like the other buttons</li><li>The
      battery percentage should be showing in the right side with the battery icon</li><li>The
      Charging Station name should be displaying</li><li>The arriving hour should
      show in the stop</li><li>The charging time should be displaying in min/h</li></ul>
    text4: null
    display_order: 3
