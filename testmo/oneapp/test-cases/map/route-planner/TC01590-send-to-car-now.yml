metadata:
  id: TC01590
  name: Send to car now
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-28'
  updated: '2025-12-12'
  author: user_2
  testmo_id: 65375
  folder_id: 101
preconditions:
- description: The user selects an EV or EVAVK2 vehicles
- description: User is on Estimate Route* screen
- description: Send to Car now enabled
steps:
- id: 1
  action: Tap Send to car now -> Tap Cancel on the modal
  expected: User should see an alert modal | Alert modal should be dismissed
- id: 2
  action: Tap Send to car now -> Tap Yes on the modal
  expected: User should see a loading state as send now call is madeRoute sent to
    the vehicle | User stays in the Map screen
- id: 3
  action: Tap Send to car now -> Force an error
  expected: User should see a failure toastFailed to send route to vehicle | User
    stays in the Estimated Route* screen
- id: 4
  action: Tap Send to car now -> Tap Yes on the modal, and allow call to succeed ->
    Check recently sent to vehicle
  expected: User should be taken back to the Maps screen with a success toast 'Route
    sent to vehicle' | User should see see sent route shown in recently sent to vehicle
