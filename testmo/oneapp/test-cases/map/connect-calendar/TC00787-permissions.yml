preconditions:
- description: The user selects an EV or EVAVK2 vehicles
- description: The user is in the Map screen
steps:
- id: 1
  action: Check the Route Planner section
  expected: The user should see the Connect Calendar option
- id: 2
  action: Tap the Connect Calendar card for the first time
  expected: The user should see the calendar permissions modal
- id: 3
  action: Deny permissions
  expected: The user should see the modal close and remain on the same page
- id: 4
  action: Tap on the card again
  expected: The user should see unable to access the calendar modal
- id: 5
  action: Tap on Cancel/Settings
  expected: Cancel will close the modal, and Settings will bring users to app settings
    where they can enable calendar permissions
