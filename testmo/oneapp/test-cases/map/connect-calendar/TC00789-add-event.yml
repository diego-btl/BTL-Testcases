preconditions:
- description: User is in the Map screen
- description: The user selects an EV or EVAVK2 vehicles
- description: Calendar permissions are allowed
steps:
- id: 1
  action: In the native calendar app, add an event with a location and save
  expected: User should see the newly added event show up in Upcoming Events (if it's
    not shown, tap to refresh)
- id: 2
  action: Switch to Nissan app and tap on Connect Calendar
  expected: User should see event cards in chronological order
