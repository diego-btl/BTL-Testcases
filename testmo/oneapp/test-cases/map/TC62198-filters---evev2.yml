metadata:
  id: TC62198
  name: Filters - EV/EV2
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-19'
  updated: '2025-12-19'
  author: user_17
  testmo_id: 65100
  folder_id: 46
description: Plug Types for EV:NACS (Adapter Required) DC FastCCS DC FastJ1772 AC
  Levels 1 and 2Plug Types for EV2:NACS DC FastCCS (Adapter Required) DC FastJ1772
  AC Levels 1 and 2
preconditions:
- description: The user selects an EV or EVAVK2 vehicles
- description: 'FF "GrantFullPlugAndCharge": true'
- description: User is on the Map screen
- description: AccountStatus is ACTIVE
steps:
- id: 1
  action: User navigates the Filters splash screen from the Map tab (accountStatus=ACTIVE)
  expected: The filter screen should show with all the options:Filters | Search SettingsShow
    cahrge stations around search | Within reachable area | Only show stations with
    available chargers | Plug TypesJ1772 AC Levels 1 and 2 | CCS DC Fast | NACS (Adapter
    Required) DC Fast | Charge Station PreferencesIn-Network Only | ProvidersPreferred
    Partners - favourite one | All - List of charging providers | RESET FILTERS |
    APPLY
- id: 2
  action: User navigates the Filters splash screen from the Map tab (accountStatus
    =! ACTIVE)
  expected: The filter screen should show with all the options:Filters | Search SettingsShow
    cahrge stations around search | Within reachable area | Only show stations with
    available chargers | Plug TypesJ1772 AC Levels 1 and 2 | CCS DC Fast | NACS (Adapter
    Required) DC Fast | Charge Station PreferencesActivate the NISSAN ENERGY Charge
    Network today for access to Nissan's in-network charging partners. | Activate
    | ProvidersPreferred Partners - favourite one | All - List of charging providers
    | RESET FILTERS | APPLY
- id: 3
  action: User navigates the Filters splash screen from the Map tab (accountStatus=INACTIVE)
    -> Click over the button > Activate
  expected: The user should be redirect to the NECN screen to activate the account
- id: 4
  action: User navigates the Filters splash screen from the Map tab (accountStatus=ACTIVE)
    -> Click over RESET FILTERS -> Click the POI Charging stations
  expected: The filters should be showing as their previous state | The results of
    the search should match the filters that were set | The RESET FILTER option it
    is disable again (will become enable once the user make any new change in the
    filter)
- id: 5
  action: User navigates the Filters splash screen from the Map tab (accountStatus=ACTIVE)
    -> Modify the next filters:Show charge stations around search -> Click the button
    APPLY -> Click the POI - Shopping
  expected: Shopping results should show along the route | No charging stations should
    be showing around the POI - Shopping, just the ones that were showing before applying
    the filters
- id: 6
  action: User navigates the Filters splash screen from the Map tab (accountStatus=ACTIVE)
    -> Mock the response for CpoDetails to fail
  expected: The app should have cache the previous response and will show the correct
    filters screen | If this was with Fresh Install and no data cache previously the
    screen of Filters wont show the Providers section
- id: 7
  action: After the user apply the Filters and perform a new search tapping the POI
    - Charge Stations the app is calling the API - LocationDetails
  expected: 'The Response will be send with the new filters applied:'
