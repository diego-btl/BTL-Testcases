metadata:
  id: TC62193
  name: Filters - AVK2
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-19'
  updated: '2025-12-19'
  author: user_17
  testmo_id: 62193
  folder_id: 46
preconditions:
- description: User is on the Map screen
- description: The user has an AVK2
steps:
- id: 1
  action: User navigates the Filters splash screen from the Map tab
  expected: CpoDetails API is triggered | Filters title is display | Route Options
    display - Fastest(default)/Shortest/Eco/General | Avoid Tolls - Toggle (disabled)
    | Avoid Highways - Toggle (disabled) | Avoid Ferries - Toggle (disabled) | RESET
    FILTERS - CTA | APPLY - CTA (disabled)
- id: 2
  action: User select the next config:Route Options - Shortest -> Avoid Tolls - Toggle
    (enabled) -> Avoid Highways - Toggle (enabled) -> Avoid Ferries - Toggle (enabled)
    -> Click APPLY
  expected: The APPLY button should became enabled | The filters should apply correctly
- id: 3
  action: Change the filters and apply the changes
  expected: The user should see the changes applied | The Route/POI search should
    meet this filters applied
- id: 4
  action: If the CpoDetails returns error for AVK2
  expected: The user still seeing the Filters screen without any issues
