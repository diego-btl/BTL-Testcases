  testmo_id: 52185
  folder_id: 2442
description: Display "Adapter" pop-up for CCS chargers
preconditions:
- description: AccountStatus API:- status is ACTIVE- nacsStatus is NOT_APPLICABLE,
    empty or null
steps:
- id: 1
  action: Navigate to the Map and tap Charge Stations ePOI
  expected: LocationDetails API is triggered and contains evses.connector.connectorType
    = "CCS" (EV) orevses.connector.connectorType = "CCS (Adapter Required)" (EV2)
    or evses.connector.connectorType = "J1772" (EV, EV2)
- id: 2
  action: Navigate to the charge station with CCS, CCS (Adapter Required) or J1772
    plug types, proceed to the Select Charge screen, and tap START CHARGING CTA
  expected: The parkingChargeable API is triggered, CCS disclaimer is displayed in
    the FE (SS)
