  testmo_id: 65424
  folder_id: 2442
description: Check nacsStatus when determining whether to show the Tesla disclaimer
preconditions:
- description: AccountStatus API:- status is ACTIVE- nacsStatus is ACTIVE or IN-ACTIVE
steps:
- id: 1
  action: Navigate to the Map and tap Charge Stations ePOI
  expected: LocationDetails API is triggered
- id: 2
  action: Navigate to the charge station which contains "Supercharger" in its name,
    proceed to the Select Charge screen and tap START CHARGING CTA
  expected: The parkingChargeable API is triggered, Tesla disclaimer is displayed
    in the FE (SS)
- id: 3
  action: Navigate to the charge station which DOES NOT contain "Supercharger" in
    its name, proceed to the Select Charge screen and tap START CHARGING CTA
  expected: The parkingChargeable API is triggered, Tesla disclaimer IS NOT displayed
    in the FE
