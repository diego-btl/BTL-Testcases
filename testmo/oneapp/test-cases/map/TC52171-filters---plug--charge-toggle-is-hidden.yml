metadata:
  id: TC52171
  name: Filters - Plug & Charge toggle is hidden
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-06-20'
  updated: '2025-12-19'
  author: user_25
  testmo_id: 65087
  folder_id: 46
preconditions:
- description: 'FF "GrantFullPlugAndCharge": true'
- description: User is on the Map screen
- description: AccountStatus =! ACTIVE
steps:
- id: 1
  action: Tap on Filters button
  expected: User should see the Filters screen opens as a splash page
- id: 2
  action: 'Scroll to the Charge Station Preferences section (AccountStatus API returns
    "pncStatus": "NA" or "pncStatus": "FAILED" or "pncStatus": "INSTALLING" OR "pncStatus":
    "READY" OR "pncStatus": "RENEWING" OR "pncStatus": "PENDING")'
  expected: The Plug & Charge toggle is hidden in the Charge Station Preferences section
- id: 3
  action: The user scroll to Charge Station Preferences
  expected: The copy Activate the NISSAN ENERGY Charge Network today for access to
    Nissan's in-network charging partners. and Activate CTA (enabled) is present in
    the Charge Station Preferences section
