description: https://www.pivotaltracker.com/story/show/188759466To help users identify
  charge stations that are capable of plug & charge, locations with P&C capable chargers
  should be identified with a tag on their map card and Charge Station Details screenNissan
  ONLY (NNA and NCI)
preconditions:
- description: FF EnablePlugAndChargeFoundational
- description: FF GrantFullPlugAndCharge
- description: LocationDetails API response contains PlugandChargeCapable in its evseCapability
steps:
- id: 1
  action: User taps Charge Stations ePOI in the Map screen
  expected: ChargePoint cards are displayed at the bottom of the screen
- id: 2
  action: If LocationDetails API response contains PlugandChargeCapable in its evseCapability
  expected: '"Plug & Charge" label is displayed on the particular ChargePoint card'
- id: 3
  action: User taps ChargePoint card with "Plug & Charge" label on it
  expected: User is redirected to the Charge Station Details screen."Plug & Charge"
    label is displayed on the ChargePoint card in the Charge Station Details screen
- id: 4
  action: User taps SELECT CHARGER CTA in the Charge Station Details screen
  expected: User is redirected to the Select Charger screen."Plug & Charge" label
    is displayed for the particular connector corresponding to the API response
