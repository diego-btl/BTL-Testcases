description: https://www.pivotaltracker.com/story/show/186399716
preconditions:
- description: User is logged into an account with a pending AD invite
- description: User is on the Code Verification screen
- description: User has exhausted all 10 attempts
- description: In order to receive the OTP code, you will need to have mocked user
    own number in VehiclesStaticData and UserMobileNumber or setting a breakpoint
    on GenerateOTPForSharedDriver and modifying the request with your own number
steps:
- id: 1
  action: Tap on Return to Home
  expected: User should see a loading spinner, then redirected to the home screen
    which updates and no longer shows the pending invite (since code verification
    has failed and invitation has been declined)
