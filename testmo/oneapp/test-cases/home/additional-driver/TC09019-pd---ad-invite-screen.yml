preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User is on the AD Invite screen
steps:
- id: 2
  action: Fill in the First and Last Name field
  expected: User is able to fill in the name fieldsFields only accept letters, minimum
    one letter required, any other characters will trigger a validation error
- id: 3
  action: Fill in the Email fields
  expected: User is able to fill in the email fieldsEmail must be in a@a.com format
    or it will trigger a validation errorIf the emails don't match, there will also
    be a validation error
- id: 4
  action: Fill in the Phone Number field
  expected: User is able to fill in the phone number fieldField only accepts exactly
    10 digits or it will trigger a validation error
- id: 5
  action: Tap on the checkbox
  expected: User should see Next button enable if all required fields are filled in,
    checkbox is enabled, and there are no validation error
- id: 6
  action: Tap on Next
  expected: User should see Configuration Details screen load and open
