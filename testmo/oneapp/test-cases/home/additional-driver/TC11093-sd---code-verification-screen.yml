description: https://www.pivotaltracker.com/story/show/186049955
preconditions:
- description: User is logged into an account with a pending AD invite
- description: User is on the Code Verification screen
- description: In order to receive the OTP code, you will need to have mocked user
    own number in VehiclesStaticData and UserMobileNumber or setting a breakpoint
    on GenerateOTPForSharedDriver and modifying the request with your own number
steps:
- id: 2
  action: Tap on the empty field
  expected: User should see the number pad appear
- id: 3
  action: Enter less than 5 digits
  expected: User should see corresponding number shown in the field, Verify and Proceed
    button remains disabled
- id: 4
  action: Enter 5 digits
  expected: User should see corresponding number shown in the field, Verify and Proceed
    button become enabled
- id: 5
  action: Tap on delete/backspace
  expected: User should see the last number deleted, Verify and Proceed button becomes
    disabled
