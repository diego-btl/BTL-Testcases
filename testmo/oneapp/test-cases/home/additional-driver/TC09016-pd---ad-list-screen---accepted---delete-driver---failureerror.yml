preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User has an accepted invitation
- description: User is viewing Invitation Details
steps:
- id: 1
  action: GeneralErrors -> DatabaseError -> BrandError -> TokenError -> InvalidInviteIdError
  expected: See expected results
- id: 2
  action: Tap on Delete Driver
  expected: User should see an Are you sure? modal with options - No/Yes
- id: 3
  action: Tap on No
  expected: User should see modal dismiss and remain on the Invitation Details screen
- id: 4
  action: Tap on Yes
  expected: User should see a loading spinner, then a Something Went Wrong modal with
    options - Cancel/Retry
- id: 5
  action: Tap on Cancel
  expected: User should see the error modal dismiss and remain on the Invitation Details
    screen
- id: 6
  action: Tap on Retry
  expected: User should see the same API call triggered again
