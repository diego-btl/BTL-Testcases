steps:
- id: 2
  action: Tap on See Less
  expected: User should see corresponding section collapse
- id: 3
  action: Tap on See More
  expected: User should see corresponding section expand
- id: 4
  action: Tap to toggle off multiple sections
  expected: User should see toggles in off state and should also see Allow all toggle
    in off state
- id: 5
  action: Tap to toggle on Allow all
  expected: User should see all toggles in on state
