preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User is on the Configuration Details screen
steps:
- id: 2
  action: 'Mock ShareableCapabilities so that a capability within a group is "shareable":
    false'
  expected: User should see that line item shown as greyed out with an asterisk
- id: 3
  action: 'Mock ShareableCapabilities so that all capabilities within a group are
    "shareable": false'
  expected: User should see the toggle for that group disabled in the off state
- id: 4
  action: Modify any of the toggles and tap on Save Changes
  expected: User should see Invite Summary screen with the corresponding capability
    groups checked (capabilities that were toggled off should show an x)
