steps:
- id: 1
  action: 'Mock an error for ShareableCapabilities [iOS] with the following:'
  expected: See expected results
- id: 2
  action: Tap on the Next button
  expected: User should see the Configuration Details screen load and open with a
    Something went wrong error modal
- id: 3
  action: Tap on Cancel
  expected: User should see the error modal dismissed and remain on the Configuration
    Details screen (user cannot proceed until configurations load)
- id: 4
  action: Tap on Retry
  expected: User should see the same API call triggered again
