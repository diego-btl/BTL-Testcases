steps:
- id: 1
  action: GeneralErrors -> DatabaseError -> BrandError -> TokenError -> VinValidationError
  expected: See expected results
- id: 2
  action: Tap on the Additional Driver card
  expected: User should see the Additional Driver screen load and open with a Something
    went wrong error modal [DriverInvites - iOS]
- id: 3
  action: Tap on Cancel
  expected: User should see the error modal dismissed and remain on the Additional
    Driver screen
