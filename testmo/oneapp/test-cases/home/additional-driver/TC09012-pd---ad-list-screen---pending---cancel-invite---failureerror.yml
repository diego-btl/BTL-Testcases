preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User has a valid pending invitation
- description: User is viewing pending invitation
steps:
- id: 1
  action: GeneralErrors -> DatabaseError -> BrandError -> TokenError -> InvalidInviteIdError
  expected: See expected results
- id: 2
  action: Tap on Cancel Invite
  expected: User should see Cancel Invite? modal with options - No/Yes
- id: 3
  action: Tap on No
  expected: User should see modal dismiss
- id: 4
  action: Tap on Yes
  expected: User should see a loading spinner, then an Failed to cancel invite modal
    with option Cancel/Retry
- id: 5
  action: Tap on Cancel
  expected: User should see the error modal dismiss and remain on the pending invitation
    screen
- id: 6
  action: Tap on Retry
  expected: User should see the same API call triggered again
