preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User has an accepted invitation
- description: User is viewing Configuration Details
steps:
- id: 1
  action: GeneralErrors -> DatabaseError -> BrandError -> TokenError -> InvalidInviteIdError
  expected: See expected results
- id: 2
  action: Modify any of the toggles -> Tap on Save Changes
  expected: User should see Save Changes button enable | User should see a loading
    spinner, then a Something Went Wrong modal with options - Cancel/Retry
- id: 3
  action: Tap on Cancel
  expected: User should see the error modal dismiss and remain on the Configuration
    Details screen and the toggle reset
- id: 4
  action: Tap on Retry
  expected: User should see the same API call triggered again
