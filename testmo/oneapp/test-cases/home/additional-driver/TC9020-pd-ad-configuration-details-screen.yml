test_case:
  preconditions: <p>User has an AVK2 vehicle and is PRIMARY_DRIVER</p><p>User is on
    the Configuration Details screen</p>
  steps:
  - column_name: custom_steps
    id: 9530
    case_id: 9020
    text1: null
    text2: null
    text3: <p>User should see shareable capability groups corresponding to the data
      returned in <code>ShareableCapabilities</code> [iOS]<br /><br />For group <code>B03</code>
      - <code>Mandatory for the privilege sharing</code> user should not see a toggle
      and it should say <code>(Always On)</code></p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 9531
    case_id: 9020
    text1: '<p>Mock <code>ShareableCapabilities</code> so that a capability within
      a group is <code>"shareable": false</code></p>'
    text2: null
    text3: <p>User should see that line item shown as greyed out with an asterisk</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 9532
    case_id: 9020
    text1: '<p>Mock <code>ShareableCapabilities</code> so that all capabilities within
      a group are <code>"shareable": false</code></p>'
    text2: null
    text3: <p>User should see the toggle for that group disabled in the off state</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 9533
    case_id: 9020
    text1: <p>Modify any of the toggles and tap on Save Changes</p>
    text2: null
    text3: <p>User should see Invite Summary screen with the corresponding capability
      groups checked (capabilities that were toggled off should show an x)</p>
    text4: null
    display_order: 4
  notes: <p>There are additonal capability groups on the app, that don't show on the
    query response. Namely, </p><p>Additional Driver Notifications</p><p>Additional
    Driver History. </p><p>These are static data in app that gets sent to NIS when
    user taps on Send Invite. </p>
