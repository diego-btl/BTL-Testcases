    id: 11664
    case_id: 11092
    text1: "<ol><li>Mock <code>VehiclesStaticData</code> so that <code>user.mobileNumber</code>\
      \ is null</li><li>Mock <code>UserMobileNumber</code> [iOS] with the following:</li></ol><pre><code\
      \ class=\"editor-json language-json code-block\">{\n  \"data\": {\n    \"user\"\
      : {\n      \"__typename\": \"User\",\n      \"mobileNumber\": null\n    }\n\
      \  }\n}</code></pre>"
    text2: null
    text3: null
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11665
    case_id: 11092
    text1: <p>Login to the account</p>
    text2: null
    text3: <p>User is able to login to the account and see the Additional Driver Invite
      card on the home screen</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11666
    case_id: 11092
    text1: <p>Tap on the Additional Driver Invite card</p>
    text2: null
