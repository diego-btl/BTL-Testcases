metadata:
  id: TC08999
  name: PD - Additional Driver Card
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-11-21'
  updated: '2025-08-21'
  author: user_4
  testmo_id: 65925
  folder_id: 411
description: https://www.pivotaltracker.com/story/show/186340957
preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User is on the home screen
steps:
- id: 1
  action: Modify capabilities.status so that it is ENROLLED -> Tap on the Additional
    Driver card
  expected: User should see the Additional Driver card enabled | User should see the
    Additional Driver screen
- id: 2
  action: Modify capabilities.status so that it is NOT_ENROLLED or FAILED or EXPIRED
    -> Tap on the Additional Driver card
  expected: User should see the Additional Driver card disabled | User should see
    the Account Expired modal with options to Cancel/Call
- id: 3
  action: Modify capabilities.status so that it is STOLEN -> Tap on the Additional
    Driver card
  expected: User should see ALL CARDS including the Additional Driver card disabled
    (except for NMAC card) | User should see 'Vehicle is reported Stolen' message
    on hero image. and a message under that "Stolen Vehicle Locator has been activated.
    This automatically disables all services. For questions or updated, speak with
    a Customer Care Specialist.' | User should see a Call Customer Care CTA button
    right under this mesage.
- id: 4
  action: Modify capabilities.status so that it is UNKNOWN
  expected: User should not see the Additional Driver card
