description: https://www.pivotaltracker.com/story/show/186049955https://www.pivotaltracker.com/story/show/186050916
preconditions:
- description: User is logged into an account with a pending AD invite
- description: User is on the Code Verification screen
- description: In order to receive the OTP code, you will need to have mocked user
    own number in VehiclesStaticData and UserMobileNumber or setting a breakpoint
    on GenerateOTPForSharedDriver and modifying the request with your own number
steps:
- id: 1
  action: Enter 5 digits (incorrect code) and tap on Verify and Proceed
  expected: User should see a loading spinner, field will be highlighted in red with
    the previously entered OTP, and error text indicating how many attempts are left
    (should match with retryAvailable from VerifyOTPForSharedDriver [iOS])
- id: 2
  action: 'Mock an error for VerifyOTPForSharedDriver [iOS] with the following:'
  expected: See expected results
- id: 3
  action: Tap on Verify and Proceed again
  expected: User should see a loading spinner, then a Something Went Wrong modal with
    options - Cancel/Retry
- id: 4
  action: Tap on Cancel
  expected: User should see the error modal dismiss and remain on the Code Verification
    screen
- id: 5
  action: Tap on Retry
  expected: User should see the same API call triggered again
