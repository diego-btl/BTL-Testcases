  - column_name: custom_steps
    id: 11642
    case_id: 9016
    text1: "<p>Mock an error for <code>DeleteDriver</code> [iOS] with the following:</p><pre><code\
      \ class=\"editor-json language-json code-block\">{\n  \"data\": {\n    \"deleteDriver\"\
      : {\n      \"__typename\": \"GeneralErrors\",\n      \"errorMessage\": \"UNEXPECTED\
      \ ERROR : Owner profile data not found.\"\n    }\n  }\n}</code></pre><p>Different\
      \ error types: </p><ul><li><code>GeneralErrors</code></li><li><code>DatabaseError</code></li><li><code>BrandError</code></li><li><code>TokenError</code></li><li><code>InvalidInviteIdError</code></li></ul><p>Note:\
      \ can also use an HTTP error</p>"
    text2: null
    text3: null
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11643
    case_id: 9016
    text1: <p>Tap on Delete Driver</p>
    text2: null
    text3: <p>User should see an <code>Are you sure?</code> modal with options - No/Yes</p>
    text4: null
