preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User is on the Invite Summary screen
steps:
- id: 2
  action: Tap on Additional Driver
  expected: User should be brought back to the AD Invite screen with all previously
    filled in info
- id: 3
  action: Modify any of the fields and proceed to the summary screen
  expected: User should see the summary screen updated with the changes that were
    made
- id: 4
  action: Tap on Selected Configurations
  expected: User should be brought back to the Configuration Details screen with the
    previously selected configurations
- id: 5
  action: Modify any of the configurations and proceed to the summary screen
  expected: User should see the summary screen updated with the changes that were
    made
