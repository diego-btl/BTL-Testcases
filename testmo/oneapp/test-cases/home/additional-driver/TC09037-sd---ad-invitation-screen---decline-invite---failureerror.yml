preconditions:
- description: User is logged into an account with a pending AD invite
- description: User is on the Invitation screen
steps:
- id: 1
  action: GeneralErrors -> DatabaseError -> BrandError -> TokenError -> InvalidInviteIdError
  expected: See expected results
- id: 2
  action: Tap on Decline
  expected: User should see a loading spinner, then a Decline invitation failed modal
    with options - Cancel/Retry
- id: 3
  action: Tap on Cancel
  expected: User should see error modal dismiss and remain on the Invitation screen
- id: 4
  action: Tap on Retry
  expected: User should see the same API call triggered again
