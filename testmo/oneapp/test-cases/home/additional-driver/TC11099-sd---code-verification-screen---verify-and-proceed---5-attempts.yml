metadata:
  id: TC11099
  name: SD - Code Verification Screen - Verify and Proceed - 5 attempts
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-11-29'
  updated: '2024-10-17'
  author: user_4
  testmo_id: 11099
  folder_id: 411
preconditions:
- description: User is logged into an account with a pending AD invite
- description: User is on the Code Verification screen
- description: In order to receive the OTP code, you will need to have mocked user
    own number in VehiclesStaticData and UserMobileNumber or setting a breakpoint
    on GenerateOTPForSharedDriver and modifying the request with your own number
steps:
- id: 1
  action: Enter an incorrect code and tap on Verify and Proceed until the attempts
    have been exhausted (should be 5 attempts)
  expected: User should see an error message for too many attempts and to request
    a new code, empty field is disabled, Send New Code link, and Verify and Proceed
    button is disabled
- id: 2
  action: Tap on Send New Code
  expected: User should see a loading spinner, then Code Verification screen will
    be reset to the default state with Send New Code link disabled, and a new code
    toast
