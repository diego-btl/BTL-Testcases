test_case:
  preconditions: <p>User is logged into an account with a pending AD invite</p><p>User
    is on the Code Verification screen</p><p>In order to receive the OTP code, you
    will need to have mocked user own number in <code>VehiclesStaticData</code> and
    <code>UserMobileNumber</code> or setting a breakpoint on <code>GenerateOTPForSharedDriver</code>
    and modifying the request with your own number</p>
  steps:
  - column_name: custom_steps
    id: 11693
    case_id: 11098
    text1: <p>Enter 5 digits (incorrect code) and tap on Verify and Proceed</p>
    text2: null
    text3: <p>User should see a loading spinner, field will be highlighted in red
      with the previously entered OTP, and error text indicating how many attempts
      are left (should match with <code>retryAvailable</code> from <code>VerifyOTPForSharedDriver</code>
      [iOS])</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11694
    case_id: 11098
    text1: "<p>Mock an error for <code>VerifyOTPForSharedDriver</code> [iOS] with\
      \ the following:</p><pre><code class=\"editor-json language-json code-block\"\
      >HTTP/1.1 500 Internal Server Error\nContent-Type: application/json\nConnection:\
      \ keep-alive\nDate: Tue, 12 Apr 2022 21:13:27 GMT\nx-amzn-RequestId: 09ac326c-1732-4547-8e2b-1faeea8c8d91\n\
      x-amzn-ErrorType: InternalServerErrorException\nx-amz-apigw-id: QfG6rHG8IAMFsRg=\n\
      X-Amzn-Trace-Id: Root=1-6255eb77-105c5ed61e98e8a165b5327b\nX-Cache: Error from\
      \ cloudfront\nVia: 1.1 e67372c9495347d4b38267a785100068.cloudfront.net (CloudFront)\n\
      X-Amz-Cf-Pop: YTO50-C1\nX-Amz-Cf-Id: O2KyBq1ze9JBQkEMlhlljmI6uTmvYeNx4aTXjtNOXnPaXoNocJMjBw==\n\
      \n{\n  \"message\": \"Internal server error\"\n}</code></pre>"
    text2: null
    text3: null
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11697
    case_id: 11098
    text1: <p>Tap on Verify and Proceed again</p>
    text2: null
    text3: <p>User should see a loading spinner, then a <code>Something Went Wrong</code>
      modal with options - Cancel/Retry</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 11698
    case_id: 11098
    text1: <p>Tap on Cancel</p>
    text2: null
    text3: <p>User should see the error modal dismiss and remain on the Code Verification
      screen</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 11699
    case_id: 11098
    text1: <p>Tap on Retry</p>
    text2: null
