      \ ERROR : Owner profile data not found.\"\n    }\n  }\n}</code></pre><p>Different\
      \ error types: </p><ul><li><code>GeneralErrors</code></li><li><code>DatabaseError</code></li><li><code>BrandError</code></li><li><code>TokenError</code></li><li><code>VinValidationError</code></li><li><code>EntitlementsValidationError</code></li></ul>"
