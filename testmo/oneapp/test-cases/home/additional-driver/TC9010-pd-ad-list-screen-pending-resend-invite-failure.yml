test_case:
  preconditions: <p>User has an AVK2 vehicle and is PRIMARY_DRIVER</p><p>User has
    a valid pending invitation</p><p>User is viewing pending invitation</p>
  steps:
  - column_name: custom_steps
    id: 11610
    case_id: 9010
    text1: "<p>Mock an error for <code>InviteDriverStatus</code> [iOS] with the following:</p><pre><code\
      \ class=\"editor-json language-json code-block\">{\n  \"data\": {\n    \"ownerInviteAction\"\
      : {\n      \"__typename\": \"GeneralErrors\",\n      \"errorMessage\": \"UNEXPECTED\
      \ ERROR : Owner profile data not found.\"\n    }\n  }\n}</code></pre><p>Different\
      \ error types: </p><ul><li><code>GeneralErrors</code></li><li><code>DatabaseError</code></li><li><code>BrandError</code></li><li><code>TokenError</code></li><li><code>InvalidInviteIdError</code></li></ul><p>Note:\
      \ can also use an HTTP error</p>"
    text2: null
    text3: null
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11611
    case_id: 9010
    text1: <ol><li>Tap on Resend Invite</li><li>Tap one of the two options</li></ol>
    text2: null
    text3: <ol><li>User should see options to send via email or sms</li><li>User should
      see a loading spinner, then an <code>Re-invite failed to send</code> modal</li></ol>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11612
    case_id: 9010
    text1: <p>Tap on Cancel</p>
    text2: null
    text3: <p>User should see the error modal dismiss and remain on the pending invitation
      screen</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 11613
    case_id: 9010
    text1: <p>Tap on Retry</p>
    text2: null
    text3: <p>User should see the same API call triggered again</p>
    text4: null
    display_order: 4
