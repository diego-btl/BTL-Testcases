metadata:
  id: TC09004
  name: PD - AD  List Screen - Add from Contacts - Deny Permissions
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-11-21'
  updated: '2024-10-17'
  author: user_4
  testmo_id: 9004
  folder_id: 411
description: https://www.pivotaltracker.com/story/show/186141206
preconditions:
- description: User has an AVK2 vehicle and is PRIMARY_DRIVER
- description: User is on the Additional Driver screen
- description: There are less than 4 invites
steps:
- id: 1
  action: Tap on Add A Driver
  expected: User should see options for Add from Contacts, Add New, and Cancel
- id: 2
  action: Tap on Add from Contacts
  expected: User should see permissions modal to access Contacts with options - Don't
    Allow and OK
- id: 3
  action: Tap on Don't Allow
  expected: User should see modal dismissed
- id: 4
  action: Tap on Add from Contacts
  expected: User should see a Contacts Permissions Needed modal with options - Cancel
    and Settings
- id: 5
  action: Tap on Cancel
  expected: User should see modal dismissed
- id: 6
  action: Tap on Add from Contacts -> Tap on Settings -> Enable contacts permissions
    -> Return to the app and select Add from Contacts
  expected: User should see permissions modal | User should see App Settings screen
    | User is able to enable contact permissions | User should see Contacts list appear
