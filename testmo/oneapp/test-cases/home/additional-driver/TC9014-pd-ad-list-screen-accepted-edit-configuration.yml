      \n    }\n  }\n}</code></pre><p>Different error types: </p><ul><li><code>GeneralErrors</code></li><li><code>DatabaseError</code></li><li><code>BrandError</code></li><li><code>TokenError</code></li><li><code>InvalidInviteIdError</code></li></ul><p>Note:\
      \ can also use an HTTP error</p>"
