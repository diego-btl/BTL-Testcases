metadata:
  name: SD - Code Verification Screen - Verify and Proceed - 10 attempts - Failure/Error
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>User is logged into an account with a pending AD invite</p><p>User
    is on the Code Verification screen</p><p>User has exhausted the first set of 5
    attempts and requested a new code</p><p>In order to receive the OTP code, you
    will need to have mocked user own number in <code>VehiclesStaticData</code> and
    <code>UserMobileNumber</code> or setting a breakpoint on <code>GenerateOTPForSharedDriver</code>
    and modifying the request with your own number</p>
  steps:
  - column_name: custom_steps
    id: 11707
    case_id: 11100
    text1: <p>Enter an incorrect code and tap on Verify and Proceed until the second
      set of 5 attempts have been exhausted (10 attempts total)</p>
    text2: null
    text3: <p>User should see an error message for too many attempts and to request
      a new invite<br /><br />Use should see back button hidden, empty field and Send
      New Code link are disabled, and Return to Home button enabled</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11710
    case_id: 11100
    text1: "<p>Mock an error for <code>DriverInviteAction</code> [iOS] with the following:</p><pre><code\
      \ class=\"editor-json language-json code-block\">{\n  \"data\": {\n    \"driverInviteAction\"\
      : {\n      \"__typename\": \"GeneralErrors\",\n      \"errorMessage\": \"UNEXPECTED\
      \ ERROR : Owner profile data not found.\"\n    }\n  }\n}</code></pre><p>Different\
      \ error types: </p><ul><li><code>GeneralErrors</code></li><li><code>DatabaseError</code></li><li><code>BrandError</code></li><li><code>TokenError</code></li><li><code>InvalidInviteIdError</code></li></ul><p>Note:\
      \ can also use an HTTP error</p>"
    text2: null
    text3: null
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11708
    case_id: 11100
    text1: <p>Tap on Return to Home</p>
    text2: null
    text3: <p>User should see a loading spinner, then a <code>Something Went Wrong</code>
      modal with options - Cancel/Retry</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 11711
    case_id: 11100
    text1: <p>Tap on Cancel</p>
    text2: null
    text3: <p>User should see the error modal dismiss and remain on the Code Verification
      screen</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 11712
    case_id: 11100
    text1: <p>Tap on Retry</p>
    text2: null
    text3: <p>User should see the same API call triggered again</p>
    text4: null
    display_order: 5
