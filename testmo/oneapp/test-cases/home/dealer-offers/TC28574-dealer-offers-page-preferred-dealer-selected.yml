test_case:
  preconditions: '<ul><li>The user has a valid vehicle selected</li><li>The user has
    a preferred dealer selected</li><li>The user has a valid set of dealer offers</li><li>The
    user is already in the Home Screen</li><li>The FF needs to be <code>"EnableDealerOffers":
    "true"</code></li></ul>'
  steps:
  - column_name: custom_steps
    id: 46192
    case_id: 28574
    text1: <ol><li>The user taps on the <strong>Offers and Promotions</strong> card</li></ol>
    text2: null
    text3: <ul><li>The user should be taken to the <strong>Dealer Offers</strong>
      screen </li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 46191
    case_id: 28574
    text1: <ol><li>Validate the screen</li></ol>
    text2: null
    text3: <ul><li>The app should display:<ul><li>Preferred dealer section at the
      top with only the Header, Address, Directions Icon, Call Icon and Languages
      Spoken</li><li>The Dealer Offers section</li><li>The offers returned from the
      middleware</li></ul></li></ul>
    text4: null
    display_order: 2
