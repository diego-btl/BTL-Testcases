preconditions:
- description: Capabilities list to test:- `REMOTE_ENGINE` (Controls card + button)-
    `REMOTE_DOOR_LOCK` (Controls card + button)- `REMOTE_DOOR_UNLOCK` (Controls card
    + button)- `REMOTE_HORN_LIGHTS` (Controls card + button)- `REMOTE_CLIMATE_CONTROL`
    (Climate + Controls card + button) or HVAC_ACCESSORIES (for AVK2 vehicles)- `REMOTE_CHARGING`
    (Charge + Controls card + button)- `SPEED_ALERT` (Alerts card)- `CURFEW_ALERT`
    (Alerts card)- `BOUNDARY_ALERT` (Alerts card)- `VALET_ALERT` (Alerts card)- `PARKED_CAR_FINDER`
    (Location card)- `INTELLIGENT_ROUTE_PLANNER` (Route Planner card)- REMOTE_VEHICLE_STATUS
    (Controls card) slack
- description: 'NOTE: AVK2 doesn''t have a climate button as RES and Climate are paired.'
steps:
- id: 1
  action: Remove an item from the capabilities list2. Repeat steps 1, but disable
    the status instead of removing it from the capabilities list, then tap on the
    item
  expected: 'User should not see the item on the home screen2. User should see the
    item in disabled state and upon tapping, user should see an alert modal with the
    option to call an agent (1-855-426-6628)Notes: - If all controls capabilities
    are disabled, then the controls card should be disabled- If all controls capabilities
    are missing, then the controls card should be hidden- If all alerts are missing,
    then the alerts card should be hidden | If all alerts are disabled, then the alerts
    card should be disabled. Tapping on it. | NOTE: All alerts work together - either
    all true or all false. - Lock/Unlock are paired together, if one is disabled/hidden,
    both will be disabled/hidden'
- id: 2
  action: log in as a shared driver -> Remove/Disable capabilities from the list
  expected: The corresponding item should be hidden
