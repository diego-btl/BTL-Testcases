    id: 854
    case_id: 685
    text1: <p>Tap on Route Planner card</p>
    text2: null
    text3: <p>User should see the Create a Route screen</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 46176
    case_id: 685
    text1: <p>Find the <code>Your destinations</code> section</p>
    text2: null
    text3: <ul><li>Validate the first text field is prepopulated with the text "Your
      Vehicle's Location"</li><li>Validate the Vehicle Image is displayed on the left
      side of this first text field</li><li>Validate the second text field is empty,
      with a circle star as icon on the left side</li><li>Validate that tapping on
      any of the text fields will drive the user to a Search page</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 46177
    case_id: 685
    text1: <p>Tap on the destination text field (second text field of the <code>Your
