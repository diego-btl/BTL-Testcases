    id: 46185
    case_id: 685
    text1: <p>Tap on the <code>ESTIMATE ROUTE</code> CTA again</p>
    text2: null
    text3: <p>The user is navigated to the Estimated Route* page again</p>
    text4: null
    display_order: 11
