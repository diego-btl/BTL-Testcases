    text2: null
    text3: <p>The user is navigated to a Search page</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 46178
    case_id: 685
    text1: <p>Type in <code>NTCNA</code></p>
    text2: null
    text3: <p>The app will show results for the Nissan Technical Center North America</p>
    text4: null
    display_order: 4
