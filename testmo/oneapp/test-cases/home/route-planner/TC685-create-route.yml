    id: 46179
    case_id: 685
    text1: <p>Tap on the first result (Nissan Technical Center North America - Arizona)</p>
    text2: null
    text3: <p>The user is navigated to the Create a Route page again</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 46180
    case_id: 685
    text1: <p>Find the <code>Plug in Options</code> section</p>
    text2: null
    text3: <ul><li>Validate the Select Date date picker</li><li>Validate the Select
      Time time picker</li><li>Validate the Send to car now checkbox</li><li>Validate
      the Est. Battery Level at Departure picker</li><li>Validate the Plug Types switches</li></ul>
    text4: null
    display_order: 6
