metadata:
  id: TC00685
  name: Create Route
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2025-10-06'
  author: user_2
  testmo_id: 65831
  folder_id: 71
description: This is the Happy Path test case for IRP (Route Planner)
preconditions:
- description: User has an EV with INTELLIGENT_ROUTE_PLANNER capability
- description: User has the EV Selected
- description: User is on the Home Page
steps:
- id: 1
  action: Tap on Route Planner card
  expected: User should see the Create a Route screen
- id: 2
  action: Find the Your destinations section
  expected: Validate the first text field is prepopulated with the text "Your Vehicle's
    Location" | Validate the Vehicle Image is displayed on the left side of this first
    text field | Validate the second text field is empty, with a circle star as icon
    on the left side | Validate that tapping on any of the text fields will drive
    the user to a Search page
- id: 3
  action: Tap on the destination text field (second text field of the Your destinations
    section
  expected: The user is navigated to a Search page
- id: 4
  action: Type in NTCNA
  expected: The app will show results for the Nissan Technical Center North America
- id: 5
  action: Tap on the first result (Nissan Technical Center North America - Arizona)
  expected: The user is navigated to the Create a Route page again
- id: 6
  action: Find the Plug in Options section
  expected: Validate the Select Date date picker | Validate the Select Time time picker
    | Validate the Send to car now checkbox | Validate the Est. Battery Level at Departure
    picker | Validate the Plug Types switches
- id: 7
  action: Tap on the Date picker and select any date in the future
  expected: The user is navigated to the Create a Route page again with the Date selected
    and the hour picker with the current time prefilled
- id: 8
  action: Find the Climate Options section
  expected: Validate the Climate Pre-Conditioning switch | Validate the Scheduled
    Temp. at Departure picker | Validate the Save as preferred climate settings
- id: 9
  action: Tap on the ESTIMATE ROUTE CTA
  expected: The app shows a loading indicator (map and location icon) | The user is
    navigated to the Estimated Route* Page with:A map with a calculated route and
    possibly charging icon POI in the route | Estimated time and mileage | EDIT ROUTE
    Button | A section with information about Starting point, destination, start time
    and end time alongside the amount of stops (same amount as POI in the map
- id: 10
  action: Tap on the EDIT ROUTE Button
  expected: The user is navigated to the previous page
- id: 11
  action: Tap on the ESTIMATE ROUTE CTA again
  expected: The user is navigated to the Estimated Route* page again
- id: 12
  action: Scroll the information section drawer up
  expected: The app shows expanded information about the weather in the destination
    point | Information about departure, ETA, time and date and charge time | Information
    about departure location, arrival and the suggested charging stations with departure
    / arrival times and charging time needed | Under every charging station stop should
    be a ADD TO ROUTE button and a Information tooltip | Tapping on the tooltip should
    display a small informative modal
- id: 13
  action: Tap on any of the charging stations ADD TO ROUTE buttons
  expected: The app shows a loading indicator (map and location icon) | The user is
    kept on the same screen
- id: 14
  action: Tap on the Save Route button
  expected: The app shows a loading indicator (map and location icon) | The user is
    navigated to the Planned Routes page
