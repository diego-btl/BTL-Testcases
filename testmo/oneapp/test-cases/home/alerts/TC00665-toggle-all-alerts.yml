metadata:
  id: TC00665
  name: Toggle All Alerts
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2026-01-13'
  author: user_2
  testmo_id: 665
  folder_id: 70
preconditions:
- description: User is on the Alerts sheet and has alerts set for their vehicle
steps:
- id: 1
  action: Toggle valet alert on/off
  expected: User should be able to toggle alerts on/off | User should see a loading
    spinner while alert is toggling | Valet alert will default back to 0.25 miles
    (0.4 km for NCI) when toggled off | Success/failure toast will show | If toggle
    fails, toggle will revert to it's previous state
- id: 2
  action: Toggle drive zone alert (which is now Boundary alert) on/off
  expected: The user should be able to toggle alerts on/off | The user should see
    a loading spinner while the alert is toggling | Success/failure toast will show
    | If the toggle fails, the toggle will revert to its previous state
- id: 3
  action: Toggle curfew alert on/off
  expected: The user should be able to toggle alerts on/off | The user should see
    a loading spinner while the alert is toggling | Success/failure toast will show
    | If the toggle fails, the toggle will revert to its previous state
- id: 4
  action: Toggle speed alert on/off
  expected: The user should be able to toggle alerts on/off | The user should see
    a loading spinner while the alert is toggling | Success/failure toast will show
    | If the toggle fails, the toggle will revert to its previous state
