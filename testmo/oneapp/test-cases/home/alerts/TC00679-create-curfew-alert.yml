preconditions:
- description: User has not reached the maximum number (2) of curfew alerts
steps:
- id: 1
  action: Tap Create Alert2. Tap curfew alert CTA3. Fill in the required fields (alert
    name, start/end time, at least 1 day of the week)4. Tap Save
  expected: 'User should see the Create alert sheet open2. User should see be able
    to edit the following alert properties: alert name, start & end times, displaying
    an alert in vehicle, days of the week that alert is active3. User should see Save
    CTA become enabled4. User should see the alert be successfully saved and taken
    to the main alerts sheet | Success toast should show'
- id: 2
  action: Fail to save the alert
  expected: The user will see an error alert and remain on the create alert sheet
