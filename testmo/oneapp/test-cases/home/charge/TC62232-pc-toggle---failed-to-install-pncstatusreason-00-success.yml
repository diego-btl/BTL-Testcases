metadata:
  id: TC62232
  name: P&C Toggle - Failed to Install pncStatusReason 00 success
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-19'
  updated: '2025-12-19'
  author: user_6
  testmo_id: 65856
  folder_id: 66
preconditions:
- description: User has an EV
- description: User is on Charge screen
- description: GrantFullPlugAndCharge FF is enabled
- description: NECN AccountStatus is `Active
- description: User is a Primary Driver
steps:
- id: 1
  action: Mock pncStatus to be FAILED and pncStatusReason to be 00
  expected: App should display the Failed to Install card with the Install CTA and
    Failed to Install as the Status
- id: 2
  action: Tap on Install
  expected: App should show a loading state while retryCertInstall is triggered and
    loading
- id: 3
  action: Mock retryCertInstall.statusCode to be 1000
  expected: AccountStatus should be triggered
- id: 4
  action: Mock AccountStatus to return pncStatus PENDING
  expected: Toast should appear with the copy Installing Certificate and card should
    update to the Pending state
- id: 5
  action: Mock AccountStatus to return pncStatus INSTALLING
  expected: Toast should appear with the copy Installing Certificate and card should
    update to the Installing state
- id: 6
  action: Mock AccountStatus to return pncStatus RENEWING
  expected: Toast should appear with the copy Installing Certificate and card should
    update to the Renewing state
- id: 7
  action: Mock AccountStatus to return pncStatus FAILED or NA
  expected: Toast should appear with the copy Failed to install and card should update
    to the Failed state(depending on the pncStatusReason)
- id: 8
  action: 'Mock AccountStatus to return pncStatus READY and and "toggleStatus": "ENABLED"/"DISABLED"'
  expected: Toast should appear with the copy Certificate Installed and card should
    update to the Ready State
