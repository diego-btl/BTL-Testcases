description: https://www.pivotaltracker.com/story/show/186645145
preconditions:
- description: User has an EV AVK2 vehicle
- description: V2L capability is returning true
- description: User is on the Vehicle-to_Load Screen
- description: Set CheckV2LServiceRequest to return the PENDING status
steps:
- id: 1
  action: Mock CheckV2LServiceRequest so that status returns FAILED or is PENDING
    for 210 seconds
  expected: User should see a failure toast Failed to set minimum Vehicle-to-Load
    limit. (5 seconds) | User should see the Set Minimum SoC CTA change back to the
    regular state (enabled)
