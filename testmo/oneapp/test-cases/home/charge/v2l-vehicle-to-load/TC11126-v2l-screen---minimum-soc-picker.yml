  name: V2L Screen - Minimum SoC picker
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2024-02-05'
  updated: '2025-12-09'
  author: user_4
  testmo_id: 66188
  folder_id: 1454
description: https://www.pivotaltracker.com/story/show/186644889
preconditions:
- description: User has an EV AVK2 vehicle
- description: V2L capability is returning true
- description: User is on the Manage EV screen and Vehicle-to_Load card is enabled
steps:
- id: 1
  action: Tap on the Vehicle-to_Load card
  expected: User should see the Vehicle-to_Load screen with Minimum SoC field showing
    the value corresponding to v2lStatus.chargeLimitationLevel
- id: 2
  action: Tap on the Minimum SoC picker
  expected: User should see values incrementing by 5%, the minimum value should correspond
    with v2lStatus.chargeMinimumLimitationLevel and the maximum value is hardcoded
    to 95%
- id: 3
  action: Mock V2lStatus so that chargeMinimumLimitationLevel is returning null ->
    Tap Refresh on the Manage EV screen -> Tap on the V2L card -> Tap on the Minimum
    SoC picker
  expected: V2lStatus should be triggered again3/4. User should see the Vehicle-to_Load
    screen and the minimum value in the Minimum SoC picker is 10%
