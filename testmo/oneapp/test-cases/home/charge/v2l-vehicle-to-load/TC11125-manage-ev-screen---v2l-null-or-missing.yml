description: https://app.clickup.com/t/86b64dch1
preconditions:
- description: User has an EV AVK2 vehicle
- description: V2L capability is returning true
- description: User is on the Charge screen
steps:
- id: 1
  action: 'Mock V2lStatus with the following:'
  expected: Or
- id: 2
  action: Tap on the Manage EV button
  expected: User should see the Vehicle-to_Load card in the enabled state without
    any secondary text
- id: 3
  action: Tap on the Vehicle-to_Load card
  expected: User should see a Something Went Wrong error modal with options Cancel/Retry
- id: 4
  action: Tap on Cancel
  expected: User should see error modal dismiss and remain on the Manage EV screen
- id: 5
  action: Tap on Retry
  expected: User should see the same API call triggered again | If an error is still
    returned, then it should show the error modal again | If a valid response is returned,
    then user should be navigated to the Vehicle-to_Load screen
