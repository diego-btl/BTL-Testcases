      \      \"__typename\": \"ElectricAVK2Vehicle\",\n      \"v2lStatus\": null\n\
      \    }\n  }\n}</code></pre>"
    text2: null
    text3: "<p>Or </p><pre><code class=\"editor-plain language-plain code-block\"\
      >{\n  \"data\": {\n    \"vehicle\": {\n      \"__typename\": \"ElectricAVK2Vehicle\"\
      ,\n      \"v2lStatus\": \"\"\n    }\n  }\n}</code></pre>"
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11783
    case_id: 11125
    text1: <p>Tap on the Manage EV button</p>
    text2: null
    text3: <p>User should see the Vehicle-to_Load card in the enabled state without
      any secondary text</p>
    text4: null
