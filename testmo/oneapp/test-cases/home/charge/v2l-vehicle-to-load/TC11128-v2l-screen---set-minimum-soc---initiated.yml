metadata:
  id: TC11128
  name: V2L Screen - Set Minimum SoC - Initiated
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2024-02-05'
  updated: '2025-12-09'
  author: user_4
  testmo_id: 11128
  folder_id: 1454
description: https://www.pivotaltracker.com/story/show/186645145
preconditions:
- description: User has an EV AVK2 vehicle
- description: V2L capability is returning true
- description: User is on the Vehicle-to_Load Screen
steps:
- id: 1
  action: Tap on the Minimum SoC picker, select a different value, and tap outside
    the field
  expected: User should see the field update with the corresponding selected value
    and Set Minimum SoC CTA should enable
- id: 2
  action: Tap on Set Minimum SoC
  expected: SetV2L is triggered and CheckV2LServiceRequest starts polling with the
    PENDING status | User should see a toast message that cycles through (3 seconds
    each):Contacting {vehicle year, vehicle model}...Waking {vehicle year, vehicle
    model}...Initiating Vehicle-to-Load limit…
- id: 3
  action: Navigate to the Home Screen
  expected: User should continue to see the relevant toasts
