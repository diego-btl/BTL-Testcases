description: https://app.clickup.com/t/86b64dch1
preconditions:
- description: User has an EV AVK2 vehicle
- description: GrantV2L feature flag is enabled
- description: User is PD
steps:
- id: 1
  action: Mock capabilities so that V2L is missing -> Go to Manage EV screen
  expected: V2lStatus API is not triggered. User should not see the Vehicle-to-Load
    card
- id: 2
  action: Mock capabilities so that V2L is false -> Go to Manage EV screen -> Tap
    on the Vehicle-to_Load card
  expected: V2lStatus API is not triggered. User should see the V2L card in the disabled
    state3. User should see an "Account Expired" modal with "Call" and "Cancel" options.
    Tapping "Call" the "ownershipVerification" phone number is populated
- id: 3
  action: Mock capabilities so that V2L is true -> Go to Manage EV screen
  expected: V2lStatus API is triggered. User should see the Vehicle-to_Load card in
    the enabled state with a corresponding status in the secondary text
