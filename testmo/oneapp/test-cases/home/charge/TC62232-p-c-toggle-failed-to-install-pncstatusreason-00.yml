metadata:
  name: P&C Toggle - Failed to Install pncStatusReason 00 success
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>User has an EV</p><p>User is on Charge screen</p><p><code>GrantFullPlugAndCharge</code>
    FF is enabled</p><p>NECN AccountStatus is `Active</p><p>User is a Primary Driver</p>
  steps:
  - column_name: custom_steps
    id: 97062
    case_id: 62232
    text1: <p>Mock <code>pncStatus</code> to be <code>FAILED</code> and <code>pncStatusReason</code>
      to be <code>00</code> </p>
    text2: null
    text3: <p>App should display the Failed to Install card with the <code>Install</code>
      CTA and <code>Failed to Install</code> as the Status</p><figure class="image"><img
      src="/attachments/view/9017" alt="9017" /></figure>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 97063
    case_id: 62232
    text1: <p>Tap on Install</p>
    text2: null
    text3: <p>App should show a loading state while <code>retryCertInstall</code>
      is triggered and loading</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 97064
    case_id: 62232
    text1: <p>Mock <code>retryCertInstall.statusCode</code> to be <code>1000</code></p>
    text2: null
    text3: <p><code>AccountStatus</code> should be triggered</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 97081
    case_id: 62232
    text1: <p>Mock <code>AccountStatus</code> to return pncStatus <code>PENDING</code></p>
    text2: null
    text3: <p>Toast should appear with the copy <code>Installing Certificate</code>
      and card should update to the Pending state</p><figure class="image"><img src="/attachments/view/9018"
      alt="9018" /></figure>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 97082
    case_id: 62232
    text1: <p>Mock <code>AccountStatus</code> to return pncStatus <code>INSTALLING</code></p>
    text2: null
    text3: <p>Toast should appear with the copy <code>Installing Certificate</code>
      and card should update to the Installing state</p><figure class="image"><img
      src="/attachments/view/9019" alt="9019" /></figure>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 97083
    case_id: 62232
    text1: <p>Mock <code>AccountStatus</code> to return pncStatus <code>RENEWING</code></p>
    text2: null
    text3: <p>Toast should appear with the copy <code>Installing Certificate</code>
      and card should update to the Renewing state</p><figure class="image"><img src="/attachments/view/9020"
      alt="9020" /></figure>
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 97084
    case_id: 62232
    text1: <p>Mock <code>AccountStatus</code> to return pncStatus <code>FAILED</code>
      or <code>NA</code></p>
    text2: null
    text3: <p>Toast should appear with the copy <code>Failed to install</code> and
      card should update to the Failed state(depending on the <code>pncStatusReason</code>)</p>
    text4: null
    display_order: 7
  - column_name: custom_steps
    id: 97085
    case_id: 62232
    text1: '<p>Mock <code>AccountStatus</code> to return pncStatus <code>READY</code>
      and and <code>"toggleStatus": "ENABLED"/"DISABLED"</code></p>'
    text2: null
    text3: <p>Toast should appear with the copy <code>Certificate Installed</code>
      and card should update to the Ready State</p><figure class="image"><img src="/attachments/view/9021"
      alt="9021" /></figure>
    text4: null
    display_order: 8
