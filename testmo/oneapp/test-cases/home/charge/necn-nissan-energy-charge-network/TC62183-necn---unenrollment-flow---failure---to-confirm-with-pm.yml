steps:
- id: 1
  action: Tap the 'Deactivate Account' button on the 'Account Status' card
  expected: The copy is 'Are you sure you want to deactivate your NISSAN ENERGY Charge
    Network account?' | 'Deactivate' and 'Cancel' buttons
- id: 2
  action: Tap the 'Deactivate' button -> Breakpoint and abort the CancelChargePlan
    API
