  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-17'
  updated: '2026-01-15'
  author: user_25
  testmo_id: 66235
  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'AccountStatus API > "status": "ACTIVE"'
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the 'NISSAN ENERGY Charge Network' card
  expected: The loading state is displayed | AccountStatus, NissanPay APIs are triggered
    | User is navigated to the NISSAN ENERGY Charge Network screen
- id: 2
  action: Tap the 'Deactivate Account' button
  expected: copy is 'Are you sure you want to deactivate your NISSAN ENERGY Charge
    Network account?' | 'Deactivate' and 'Cancel' buttons
- id: 3
  action: Tap the 'Cancel' button
  expected: The modal is dismissed | User remains on the same NISSAN ENERGY Charge
    Network screen
- id: 4
  action: Tap the 'Deactivate' button
  expected: CancelChargePlan and ChargeProduct APIs are triggered | The loading state
    is displayed | The 'Account deactivated' modal is displayed | The 'ACTIVATE' CTA
    is displayed on the Account Status card | The 'Account Status' card's status is
    changed to 'Not Activated'
- id: 5
  action: Tap '<' back button
  expected: 'The loading state is displayed | AccountStatus API is triggered, returning
    "status": "CANCELLED" | User is navigated to the Manage EV screen | The subtitle
    of the ''NISSAN ENERGY Charge Network'' card is ''Not Activated'''
