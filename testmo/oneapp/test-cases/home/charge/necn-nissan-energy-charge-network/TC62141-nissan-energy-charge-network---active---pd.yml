metadata:
  id: TC62141
  name: NISSAN ENERGY Charge Network - Active - PD
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-11'
  updated: '2026-01-15'
  author: user_25
  testmo_id: 62141
  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
- description: Payment Method > card is added to the account
steps:
- id: 1
  action: 'User is on the Manage EV screen -> AccountStatus API > "status": "ACTIVE"'
  expected: NISSAN ENERGY Charge Network card is displayed | Subtitle of the NISSAN
    ENERGY Charge Network card is 'Active'
- id: 2
  action: Tap the NISSAN ENERGY Charge Network card
  expected: Status is 'Active' | Copy is 'NISSAN ENERGY Charge Network' | 'Deactivate
    Account' button is displayed | Copy is 'Your default payment method will be used
    for charging transactions.' | Added card info | 'Change Payment Method' CTA
- id: 3
  action: Tap the 'CALL OUR HELP LINE' button
  expected: The phone number from the ContactUs.plugAndChargeSupport is populated
- id: 4
  action: Tap the 'Change Payment Method' CTA
  expected: UpsertNissanPayAccount API is triggered (if it hasn't been called before)
    | The loading state is displayed | User is navigated to the Nissan Store Wallet
    screen
- id: 5
  action: Tap the back button on the Nissan Store Wallet screen
  expected: User is navigated back to the NISSAN ENERGY Charge Network screen
