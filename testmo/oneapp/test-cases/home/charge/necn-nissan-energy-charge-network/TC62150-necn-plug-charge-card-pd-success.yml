  steps:
  - column_name: custom_steps
    id: 96453
    case_id: 62150
    text1: '<p>Mock AccountStatus API to return "pncStatus": "PENDING" or "INSTALLING" </p><p>Navigate
      to the NISSAN ENERGY Charge Network screen</p>'
    text2: null
    text3: <p>Plug &amp; Charge card is displayed:</p><ul><li>The status is 'Installing...'</li><li>The
      copy is 'Please note that it may take up to 24 hours to install your Plug &amp;
      Charge Certificate. Make sure that your vehicle has a clear view of the sky
      to maximize network connection.'</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96454
    case_id: 62150
    text1: '<p>Mock AccountStatus API to return "pncStatus": "RENEWING"</p><p>Navigate
      to the NISSAN ENERGY Charge Network screen</p>'
    text2: null
    text3: <p>Plug &amp; Charge card is displayed:</p><ul><li>The status is 'Renewing...'</li><li>The
      copy is 'Please note that it may take up to 24 hours to install your Plug &amp;
      Charge Certificate. Make sure that your vehicle has a clear view of the sky
      to maximize network connection.'</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96455
    case_id: 62150
    text1: '<p>Mock AccountStatus API to return "pncStatus": "READY" and "toggleStatus":
      "ENABLED"/"DISABLED"</p><p>Navigate to the NISSAN ENERGY Charge Network screen</p>'
    text2: null
    text3: <p>Plug &amp; Charge card is shown:</p><ul><li>The toggle is in ON/OFF
      state</li><li>The copy is 'Plug and Charge provides a seamless method of charging
      (when at compatible stations). After plugging in the vehicle, charging will
      start automatically. <br /><strong>Troubleshooting</strong> <br />- If charging
      doesn't start within two minutes, unplug the charger<br />- Toggle "off" Plug
      &amp; Charge in-app<br />- Begin the session through your MyNISSAN app (or follow
      the instructions on the charger)'</li></ul>
    text4: null
    display_order: 3
