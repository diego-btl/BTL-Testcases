metadata:
  id: TC62140
  name: NISSAN ENERGY Charge Network - Not Activated - AD
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-11'
  updated: '2026-01-15'
  author: user_25
  testmo_id: 66249
  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'VehicleStaticData > "driverType": "SHARED_DRIVER"'
steps:
- id: 1
  action: 'User is on the Manage EV screen -> AccountStatus API > "status": "INACTIVE"/"NOT_ENROLLED"/"FAILED"/"CANCELLED"/"CLOSED"/"ENROLLING"'
  expected: NISSAN ENERGY Charge Network card is displayed | Subtitle of the NISSAN
    ENERGY Charge Network card is 'Not Activated'
- id: 2
  action: Tap the NISSAN ENERGY Charge Network card
  expected: '''NISSAN ENERGY Charge Network'' | ''The NISSAN ENERGY Charge Network
    allows drivers to initiate and pay for charging sessions through the MyNISSAN
    app. If you would like to utilize this feature, please contact the primary account
    holder for activation.'''
- id: 3
  action: Tap the 'CALL OUR HELP LINE' button
  expected: The phone number from the ContactUs.plugAndChargeSupport is populated
