metadata:
  id: TC62166
  name: NECN - Enrollment Flow - SUCCESS
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-16'
  updated: '2026-01-15'
  author: user_25
  testmo_id: 62166
  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'AccountStatus API > "status": "NOT_ENROLLED"/"FAILED"/"CANCELLED"'
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the 'NISSAN ENERGY Charge Network' card
  expected: The loading state is displayed | AccountStatus, NissanPay, and ChargeProduct
    APIs are triggered | User is navigated to the NISSAN ENERGY Charge Network screen
- id: 2
  action: Tap the 'Add Payment Method' button
  expected: UpsertNissanPayAccount API is triggered (if it hasn't been called before)
    | The loading state is displayed | User is navigated to the Nissan Store Wallet
    screen
- id: 3
  action: Tap the 'ADD NEW PAYMENT METHOD' button
  expected: User is redirected to the Nissan Store Wallet screen
- id: 4
  action: Enter a correct card number in the 'Card Number' field and any number in
    the 'Expiry' field and 'CVC/CVV' fields -> Enter the postal code in the 'Postal
    Code' filed and check the 'By checking this box...' checkmark
  expected: Particular numbers are displayed in the proper fields
- id: 5
  action: Tap the 'SAVE' button
  expected: The loading state is displayed | The toast 'Payment method added successfully'
    is displayed | The card information is displayed on the Nissan Store Wallet screen
- id: 6
  action: Tap '<' back button
  expected: Copy is 'Your default payment method will be used for charging transactions.'
    | Added card info | 'Change Payment Method' CTA
- id: 7
  action: Tap 'ACTIVATE' CTA
  expected: The loading state is displayed | UpsertNissanPayAccount, EnrollChargePlan
    and AccountStatus APIs are triggered
- id: 8
  action: 'AccountStatus returns "status": "ENROLLING"'
  expected: The 'Activation is pending' toast is displayed | The 'Account Status'
    card's status is 'Processing'
- id: 9
  action: 'AccountStatus returns "status": "ACTIVE"'
  expected: The 'Charge Network Activated' success toast is displayed | The 'Deactivate
    Account' CTA is displayed on the Account Status card | The 'Account Status' card's
    status is changed to 'Active'
- id: 10
  action: Tap '<' back button
  expected: User is navigated to the Manage EV screen | The subtitle of the 'NISSAN
    ENERGY Charge Network' card is 'Active'
