      /><strong>Troubleshooting</strong> <br />- If charging doesn't start within
      two minutes, unplug the charger<br />- Toggle "off" Plug &amp; Charge in-app<br
      />- Begin the session through your MyNISSAN app (or follow the instructions
      on the charger)'</li></ul>
    text4: null
    display_order: 7
