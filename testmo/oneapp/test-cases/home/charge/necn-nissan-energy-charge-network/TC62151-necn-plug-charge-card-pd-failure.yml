      loading state is displayed</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 96459
    case_id: 62151
    text1: '<p>If RetryCertInstall returns "statusCode": "1000"</p>'
    text2: null
    text3: <p>The loading state is displayed</p><p>AccountStatus API is triggered</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 96460
    case_id: 62151
    text1: '<p>If AccountStatus API returns "pncStatus": "PENDING"/"INSTALLING"/"RENEWING"</p>'
    text2: null
    text3: <p>The toast 'Installing Certificate' is displayed</p><p>Plug &amp; Charge
      card shows:</p><ul><li>The status is 'Installing...'/'Renewing...'</li><li>The
      copy is 'Please note that it may take up to 24 hours to install your Plug &amp;
      Charge Certificate. Make sure that your vehicle has a clear view of the sky
      to maximize network connection.'</li></ul>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 96461
    case_id: 62151
    text1: '<p>If AccountStatus API returns "pncStatus": "FAILED" </p>'
    text2: null
    text3: <p>The toast 'Failed to Install' is displayed</p>
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 96462
    case_id: 62151
    text1: '<p>If AccountStatus API returns "pncStatus": "READY" and "toggleStatus":
