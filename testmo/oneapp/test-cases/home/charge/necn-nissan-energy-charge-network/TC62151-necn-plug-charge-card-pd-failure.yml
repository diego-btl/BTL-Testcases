  steps:
  - column_name: custom_steps
    id: 96456
    case_id: 62151
    text1: '<p>Mock AccountStatus API to return "pncStatus": "FAILED" and "pncStatusReason":
      "01"</p><p>Navigate to the NISSAN ENERGY Charge Network screen</p>'
    text2: null
    text3: <p>Plug &amp; Charge card is displayed:</p><ul><li>The status is 'Failed
      to Install'</li><li>The copy is 'Plug &amp; Charge certificates failed to install.
      Please contact customer support for more details.'</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96457
    case_id: 62151
    text1: '<p>Mock AccountStatus API to return "pncStatus": "FAILED" and "pncStatusReason":
      "00"</p><p>Navigate to the NISSAN ENERGY Charge Network screen</p>'
    text2: null
    text3: <p>Plug &amp; Charge card is displayed:</p><ul><li>The status is 'Failed
      to Install'</li><li>The copy is 'Plug &amp; Charge certificates failed to install.
      You can click "Install" to try again.'</li><li>'Install' CTA</li></ul>
    text4: null
