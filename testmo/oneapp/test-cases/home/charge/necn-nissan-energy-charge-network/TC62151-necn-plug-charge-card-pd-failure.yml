    text2: null
    text3: <p>The toast 'Certificate Installed' is displayed</p><p>The Plug &amp;
      Charge card is updated respectively:</p><ul><li>The toggle is in ON/OFF state</li><li>The
      copy is 'Plug and Charge provides a seamless method of charging (when at compatible
