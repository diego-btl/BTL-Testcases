metadata:
  id: TC62155
  name: NECN - Plug & Charge Toggle - ENABLING - TO CONFIRM WITH PM
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-15'
  updated: '2026-01-28'
  author: user_25
  testmo_id: 66251
  folder_id: 2444
description: https://app.clickup.com/t/86b6k4h6xhttps://app.clickup.com/t/86b6xxa5a
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
- description: 'AccountStatus > "status": "ACTIVE"'
steps:
- id: 1
  action: 'Mock AccountStatus API to return "pncStatus": "READY" and "toggleStatus":
    "DISABLED" -> Navigate to the NISSAN ENERGY Charge Network screen -> Tap the toggle
    to enable it'
  expected: 'UpdatePnCServiceStatus API is called with the current VIN and "pncServiceStatus":
    "ENABLE" as inputs | PNCServiceStatus API is called returning "pncServiceStatus":
    "ENABLING" every 3 seconds | The toast ''Enabling Plug & Charge'' is displayed'
- id: 2
  action: 'Mock PNCServiceStatus API to return "pncServiceStatus": "ENABLED"'
  expected: The toast 'Plug & Charge enabled' is displayed | The toggle is moved to
    the 'ON' state
- id: 3
  action: 'Mock PNCServiceStatus API to return "pncServiceStatus": "ENABLING" and
    then mock it to "DISABLED"'
  expected: The toggle should remain in the 'OFF' state and be enabled | The error
    toast 'Failed to enable Plug & Charge' is displayed
- id: 4
  action: 'Mock AccountStatus API to return "pncStatus": "READY" and "toggleStatus":
    "DISABLING" -> Navigate to the NISSAN ENERGY Charge Network screen -> Tap the
    toggle to enable it'
  expected: The toggle is in 'OFF' state and is disabled | User is not able to toggle
    it ON
- id: 5
  action: 'Return to the first step and Mock AccountStatus API to return "pncStatus":
    "READY" and "toggleStatus": "DISABLED" -> Navigate to the NISSAN ENERGY Charge
    Network screen -> Tap the toggle to enable it'
  expected: 'UpdatePnCServiceStatus API returns "statusCode": "2004" | { "data": {
    "updatePnCServiceStatus": { "__typename": "EmpUpdatePnCServiceStatusResponse",
    "statusCode": "2004", "statusMessage": "Vehicle is currently in Charge Mode. Please
    try after completing the charge.", "timestamp": "2025-08-09T16:19:27.431Z", "data":
    null } } }The toast ''Failed to enable Plug & Charge'' is displayed | The toggle
    remains in the same state'
- id: 6
  action: 'Return to the first step and Mock AccountStatus API to return "pncStatus":
    "READY" and "toggleStatus": "DISABLED" -> Navigate to the NISSAN ENERGY Charge
    Network screen -> Tap the toggle to enable it'
  expected: 'UpdatePnCServiceStatus API returns "statusCode": "3015" | { "data": {
    "updatePnCServiceStatus": { "__typename": "EmpUpdatePnCServiceStatusResponse",
    "statusCode": "3015", "statusMessage": "Previous action is in progress, Please
    try after sometime.", "timestamp": "2025-08-09T16:19:27.431Z", "data": null }
    } }The toast ''Failed to enable Plug & Charge'' is displayed | The toggle remains
    in the same state'
