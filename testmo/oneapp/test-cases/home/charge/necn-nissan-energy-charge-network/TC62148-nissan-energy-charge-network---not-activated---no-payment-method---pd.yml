metadata:
  id: TC62148
  name: NISSAN ENERGY Charge Network - Not Activated - No Payment Method - PD
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-12'
  updated: '2026-01-15'
  author: user_25
  testmo_id: 62148
  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
- description: Payment Method > card is NOT added to the account
steps:
- id: 1
  action: 'User is on the Manage EV screen -> AccountStatus API > "status": "INACTIVE"/"NOT_ENROLLED"/"FAILED"/"CANCELLED"/"CLOSED"'
  expected: NISSAN ENERGY Charge Network card is displayed | Subtitle of the NISSAN
    ENERGY Charge Network card is 'Not Activated'
- id: 2
  action: Tap the NISSAN ENERGY Charge Network card
  expected: Status is 'Not Activated' | Copy is 'NISSAN ENERGY Charge Network' | 'Activate
    the NISSAN ENERGY Charge Network today for access to Nisssan's in-network charging
    partners. Find charge stations and manage your charging sessions with in-network
    partners directly through the MyNISSAN App.' | The 'Add Payment Method' button
    is displayed
- id: 3
  action: Tap the 'CALL OUR HELP LINE' button
  expected: The phone number from the ContactUs.plugAndChargeSupport is populated
- id: 4
  action: Tap the 'Add Payment Method' CTA
  expected: UpsertNissanPayAccount API is triggered (if it hasn't been called before)
    | The loading state is displayed | User is navigated to the Nissan Store Wallet
    screen
- id: 5
  action: Tap the back button on the Nissan Store Wallet screen
  expected: User is navigated back to the NISSAN ENERGY Charge Network screen
- id: 6
  action: Fresh install the app -> Navigate to the Charge screen -> Add a breakpoint
    to the UpsertNissanPayAccount API -> Tap the 'Add Payment Method' CTA -> Abort
    the UpsertNissanPayAccount API
  expected: The 'Something Went Wrong' modal with 'Cancel' and 'Retry' buttons is
    displayed
- id: 7
  action: Tap 'Cancel'
  expected: The modal is dismissed
- id: 8
  action: Tap 'Retry' button
  expected: The UpsertNissanPayAccount API is triggered again
