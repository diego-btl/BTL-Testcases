  folder_id: 2444
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
steps:
- id: 1
  action: 'Mock AccountStatus API to return "status": "ACTIVE" and "pncStatus": "NA"/null/""
    -> Navigate to the NISSAN ENERGY Charge Network screen'
  expected: Plug & Charge card is hidden
- id: 2
  action: '"status" =! "ACTIVE" ("INACTIVE"/"NOT_ENROLLED"/"FAILED"/"CANCELLED"/"CLOSED"/"ENROLLING")
    -> "pncStatus": "READY"/"PENDING"/"INSTALLING"/"RENEWING"/"FAILED"'
  expected: Plug & Charge card is hidden
