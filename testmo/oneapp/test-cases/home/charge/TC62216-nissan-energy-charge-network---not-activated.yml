metadata:
  id: TC62216
  name: NISSAN ENERGY Charge Network - Not Activated
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-19'
  updated: '2025-12-19'
  author: user_6
  testmo_id: 65878
  folder_id: 66
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: '"GrantFullPlugAndCharge": "{\"enabled\": true, \"checkCapability\":
    true}"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
steps:
- id: 1
  action: 'User is on the Charge screen -> AccountStatus API > "status": "INACTIVE"/"NOT_ENROLLED"/"FAILED"/"CANCELLED"/"CLOSED"/"ENROLLING"'
  expected: NISSAN ENERGY Charge Network card is displayed with the Start Activation
    CTA
- id: 2
  action: Tap the 'Start Activation' CTA
  expected: AccountStatus, NissanPay, ChargeProduct are called | User is navigated
    to the NISSAN ENERGY Charge Network screen
- id: 3
  action: Tap '<' back button
  expected: User is redirected to the Charge screen
