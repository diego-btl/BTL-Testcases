metadata:
  id: TC61998
  name: Charge Limit - Set Notify at - Success
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-14'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 61998
  folder_id: 6780
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Charge Limit screen
steps:
- id: 1
  action: Tap the Notify at picker, select a different value, and tap outside the
    field
  expected: User should see the field updated with the corresponding selected value,
    and the Set Notification CTA should get enabled
- id: 2
  action: Tap the Set Notification CTA
  expected: SetNotificationLimit API is triggered | The loading state is displayed
- id: 3
  action: SetNotificationLimit API returns a correct response
  expected: Notification Set success toast is displayed | The Set Charge Limit CTA
    gets back to the disabled state
