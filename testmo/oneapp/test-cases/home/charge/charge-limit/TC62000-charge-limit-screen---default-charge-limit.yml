metadata:
  id: TC62000
  name: Charge Limit screen - Default Charge Limit
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-14'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 62000
  folder_id: 6780
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Charge Limit screen
steps:
- id: 1
  action: Tap the Charge Limit Setting dropdown
  expected: The dropdown is expanded
- id: 2
  action: Select No Limit and tap outside the dropdown
  expected: The No Limit value is displayed in the field | The Set Charge Limit CTA
    gets enabled
- id: 3
  action: Tap the Set Charge Limit CTA
  expected: SetChargeLimit API is triggered | CheckChargeConfigServiceRequest API
    returns success response
- id: 4
  action: Navigate to the Charge Notification section and tap the Notify at dropdown
  expected: The dropdown is expanded
- id: 5
  action: Select Do Not Notify and tap outside the dropdown
  expected: The Do Not Notify value is displayed in the field | The Set Notification
    CTA gets enabled
- id: 6
  action: Tap the Set Notification CTA
  expected: SetNotificationLimit API is triggered returning the success reponse
- id: 7
  action: Navigate back to the Charge screen -> Tap the Manage EV button
  expected: 'ChargeConfig API is triggered, returning the updated response | { "data":
    { "vehicle": { "__typename": "ElectricAVK2Vehicle", "chargeConfig": { "__typename":
    "ChargeConfig", "limits": { "__typename": "ChargeLimits", "notification": { "__typename":
    "ChargeNotificationLimit", "percent": -1 }, "charge": { "__typename": "ChargeLimit",
    "percent": 100 } } } } } }The No Limit secondary text is displayed on the Charge
    Limit card'
- id: 8
  action: Tap the Charge Limit card
  expected: The Charge Limit Setting is set to No Limit | The Notify at is set to
    Do Not Notify
