metadata:
  id: TC61992
  name: Charge Limit screen - Charge Limit Setting picker
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-14'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 66279
  folder_id: 6780
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Manage EV screen and Charge Limit card is enabled
steps:
- id: 1
  action: Tap the Charge Limit card
  expected: User should see the Charge Limit screen with the Charge Limit Settings
    field showing the value corresponding to ChargeConfig.charge.percent
- id: 2
  action: Tap the Charge Limit Setting dropdown
  expected: Values should start with No Limit, then increase by 5% from 40% to 95%
- id: 3
  action: Mock ChargeConfig so that ChargeConfig.charge.percent is returning null
    or value from 5 to 15 or 100 -> Navigate back to the Charge screen and return
    to the Manage EV screen
  expected: ChargeConfig API is called
- id: 4
  action: Tap the Charge Limit card
  expected: Charge Limit Setting is updated to No Limit | The Set Charge Limit CTA
    is disabled
- id: 5
  action: Tap Charge Limit Setting dropdown
  expected: Values should start with No Limit, then increase by 5% from 40% to 95%
- id: 6
  action: Mock ChargeConfig so that ChargeConfig.charge.percent is returning value
    from 20 to 35 -> Navigate back to the Charge screen and return to the Manage EV
    screen
  expected: ChargeConfig API is called
- id: 7
  action: Tap the Charge Limit card
  expected: Charge Limit Setting is updated to 40 | The Set Charge Limit CTA is disabled
- id: 8
  action: Tap Charge Limit Setting dropdown
  expected: Values should start with No Limit, then increase by 5% from 40% to 95%
