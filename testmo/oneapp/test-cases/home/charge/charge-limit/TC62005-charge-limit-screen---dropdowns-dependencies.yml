metadata:
  id: TC62005
  name: Charge Limit screen - Dropdowns Dependencies
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-16'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 66273
  folder_id: 6780
description: https://app.clickup.com/t/86b6jdmdg
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Charge Limit screen
steps:
- id: 1
  action: Set the Charge Notification Settings to any value by selecting it from the
    dropdown -> Tap outside the dropdown
  expected: The selected value is set and displayed in the field
- id: 2
  action: Tap the Notify at dropdown
  expected: The maximum value available in the Notify at picker should be limited
    to my current charge limit setting
- id: 3
  action: Set the Notify at to 95 by selecting it from the dropdown -> Tap outside
    the dropdown
  expected: The selected value is set and displayed in the field
- id: 4
  action: Tap the Charge Limit Setting dropdown -> Select 90 value from the dropdown
  expected: The charge notification value is automatically updated to match the charge
    limit value
