metadata:
  id: TC62004
  name: Charge Limit - Set Notify at - Failure
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-16'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 66280
  folder_id: 6780
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Charge Limit screen
steps:
- id: 1
  action: Tap the Notify at picker, select a different value, and tap outside the
    field
  expected: User should see the field updated with the corresponding selected value,
    and the Set Notification CTA should get enabled
- id: 2
  action: Add a breakpoint to the SetNotificationLimit API -> Tap the Set Notification
    CTA
  expected: SetNotificationLimit API is triggered | The loading state is displayed
- id: 3
  action: Abort the SetNotificationLimit API
  expected: The Failed to set notification limit toast is displayed (5 seconds) |
    The Set Charge Limit CTA is in the enabled state
