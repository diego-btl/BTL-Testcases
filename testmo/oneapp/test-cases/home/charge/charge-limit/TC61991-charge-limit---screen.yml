steps:
- id: 1
  action: Tap the Charge Limit card
  expected: Charge Limit card:- Choose the maximum charge limit for your battery.
    text - Charge Limit Settings dropdown with the correlated value set- Set Charge
    Limit CTA in disabled state- Charging time and capacity may vary based on power
    source, ambient temperature, battery temperature, condition, age, and use of the
    vehicle accessories while charging. description text | Charge Notification card:-
    Set notifications whenever your battery reaches a specified charge percentage.
    To make additional adjustments to your alerts, go to "Notification Preferences".
    text- Notify at dropdown with the correlated value set- Set Notification CTA in
    disabled state- MANAGE NOTIFICATIONS button
