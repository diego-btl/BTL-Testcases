test_case:
  preconditions: <p>User has an EV AVK2 vehicle</p><p><code>EnableChargeLimit</code>
    FF is true</p><p>User is on the Charge Limit screen</p>
  steps:
  - column_name: custom_steps
    id: 95545
    case_id: 62000
    text1: <p>Tap the <strong>Charge Limit Setting</strong> dropdown</p>
    text2: null
    text3: <p>The dropdown is expanded</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95546
    case_id: 62000
    text1: <p>Select <strong>No Limit</strong> and tap outside the dropdown</p>
    text2: null
    text3: <p>The No Limit value is displayed in the field</p><p>The <strong>Set Charge
      Limit</strong> CTA gets enabled </p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95547
    case_id: 62000
    text1: <p>Tap the <strong>Set Charge Limit</strong> CTA</p>
    text2: null
    text3: "<p>SetChargeLimit API is triggered</p><p>CheckChargeConfigServiceRequest\
      \ API returns success response</p><pre><code class=\"editor-plain language-plain\
      \ code-block\">{\n  \"data\": {\n    \"checkChargeConfigServiceRequest\": {\n\
      \      \"__typename\": \"ServiceRequestResult\",\n      \"status\": \"SUCCESS\"\
      \n    }\n  }\n}</code></pre>"
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95548
    case_id: 62000
    text1: <p>Navigate to the Charge Notification section and tap the <strong>Notify
      at</strong> dropdown</p>
    text2: null
    text3: <p>The dropdown is expanded</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95549
    case_id: 62000
    text1: <p>Select <strong>Do Not Notify</strong> and tap outside the dropdown</p>
    text2: null
    text3: <p>The Do Not Notify value is displayed in the field</p><p>The <strong>Set
      Notification</strong> CTA gets enabled </p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 95550
    case_id: 62000
    text1: <p>Tap the <strong>Set Notification</strong> CTA</p>
    text2: null
    text3: "<p>SetNotificationLimit API is triggered returning the success reponse</p><pre><code\
      \ class=\"editor-plain language-plain code-block\">{\n  \"data\": {\n    \"\
      setChargeNotificationThreshold\": {\n      \"__typename\": \"TelematicsResponse\"\
      ,\n      \"serviceRequestId\": \"af51ff76-c4a3-4bd7-bcba-0d0cb1d6ac12\"\n  \
      \  }\n  }\n}</code></pre>"
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 95551
    case_id: 62000
    text1: <p>Navigate back to the Charge screen</p><p>Tap the Manage EV button</p>
    text2: null
    text3: "<p>ChargeConfig API is triggered, returning the updated response</p><pre><code\
      \ class=\"editor-plain language-plain code-block\">{\n  \"data\": {\n    \"\
      vehicle\": {\n      \"__typename\": \"ElectricAVK2Vehicle\",\n      \"chargeConfig\"\
      : {\n        \"__typename\": \"ChargeConfig\",\n        \"limits\": {\n    \
      \      \"__typename\": \"ChargeLimits\",\n          \"notification\": {\n  \
      \          \"__typename\": \"ChargeNotificationLimit\",\n            \"percent\"\
      : -1\n          },\n          \"charge\": {\n            \"__typename\": \"\
      ChargeLimit\",\n            \"percent\": 100\n          }\n        }\n     \
      \ }\n    }\n  }\n}</code></pre><p>The <strong>No Limit</strong> secondary text\
      \ is displayed on the Charge Limit card</p>"
    text4: null
    display_order: 7
  - column_name: custom_steps
    id: 95552
    case_id: 62000
    text1: <p>Tap the Charge Limit card</p>
    text2: null
    text3: <p>The <strong>Charge Limit Setting</strong> is set to <strong>No Limit</strong></p><p>The
      <strong>Notify at</strong> is set to <strong>Do Not Notify</strong></p>
    text4: null
    display_order: 8
