metadata:
  id: TC61990
  name: Charge Limit - Set Charge Limit Setting - Initiated
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-14'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 61990
  folder_id: 6780
preconditions:
- description: User has an EV AVK2 vehicle
- description: EnableChargeLimit FF is true
- description: User is on the Charge Limit screen
steps:
- id: 1
  action: Tap on the Charge Limit Setting picker, select a different value, and tap
    outside the field
  expected: User should see the field updated with the corresponding selected value,
    and the Set Charge Limit CTA should get enabled
- id: 2
  action: Tap the Set Charge Limit CTA
  expected: SetChargeLimit API is triggered, and CheckChargeConfigServiceRequest starts
    polling with the PENDING status | The Set Charge Limit CTA is disabled | User
    should see the Setting charge limit toast while CheckChargeConfigServiceRequest
    returns the PENDING status
