    text1: <p>V1GTokenizedUrl API returns the valid URL</p>
    text2: null
    text3: '<p>The URL is displayed within the webview according to the following
      logic:</p><pre><code class="editor-plain language-plain code-block">

      view=optimize|insights


      theme=light|dark


      languageCode=en-US | Fr-CA | en-CA


      TimeFormat = 12h | 24h

      </code></pre>'
    text4: null
