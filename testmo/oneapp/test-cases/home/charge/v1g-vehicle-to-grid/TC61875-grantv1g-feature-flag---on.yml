metadata:
  id: TC61875
  name: GrantV1G Feature flag - ON
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-24'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66223
  folder_id: 6755
description: A user can enroll in the smart charging program to start getting personalized
  cost optimizations and smart charging recommendations from Nissan / their partners
  (BTR)
preconditions:
- description: Nissan NNA and NCI only
- description: User has an EV or EV AVK2 vehicle
- description: PD only
steps:
- id: 1
  action: 'Mock remote config to "GrantV1G": "{\"enabled\": true, \"checkCapability\":
    false}" -> VehicleCapabilities returns "status" =! "STOLEN" -> eVehicleEligibility
    API returns "v1GEligible": true'
  expected: 'V1GMonitoredChargingAccountStatus API is called when landing on the home
    page, returning "v1GMonitoredChargingAccountStatus": "ACTIVE" | Status, Optimize,
    and Insights tabs are displayed'
- id: 2
  action: 'Mock remote config to "GrantV1G": "{\"enabled\": true, \"checkCapability\":
    false}" -> VehicleCapabilities returns "status": "STOLEN"'
  expected: 'eVehicleEligibility API and V1GMonitoredChargingAccountStatus API are
    not called (note: mocking VehicleCapabilities perform bg/fg or cold start 2 times,
    the API will not be called after the second attempt) | User is blocked from navigating
    to the Charge screen'
