metadata:
  id: TC61878
  name: V1G status - NOT_ENROLLED - Dismissible Marketing Message
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-24'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 61878
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: User has an EV or EV AVK2 vehicle
- description: PD only
- description: '"v1GEligible": true'
steps:
- id: 1
  action: 'Mock V1GMonitoredChargingAccountStatus API to return "v1GMonitoredChargingAccountStatus":
    "NOT_ENROLLED" -> Navigate to the Charge screen'
  expected: The dismissible marketing message is displayed under the Status tab
- id: 2
  action: Tap the LEARN MORE button
  expected: User is navigated to the Optimize screen
- id: 3
  action: Tap the X button in the top right corner of the message
  expected: The message is dismissed
- id: 4
  action: Navigate to any tab and go back to the Charge screen
  expected: The message is hidden
- id: 5
  action: Bg/fg or cold start the app -> Navigate to the Charge screen
  expected: The message is hidden
- id: 6
  action: 'Fresh install the app -> Make sure the V1GMonitoredChargingAccountStatus
    API still returns "v1GMonitoredChargingAccountStatus": "NOT_ENROLLED" -> Navigate
    to the Charge screen'
  expected: The dismissible marketing message is displayed under the Status tab
- id: 7
  action: 'Mock V1GMonitoredChargingAccountStatus API to return "v1GMonitoredChargingAccountStatus":
    "CANCELLED"/"FAILED"/"ENROLLING"/"INACTIVE" -> Navigate to the Charge screen'
  expected: The dismissible marketing message is hidden
