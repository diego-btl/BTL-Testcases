metadata:
  id: TC61942
  name: V1G - Garage Load - Switching VINs
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-05'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66222
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: '"GrantV1G": "{\"enabled\": true, \"checkCapability\": true}"'
- description: 'VehicleStaticData > "__typename": "ElectricAVK2Vehicle" or "__typename":
    "ElectricVehicle"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
- description: 'VehicleCapabilities > "status": "ENROLLED"'
- description: 'eVehicleEligibility > "v1GEligible": true'
steps:
- id: 1
  action: User is on the Home screen
  expected: V1GMonitoredChargingAccountStatus API is called for the eligible VIN,
    returning "v1GMonitoredChargingAccountStatus" =! "CLOSED"
- id: 2
  action: Select another vehicle from the vehicle selector
  expected: eVehicleEligibility and V1GMonitoredChargingAccountStatus APIs are not
    re-triggered
