metadata:
  id: TC61935
  name: V1G - Garage Load - EV/EV2 - PD - ENROLLED
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-05'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66225
  folder_id: 6755
description: 'Note: mocking VehicleCapabilities or VehicleStaticData perform bg/fg
  or cold start 2 times due to the existing 2nd step validationNote: performing pull-to-refresh
  cache should be cleared, if all the mandatory criteria have not been met > the feature
  should be hidden after the first pull-to-refresh; after the second pull-to-refresh
  > eVehicleEligibility and V1GMonitoredChargingAccountStatus APIs should not be called'
preconditions:
- description: Nissan NNA and NCI only
- description: '"GrantV1G": "{\"enabled\": true, \"checkCapability\": true}"'
- description: 'VehicleStaticData > "__typename": "ElectricAVK2Vehicle" or "__typename":
    "ElectricVehicle"'
- description: 'VehicleStaticData > "driverType": "PRIMARY_DRIVER"'
- description: 'VehicleCapabilities > "status": "ENROLLED"'
- description: 'eVehicleEligibility > "v1GEligible": true'
steps:
- id: 1
  action: User is on the Home screen
  expected: V1GMonitoredChargingAccountStatus API is called for the eligible VIN,
    returning "v1GMonitoredChargingAccountStatus" =! "CLOSED"
- id: 2
  action: Bg/fg or cold start the app -> Navigate to the Charge screen while APIs
    are still loading
  expected: The value is cached locally > Status, Optimize, Insights tabs are displayed
- id: 3
  action: 'Mock VehicleStaticData to return EV and EV2 in the garage -> Mock eVehicleEligibility
    > "v1GEligible": true for the second EV'
  expected: V1GMonitoredChargingAccountStatus API is called for every eligible VIN
