metadata:
  id: TC61933
  name: V1G - Existing User Flow
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-05'
  updated: '2026-01-30'
  author: user_25
  testmo_id: 66224
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "ACTIVE"'
steps:
- id: 1
  action: The app is fresh installed -> Navigate to the Charge > Optimize or Charge
    > Insights screen
  expected: V1GTokenizedUrl API is triggered | The loading state is displayed
- id: 2
  action: V1GTokenizedUrl API returns the valid URL
  expected: 'The URL is displayed within the webview according to the following logic:'
- id: 3
  action: Bg/fg or cold start the app -> Navigate to the Charge > Optimize or Charge
    > Insights screen
  expected: V1GTokenizedUrl API is NOT triggered | The loading state is NOT displayed
    since the value is cached
- id: 4
  action: Change the theme in the app or in the device settings -> Navigate to the
    Charge > Optimize or Charge > Insights screen
  expected: The content of the webview is displayed accordingly
- id: 5
  action: Navigate to the Charge > Optimize
  expected: Time format is correct according to the app region and language settings:-
    Nissan NNA - 12h- Nissan NCI - EN - 12h- Nissan NCI - FR - 24h
- id: 6
  action: Set device to FR -> Navigate to the Charge > Optimize or Charge > Insights
    screen
  expected: The content of the webview is displayed accordingly:- Nissan NNA - in
    English- Nissan NCI - in French
