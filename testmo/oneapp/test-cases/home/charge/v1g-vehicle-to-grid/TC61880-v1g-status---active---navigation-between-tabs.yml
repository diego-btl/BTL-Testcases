metadata:
  id: TC61880
  name: V1G status - ACTIVE - Navigation Between Tabs
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-24'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66231
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "ACTIVE"'
- description: User is on the Status, Optimize, or Insights screen
steps:
- id: 1
  action: Tap the back button on the device or the top left back chevron on the first
    webview page or on the Status/Optimize/Insight tabs
  expected: User is navigated to the Home screen
- id: 2
  action: Navigate to the inner page on the Optimize or Insights webview -> Tap the
    back button on the device or the top left back chevron
  expected: User should be navigated back one page within the webview context
