metadata:
  id: TC61930
  name: V1G - CANCELLED
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-04'
  updated: '2026-01-30'
  author: user_25
  testmo_id: 66214
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "CANCELLED"'
steps:
- id: 1
  action: User is on the Optimize or Insights screen -> Tap the 'Activate Now' button
  expected: 'V1GEnrollMonitoredChargingPlan APIs is called returning "v1GMonitoredChargingAccountStatus":
    "FAILED" | { "data": { "v1GEnrollMonitoredChargingPlan": { "__typename": "V1GEnrollMonitoredChargingPlanResponse",
    "data": { "__typename": "V1GEnrollChargePlanData", "v1GMonitoredChargingAccountStatus":
    "FAILED" } } } }2. The modal ''Enrolling account failed'' with ''Cancel'' and
    ''Contact Support'' buttons is displayed'
- id: 2
  action: Tap 'Cancel' button
  expected: The modal is dismissed
- id: 3
  action: Tap 'Contact Support' button
  expected: The native app page is opened with prepopulation of the phone number (ContactUs
    API customerCare)
- id: 4
  action: User is on the Optimize or Insights screen -> Tap the 'Activate Now' button
  expected: 'V1GEnrollMonitoredChargingPlan APIs is called returning "data": null
    | { "data": { "v1GEnrollMonitoredChargingPlan": { "__typename": "V1GEnrollMonitoredChargingPlanResponse",
    "data": null } } }2. The SWW modal with ''Ok'' button is displayed'
- id: 5
  action: Tap 'Ok' button
  expected: The modal is dismissed
