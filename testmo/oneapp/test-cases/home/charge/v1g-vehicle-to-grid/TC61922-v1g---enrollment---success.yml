metadata:
  id: TC61922
  name: V1G - Enrollment - SUCCESS
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-03'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66205
  folder_id: 6755
description: CANCELLED or NOT_ENROLLED V1G statuses mean that the user is eligible,
  but needs to opt-in to start getting the full experience
preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "CANCELLED" or "NOT_ENROLLED"'
steps:
- id: 1
  action: User is on the Optimize or Insights screen -> Tap the 'Activate Now' button
  expected: The loading state is displayed (Processing your enrollment) | The V1GEnrollMonitoredChargingPlan
    API is triggered
- id: 2
  action: The V1GEnrollMonitoredChargingPlan API is triggered, returning the proper
    response
  expected: '''You''ve successfully enrolled!'' success toast is displayed | V1GTokenizedUrl
    API is triggered, returning the valid URL | The Optimize and Insights screens
    are updated, displaying the URL in a webview'
- id: 3
  action: Bg/fg or cold start the app -> Navigate to the Optimize/Insights screen
  expected: The access token is cached | The tabs show the context of the webview
    | The V1GTokenizedUrl API is NOT triggered
