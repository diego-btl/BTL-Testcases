preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "FAILED"'
steps:
- id: 1
  action: User is on the Optimize screen -> Tap the 'Activate Now' button
  expected: None of the APIs are called | The modal 'Enrolling account failed' with
    'Cancel' and 'Contact Support' buttons is displayed
- id: 2
  action: Tap 'Cancel' button
  expected: The modal is dismissed
- id: 3
  action: Tap 'Contact Support' button
  expected: The native app page is opened with prepopulation of the phone number (ContactUs
    API customerCare)
- id: 4
  action: User is on the Insights screen -> Tap the 'Activate Now' button
  expected: None of the APIs are called | The modal 'Enrolling account failed' with
    'Cancel' and 'Contact Support' buttons is displayed
- id: 5
  action: Tap 'Cancel' button
  expected: The modal is dismissed
- id: 6
  action: Tap 'Contact Support' button
  expected: The native app page is opened with prepopulation of the phone number (ContactUs
    API customerCare)
