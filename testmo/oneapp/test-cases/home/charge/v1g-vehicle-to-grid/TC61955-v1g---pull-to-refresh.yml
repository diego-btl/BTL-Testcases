metadata:
  id: TC61955
  name: V1G - Pull-to-Refresh
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-10'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66216
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: User has an EV or EV AVK2 vehicle
- description: PD only
- description: 'VehicleCapabilities > "status": "ENROLLED"'
- description: 'eVehicleEligibility > "v1GEligible": true'
- description: 'V1GMonitoredChargingAccountStatus > "v1GMonitoredChargingAccountStatus":
    "ACTIVE"'
steps:
- id: 1
  action: Navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are displayed, the data is cached
- id: 2
  action: Mock VehicleStaticData to return "__typename" =! "ElectricAVK2Vehicle" or
    "__typename" =! "ElectricVehicle" -> Navigate to the Home screen and perform Pull-to-Refresh
    -> Wait until APIs are loading -> Navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are hidden
- id: 3
  action: Stop mocking -> Navigate to the Home screen and perform Pull-to-Refresh
    -> Wait until APIs are loading -> Navigate to the Charge screen
  expected: eVehicleEligibility and V1GMonitoredChargingAccountStatus should be triggered
    | Status, Optimize, and Insights tabs are displayed
- id: 4
  action: 'Mock VehicleStaticData to return "driverType": "SHARED_DRIVER" -> Navigate
    to the Home screen and perform Pull-to-Refresh -> Wait until APIs are loading
    -> Navigate to the Charge screen'
  expected: Status, Optimize, and Insights tabs are hidden
- id: 5
  action: Stop mocking -> Navigate to the Home screen and perform Pull-to-Refresh
    -> Wait until APIs are loading -> Navigate to the Charge screen
  expected: eVehicleEligibility and V1GMonitoredChargingAccountStatus should be triggered
    | Status, Optimize, and Insights tabs are displayed
- id: 6
  action: Mock VehicleCapabilities to return "status" =! "ENROLLED" -> Navigate to
    the Home screen and perform Pull-to-Refresh -> Wait until APIs are loading ->
    Navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are hidden
- id: 7
  action: Stop mocking -> Navigate to the Home screen and perform Pull-to-Refresh
    -> Wait until APIs are loading -> Navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are displayed
- id: 8
  action: 'Mock eVehicleEligibility to return "v1GEligible": false -> Navigate to
    the Home screen and perform Pull-to-Refresh -> Wait until APIs are loading ->
    Navigate to the Charge screen'
  expected: Status, Optimize, and Insights tabs are hidden
