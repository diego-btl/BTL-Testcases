preconditions:
- description: Nissan NNA and NCI only
- description: User has an EV or EV AVK2 vehicle
- description: PD only
- description: 'eVehicleEligibility > "v1GEligible": true'
- description: 'V1GMonitoredChargingAccountStatus > "v1GMonitoredChargingAccountStatus":
    "ACTIVE"'
steps:
- id: 1
  action: Bg/fg the app -> While the loading state is displayed on the Home screen
    quickly navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are displayed, the data is cached
- id: 2
  action: Navigate to the Manage EV screen
  expected: The Smart Charging card is located under the NECN card with the 'Enrolled'
    secondary text
- id: 3
  action: Cold start the app -> While the loading state is displayed on the Home screen
    quickly navigate to the Charge screen
  expected: Status, Optimize, and Insights tabs are displayed, the data is cached
- id: 4
  action: Navigate to the Manage EV screen
  expected: The Smart Charging card is located under the NECN card with the 'Enrolled'
    secondary text
