  steps:
  - column_name: custom_steps
    id: 94691
    case_id: 61879
    text1: '<p>1. Mock V1GMonitoredChargingAccountStatus API to return "v1GMonitoredChargingAccountStatus":
      "CANCELLED"/"NOT_ENROLLED"/"FAILED"/"ENROLLING"/"INACTIVE"</p><p>2. Navigate
      to the Charge screen &gt; Optimize tab &gt; Insights tab</p>'
    text2: null
    text3: <p>The legal copy is displayed according to the app's region and device
      language settings<br /> </p><figure class="image"><img src="/attachments/view/8629"
      alt="8629" /></figure><figure class="image"><img src="/attachments/view/8632"
      alt="8632" /></figure><figure class="image"><img src="/attachments/view/8631"
      alt="8631" /></figure><figure class="image"><img src="/attachments/view/8630"
      alt="8630" /></figure><figure class="image"><img src="/attachments/view/8633"
      alt="8633" /></figure>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 94692
    case_id: 61879
    text1: <p>Tap BTR link on the Optimize or Insights screen</p>
    text2: null
    text3: <p>1. User is navigated to the external browser</p><p>2. The <a href="http://btr.energy">http://btr.energy</a>
      web page is opened (<a href="https://btr.energy/fr/">http://btr.energy/fr/</a>
      for NCI if language is FR)</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 94693
    case_id: 61879
    text1: <p>Tap NissanConnect Subscriber Terms and Conditions link</p>
    text2: null
    text3: <p>1. ConnectedTermsAndConditionsByVIN API is triggered</p><p>2. The loading
      indicator is displayed</p><p>3. The Terms and Conditions screen is opened</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 94694
    case_id: 61879
    text1: <p>Tap the highlighted links in the Terms and Conditions</p>
    text2: null
    text3: <p>The link is opened in the external browser</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 94695
    case_id: 61879
    text1: <p>1. Fail the ConnectedTermsAndConditionsByVIN API</p><p>2. Tap the link
