    text2: null
    text3: <p>The Terms and Conditions are displayed since it's implemented as a fallback </p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 94696
    case_id: 61879
    text1: <p>Tap X button (iOS) or &lt; button (Android) on the Terms and Conditions
