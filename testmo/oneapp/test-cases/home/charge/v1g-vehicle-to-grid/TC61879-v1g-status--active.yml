metadata:
  id: TC61879
  name: V1G status =! ACTIVE
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-24'
  updated: '2025-12-16'
  author: user_25
  testmo_id: 66204
  folder_id: 6755
preconditions:
- description: Nissan NNA and NCI only
- description: User has an EV or EV AVK2 vehicle
- description: PD only
- description: '"v1GEligible": true'
steps:
- id: 1
  action: 'Mock V1GMonitoredChargingAccountStatus API to return "v1GMonitoredChargingAccountStatus":
    "CANCELLED"/"NOT_ENROLLED"/"FAILED"/"ENROLLING"/"INACTIVE" -> Navigate to the
    Charge screen > Optimize tab > Insights tab'
  expected: The legal copy is displayed according to the app's region and device language
    settings
- id: 2
  action: Tap BTR link on the Optimize or Insights screen
  expected: User is navigated to the external browser | The http://btr.energy web
    page is opened (http://btr.energy/fr/ for NCI if language is FR)
- id: 3
  action: Tap NissanConnect Subscriber Terms and Conditions link
  expected: ConnectedTermsAndConditionsByVIN API is triggered | The loading indicator
    is displayed | The Terms and Conditions screen is opened
- id: 4
  action: Tap the highlighted links in the Terms and Conditions
  expected: The link is opened in the external browser
- id: 5
  action: Fail the ConnectedTermsAndConditionsByVIN API -> Tap the link again
  expected: The Terms and Conditions are displayed since it's implemented as a fallback
- id: 6
  action: Tap X button (iOS) or < button (Android) on the Terms and Conditions screen
  expected: User is navigated back to the Optimize or Insights screen
- id: 7
  action: 'Mock V1GMonitoredChargingAccountStatus API to return "v1GMonitoredChargingAccountStatus":
    "CLOSED" -> Navigate to the Charge screen'
  expected: The tabs Status/Optimize/Insights are not displayed, the feature is hidden
