preconditions:
- description: User has an EV or EV2User is on the Charge screen
steps:
- id: 1
  action: 'Mock "EnablePlugAndCharge": "true" and "GrantFullPlugAndCharge": "{\"enabled\":
    true, \"checkCapability\": true}"'
  expected: User should see the NISSAN ENERGY Charge Network card
- id: 2
  action: 'Mock "EnablePlugAndCharge": "false" and/or "GrantFullPlugAndCharge": "{\"enabled\":
    false, \"checkCapability\": false}"'
  expected: User should not see the NISSAN ENERGY Charge Network card
