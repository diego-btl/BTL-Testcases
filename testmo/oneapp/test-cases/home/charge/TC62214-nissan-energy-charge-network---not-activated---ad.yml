metadata:
  id: TC62214
  name: NISSAN ENERGY Charge Network - Not Activated - AD
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-19'
  updated: '2025-12-19'
  author: user_6
  testmo_id: 65874
  folder_id: 66
preconditions:
- description: User has an EV/EV2
- description: '"EnablePlugAndCharge": "true"'
- description: '"GrantFullPlugAndCharge": "{\"enabled\": true, \"checkCapability\":
    true}"'
- description: 'VehicleStaticData > "driverType": "SHARED_DRIVER"'
steps:
- id: 1
  action: 'User is on the Charge screen -> AccountStatus API > "status": "INACTIVE"/"NOT_ENROLLED"/"FAILED"/"CANCELLED"/"CLOSED"/"ENROLLING"'
  expected: NISSAN ENERGY Charge Network card is displayed
- id: 2
  action: Tap the `Start Activation` CTA
  expected: '''NISSAN ENERGY Charge Network'' | ''The NISSAN ENERGY Charge Network
    allows drivers to initiate and pay for charging sessions through the MyNISSAN
    app. If you would like to utilize this feature, please contact the primary account
    holder for activation.'''
- id: 3
  action: Tap on CALL OUR HELP LINE
  expected: User can call 1 (833) 283-1888
