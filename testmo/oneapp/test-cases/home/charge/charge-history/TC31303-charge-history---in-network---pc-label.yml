description: https://www.pivotaltracker.com/story/show/188933442https://www.figma.com/design/w0iU02CnK1yBnT3PYljNJT/%5BSHARE%5D-Nissan-Charging?node-id=10860-91936&t=q5mMxGuxJfRCq75e-0To
  help users identify charge sessions that were made using Plug & Charge, Charge History
  entries made using P&C should be identified with a tag on their Charge History entries
preconditions:
- description: 'NissanPayOrderHistory API: "sessionType": "PLUG_AND_CHARGE"'
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the 'Charge History' card
  expected: The NissanPayOrderHistory API is triggered | The loading state is displayed
    | User is navigated to the Charge History screen
- id: 2
  action: Scroll to the card that correlates with the items.sessionType "PLUG_AND_CHARGE"
  expected: P&C label is displayed in the top right corner of the card | same in French
    - "P&C"
- id: 3
  action: Scroll to the card that correlates with the items.sessionType =! "PLUG_AND_CHARGE"
  expected: P&C label is NOT displayed in the top right corner of the card
