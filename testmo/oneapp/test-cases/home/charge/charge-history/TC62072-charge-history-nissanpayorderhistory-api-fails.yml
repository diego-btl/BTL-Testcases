metadata:
  name: Charge History - NissanPayOrderHistory API fails
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>User is a PD and has an EV/EV2</p><p>None of the FF is checked</p><p>User
    is on the Manage EV screen &gt; Charge History card is in the enabled state (it
    should always be enabled for PD)</p><p>EV &gt; VehicleCapabilities &gt; "DRIVING_ANALYSIS"
    is true</p><p>EV2 &gt; VehicleCapabilities &gt; "CHARGE_HISTORY" is true</p>
  steps:
  - column_name: custom_steps
    id: 95859
    case_id: 62072
    text1: <p>1. Add a breakpoint to the NissanPayOrderHistory API</p><p>2. Tap Charge
      History card</p>
    text2: null
    text3: <p>1. NissanPayOrderHistory API is triggered and failed</p><p>2. User is
      navigated to the In-network tab</p><p>3. The 'Something Went Wrong' modal with
      the copy 'Sorry, something went wrong. Please try again.' and buttons 'Cancel'
      and 'Retry' is displayed</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95860
    case_id: 62072
    text1: <p>Tap the 'Cancel' button</p>
    text2: null
    text3: <p>1. The modal is dismissed</p><p>2. User remains on the In-network tab</p><p>3.
      The copy ' No Charge History' is displayed on the screen</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95861
    case_id: 62072
    text1: <p>Tap the 'Refresh' button</p>
    text2: null
    text3: <p>1. NissanPayOrderHistory API is triggered and failed</p><p>2. The 'Something
      Went Wrong' modal with the copy 'Sorry, something went wrong. Please try again.'
      and buttons 'Cancel' and 'Retry' is displayed</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95862
    case_id: 62072
    text1: <p>Tap the 'Retry' button</p>
    text2: null
    text3: <p>The NissanPayOrderHistory API is triggered again</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95866
    case_id: 62072
    text1: <p>Tap 'Execute' to return the data for the NissanPayOrderHistory API response</p>
    text2: null
    text3: <p>UI shows the correct data according to the  returned NissanPayOrderHistory
      API response</p>
    text4: null
    display_order: 5
