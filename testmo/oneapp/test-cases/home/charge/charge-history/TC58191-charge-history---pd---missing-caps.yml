description: https://app.clickup.com/t/86b63902yhttps://app.clickup.com/t/86b66c5h9
preconditions:
- description: User is a PD and has an EV/EV2
- description: None of the FF is checked
- description: User is on the Manage EV screen > Charge History card is in the enabled
    state (it should always be enabled for PD)
- description: EV > VehicleCapabilities > "DRIVING_ANALYSIS" is missing
- description: EV2 > VehicleCapabilities > "CHARGE_HISTORY" is missing
steps:
- id: 1
  action: Tap Charge History card
  expected: NissanPayOrderHistory API is triggered | User is navigated to the Charge
    History screen, and there is no capability check before proceeding there | All
    Sessions and In-network tabs are not displayed
