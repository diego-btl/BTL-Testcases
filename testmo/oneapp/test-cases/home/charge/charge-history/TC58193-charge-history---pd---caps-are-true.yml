  testmo_id: 58193
  folder_id: 2443
description: https://app.clickup.com/t/86b63902yhttps://app.clickup.com/t/86b66c5h9
preconditions:
- description: User is a PD and has an EV/EV2
- description: None of the FF is checked
- description: User is on the Manage EV screen > Charge History card is in the enabled
    state (it should always be enabled for PD)
- description: EV > VehicleCapabilities > "DRIVING_ANALYSIS" is true
- description: EV2 > VehicleCapabilities > "CHARGE_HISTORY" is true
steps:
- id: 1
  action: Tap Charge History card
  expected: NissanPayOrderHistory API is triggered | User is navigated to the In-network
    tab | All Sessions tab is in the enabled state
- id: 2
  action: Tap the "Refresh" button in the top right corner of the screen
  expected: NissanPayOrderHistory API is triggered | The loading state is displayed
- id: 3
  action: Tap the enabled "All Sessions" tab
  expected: The VehicleChargeHistory API is triggered | User is navigated to the All
    Sessions tab
- id: 4
  action: Tap the "Refresh" button in the top right corner of the screen
  expected: The VehicleChargeHistory API is triggered | The loading state is displayed
