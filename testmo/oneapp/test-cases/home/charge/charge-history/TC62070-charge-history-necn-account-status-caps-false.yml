metadata:
  name: Charge History - NECN Account Status - Caps FALSE
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>User has EV2 or EV1</p><p>EV &gt; VehicleCapabilities &gt; "DRIVING_ANALYSIS"
    is FALSE</p><p>EV2 &gt; VehicleCapabilities &gt; "CHARGE_HISTORY" is FALSE<br
    /><br />User is a PRIMARY_DRIVER</p><p>User is on the Manage EV screen</p>
  steps:
  - column_name: custom_steps
    id: 95826
    case_id: 62070
    text1: "<p>1. Mock AccountStatus &gt; \"status\" =! \"ACTIVE\" (FAILED/INACTIVE/CANCELLED/CLOSED/ENROLLING/NOT_ENROLLED)</p><p>2.\
      \ Tap the 'Charge History' card </p><p>3. NissanPayOrderHistory API returns\
      \ an empty response</p><pre><code class=\"editor-plain language-plain code-block\"\
      >{\n  \"data\": {\n    \"nissanPay\": {\n      \"__typename\": \"NissanPay\"\
      ,\n      \"orderHistory\": {\n        \"__typename\": \"NissanPayOrderHistoryResponse\"\
      ,\n        \"items\": [],\n        \"pagination\": {\n          \"__typename\"\
      : \"NissanPayOrderHistoryPagination\",\n          \"nextPageCursor\": null,\n\
      \          \"totalSize\": 0\n        }\n      }\n    }\n  }\n}</code></pre>"
    text2: null
    text3: <p>1. User should be navigated to the 'In-network' tab  with a dialog:</p><p><code><strong>NISSAN
      ENERGY Charge Network</strong></code></p><p><code>Activate the NISSAN ENERGY
      Charge Network today for access to Nissan's in-network charging partners.</code></p><p>2.
      The 'Start Activation' CTA is enabled</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95827
    case_id: 62070
    text1: <p>Tap the 'Start Activation' CTA</p>
    text2: null
    text3: <p>User is redirected to the NECN screen</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95828
    case_id: 62070
    text1: <p>1. Tap the 'All Sessions' tab, which is displayed in a disabled state</p>
    text2: null
    text3: <p>1. VehicleChargeHistory API is not triggered</p><p>2. The 'Account Expired'
      modal with the copy 'If you feel is an error, please use the call button to
      speak with an agent' and buttons 'Cancel' and 'Call' is displayed</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95841
    case_id: 62070
    text1: <p>Tap the 'Cancel' button</p>
    text2: null
    text3: <p>1. The modal is dismissed</p><p>2. User remains on the same 'In-network'
      tab</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95842
    case_id: 62070
    text1: <p>1. Tap the 'All Sessions' tab again</p><p>2. Tap the 'Call' button in
      the Account Expired modal </p>
    text2: null
    text3: <p>The <strong>customerCare</strong> phone number from the ContactUs API
      response is populated</p>
    text4: null
