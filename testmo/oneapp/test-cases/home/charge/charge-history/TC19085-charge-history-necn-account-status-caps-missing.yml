test_case:
  preconditions: <p>User has EV2 or EV1</p><p>EV &gt; VehicleCapabilities &gt; "DRIVING_ANALYSIS"
    is missing</p><p>EV2 &gt; VehicleCapabilities &gt; "CHARGE_HISTORY" is missing<br
    /><br />User is a PRIMARY_DRIVER</p><p>User is on the Manage EV screen</p>
  steps:
  - column_name: custom_steps
    id: 27481
    case_id: 19085
    text1: "<p>1. Mock AccountStatus &gt; \"status\" =! \"ACTIVE\" (FAILED/INACTIVE/CANCELLED/CLOSED/ENROLLING/NOT_ENROLLED)</p><p>2.\
      \ Tap the 'Charge History' card </p><p>3. NissanPayOrderHistory API returns\
      \ an empty response</p><pre><code class=\"editor-plain language-plain code-block\"\
      >{\n  \"data\": {\n    \"nissanPay\": {\n      \"__typename\": \"NissanPay\"\
      ,\n      \"orderHistory\": {\n        \"__typename\": \"NissanPayOrderHistoryResponse\"\
      ,\n        \"items\": [],\n        \"pagination\": {\n          \"__typename\"\
      : \"NissanPayOrderHistoryPagination\",\n          \"nextPageCursor\": null,\n\
      \          \"totalSize\": 0\n        }\n      }\n    }\n  }\n}</code></pre>"
    text2: null
    text3: <p>1. User should see the 'Charge History' screen  with a dialog:</p><p><code><strong>NISSAN
      ENERGY Charge Network</strong></code></p><p><code>Activate the NISSAN ENERGY
      Charge Network today for access to Nissan's in-network charging partners.</code></p><p>2.
      The 'Start Activation' CTA is enabled</p>
    text4: null
    display_order: 1
