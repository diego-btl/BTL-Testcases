metadata:
  id: TC62073
  name: Charge History - VehicleChargeHistory API fails
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-02'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 66175
  folder_id: 2443
preconditions:
- description: User is a PD and has an EV/EV2
- description: None of the FF is checked
- description: User is on the Manage EV screen > Charge History card is in the enabled
    state (it should always be enabled for PD)
- description: EV > VehicleCapabilities > "DRIVING_ANALYSIS" is true
- description: EV2 > VehicleCapabilities > "CHARGE_HISTORY" is true
- description: The app is fresh installed
steps:
- id: 1
  action: User is on the 'In-network' tab -> Add a breakpoint to the VehicleChargeHistory
    API -> Tap the 'All Sessions' tab
  expected: VehicleChargeHistory API is triggered and failed | User is navigated to
    the All Sessions tab | The 'Something Went Wrong' modal with the copy 'Sorry,
    something went wrong. Please try again.' and buttons 'Cancel' and 'Retry' is displayed
- id: 2
  action: Tap the 'Cancel' button
  expected: The modal is dismissed | User remains on the In-network tab | The copy
    ' No Charge History' is displayed on the screen
- id: 3
  action: Tap the 'Refresh' button
  expected: VehicleChargeHistory API is triggered and failed | The 'Something Went
    Wrong' modal with the copy 'Sorry, something went wrong. Please try again.' and
    buttons 'Cancel' and 'Retry' is displayed
- id: 4
  action: Tap the 'Retry' button
  expected: The VehicleChargeHistory API is triggered again
- id: 5
  action: Tap 'Execute' to return the data for the VehicleChargeHistory API response
  expected: UI shows the correct data according to the returned VehicleChargeHistory
    API response
- id: 6
  action: Navigate to the In-network tab and return to the All Sessions tab
  expected: VehicleChargeHistory API is not triggered | The previously cached data
    is displayed
