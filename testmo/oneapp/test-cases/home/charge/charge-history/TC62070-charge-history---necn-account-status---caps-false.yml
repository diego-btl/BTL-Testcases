metadata:
  id: TC62070
  name: Charge History - NECN Account Status - Caps FALSE
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-02'
  updated: '2025-12-03'
  author: user_25
  testmo_id: 62070
  folder_id: 2443
preconditions:
- description: User has EV2 or EV1
- description: EV > VehicleCapabilities > "DRIVING_ANALYSIS" is FALSE
- description: EV2 > VehicleCapabilities > "CHARGE_HISTORY" is FALSEUser is a PRIMARY_DRIVER
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Mock AccountStatus > "status" =! "ACTIVE" (FAILED/INACTIVE/CANCELLED/CLOSED/ENROLLING/NOT_ENROLLED)
    -> Tap the 'Charge History' card -> NissanPayOrderHistory API returns an empty
    response
  expected: 'User should be navigated to the ''In-network'' tab with a dialog: | NISSAN
    ENERGY Charge Network | Activate the NISSAN ENERGY Charge Network today for access
    to Nissan''s in-network charging partners. | The ''Start Activation'' CTA is enabled'
- id: 2
  action: Tap the 'Start Activation' CTA
  expected: User is redirected to the NECN screen
- id: 3
  action: Tap the 'All Sessions' tab, which is displayed in a disabled state
  expected: VehicleChargeHistory API is not triggered | The 'Account Expired' modal
    with the copy 'If you feel is an error, please use the call button to speak with
    an agent' and buttons 'Cancel' and 'Call' is displayed
- id: 4
  action: Tap the 'Cancel' button
  expected: The modal is dismissed | User remains on the same 'In-network' tab
- id: 5
  action: Tap the 'All Sessions' tab again -> Tap the 'Call' button in the Account
    Expired modal
  expected: The customerCare phone number from the ContactUs API response is populated
- id: 6
  action: Tap the 'Charge History' card -> NissanPayOrderHistory API returns some
    data in the response
  expected: User should see the 'In-network' tab with data correlated to the NissanPayOrderHistory
    API response | The 'Start Activation' CTA is hidden
- id: 7
  action: Tap the 'See More' dropdown
  expected: The 'See More' section is expanded, showing the details for the particular
    NissanPayEnergyChargeSession | The 'See More' button is replaced with the 'See
    Less'
- id: 8
  action: Tap the 'See Less' dropdown
  expected: The section should be collapsed | The 'See Less' button is replaced with
    the 'See More'
- id: 9
  action: Mock AccountStatus > "status" = "ACTIVE" -> Tap the 'Charge History' card
    -> NissanPayOrderHistory API returns an empty response
  expected: The user should see the Charge History card with the dialog 'No Charge
    History' | The 'Start Activation' CTA is hidden
- id: 10
  action: Tap the 'Refresh' button
  expected: NissanPayOrderHistory API is triggered | The loading state is displayed
    | The data on the screen correlates with the NissanPayOrderHistory API response
