metadata:
  id: TC58192
  name: Charge History - PD - Caps are false
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-08-19'
  updated: '2025-12-02'
  author: user_25
  testmo_id: 66177
  folder_id: 2443
description: https://app.clickup.com/t/86b63902yhttps://app.clickup.com/t/86b66c5h9
preconditions:
- description: User is a PD and has an EV/EV2
- description: None of the FF is checked
- description: User is on the Manage EV screen > Charge History card is in the enabled
    state (it should always be enabled for PD)
- description: EV > VehicleCapabilities > "DRIVING_ANALYSIS" is false
- description: EV2 > VehicleCapabilities > "CHARGE_HISTORY" is false
steps:
- id: 1
  action: Tap Charge History card
  expected: NissanPayOrderHistory API is triggered | User is navigated to the In-network
    tab | All Sessions tab is in a disabled state
- id: 2
  action: Tap the disabled "All Sessions" tab
  expected: The VehicleChargeHistory API is not triggered | The "Account Expired"
    modal with Cancel/Call options is displayed
- id: 3
  action: Tap "Cancel" button
  expected: The modal is dismissed | User remains on the same In-network tab
- id: 4
  action: Tap "Call" button
  expected: The "customerCare" phone number (ContactUs API) should be populated
