metadata:
  id: TC62010
  name: Charge Schedule - No Schedule
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 62010
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: User is on the Charge screen
steps:
- id: 1
  action: Tap the 'Manage EV' CTA
  expected: VehicleChargeSchedules API is triggered | User is navigated to the Manage
    EV screen
- id: 2
  action: VehicleChargeSchedules API returns an empty response
  expected: The 'Scheduled' card is displayed with an enabled Add button, and a placeholder
    copy is 'No Charge Schedule'
- id: 3
  action: Tap the 'Add' button
  expected: User is redirected to the Charge Schedule screen
