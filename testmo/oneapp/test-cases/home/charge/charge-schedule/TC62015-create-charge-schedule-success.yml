metadata:
  name: Create Charge Schedule - Success
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <p>User has an EV/EV2</p><p>User is on the Manage EV screen </p><p>There're
    0, 1 or 2 charge schedules created</p>
  steps:
  - column_name: custom_steps
    id: 95619
    case_id: 62015
    text1: <p>Tap the 'Add' button on the 'Scheduled' card</p>
    text2: null
    text3: <p>User is redirected to the Charge Schedule screen</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95620
    case_id: 62015
    text1: <p>Set the Start Time, End Time from the dropdowns</p>
    text2: null
    text3: <p>1. Selected time is displayed in the Start Time and End Time fields</p><p>2.
      The 'CREATE SCHEDULE' CTA is disabled</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95621
    case_id: 62015
    text1: <p>Set the day/days for the charge schedule, selecting any option in the
      Quick Option or Days of the Week sections </p>
    text2: null
    text3: <p>1. The particular button/buttons get selected</p><p>2. The 'CREATE SCHEDULE'
      CTA gets enabled</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95622
    case_id: 62015
    text1: <p>Tap the 'CREATE SCHEDULE' CTA</p>
    text2: null
    text3: '<p>1. The CreateChargeSchedule API is triggered, sending selected parameters
      in the request</p><p>2. The CheckChargeServiceRequest starts polling; the last
      API returns "status": "SUCCESS"</p><p>3. User is redirected to the Manage EV
      screen, and the success toast ''Charge schedule created'' is displayed</p><p>4.
      The created schedule is displayed inside the Scheduled card with the toggle
      enabled</p><p>5. The VehicleChargeSchedules API is triggered, returning the
      updated response</p>'
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95626
    case_id: 62015
    text1: <p>Tap the created schedule inside the Scheduled card</p>
    text2: null
    text3: <p>1. User is redirected to the Charge Schedule screen</p><p>2. Parameters
      are set according to the VehicleChargeSchedules API response</p><p>3. The 'CREATE
      SCHEDULE' CTA is hidden; the 'SAVE SCHEDULE' CTA (disabled) and the 'DELETE
      SCHEDULE' button (enabled) are displayed </p>
    text4: null
    display_order: 5
