  tags: []
test_case:
  preconditions: <p>User has an EV/EV2</p><p>At least 1 charge schedule exists with
    the toggle in enabled state</p><p>User is on the Manage EV screen </p>
  steps:
  - column_name: custom_steps
    id: 95696
    case_id: 62029
    text1: <p>Tap the toggle OFF for one of the created charge schedule</p>
    text2: null
    text3: '<p>1. The ToggleChargeSchedule API is triggered, sending <strong>"enable":
      false</strong> in the request</p><p>2. The CheckChargeServiceRequest starts
      polling, returning "status": "PENDING"</p><p>3. The loading state with the Charge
      icon is displayed</p><p>4. The DeleteChargeSchedule API is triggered</p><p>5.
      The CheckChargeServiceRequest starts polling, returning "status": "PENDING"</p><p>6.
      The loading state with the Charge icon is displayed</p><p>7. The toasts are
      displayed in the following order:<br />- ''Contacting &lt;year model&gt; to
      toggle charge schedule...''<br />- ''Waking &lt;year model&gt; to toggle charge
      schedule...''<br />- ''Initiating toggle charge schedule on &lt;year model&gt;...''</p>'
    text4: null
    display_order: 1
