metadata:
  id: TC62012
  name: Create Charge Schedule - Set Parameters
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 66252
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: User is on the Manage EV screen
- description: There're 0, 1 or 2 charge schedules created
steps:
- id: 1
  action: Tap the 'Add' button on the 'Scheduled' card
  expected: User is redirected to the Charge Schedule screen
- id: 2
  action: Tap the 'Start Time' dropdown
  expected: The dropdown with the selected current time is displayed
- id: 3
  action: Tap outside the dropdown (iOS) or 'OK' button (Android)
  expected: The dropdown is hidden, the time is shown in the 'Start Time' field |
    Note on Android selected time is displayed in both 'Start Time' and 'End Time'
    fields
- id: 4
  action: Tap the 'End Time' dropdown
  expected: The dropdown showing the current time is displayed.
- id: 5
  action: Select time and tap outside the dropdown (iOS) or 'OK' button (Android)
  expected: The dropdown is hidden, the time is shown in the 'End Time' field
- id: 6
  action: In the 'Quick Options' section, tap any of the buttons
  expected: The button is in the selected state | 'Days of the Week' buttons get selected
    accordingly | 'CREATE SCHEDULE' CTA gets enabled
- id: 7
  action: Tap the selected button in the 'Quick Options' section
  expected: The button returns to the previous non-selected state | 'Days of the Week'
    buttons return to the previous non-selected state | 'CREATE SCHEDULE' CTA gets
    disabled
- id: 8
  action: Tap the 'M' (Monday) button in the 'Days of the Week' section
  expected: The button is in the selected state | 'Quick Option' buttons are not selected
    | 'CREATE SCHEDULE' CTA gets enabled
- id: 9
  action: Tap the selected 'M' (Monday) button in the 'Days of the Week' section
  expected: The button returns to the previous non-selected state | 'CREATE SCHEDULE'
    CTA gets disabled
- id: 10
  action: Tap the 'Su' and 'Sa' buttons in the 'Days of the Week' section
  expected: The buttons are in the selected state | The 'Weekends' button gets selected
    in the 'Quick Options' section | 'CREATE SCHEDULE' CTA gets enabled
- id: 11
  action: Tap the 'Su' selected button
  expected: The 'Su' button gets non-selected | The 'Sa' button remains selected |
    The 'Weekends button' returns to the previous non-selected state | 'CREATE SCHEDULE'
    CTA remains enabled
- id: 12
  action: Tap the 'Sa' button
  expected: Both the 'Sa' and 'CREATE SCHEDULE' gets non-selected
- id: 13
  action: Tap the 'Every Day' button in the 'Quick Option' section
  expected: The 'Every Day' button gets selected | All the buttons in the 'Days of
    the Week' section are selected | 'CREATE SCHEDULE' CTA gets enabled
- id: 14
  action: Tap the selected 'Every Day' button in the 'Quick Option' section
  expected: The 'Every Day' button gets non-selected | All the buttons in the 'Days
    of the Week' return to the previous state | 'CREATE SCHEDULE' CTA gets disabled
- id: 15
  action: Tap all the buttons in the 'Days of the Week' section
  expected: All the buttons gets selected | The 'Every Day' button gets selected |
    'CREATE SCHEDULE' CTA gets enabled
- id: 16
  action: Tap the 'Weekdays' button
  expected: The 'Weekdays' button gets selected | The 'Every Day', 'Su', 'Sa' buttons
    get non-selected | 'CREATE SCHEDULE' CTA remains enabled
- id: 17
  action: Tap the 'Weekends' button
  expected: The 'Weekends', 'Su', 'Sa' button gets selected | The 'Weekdays', 'M',
    'Tu'. 'W', 'Th', 'Fr' buttons get non-selected | 'CREATE SCHEDULE' CTA remains
    enabled
