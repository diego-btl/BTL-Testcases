      The toasts are displayed in the following order:<br />- ''Contacting &lt;year
      model&gt; to toggle charge schedule...''<br />- ''Waking &lt;year model&gt;
      to toggle charge schedule...''<br />- ''Initiating toggle charge schedule on
      &lt;year model&gt;...''</p>'
