metadata:
  id: TC62023
  name: Charge Schedule - Max number reached
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 66263
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: User is on the Charge screen
steps:
- id: 1
  action: Tap the 'Manage EV' CTA
  expected: VehicleChargeSchedules API is triggered | User is navigated to the Manage
    EV screen
- id: 2
  action: VehicleChargeSchedules API returns a response with 3 charge schedules
  expected: All 3 schedules are displayed inside the 'Scheduled' card on the Manage
    EV screen | The 'Add' button is disabled
- id: 3
  action: Tap any created Charge Schedules inside the 'Scheduled' card
  expected: User is redirected to the Charge Schedule screen
- id: 4
  action: Tap the 'DELETE SCHEDULE' button
  expected: The 'Delete Schedule?' modal with 'No' and 'Yes' buttons, and the copy
    'Are you sure you want to delete this charging schedule? This action cannot be
    undone' is displayed
- id: 5
  action: Tap the 'Yes' button
  expected: 'The DeleteChargeSchedule API is triggered | The CheckChargeServiceRequest
    starts polling, returning "status": "SUCCESS" | User is redirected to the Manage
    EV screen, and the success toast ''Charge schedule deleted'' is displayed | The
    deleted schedule is not shown inside the Scheduled card | The VehicleChargeSchedules
    API is triggered, returning the updated response | The ''Add'' button gets enabled'
- id: 6
  action: Tap the 'Add' button
  expected: User is redirected to the Charge Schedule screen
