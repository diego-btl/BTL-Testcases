  - column_name: custom_steps
    id: 95670
    case_id: 62023
    text1: "<p>1. VehicleChargeSchedules API returns a response with 3 charge schedules</p><pre><code\
      \ class=\"editor-plain language-plain code-block\">{\n  \"data\": {\n    \"\
      vehicle\": {\n      \"__typename\": \"ElectricVehicle\",\n      \"chargeSchedules\"\
      : [\n        {\n          \"__typename\": \"ChargeSchedule\",\n          \"\
      id\": \"1\",\n          \"state\": \"ON\",\n          \"startDateTime\": \"\
      2020-01-01T00:13:00.000Z\",\n          \"duration\": \"PT9H\",\n          \"\
      weekDays\": [\n            \"SU\",\n            \"SA\"\n          ]\n      \
      \  },\n        {\n          \"__typename\": \"ChargeSchedule\",\n          \"\
      id\": \"2\",\n          \"state\": \"ON\",\n          \"startDateTime\": \"\
      2020-01-01T20:16:00.000Z\",\n          \"duration\": \"PT4H\",\n          \"\
      weekDays\": [\n            \"SU\",\n            \"MO\",\n            \"TU\"\
      ,\n            \"WE\",\n            \"TH\",\n            \"FR\",\n         \
      \   \"SA\"\n          ]\n        },\n        {\n          \"__typename\": \"\
      ChargeSchedule\",\n          \"id\": \"3\",\n          \"state\": \"ON\",\n\
      \          \"startDateTime\": \"2020-01-01T23:18:00.000Z\",\n          \"duration\"\
      : \"PT24H\",\n          \"weekDays\": [\n            \"MO\",\n            \"\
      TU\",\n            \"WE\",\n            \"TH\",\n            \"FR\"\n      \
      \    ]\n        }\n      ]\n    }\n  }\n}</code></pre>"
    text2: null
    text3: <p>2. All 3 schedules are displayed inside the 'Scheduled' card on the
      Manage EV screen</p><p>3. The 'Add' button is disabled</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95671
    case_id: 62023
    text1: <p>Tap any created Charge Schedules inside the 'Scheduled' card</p>
    text2: null
    text3: <p>User is redirected to the Charge Schedule screen</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95672
    case_id: 62023
    text1: <p>Tap the 'DELETE SCHEDULE' button</p>
    text2: null
    text3: <p>The 'Delete Schedule?' modal with 'No' and 'Yes' buttons, and the copy
      'Are you sure you want to delete this charging schedule? This action cannot
      be undone' is displayed</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95673
    case_id: 62023
    text1: <p>Tap the 'Yes' button</p>
    text2: null
    text3: '<p>1. The DeleteChargeSchedule API is triggered</p><p>2. The CheckChargeServiceRequest
      starts polling, returning "status": "SUCCESS"</p><p>3. User is redirected to
      the Manage EV screen, and the success toast ''Charge schedule deleted'' is displayed</p><p>4.
      The deleted schedule is not shown inside the Scheduled card</p><p>5. The VehicleChargeSchedules
      API is triggered, returning the updated response</p><p>6. The ''Add'' button
      gets enabled</p>'
    text4: null
    display_order: 5
