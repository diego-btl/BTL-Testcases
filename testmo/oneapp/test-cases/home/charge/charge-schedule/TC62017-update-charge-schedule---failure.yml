metadata:
  id: TC62017
  name: Update Charge Schedule - Failure
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 62017
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: At least 1 charge schedule exists
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the created schedule inside the Scheduled card
  expected: User is redirected to the Charge Schedule screen
- id: 2
  action: Modify any of the set parameters (Start Time, End Time, Quick Options, Days
    of the Week)
  expected: Parameters are updated | The 'SAVE SCHEDULE' CTA gets enabled
- id: 3
  action: Tap the 'SAVE SCHEDULE' CTA
  expected: 'The UpdateChargeSchedule API is triggered, sending selected parameters
    in the request | The CheckChargeServiceRequest starts polling; the last API returns
    "status": "FAILED" | The failure toast ''Charge schedule failed to update'' is
    displayed | The ''SAVE SCHEDULE'' CTA remains enabled'
