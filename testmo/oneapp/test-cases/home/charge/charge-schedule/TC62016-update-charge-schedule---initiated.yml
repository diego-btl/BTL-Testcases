metadata:
  id: TC62016
  name: Update Charge Schedule - Initiated
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 66269
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: At least 1 charge schedule exists
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the created schedule inside the Scheduled card
  expected: User is redirected to the Charge Schedule screen
- id: 2
  action: Modify any of the set parameters (Start Time, End Time, Quick Options, Days
    of the Week)
  expected: Parameters are updated | The 'SAVE SCHEDULE' CTA gets enabled
- id: 3
  action: Tap the 'SAVE SCHEDULE' CTA
  expected: 'The UpdateChargeSchedule API is triggered, sending selected parameters
    in the request | The CheckChargeServiceRequest starts polling, returning "status":
    "PENDING" | The loading state with the Charge icon is displayed | The toasts are
    displayed in the following order:- ''Contacting <year model> to update charge
    schedule...''- ''Waking <year model> to update charge schedule...''- ''Initiating
    update charge schedule on <year model>...'''
