preconditions:
- description: User has an EV/EV2
- description: At least 1 charge schedule exists with the toggle in disabled state
- description: User is on the Manage EV screen
steps:
- id: 1
  action: Tap the toggle ON for one of the created charge schedule
  expected: 'The ToggleChargeSchedule API is triggered, sending "enable": true in
    the request | The CheckChargeServiceRequest starts polling, returning "status":
    "SUCCESS" | The success toast ''Charge schedule toggled'' is displayed | The toggle
    state is enabled'
