metadata:
  id: TC62015
  name: Create Charge Schedule - Success
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-21'
  updated: '2025-11-21'
  author: user_25
  testmo_id: 66257
  folder_id: 6781
preconditions:
- description: User has an EV/EV2
- description: User is on the Manage EV screen
- description: There're 0, 1 or 2 charge schedules created
steps:
- id: 1
  action: Tap the 'Add' button on the 'Scheduled' card
  expected: User is redirected to the Charge Schedule screen
- id: 2
  action: Set the Start Time, End Time from the dropdowns
  expected: Selected time is displayed in the Start Time and End Time fields | The
    'CREATE SCHEDULE' CTA is disabled
- id: 3
  action: Set the day/days for the charge schedule, selecting any option in the Quick
    Option or Days of the Week sections
  expected: The particular button/buttons get selected | The 'CREATE SCHEDULE' CTA
    gets enabled
- id: 4
  action: Tap the 'CREATE SCHEDULE' CTA
  expected: 'The CreateChargeSchedule API is triggered, sending selected parameters
    in the request | The CheckChargeServiceRequest starts polling; the last API returns
    "status": "SUCCESS" | User is redirected to the Manage EV screen, and the success
    toast ''Charge schedule created'' is displayed | The created schedule is displayed
    inside the Scheduled card with the toggle enabled | The VehicleChargeSchedules
    API is triggered, returning the updated response'
- id: 5
  action: Tap the created schedule inside the Scheduled card
  expected: User is redirected to the Charge Schedule screen | Parameters are set
    according to the VehicleChargeSchedules API response | The 'CREATE SCHEDULE' CTA
    is hidden; the 'SAVE SCHEDULE' CTA (disabled) and the 'DELETE SCHEDULE' button
    (enabled) are displayed
