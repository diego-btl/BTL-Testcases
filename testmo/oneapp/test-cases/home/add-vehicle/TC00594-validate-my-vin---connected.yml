metadata:
  id: TC00594
  name: Validate My Vin - Connected
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2025-09-19'
  author: user_2
  testmo_id: 594
  folder_id: 56
description: 'If we validate this flow by removing/adding the vehicle to the account
  (Frontier for ex.) > notify the team in #proj-oneapp-qa and send Victor information
  about the VIN, Case ID and email, so he''ll be able to tell Nissan and add the vehicle
  to the account'
preconditions:
- description: User is already in the Add Vehicle Page
- description: User has already entered a valid VIN for a connected vehicle that has
    not been previously added to the account
steps:
- id: 1
  action: Tap the VALIDATE VIN button
  expected: User should see the Terms and Conditions screen for connected vehicles
    and SAVE should be disabled
- id: 2
  action: Scroll through the Terms and Conditions, select a phone number and tap on
    any link
  expected: Selecting the phone number should trigger the phone call action or showing
    the call action on a modal, depending on the OS | Tapping on any link should open
    the link on an external web browser
- id: 3
  action: Select and deselect the Connected Vehicle Terms & Conditions checkbox
  expected: The SAVE button should be enabled / disabled
- id: 4
  action: Tap the SAVE button
  expected: After a short loading indicator, a Vin Validated modal should be displayed
- id: 5
  action: Tap the OK button on the modal
  expected: The user should be driven to the Upload Ownership Documents page
