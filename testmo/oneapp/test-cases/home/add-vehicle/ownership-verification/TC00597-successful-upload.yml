preconditions:
- description: User is on the Upload Ownership Documents page
steps:
- id: 1
  action: Use any of the options (Take a Picture, Select an Image, Select a File)
    to select a file
  expected: The No Selected File label should be updated to display the file selected,
    including a checkmark | The UPLOAD button should be enabled
- id: 2
  action: Tap on the UPLOAD button
  expected: The user should be driven to a Proof of Ownership Submitted page | The
    page shows a big green checkmark and information about the case number
