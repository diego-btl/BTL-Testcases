metadata:
  id: TC01491
  name: Denied Camera Permissions
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-28'
  updated: '2025-10-09'
  author: user_2
  testmo_id: 65837
  folder_id: 56
description: Verify that if device does not have camera permissions then when user
  tries to take a picture a modal is displayed to turn-on on device Settings.
preconditions:
- description: User has denied camera permissions
steps:
- id: 1
  action: Tap camera field
  expected: 'Text: MyNISSAN would like to access the camera. Please enable your camera
    for this app in Settings. | Buttons: Ok | Button: Settings'
- id: 2
  action: Tap on Ok button
  expected: Modal is dismissed
- id: 3
  action: Tap on Settings
  expected: User is directed to device settings
