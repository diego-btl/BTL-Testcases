test_case:
  preconditions: <ul><li>User is already in the Add Vehicle Page</li><li>User has
    already entered a valid VIN for a connected vehicle that has not been previously
    added to the account</li></ul>
  steps:
  - column_name: custom_steps
    id: 763
    case_id: 594
    text1: <p>Tap the <code>VALIDATE VIN</code> button<br /> </p>
    text2: null
    text3: <p>User should see the Terms and Conditions screen for connected vehicles
      and <code>SAVE</code> should be disabled<br /> </p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 11659
    case_id: 594
    text1: <p>Scroll through the Terms and Conditions, select a phone number and tap
      on any link<br /> </p>
    text2: null
    text3: <p>Selecting the phone number should trigger the phone call action or showing
      the call action on a modal, depending on the OS</p><p>Tapping on any link should
      open the link on an external web browser<br /> </p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 11660
    case_id: 594
    text1: <p>Select and deselect the Connected Vehicle Terms &amp; Conditions checkbox<br
      /> </p>
    text2: null
    text3: <p>The <code>SAVE</code> button should be enabled / disabled</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 11661
    case_id: 594
    text1: <p>Tap the <code>SAVE</code> button</p>
    text2: null
    text3: <p>After a short loading indicator, a <code>Vin Validated</code> modal
      should be displayed</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 11662
    case_id: 594
    text1: <p>Tap the <code>OK</code> button on the modal</p>
    text2: null
    text3: <p>The user should be driven to the Upload Ownership Documents page</p>
    text4: null
    display_order: 5
  notes: <p>Only use the pathfinder and frontier accounts for add/remove vehicle</p>
