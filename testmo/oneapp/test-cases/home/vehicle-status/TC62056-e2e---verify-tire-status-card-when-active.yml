description: SCOPEWhen the Tire Pressure MIL is NOT active and there are tires where
  the tire pressure status is not zero (0 means OK), display the Tire Pressure status
  card for that tire in the Vehicle Status screen > Status tab (no changes to the
  card as it is currently displayed in the Status tab)Ensure Tire Pressure status
  cards causes Home tab to show Vehicle Status status card with icon on vehicle image
steps:
- id: 1
  action: Mock VehicleDynamicData only with TIRE_PRESSURE=false and ensure all tires
    have pressureStatus =! 0 > Call VehicleDynamicData api > go to Home screen
  expected: Vehicle Status card appears below Quick Actions. | The subtitle shows
    "Tire Pressure, +3 more". | Red exclamation icon appears over the vehicle hero
    image.
- id: 2
  action: Tab on Vehicle Status card
  expected: Tire Status card is displayed in the Vehicle tab and follows the order:Front
    driver | Front passenger | Rear driver | Rear passenger
- id: 3
  action: Mock VehicleDynamicData only with TIRE_PRESSURE=false and ensure all tires
    have pressureStatus == 0 > Call VehicleDynamicData api
  expected: Vehicle Status card is not shown.
