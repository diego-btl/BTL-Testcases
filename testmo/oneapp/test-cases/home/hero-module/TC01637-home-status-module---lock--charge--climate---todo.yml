steps:
- id: 1
  action: 'GIVEN: the user is on the Home screenWHEN: only lock status & weather are
    showing'
  expected: 'THEN: the user should see the "Locked/Unlocked" verbiage next to the
    icon'
- id: 2
  action: 'IF: there is a charge or climate status icon also present (but not both)'
  expected: 'THEN: the user should not see the weather status at allAND: they should
    still see the "Locked/Unlocked" verbiage next to the lock status icon'
- id: 3
  action: 'IF: all 3 statuses are present'
  expected: 'THEN: the user should not see the weather status at allAND: they should
    only see the lock status icon without the verbiage next to it'
