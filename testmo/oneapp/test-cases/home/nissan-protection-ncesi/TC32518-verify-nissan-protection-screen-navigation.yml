metadata:
  id: TC32518
  name: Verify Nissan Protection screen navigation
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-04'
  updated: '2025-04-05'
  author: user_15
  testmo_id: 65992
  folder_id: 4079
description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Navigate
  user to Vehicle Protection Screen Overview- 2/18ANDROID[NCESI] Navigate user to
  Vehicle Protection Screen Overview- 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: true'
- description: Mock GetServiceContract response (use attached mocks ENG/FR in case
    needed)
steps:
- id: 1
  action: Use mock provided > Login to app > Go to Nissan Protection card
  expected: Verify there is a call trigger for GetServiceContract API for the selected
    VIN and a loading icon is displayed in the screen until a response is retrieved.
- id: 2
  action: Go to Service Contract Section
  expected: 'Status: Displayed in hierarchal orderActive => Expiring Soon => Expired
    => Cancelled | coverageName: Name of the plan | coverage: This will affect the
    icon displayed for each plan.For Nissan:(English acronyms on the left, FR equivalent
    on the right)CPO = VOC | PMP = PEP | ASP = PSP | For Infiniti:(English acronyms
    on the left, FR equivalent on the right)[Nissan’s ASP] IPP = PPI | CPO = VOC |
    PMP = PEP'
- id: 3
  action: Go to Basic Coverage section
  expected: Only months are displayed (no mileage should be shown) | Flat tires, Dead
    battery, Low fuel, and locked out buttons are present.
- id: 4
  action: Background/foreground the app
  expected: Verify GetServiceContract API is not called again
- id: 5
  action: Cold start the app
  expected: Verify there is a call for GetServiceContract API for the selected VIN
- id: 6
  action: Change vehicles > Tap Nissan Protection card
  expected: Verify GetServiceContract API is called again for the selected VIN
- id: 7
  action: Mock GetServiceContract API to fail
  expected: Verify the app displays empty state
