metadata:
  id: TC61898
  name: Verify "powered by Co-operators" card branding
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-29'
  updated: '2025-10-29'
  author: user_6
  testmo_id: 61898
  folder_id: 6759
description: This test case is to verify the branding for Infiniti and Nissan NCI
preconditions:
- description: User is on the Nissan Protection Screen
- description: User has a valid province in VehicleStaticData that is returned in
    the feature flag
steps:
- id: 1
  action: Launch the MyINFINITI app and enter the INFINITI protection screen
  expected: User should see the card with the copy Insure my INFINITI powered by Co-operators
- id: 2
  action: Tap on the card
  expected: All brandings should be for INFINITI
- id: 3
  action: Launch the MyNissan app and enter the Nissan Protection screen
  expected: User should see the Insure my Nissan powered by Co-operators card
- id: 4
  action: Tap on the card
  expected: All brandings should be for Nissan
