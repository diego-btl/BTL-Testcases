description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Allow user
  to view catalogue of plans - 2/18ANDROID[NCESI] Allow user to view catalogue of
  plans - 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: true'
- description: Mock GetServiceContract response (use attached mocks ENG/FR in case
    needed)
steps:
- id: 1
  action: Get into Nissan Protection screen > Tap on View all Nissan Protection Products
    > tap on any plan type (ASP, PMP, CPO) > Tap on Online button
  expected: Are you sure? | You are being redirected to Nissan's Buy Protection Plans
    portal. | Cancel and Continue buttons
- id: 2
  action: Tap con Cancel button
  expected: Verify app dismisses the modal
- id: 3
  action: Tap on Continue button
  expected: 'User is taken to a browser, The URL should be the one retrieved on ContactUs
    response:'
- id: 4
  action: Mocke ContactUs response to have
  expected: 'Verify user fallsback tho dame URL: https://www.mynissanprotection.ca/home'
