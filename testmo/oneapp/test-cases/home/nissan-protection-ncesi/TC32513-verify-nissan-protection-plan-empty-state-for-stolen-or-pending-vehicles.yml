metadata:
  id: TC32513
  name: Verify Nissan Protection Plan empty state for STOLEN or PENDING vehicles
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-04'
  updated: '2026-01-22'
  author: user_15
  testmo_id: 32513
  folder_id: 4079
description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Navigate
  user to Vehicle Protection Screen Overview- 2/18ANDROID[NCESI] Navigate user to
  Vehicle Protection Screen Overview- 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: true'
- description: Mock GetServiceContract response (use attached mocks ENG/FR)
steps:
- id: 1
  action: Use mock provided > Login to app > Go to Nissan Protection app
  expected: Verify there are plans showing
- id: 2
  action: Mock capabilities to show vehicle has STOLEN or PENDING > call capabilities
    again
  expected: Verify Nissan Protection card is displayed
- id: 3
  action: Tap on Nissan Protection
  expected: Display Vehicle Information section | Display Service Contracts section
    with View All Nissan Protection Products cta but not contracts | Display Basic
    Coverage section with mileage information | No call is triggered for GetServiceContract
    API
- id: 4
  action: Tap on View All Nissan Protection Products cta
  expected: Verify user can navigate to Plans and see the video without any problem
