metadata:
  id: TC62252
  name: My Photos Card - PD- Photo card Disabled
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-06'
  updated: '2026-01-19'
  author: user_25
  testmo_id: 62252
  folder_id: 3083
description: https://app.clickup.com/t/86b73mvju
preconditions:
- description: The user has a CCS2 - AVK2 Vehicle MY 26 or older OR MY27 and newer
- description: User is a PD
- description: VehicleCapabilities return REMOTE_PHOTOS_SHOCK and REMOTE_PHOTOS_COMMAND
steps:
- id: 1
  action: 'Mock VehicleCapabilities to return "enabled": false, "subscribed": false
    for both REMOTE_PHOTOS_SHOCK and REMOTE_PHOTOS_COMMAND services -> Navigate to
    the Home screen'
  expected: The 'My Photos' card is displayed on the Home screen in the disabled state
- id: 2
  action: Tap the card
  expected: The 'Account Expired' modal with 'Cancel' and 'Call' buttons is displayed
- id: 3
  action: Tap the 'Cancel' button
  expected: The modal is dismissed
- id: 4
  action: Tap the 'Call' button
  expected: The phone number is populated (ContactUs.customerCare)
- id: 5
  action: 'Mock VehicleCapabilities to return "enabled": true, "subscribed": null
    (or "enabled": false, "subscribed": null) for both REMOTE_PHOTOS_SHOCK and REMOTE_PHOTOS_COMMAND
    services -> Navigate to the Home screen'
  expected: The 'My Photos' card is displayed on the Home screen in the disabled state
- id: 6
  action: Tap the card
  expected: The 'Account Expired' modal with 'Cancel' and 'Call' buttons is displayed
- id: 7
  action: Tap the 'Cancel' button
  expected: The modal is dismissed
- id: 8
  action: Tap the 'Call' button
  expected: The phone number is populated (ContactUs.customerCare)
