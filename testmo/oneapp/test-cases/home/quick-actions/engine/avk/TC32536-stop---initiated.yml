preconditions:
- description: User is in the Home screen
- description: Engine has been turned on successfully
steps:
- id: 1
  action: User taps an Engine STOP button
  expected: 'AVK: "Are you sure? This action will remotely stop your vehicle." with
    two buttons "No" and "Yes"'
- id: 2
  action: User taps "No" button on confirmation modal
  expected: A modal is dismissed
- id: 3
  action: User taps an Engine STOP button again
  expected: 'AVK: "Are you sure? This action will remotely stop your vehicle." with
    two buttons "No" and "Yes"'
- id: 4
  action: User taps "Yes" button on confirmation modal
  expected: Contacting <year and model> to stop engine... | Initiating engine stop
    on <year and model>...
