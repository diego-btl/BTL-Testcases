steps:
- id: 1
  action: User taps an "Engine" button
  expected: 'AVK2: "Are you sure? This action will remotely start your vehicle and
    start your default climate settings. Would you like to proceed?" with two buttons
    "No" and "Yes"'
- id: 2
  action: User taps "No" on confirmation modal
  expected: A modal is dismissed
- id: 3
  action: User taps an "Engine" button again
  expected: 'AVK2: "Are you sure? This action will remotely start your vehicle and
    start your default climate settings. Would you like to proceed?" with two buttons
    "No" and "Yes"'
- id: 4
  action: User taps "Yes" on confirmation modal
  expected: Contacting <year and model> to start engine... | Waking <year and model>
    to start engine... | Initiating engine start on <year and model>...
