preconditions:
- description: User is on the Home screen
- description: User has sent a StopClimate request
steps:
- id: 1
  action: 'Climate off request has resolved into a failure -> CheckRemoteClimateRequest
    API: -> { -> "data": { -> "checkRemoteClimateRequest": { -> "__typename": "ServiceRequestResult",
    -> "status": "FAILED" -> } -> } -> }'
  expected: User should see a toast "<year and model> failed to turn off climate""Climate
    On" and "Climate Off" buttons are returned to the default stateUser should see
    the "Climate On" card with the secondary text "Warming/Cooling to <target temp>
    depending on what the target temp is compared to the interior temperature"
- id: 2
  action: 'Climate off request has resolved into a failure -> CheckRemoteClimateRequest
    API: -> { -> "data": { -> "checkRemoteClimateRequest": { -> "__typename": "ServiceRequestResult",
    -> "status": "SUCCESS" -> } -> } -> } -> VehicleClimateStatus API: -> { -> "data":
    { -> "vehicle": { -> "__typename": "ElectricVehicle", -> "climateStatus": { ->
    "__typename": "ClimateStatus", -> "state": "ON", -> "temperature": { -> "__typename":
    "Temperature", -> "value": 70, -> "unit": "FAHRENHEIT" -> } -> } -> } -> } ->
    }'
  expected: User should see a toast "<year and model> failed to turn off climate""Climate
    On" and "Climate Off" buttons are returned to the default state | "Climate On"
    card with secondary text is replaced with "Climate" card with 3 dots (...) while
    API is loadingUser should see the "Climate On" card with the secondary text "Warming/Cooling
    to <target temp> depending on what the target temp is compared to the interior
    temperature"
