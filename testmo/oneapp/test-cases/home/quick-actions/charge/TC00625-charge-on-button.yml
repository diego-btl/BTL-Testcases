preconditions:
- description: User has an EV
- description: User is on the Home screen
- description: 'Charge On button is in the Telematics row is in an inactive state
    (VehicleDynamicData API > "isPluggedIn": false)'
steps:
- id: 1
  action: User taps the Charge On button
  expected: The modal "Not Plugged In Please plug your vehicle in order to start charging."
    with Ok button is displayed
- id: 2
  action: User taps Ok button on the modal
  expected: Modal is dismissed
- id: 3
  action: 'Mock VehicleDynamicData API > "isPluggedIn": true'
  expected: The Charge On button is changed to an active state
