preconditions:
- description: User has sent a StartCharge request
steps:
- id: 1
  action: 'CheckChargeServiceRequest API > "status": "SUCCESS" -> VehicleBatteryStatus
    API response > "isPluggedIn": true, "isCharging": true)'
  expected: <year and model> charging.' (5 seconds)
- id: 2
  action: User taps Charge On button
  expected: Modal "Already Charging. Your vehicle is already charging" with Ok button
    is displayed
- id: 3
  action: User taps Ok button on the modal
  expected: Modal is dismissed
