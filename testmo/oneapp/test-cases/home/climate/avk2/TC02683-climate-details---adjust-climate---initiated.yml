steps:
- id: 1
  action: Modify any of the climate parameters (temperature, seat heating, steering
    wheel, defrost/deicer) -> Tap on the Apply Changes button
  expected: User should see text that climate has been changed and Apply Changes button
    appears | User should see Apply Changes button change to a disabled stateUser
    should see a toast message that transitions from (3 seconds each) for the first
    time:Contacting {vehicle model} to adjust climate... | Initiating climate adjustment...
    | Climate adjusted | Contacting {vehicle model} to adjust climate... | Climate
    adjusted
