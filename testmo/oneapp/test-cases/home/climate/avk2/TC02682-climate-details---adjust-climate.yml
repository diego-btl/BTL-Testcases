preconditions:
- description: 'Vehicle is AVK2Firebase flag is enabled:'
- description: '{ "entries": { "EnableAdjustClimate": "true" }, "appName": $app_name
    // Update To Proper App Name, "state": "UPDATE", "templateVersion": "118" }User
    is already on the Climate Details PageClimate is ON'
steps:
- id: 1
  action: 'Validate the firebase flag and set it to "EnableAdjustClimate": "false"
    -> Try to modify any of the climate parameters (temperature, seat heating, steering
    wheel, defrost/deicer)'
  expected: Dials are locked | Selectors are not clickable | There is no UPDATE BUTTON
    in the UI
- id: 2
  action: 'Close the app, modify the firebase flag and set it to "EnableAdjustClimate":
    "true" -> Turn Climate ON again and navigate to Climate Details Page -> Try to
    modify any of the climate parameters (temperature, seat heating, steering wheel,
    defrost/deicer)'
  expected: 'User should see text: "You made changes to your climate settings while
    climate is turned on. Would you like to apply these changes now?" | User should
    see an "Apply Changes" button appear'
