preconditions:
- description: AVK2 vehicleUser is on Home screen
steps:
- id: 1
  action: Mock ClimateDefaults to return null -> Tap on Climate card
  expected: User should see hardcoded temperature set to 75 (NNA) and all other present
    parameters set to OFFUser should see the Make Default button is disabled
- id: 2
  action: Tap on Climate card (without mocking ClimateDefaults)
  expected: User should see the corresponding states for HVAC parametersclimate -
    if this is null, temperature should also default to 75 (NNA) | defrostAndDeicerState
    | seatsClimate | steeringWheelHeaterState
- id: 3
  action: Mock ClimateDefaults so that any seatsClimate parameters are null -> Tap
    on Climate card
  expected: User should not see the affected parameter returning null
