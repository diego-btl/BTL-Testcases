preconditions:
- description: You have a delayed Climate Start card existing on Climate screen for
    EV2 vehicle
steps:
- id: 1
  action: Tap on Remove on the Delayed Climate start Card
  expected: you will see a modal Remove Delayed Start? Do you want to remove your
    delayed start? with Cancel and Remove options
- id: 2
  action: Tap on Remove
  expected: you see a loading indicator | User will be taken back to Climate screen
    and toast Delayed Start removed will show
