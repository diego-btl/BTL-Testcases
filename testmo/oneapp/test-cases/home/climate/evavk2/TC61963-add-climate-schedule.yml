  - column_name: custom_steps
    id: 95318
    case_id: 61963
    text1: <p>1. Tap on Add button<br />2. Fill in a departure time (at least 15 mins
      from now)<br />3. Tap on arrows or drag dial to change temperature. Temperature
      will show the internal temperature as default<br />4. Tap one of the quick options<br
      />5. Tap on days of the week<br />6. Tap to Create Schedule</p>
    text2: null
    text3: '<p>1. User should see Climate Schedule screen in the empty state, create
      button disabled<br />3. User should see in temperature between 61-98 (after
      98 it says hi) degrees<br />4. User should see the corresponding days of the
      week highlighted<br />5. User should see corresponding days of the week selected/unselected</p><p>6.
      User also sees Driver Seat, Front Passenger Seat with three options to choose:
      Off, Cool, Heat - one of them selected.</p><ul><li>Rear Left Seat, Rear Right
      Seat with Off and Heat options - one of them selected</li><li><p>Steering Wheel
      Heater and Defrost &amp; Deicer with off and on options - one of them selected</p><p><i>NOTE:
      All the settings above are the ones selected as Default settings. </i></p><p><i>(This
      section above may be removed from the app as making changes to it doesn''t affect
      anything)</i></p><p>7. User should see a loading spinner while schedule is being
      created<br />User should see all 3 messages Contacting, Waking, Inititating
      and success toast if schedule was created successfully<br />User should be returned
      to the Climate screen with newly added schedule shown with <i>toggle off </i><br
      /><br />Departure time, temperature, and days of the week are required fields</p></li></ul><p><br
      />Note: If create schedule fails, user should see a failure toast and remain
      on the Climate Schedule screen</p>'
    text4: null
    display_order: 1
