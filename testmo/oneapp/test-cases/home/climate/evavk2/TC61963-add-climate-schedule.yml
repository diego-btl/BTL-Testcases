steps:
- id: 1
  action: Tap on Add button2. Fill in a departure time (at least 15 mins from now)3.
    Tap on arrows or drag dial to change temperature. Temperature will show the internal
    temperature as default4. Tap one of the quick options5. Tap on days of the week6.
    Tap to Create Schedule
  expected: 'Rear Left Seat, Rear Right Seat with Off and Heat options - one of them
    selected | Steering Wheel Heater and Defrost & Deicer with off and on options
    - one of them selectedNOTE: All the settings above are the ones selected as Default
    settings. (This section above may be removed from the app as making changes to
    it doesn''t affect anything)7. User should see a loading spinner while schedule
    is being createdUser should see all 3 messages Contacting, Waking, Inititating
    and success toast if schedule was created successfullyUser should be returned
    to the Climate screen with newly added schedule shown with toggle off Departure
    time, temperature, and days of the week are required fields'
