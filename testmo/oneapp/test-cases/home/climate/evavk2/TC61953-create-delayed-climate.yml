description: This feature allows the user to create or update a one-time climate command
  that will execute after a delay anywhere from 20 minutes to 2 weeks from the time
  of creation. This will be functional only for EV2 vehicles
preconditions:
- description: User is logged in to an account with EVAV2 vehicle selected in garage
steps:
- id: 1
  action: Tap on Climate card
  expected: 'Climate Control with Ext and int temperature showing on the top right
    - Indicate Climate is on or off with the climate (fan) icon - The interior temperature
    as default value with temperature selector bar as well as - and + buttons to change
    temperature setting | Driver Seat, Front Passenger Seat with three options to
    choose: Off, Cool, Heat - one of them selected. | Rear Left Seat, Rear Right Seat
    with Off and Heat options - one of them selected | Steering Wheel Heater and Defrost
    & Deicer with off and on options - one of them selected | MAKE DEFAULT disabled
    CTA | Secheduled box with Add CTA on top right -(if schedules exist, they should
    show in this box with toggle on or off) - the schedules should read the temperature
    scheduled with initial of Day and departure time. (Fan icon on right side in blue)
    | TURN CLIMATE & ACCESSORIES ON CTA button enabled with black bg and white font
    on Light mode | CREATE DELAYED START CTA button enabled with white bg and black
    font on Light mode | The values for the climate accessories above should match
    the response from VehicleCimateDefaults'
- id: 2
  action: Tap o Create Delayed Start CTA
  expected: It will take you to Delayed Climate Start screen
- id: 3
  action: Select Day, Start time 20 mins upto 2 weeks -> Tap on Save Delayed Start
    -> Ignore the Climate control card with temperature and climate settings as making
    any changes here doesn't come into effect. Only the Default settings will kick
    in for Delayed Start. This particular card will most probably be removed.
  expected: You will see loading indicator | And then user is taken back to Climate
    screenand success toast Delayed Start Saved is shown | The Delayed Climate Start
    card will show on top of Climate Screen with Edit and Remove options | The card
    will indicate the Month, date, year and time of Delayed Start.
