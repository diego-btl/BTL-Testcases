steps:
- id: 1
  action: Tap on Turn Climate off
  expected: User should see Stop Climate button disable and status shows loading stateUser
    should see a toast message that transitions from (3 seconds each):Contacting {vehicle
    model} to turn {on/off} climate...Waking {vehicle model} to turn {on/off} climate...Initiating
    climate {on/off} for {vehicle model}... | User should see a toast saying'{vehicle
    model} climate turned {on/off}.' (5 seconds)User should see button update to Stop
    Climate buttonUser should see Climate status update to show climate off state
    (Off label, temperature dial shows grey) | On home screen, while the toasts are
    showing, the Climate button is disabled | After success toast, the climate icon
    doesn't show on Hero image | And Climate card on Home screen reads sub text Off.
    - Interior Temp <the temp> F for NNA, C for NCI
