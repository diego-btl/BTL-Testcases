    text1: <p>1. Go to Climate screen </p><p>Tap on Turn on Climte and Accessories.</p><p>OR</p><p>1.
      Go to Climate screen </p><p>Select a temperature and toggle the climate settings</p><p>Tap
      on Turn on Climte and Accessories.</p>
    text2: null
    text3: '<p>1. User should see Turn Climate On button disable and status shows
      loading state<br /><br />User should see a toast message that transitions from
      (3 seconds each):<br />Contacting {vehicle year, model} to turn {on/off} climate...<br
      />Waking {vehicle year, model} to turn {on/off} climate...<br />Initiating climate
      {on/off} for {vehicle year, model}...</p><p>User should see a toast saying<br
      />''{vehicle model} climate turned {on/off}.'' (5 seconds)<br /><br />User should
      see button update to Turn Climate off  button and temperature dial buttons be
      disabled<br /><br />User should see Climate status update to show climate on
      the state (On label, temperature dial shows gradient)</p><p>On Home screen,
      The Climate button on telematics says Climate <br />On</p><p>The Climate card
      says Climate On with the subtext ''Setting to &lt;set temperature&gt; F for
      NNA, C for NCI</p><p> </p><p>NOTE: If you choose to change the climate or climate
      settings but NOT MAKE IT DEFAULT, the climate settings will be in effect. You
      can check the Request for StartClimate to verify the changes you made are sent</p>'
