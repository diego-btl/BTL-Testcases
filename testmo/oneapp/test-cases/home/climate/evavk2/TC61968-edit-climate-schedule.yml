preconditions:
- description: User is on Climate screen with existing charge schedule
steps:
- id: 1
  action: Tap on an existing Climate Schedule2. Modify departure time, temperature,
    and days of the week3. Tap to Save Schedule
  expected: 'Rear Left Seat, Rear Right Seat with Off and Heat options - one of them
    selected | Steering Wheel Heater and Defrost & Deicer with off and on options
    - one of them selectedAll settings above are as per Default settings4. User should
    see a loading spinner while schedule is being savedUser should see all three toasts
    - Contacting, Waking, Initiating and success toast if schedule was saved successfullyUser
    should be returned to the Climate screen with modified schedule shownNote: If
    save schedule fails, user should see a failure toast and remain on the Climate
    Schedule screen'
