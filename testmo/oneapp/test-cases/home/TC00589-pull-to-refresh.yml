steps:
- id: 1
  action: If there exists cached data for the currently selected vehicle -> The user
    is manually refreshing from Home screen -> The proper calls shall be made
  expected: RefreshVehicleStatus (polling) | LocateVehicle (polling) | Appointments
    | Recalls | Static (async) | Dynamic (async) | Capability (async) | Subscription
    | Capability | Subscription (async) | Dynamic (async)
- id: 2
  action: If loading succeeds -> The user should should see updated data -> If loading
    fails -> The user should should see the previously cached data -> After the static
    call, a new vehicle is added -> The proper calls are made
  expected: Capabilities per vin then | Dynamic data per vin
- id: 3
  action: If the vehicle is TCU2k -> Then show a loader when performing recalls and
    appointments call
  expected: See expected results
