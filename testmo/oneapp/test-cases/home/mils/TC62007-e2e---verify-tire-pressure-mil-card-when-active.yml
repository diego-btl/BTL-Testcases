metadata:
  id: TC62007
  name: E2E - Verify Tire Pressure MIL card when active
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-17'
  updated: '2026-01-06'
  author: user_15
  testmo_id: 66024
  folder_id: 50
description: SCOPEWhen the Tire Pressure MIL is active, then instead of displaying
  it in the Status tab, it should be displayed in the MIL tabWhen displaying Tire
  Pressure MIL in MIL tab, any tire where the tire pressure status is not 0 should
  be displayed under the Tire Pressure MIL cardEnsure Tire Pressure MIL causes Home
  tab to show MIL status card with icon on vehicle imageApplies for AVKVehicle generation
  or newer vehicle (AVK, ElectricVehicle, AVK2, EVAVK2, EVO, EVEVO)
steps:
- id: 1
  action: Mock VehicleDynamicData only with TIRE_PRESSURE=true and ensure all tires
    have pressureStatus == 0 > Call VehicleDynamicData api
  expected: MIL Status card appears below Quick Actions. | The subtitle shows "Check
    Tires". | Red exclamation icon appears over the vehicle hero image.
- id: 2
  action: Tab on MIL card
  expected: Tire Pressure MIL is displayed in the MIL tab. | No individual tire pressure
    cards are shown under it.
- id: 3
  action: Ensure Tire Pressure MIL is active and one or more tires have pressureStatus
    != 0 > Call VehicleDynamicData api
  expected: Each tire with pressureStatus != 0 is displayed under the Tire Pressure
    MIL card. | Tires with pressureStatus == 0 are not shown.
- id: 4
  action: Activate Tire Pressure and Active Recall MILs
  expected: 'Subtitle order follows: Active Recall, +1 more. | Tire Pressure MIL card
    appears directly below Active Recall on MIL tab.'
- id: 5
  action: Activate multiple MILs and VehicleRecalls
  expected: 'Verify Subtitle order follows: Active Recall, +X more'
- id: 6
  action: Activate multiple MILs w/o VehicleRecalls
  expected: 'Verify Subtitle order follows: Check Tires, +X more'
- id: 7
  action: Repeat the same steps from above for the Vehicle Screen entry point
  expected: Verify the Vehicle screen entry point also works as expected
