    id: 37880
    case_id: 24313
    text1: '<p>If <code>staticText</code>: <code>"ST3"</code></p><ol><li>Login into
      the app</li><li>In the Home page screen</li><li>Click over <strong>NCF Account</strong>
      card</li><li>Open the <strong>NCF Account</strong> screen</li></ol>'
    text2: null
    text3: <p>Display Congratulatory Message based on Type of Accounts:</p><ul><li><code>paymentHistory</code>
      is <code>false</code></li></ul><p>The CTA <code>View past statements</code>
      should be hidden and CTAs for <code>Get Payout Quote</code>, and <code>Contract
      Details</code> should be displayed under the Account Summary card as done in
      other Account Rules.</p>
