    id: 37879
    case_id: 24313
    text1: <p>If <code>staticText</code> &lt;&gt; <code>"ST3"</code>,<code>"ST4"</code>,
      <code>"ST5"</code>, <code>"ST9"</code>, <code>"ST10"</code>, <code>"ST14"</code>,
      <code>"ST16"</code>, <code>"ST17"</code>, <code>"ST18"</code>, <code>"ST19"</code>,
      <code>"ST20"</code>, <code>"ST22"</code></p><ol><li>Login into the app</li><li>In
      the Home page screen</li><li>Click over <strong>NCF Account</strong> card</li><li>Open
      the <strong>NCF Account</strong> screen</li></ol>
    text2: null
    text3: <p>The NCF Account screen should be displaying with <strong>Account Summary</strong>
      and the 3 options:</p><ul><li>Get Payout, Payment History &amp; Contract Details</li></ul>
