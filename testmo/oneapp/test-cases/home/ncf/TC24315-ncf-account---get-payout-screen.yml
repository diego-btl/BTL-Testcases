- id: 1
  action: Login into the app -> In the Home page screen -> Click over NCF Account
    card -> Open the NCF Account screen -> Click the option Get Payout
  expected: 'The user sees the Payout Quote screen with the instructions: | InstructionsPlease
    include your Nissan account number on the payout cheque, money order or bank draft
    made payable to NCF. Sending certified funds can assist in having the process
    expedited.If you currently have an automatic payment scheduled for your monthly
    payments, please make sure to cancel it to prevent any further deductions from
    your bank account.Please mail to: Nissan Canada Finance5290 Orbitor DriveMississauga,
    ONL4W 4Z5DOWNLOAD PAYOUT QUOTE'
- id: 2
  action: Login into the app -> In the Home page screen -> Click over NCF Account
    card -> Open the NCF Account screen -> Click the option Get Payout
  expected: 'If the user gets and error show a CTA with the 2 buttons "Cancel" & "Retry"
    and the message: | "Something went wrongWe are unable to process your request.
    Please contact (800) 268-6499 for help. (Error Code: I05)"'
