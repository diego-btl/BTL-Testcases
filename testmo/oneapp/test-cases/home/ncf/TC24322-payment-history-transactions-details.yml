      Type</code></li><li><code>Account</code></li></ul><p>For the <strong>Transaction
      Type </strong>display the type of it. For Account section display the next fields:</p><ul><li><code>Description</code>
      &gt; <i>More description about the type</i></li><li><code>Effective Date</code>
      &gt; <i>Month Date, Year</i></li><li><code>Total Payment Amount</code> &gt;
