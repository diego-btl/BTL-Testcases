description: 'If user gets an 404: Not Found (INTERNAL_SERVER_ERROR) in the InVehicleMessages
  this means that the VIN doesn''t have campaigns found'
steps:
- id: 1
  action: Tap on notifications icon -> Tap between Activity History and Alerts tabs
  expected: User should see the notification center | User should be able to navigate
    between Activity History and Alerts
- id: 2
  action: Import the config file -> Modify EnableInAppMessages to FALSE -> Tap on
    notifications icon -> Tap between Activity History and Alerts tabs -> Not seeing
    the notification messages in the App
  expected: User should not see the notification toast/messages changes in the app
    if the EnableInAppMessages is set to FALSE
