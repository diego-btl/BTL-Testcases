preconditions:
- description: AVK2 vehicle
steps:
- id: 1
  action: Mock capabilities so that windowStatus is null -> Go to Notification Preferences
    and view Reminder After Leave section
  expected: User should not see option for Window Open
- id: 2
  action: 'Mock capabilities so that windowStatus is disabled -> "windowStatus": {"__typename":
    "WindowStatusAccessoryCapability","enabled": false} -> Go to Notification Preferences
    and view Reminder After Leave section'
  expected: User should not see option for Window Open
- id: 3
  action: 'Mock capabilities so that windowStatus is enabled -> "windowStatus": {"__typename":
    "WindowStatusAccessoryCapability","enabled": true} -> Go to Notification Preferences
    and view Reminder After Leave section'
  expected: User should see option for Window Open
