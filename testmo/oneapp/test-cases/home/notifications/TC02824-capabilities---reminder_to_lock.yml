steps:
- id: 1
  action: Mock capabilities so that REMINDER_TO_LOCK is missing -> Go to Notification
    Preferences screen
  expected: User should not see the Reminder After Leave section
- id: 2
  action: Mock capabilities so that REMINDER_TO_LOCK is set to false -> Go to Notification
    Preferences screen
  expected: User should not see the Reminder After Leave section
- id: 3
  action: Mock capabilities so that REMINDER_TO_LOCK is set to true -> Go to Notification
    Preferences screen
  expected: 'User should see the Reminder After Leave sectionUser should see default
    options for Door Unlocked, Door Open, Trunk Open (Note: Moonroof Open and Window
    Open are dependent on Accessories Details Capability - covered in other test cases)'
