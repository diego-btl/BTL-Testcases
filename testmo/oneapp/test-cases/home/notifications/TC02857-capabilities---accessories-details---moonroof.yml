description: https://www.pivotaltracker.com/story/show/185793703
preconditions:
- description: AVK2 vehicle
steps:
- id: 1
  action: Mock capabilities so that sunRoof is null -> Go to Notification Preferences
    and view Reminder After Leave section
  expected: User should not see option for Moonroof Open
- id: 2
  action: 'Mock capabilities so that sunRoof is disabled -> "sunRoof": {"__typename":
    "SunRoofAccessoryCapability","enabled": false,"type": "ELECTRIC"} -> Go to Notification
    Preferences and view Reminder After Leave section'
  expected: User should not see option for Moonroof Open
- id: 3
  action: 'Mock capabilities so that sunRoof is enabled but not electric -> "sunRoof":
    {"__typename": "SunRoofAccessoryCapability","enabled": true,"type": "NORMAL"}
    -> Go to Notification Preferences and view Reminder After Leave section'
  expected: User should not see option for Moonroof Open
- id: 4
  action: 'Mock capabilities so that sunRoof is enabled and electric -> "sunRoof":
    {"__typename": "SunRoofAccessoryCapability","enabled": true,"type": "ELECTRIC"}
    -> Go to Notification Preferences and view Reminder After Leave section'
  expected: User should see option for Moonroof Open
