metadata:
  id: TC61901
  name: Smart Charging Notifications - V1G
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-10-29'
  updated: '2025-12-05'
  author: user_25
  testmo_id: 61901
  folder_id: 49
preconditions:
- description: Nissan NNA and NCI only
- description: EV or EV AVK2 only
- description: PD only
- description: '"v1GMonitoredChargingAccountStatus": "ACTIVE"'
steps:
- id: 1
  action: User is on the Notification Preferences screen
  expected: Smart Charging Notification section is displayed at the bottom according
    to the V1GMonitoredChargingAccountStatus API response | There are 4 categories:-
    New PrimeTime Hours- PrimeTime Upcoming Reminder- Monthly Insights- PrimeTime
    Stats Updates
- id: 2
  action: Expand/Collapse the group/arrows
  expected: The groups are expanded/collapsed | Notification options (push, email,
    sms) are shown according to the V1GMonitoredChargingAccountStatus API response
- id: 3
  action: Toggle ON/OFF any of the notifications under any of the notification groups
  expected: V1GUpdateNotificationPreferences API is triggered, returning the updated
    value for the updated notification status | Toggle state is updated accordingly
- id: 4
  action: 'Mock the V1GUpdateNotificationPreferences API response to return "statusCode":
    "4000/"statusCode": "5000 or breakpoint and abort it -> Toggle ON/OFF any of the
    notifications under any of the notification groups'
  expected: The SWW modal is NOT displayed | The toggle is quietly moved back to the
    original position
- id: 5
  action: Mock V1GMonitoredChargingAccountStatus API response to return "v1GMonitoredChargingAccountStatus"
    =! "ACTIVE" -> Navigate to the Notification Preferences screen
  expected: Smart Charging Notification section is hidden
