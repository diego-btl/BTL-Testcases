preconditions:
- description: User has an EV AVK2 vehicle
- description: V2L capability is returning true
- description: User is on the Notification Preferences screen
steps:
- id: 1
  action: Scroll to the EV Notifications section and tap on Vehicle-to-Load
  expected: User should see a Vehicle-to-Load section expand with options for Push,
    Text and Email notifications corresponding to the data returned in NotificationPreferences
- id: 2
  action: Toggle ON/OFF any of the notifications under the notification group
  expected: SetNotificationPreferences API is triggered, returning the updated value
    for the updated notification status | Toggle state is updated accordingly
