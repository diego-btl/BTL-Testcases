preconditions:
- description: User is on Main Proactive Maintenance sheet
- description: User has fewer than 4 reminders
- description: Mock data failure for parts list
steps:
- id: 1
  action: Tap Create New
  expected: User should see an unable to load parts error modal with an option to
    retry
- id: 2
  action: Press No
  expected: Error modal should dismiss
- id: 3
  action: Press Yes
  expected: App should retry api for parts data. If the retry fails, they should see
    the error modal again. If it passes they should see the create screen
