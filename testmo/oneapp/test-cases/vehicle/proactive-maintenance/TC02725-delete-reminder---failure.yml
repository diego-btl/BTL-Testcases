metadata:
  id: TC02725
  name: Delete reminder - Failure
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-09-07'
  updated: '2024-10-17'
  author: user_3
  testmo_id: 2725
  folder_id: 412
preconditions:
- description: User is on PSR screenUser has an existing reminder
steps:
- id: 1
  action: Tap on Edit on existing reminder
  expected: User should see Edit Reminder screen with the corresponding settinsg for
    that reminder
- id: 2
  action: Tap on Delete reminder
  expected: User should see confirmation modal
- id: 3
  action: Mock an error for the API call then tap on Yes on modal
  expected: User should see a loading spinner while reminder is being deletedOn error,
    user should see a failure modal with the option to retry or not
- id: 4
  action: Tap on Yes on failure modal
  expected: User should see a loading spinner while reminder is being deleted
- id: 5
  action: Tap on No on failure modal
  expected: User should see failure modal dismiss and remain on the Edit Reminder
    screen
