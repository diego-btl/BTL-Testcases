  testmo_id: 2724
  folder_id: 412
preconditions:
- description: User is on PSR screenUser has an existing reminder
steps:
- id: 1
  action: Tap on Edit on existing reminder
  expected: User should see Edit Reminder screen with the corresponding settings for
    that reminder
- id: 2
  action: Tap on Delete reminder
  expected: User should see confirmation modal
- id: 3
  action: Tap on No on modal
  expected: User should see confirmation modal dismissed
- id: 4
  action: Tap on Yes on modal
  expected: User should see a loading spinner while reminder is being deletedOn success,
    user should be taken back to the Parts Service Reminders screen with reminder
    removed and see a success toast
