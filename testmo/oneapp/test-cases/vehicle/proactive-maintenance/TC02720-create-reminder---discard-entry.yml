metadata:
  id: TC02720
  name: Create reminder - Discard entry
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-09-07'
  updated: '2024-10-17'
  author: user_3
  testmo_id: 65595
  folder_id: 412
preconditions:
- description: User is on PSR screen
- description: User has fewer than 4 reminders
steps:
- id: 1
  action: Tap on Create New
  expected: User should see New Reminder screen
- id: 2
  action: Select anything within Parts or Reminder Interval
  expected: User is able to check any parts or set a reminder interval
- id: 3
  action: Tap on Back button
  expected: User should see discard entry modal
- id: 4
  action: Tap on No on modal
  expected: User should see discard entry modal dismiss
- id: 5
  action: Tap on Yes on modal
  expected: User should be returned to the PSR screen without creating a new reminder
