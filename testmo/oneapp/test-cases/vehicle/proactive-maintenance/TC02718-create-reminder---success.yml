metadata:
  id: TC02718
  name: Create reminder - Success
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-09-07'
  updated: '2024-10-17'
  author: user_3
  testmo_id: 2718
  folder_id: 412
preconditions:
- description: User is on Proactive Maintenance(PSR) screen
- description: User has fewer than 4 reminders
steps:
- id: 1
  action: Tap on Create New
  expected: User should see New Reminder screen in default state without anything
    selected
- id: 2
  action: Select at least 1 part and set at least 1 type of reminder interval
  expected: User is able to check any parts and set a reminder interval
- id: 3
  action: Tap on Save
  expected: User should see a loading spinner while reminder is savingOn success,
    user is returned to the PSR screen showing the new reminder and a success toast
    is shown
