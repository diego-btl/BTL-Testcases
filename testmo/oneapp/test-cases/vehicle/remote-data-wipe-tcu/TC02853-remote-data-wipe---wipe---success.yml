- description: 'Note: Use breakpoint to check the cases. QueryName: `DataWipe`'
steps:
- id: 1
  action: Toggle on at least one of the toggles -> Tap on Reset -> Tap on Yes
  expected: User should see corresponding toggle toggled on | User should see a confirmation
    prompt | User should see confirmation prompt dismiss and a loading spinnerUser
    should see dataWipeType correspond with the selected toggle | Reset Monitoring
