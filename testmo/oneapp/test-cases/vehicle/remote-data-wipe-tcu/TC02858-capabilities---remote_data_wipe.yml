steps:
- id: 1
  action: Mock capabilities so that REMOTE_DATA_WIPE is missing -> Go to Vehicle Profile
    screen
  expected: User should not see the Remote Data Wipe card
- id: 2
  action: Mock capabilities so that REMOTE_DATA_WIPE is set to false -> Go to Vehicle
    Profile screen -> Tap on Remote Data Wipe card -> Tap on Cancel -> Tap on Remote
    Data Wipe card and tap call Customer Care - 1-855-426-6628 (Nissan NNA)
  expected: User should see the Remote Data Wipe card disabled3. User should see an
    Account Expired modal4. User should see modal dismiss5. User should see option
    to dial number
- id: 3
  action: Mock capabilities so that REMOTE_DATA_WIPE is set to true -> Go to Vehicle
    Profile screen
  expected: User should see the Remote Data Wipe card enabled
