preconditions:
- description: User has a MIL status indicator active for EV/AVK
steps:
- id: 1
  action: Recall data returned (RECALL or SERVICE type)
  expected: User should see MIL status card with secondary text containing MIL name
    - if there are multiple MIL, will also show '+# more'
- id: 2
  action: Tap on MIL status card
  expected: User should see Vehicle Status screen with MIL tab
- id: 3
  action: Tap on Active Recall
  expected: User should see Open Campaigns screen with Recall and Service Campaigns
- id: 4
  action: Tap on Recall/Service Campaign
  expected: User is able view Recall Campaign Information for both campaign types,
    | User should see data corresponding to the response
- id: 5
  action: Tap on Book a Service
  expected: User should enter into Book a Service flow as above
