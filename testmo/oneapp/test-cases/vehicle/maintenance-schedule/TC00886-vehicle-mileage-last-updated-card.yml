    conditions
  expected: 'Tesxt:Please enter the mileage for your vehicle to see your suggested
    maintenance schedule | Current Vehicle Mileage (mi) (text box) | Last updated:
    -- | Save cta greyed out.'
- id: 2
  action: 'Insert any number on the Current Vehicle Mileage (mi) field (e.g: 12345)
    > Tap on Save'
