  tags: []
test_case:
  preconditions: '<ul><li><p>Card is on Time Track and driving type was selected</p><ul><li><strong>GenerateAllVisits</strong>
    API response should have: <code>"Alignment": "TimeBased"</code> (Attaching mocks)</li></ul><p> </p></li></ul>'
  steps:
  - column_name: custom_steps
    id: 96243
    case_id: 877
    text1: <p><i>Mock GenerateAllVisits API (use mock - Not close to Overdue ) </i></p><p>Go
      to vehicle screen &gt; Tap on Maintenance schedule &gt; Set a driving condition&gt;
      GenerateAllVisits + PartsReminders calls are triggered&gt; Observe UI</p>
    text2: null
    text3: <ol><li>Card with time remaining:<ol><li><strong>Title Text</strong>: <br
      /><code>X mo until Est. Next Service until next service</code></li></ol></li><li>Green
      Progress bar with percentage according to the service done<ol><li><code>X of
      Y months</code></li></ol></li><li>Estimated Next Service card<ol><li>Displays
      past Service in Months</li><li>The upcoming one will be selected and the next
      one unselected</li><li>The colour will be green</li><li><figure class="image"><img
      src="/attachments/view/8874" alt="8874" /></figure></li></ol></li></ol>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 2000
    case_id: 877
    text1: <p>Tap on any of the scheduled services</p>
    text2: null
    text3: <p>Verify that the Service Details screen displays the correct information
      for the selected service/date, including all <strong>ServiceComponentName</strong>
      entries associated with that service.</p><figure class="image"><img src="/attachments/view/8899"
      alt="8899" /></figure>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96244
    case_id: 877
    text1: <p>Go back to the vehicle screen </p>
    text2: null
    text3: <p>The <code>Maintenance Schedule</code> card should display a green progress
      bar:</p><ol><li><strong>Title Text</strong>: <br /><code>X mo until Est. Next
      Service until next service</code></li><li>Green Progress bar with percentage
      according to the service done<ol><li><code>X of Y months</code></li></ol></li></ol>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 96245
    case_id: 877
    text1: <p><i>Mock GenerateAllVisits API (use mock - Overdue/Close Overdue) </i></p><p>Go
      to vehicle screen &gt; Tap on Maintenance schedule &gt; Set a driving condition&gt;
      GenerateAllVisits + PartsReminders calls are triggered&gt; Observe UI</p>
    text2: null
    text3: <ol><li>Card with time remaining:<ol><li><strong>Title Text:</strong><ol><li><code>0
      mo until Est. Next Service until next service</code></li></ol></li></ol></li><li>Orange
      Progress bar fully filled<ol><li><code>X of Y months - Expected Soon</code></li></ol></li><li><code>Schedule
      Service</code> CTA</li><li><code>Service Expected Soon</code> card<ol><li>Displays
      past Service in Months</li><li>The upcoming one will be unselected</li><li>color
      will be orange</li></ol></li></ol><figure class="image"><img src="/attachments/view/8875"
      alt="8875" /></figure>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 96246
    case_id: 877
    text1: <p>Go back to the vehicle screen </p>
    text2: null
    text3: <p>The <code>Maintenance Schedule</code> card should display a green progress
      bar:</p><ol><li><strong>Title Text</strong>: <br /><code>0 mo until Est. Next
      Service until next service</code></li><li>Orange Progress bar with percentage
      according to the service done<ol><li><code>X of Y months - Expected soon</code></li></ol></li><li><code>Schedule
      Service</code> CTA</li></ol><figure class="image"><img src="/attachments/view/8876"
      alt="8876" /></figure>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 96247
    case_id: 877
    text1: <p>Tapping on Schedule Service CTA</p>
    text2: null
    text3: <p>Leads the user to the Selected Services screen, which is part of the
      Schedule Appointment flow.</p>
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 9440
    case_id: 877
    text1: <p>Delete any previous visits, bg/fg the app, and wait for apis to load</p>
    text2: null
    text3: <ol><li>Progress bar should be empty for time track if there are no previous
      visits</li><li>Expected Soon verbiage should be hidden</li></ol>
    text4: null
    display_order: 7
  notes: <ul><li>If manually entry was done, card also shows a timestamp for when
    it was last updated</li><li>If month progress is within 60 days, then a "Book
    a Service" CTA is also shown.</li><li>Dates are calculated using the end of the
    month  (e.g Jan 2023 uses Jan 31st 2023 as target )</li></ul>
