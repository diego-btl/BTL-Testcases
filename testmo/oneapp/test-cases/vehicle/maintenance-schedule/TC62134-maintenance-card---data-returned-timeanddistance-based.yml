metadata:
  id: TC62134
  name: Maintenance Card - Data returned TimeAndDistance Based
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-10'
  updated: '2025-12-18'
  author: user_15
  testmo_id: 62134
  folder_id: 91
description: User has data being returned(AVK) or has done manual entry (TCU2K) within
  the last 3 monthsNot Close to Due - green progress barClose to Due - Orange warning
  state progress bar nearly completeOverdue - Orange warning state Progress bar filled
preconditions:
- description: 'Card is on Time Track and driving type was selectedGenerateAllVisits
    API response should have: "Alignment": "TimeAndDistanceBased" (Attaching mocks)'
steps:
- id: 1
  action: Mock GenerateAllVisits & VehicleDynamicData APIs (use mock - Not close to
    Overdue ) -> Go to vehicle screen > Tap on Maintenance schedule > Set a driving
    condition> GenerateAllVisits + PartsReminders calls are triggered> Observe UI
  expected: 'Card with time remaining:Title Text: X mi until Est. Next Service until
    next service | Green Progress bar with percentage according to the service doneX
    of Y mi | Estimated Next Service cardDisplays past Service in miles | The upcoming
    one will be selected and the next one unselected | The colour will be green'
- id: 2
  action: Tap on any of the scheduled services
  expected: Verify that the Service Details screen displays the correct information
    for the selected service/date, including all ServiceComponentName entries associated
    with that service.
- id: 3
  action: Go back to the vehicle screen
  expected: 'Title Text: X mi until Est. Next Service until next service | Green Progress
    bar with percentage according to the service doneX of Y mi'
- id: 4
  action: Mock GenerateAllVisits & VehicleDynamicData APIs (use mock - Overdue/ Close
    to Overdue) -> Go to vehicle screen > Tap on Maintenance schedule > Set a driving
    condition> GenerateAllVisits + PartsReminders calls are triggered> Observe UI
  expected: Card with time remaining:Title Text:0 mi until Est. Next Service until
    next service | Orange Progress bar fully filledX of Y mi/mo - Expected Soon |
    Schedule Service CTA | Service Expected Soon cardDisplays past Service in Miles
    | The upcoming one will be unselected | color will be orange
- id: 5
  action: Go back to the vehicle screen
  expected: 'Title Text: 0 mi until Est. Next Service until next service | Orange
    Progress bar with percentage according to the service doneX of Y mi - Expected
    soon | Schedule Service CTA'
- id: 6
  action: Tapping on Schedule Service CTA
  expected: Leads the user to the Selected Services screen, which is part of the Schedule
    Appointment flow.
- id: 7
  action: Delete any previous visits, bg/fg the app, and wait for apis to load
  expected: Progress bar should be empty for time track if there are no previous visits
    | Expected Soon verbiage should be hidden
