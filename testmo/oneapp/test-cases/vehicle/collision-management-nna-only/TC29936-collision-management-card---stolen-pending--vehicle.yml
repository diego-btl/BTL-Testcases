description: Verify the User is not able to see the collision management card on the
  Vehicle screen when the status is "STOLEN" https://www.pivotaltracker.com/story/show/188707438
preconditions:
- description: 'Verify the Feature Flag: "EnableCollisionManagement": "true”.- Account
    has the vehicle is in the ''STOLEN'' and ''PENDING'' status'
- description: User is on the Home Screen
steps:
- id: 1
  action: Select Vehicle is in 'STOLEN' status -> Navigate to the Vehicle Screen
  expected: The user should not see the Collision Management card
- id: 2
  action: Select Vehicle is in 'PENDING' status -> Navigate to the Vehicle Screen
  expected: The user should not see the Collision Management card
