description: https://www.pivotaltracker.com/story/show/188707479Verify the user can
  successfully edit and save the Insurance Provider field
preconditions:
- description: The user is already on the Collision Report start screen
steps:
- id: 1
  action: Tap on the Edit CTA for the Insurance Provider card
  expected: 'The user is redirected to the edit screen | They should see the following
    field: Insurance Provider | The field should not be marked as required | The Save
    button should be inactive (disabled).'
- id: 2
  action: Enter the Insurance Provider's Name
  expected: The user should see the Save button becomes enabled
- id: 3
  action: Tap on Save button
  expected: The user should be redirected to the Collision Report start screen | The
    user should see the updated company name on the Insurance Provider's card
