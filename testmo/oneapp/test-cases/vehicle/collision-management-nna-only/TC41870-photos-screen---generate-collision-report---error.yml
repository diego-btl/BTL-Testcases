preconditions:
- description: 'Feature flag "EnableCollisionManagement": "true" is enabled'
- description: 'Feature flag "GrantCollisionManagement": "{\"enabled\": true, \"checkCapability\":
    false} is enabled'
- description: User is logged in with an account that has a vehicle in ENROLLstatus
- description: User is on the Photos screen
- description: mocking CreateCollisionReportPDF to show an error for GenerationCollisionReport
steps:
- id: 1
  action: Tap the Generate Collision Report CTA
  expected: A confirmation modal appears
- id: 2
  action: Simulate a failure in the CreateCollisionReportPDF API call
  expected: See expected results
- id: 3
  action: Tap Save in the modal
  expected: CreateCollisionReportPDF API is failed
- id: 4
  action: Observe error message
  expected: An Error modal is displayed with a Try Again option
