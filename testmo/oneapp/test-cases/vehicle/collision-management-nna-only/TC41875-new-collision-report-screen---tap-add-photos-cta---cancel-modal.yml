  testmo_id: 41875
  folder_id: 3800
description: Verify that when a user taps the Add Photos CTA with missing required
  fields, a Missing Information Modal appears, and if the user taps No or Cancel,
  the modal is properly closed without triggering any action.
preconditions:
- description: User is on the Collision Report screen
- description: One or more required fields are left empty
steps:
- id: 1
  action: Leave at least one or all required fields empty on the Collision Report
    screen
  expected: See expected results
- id: 2
  action: Tap the ADD PHOTOS CTA
  expected: A Missing Information Modal should appearModal contains No and Yes options
- id: 3
  action: Tap No in the modal
  expected: The modal should be closed | The app should not proceed with any API call
    | User remains on the same screen
