    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 71971
    case_id: 41880
    text1: <p>Selects or captures a new photo</p>
    text2: null
    text3: <p>The new photo preview is shown</p><ul><li><code>Use Photo</code> CTA
      </li><li><code>Add Different Photo</code> CTA</li><li><code>Delete Photo</code>
      CTA are still visible</li><li>The <code>photo name</code> updates to the new
