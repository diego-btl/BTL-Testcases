  - column_name: custom_steps
    id: 71968
    case_id: 41880
    text1: <p> Tap  <code>Add from Gallery</code> or  <code>Take a Photo</code></p>
    text2: null
    text3: <ul><li>If Add from Gallery → the device’s gallery opens</li><li>If Take
      a Photo → the device camera opens</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 71969
    case_id: 41880
    text1: <p>Select a photo from Gallery or take a photo using the camera</p>
    text2: null
    text3: <ul><li>User is redirected to the Photo Details screen showing:</li><li>Photo
      preview</li><li>Use Photo, Add Different Photo, Delete Photo CTAs</li><li>Non-editable
      photo name</li></ul>
