description: The user should see a warning modal when clicking the Back buttonhttps://www.pivotaltracker.com/story/show/188707479
preconditions:
- description: The user is on the Collision Report start screen
steps:
- id: 1
  action: Tap on the Back button
  expected: A warning modal appears with the message "Are you sure? If you go back,
    you will have to start your report over again" and options Cancel and Yes, Leave
- id: 2
  action: Tap the Cancel option
  expected: The user stays on the current screen, and the warning modal is closed
- id: 3
  action: Tap on the Back button
  expected: A warning modal appears with the message "All information will be lost
    if you navigate away", and options Cancel and Yes,Leave
- id: 4
  action: Tap the Yes, Leave option
  expected: The user is redirected to the previous screen (e.g., Collision Management
    start screen)
