description: https://www.pivotaltracker.com/story/show/188707479Validate that the
  user should see a warning modal when tabbing the Navigation tabs
preconditions:
- description: The user is on the Collision Report screen
steps:
- id: 1
  action: Tap on any Navigation tab
  expected: A warning modal appears with the message "All information will be lost
    if you navigate away," and options Cancel and Yes, Leave
- id: 2
  action: Tap the Cancel option
  expected: The user stays on the current screen, and the warning modal is closed
- id: 3
  action: Tap on the Navigation tab
  expected: A warning modal appears with the message "All information will be lost
    if you navigate away" and options Cancel and Yes, Leave
- id: 4
  action: Tap the Yes, Leave option
  expected: The user is redirected to the appropriate navigation screen (e.g., Settings,
    Support, Map ...).
