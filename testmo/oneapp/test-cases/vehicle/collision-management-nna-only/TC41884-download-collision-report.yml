description: Verify that the user can successfully download the collision report file
  from the Generated Report screen after tapping the Download Report CTA.
preconditions:
- description: A collision report has been generated successfully.
- description: The user is on the Collision Generated Report screen.
steps:
- id: 1
  action: Tap the Download Report CTA
  expected: A system dialog appears prompting the user to select a location to save
    the generated report.
- id: 2
  action: In the system dialog, choose a save location on the mobile device (e.g.,
    "Files" folder)
  expected: The user is able to choose the desired folder (e.g., Files)
- id: 3
  action: Tap Save
  expected: The save dialog closes, and the user remains on the Generated Report screen.
