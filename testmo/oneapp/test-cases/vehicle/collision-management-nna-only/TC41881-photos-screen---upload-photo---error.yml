metadata:
  id: TC41881
  name: Photos Screen - Upload Photo - Error
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-06-09'
  updated: '2025-06-09'
  author: user_26
  testmo_id: 41881
  folder_id: 3800
description: Validate the app behavior when the user captures or selects a photo,
  proceeds to upload it, but the upload fails.
preconditions:
- description: User is on the Photos screenApp has permission to access camera and
    gallerymocking UploadPhotoForCollisionReport API call false
steps:
- id: 1
  action: Tap any photo placeholder or camera icon
  expected: Add from Gallery | Take a Photo
- id: 2
  action: Tap *Add from Gallery* or *Take a Photo*
  expected: If Add from Gallery → the device’s gallery opens | If Take a Photo → the
    device camera opens
- id: 3
  action: Select a photo from Gallery or take a photo using the camera
  expected: User is redirected to the Photo Details screen
- id: 4
  action: Simulate a failure in the UploadPhotoForCollisionReport API call
  expected: See expected results
- id: 5
  action: Tap Use Photo
  expected: App triggers UploadPhotoForCollisionReport API | A loading state is shown
    during the request | User sees the corresponding error modal " Unable to upload
    image "
