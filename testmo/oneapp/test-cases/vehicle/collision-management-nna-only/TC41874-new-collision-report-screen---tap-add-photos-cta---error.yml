description: Verify that when the CreateCollisionReport API call fails, the app retries
  the call once. If it fails again, the user is shown the standard Something Went
  Wrong modal
preconditions:
- description: User is on the Collision Report screen
- description: Mocking CreateCollisionReport API call fails
steps:
- id: 1
  action: Fill out all required fields or leave them empty
  expected: See expected results
- id: 2
  action: Tap the Add Photos CTA
  expected: See expected results
- id: 3
  action: Simulate a failure in the CreateCollisionReport API call
  expected: See expected results
- id: 4
  action: In the confirmation modal, tap Yes /Continue
  expected: The app automatically retries the API call once. | If the retry also fails,
    the "Something Went Wrong" modal is displayed.
