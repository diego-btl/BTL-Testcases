metadata:
  id: TC41872
  name: New Collision Report screen - Tap "Add Photos" CTA -  All required fields
    are filled
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-06-09'
  updated: '2025-06-10'
  author: user_26
  testmo_id: 41872
