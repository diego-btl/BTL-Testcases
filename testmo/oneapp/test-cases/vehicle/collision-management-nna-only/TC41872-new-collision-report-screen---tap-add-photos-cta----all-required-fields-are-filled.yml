description: Verify that when all required fields are completed and the user taps
  the Add Photos CTA, the flow proceeds correctly through confirmation and API response
preconditions:
- description: User is on the Collision Report screen
- description: All required fields are filled
steps:
- id: 1
  action: Fill out all required fields on the Collision Management screen
  expected: All required fields are filled out
- id: 2
  action: Tap the ADD PHOTOS CTA
  expected: Appears the Confirmation Message modal
- id: 3
  action: Tap Continue
  expected: Appears a Loading State | CreateCollisionReport API is triggered successfully
    | User is redirected to the Photos screen
