metadata:
  id: TC58188
  name: Collision Management - Golden Path ( Completed Collision Report form and photo
    upload)
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-08-15'
  updated: '2025-08-15'
  author: user_26
  testmo_id: 65557
  folder_id: 3800
preconditions:
- description: 'The Collision Management feature flag is enabled:'
- description: The user is on the vehicle page and can see the Collision Management
    card.
steps:
- id: 1
  action: Tap on the Collision Management card
  expected: 'The user should be navigated to the Collision Management screen | The
    Collision Management screen opens, showing options: - New Collision Report- View
    All Reports- Accident Helper- Collision Towing section with a Call Roadside Assistance
    button.'
- id: 2
  action: Tap on the New Collision Report card
  expected: 'The user is redirected to the Collision Report start screen | The Collision
    Report screen opens with sections: - Your Information, - Towing/Transportation,-
    Insurance Provider, - Collision Center- Add Photos button.**Fields may have existing
    or empty values.'
- id: 3
  action: In each section, tap Edit and enter test data
  expected: The entered information is displayed in the corresponding section (name,
    address, phone number, company, etc.).
- id: 4
  action: Tap Add Photos button
  expected: 'A warning appears: “You will not be able to edit your information once
    you start adding photos” with Cancel and Continue options.'
- id: 5
  action: Tap Continue
  expected: The Photos screen opens, showing a car image and photo slots (Front Left,
    Front, Front Right, etc.).
- id: 6
  action: Tap a photo slot, select Add from Photo Gallery, and add at least 3 photos
  expected: Selected photos are displayed in the slots with previews. The Generate
    Collision Report button becomes active.
- id: 7
  action: Tap Generate Collision Report
  expected: 'A warning appears: “You will not be able to edit your photos once you
    save. Saving will generate your completed Collision Report” with Cancel and Save
    options.'
- id: 8
  action: Tap Save
  expected: The completed Collision Report screen opens, showing a PDF preview with
    Share Report and Download Report buttons.
- id: 9
  action: Tap Share Report and send to an external email
  expected: The email app opens with the PDF report attached, subject line Collision
    report from , and a yellow External recipient warning for outside addresses.
- id: 10
  action: Tap Download Report
  expected: The system “Open with” menu appears, showing available apps to open or
    save the PDF.
- id: 11
  action: Go back from the report screen
  expected: 'A confirmation appears: “Are you sure? If you go back, you will have
    to start your report over again,” with Cancel and Yes, Leave options.'
- id: 12
  action: On the Collision Management screen, tap View All Reports
  expected: The Accident Report History screen opens, showing a list of reports. |
    The latest report is displayed with the correct date and time in the Report Date
    field.
