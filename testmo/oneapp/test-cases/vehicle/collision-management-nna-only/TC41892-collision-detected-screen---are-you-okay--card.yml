metadata:
  id: TC41892
  name: Collision Detected screen - "Are you okay? " card
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-06-10'
  updated: '2025-06-10'
