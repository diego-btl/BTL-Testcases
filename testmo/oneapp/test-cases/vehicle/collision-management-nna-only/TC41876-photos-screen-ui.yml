description: Verify that the user can see all required UI elements on the Photos screen,
  interact with them correctly, including scrolling, tapping icons, placeholders,
  and managing photo uploads (up to 18 photos).
preconditions:
- description: User is successfully navigated to the Photos screen from a previous
    Collision Report screen
steps:
- id: 1
  action: The user is on the *Photos* screen
  expected: The following elements should be visible | Info icon in the top right
    corner- A vehicle image with 8 camera icons- Vehicle photo placeholders are divided
    into 3 sections - "Add More Photos" CTA- You can save up to 18 photos- "Generate
    Collision Report" CTA always Active- The screen is fully scrollable
