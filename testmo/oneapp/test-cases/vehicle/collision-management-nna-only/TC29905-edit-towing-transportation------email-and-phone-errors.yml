description: Verify email and phone number errors when adding incorrect information
  https://www.pivotaltracker.com/story/show/188707449
preconditions:
- description: The user is already on the Edit Towing/Transportation screen
steps:
- id: 1
  action: Enter an incorrect email format
  expected: 'The email text field shows a red background | The asterisk is displayed
    below the Email field | The user should see an error as: * Invalid email address
    | The SAVE button remains inactive'
- id: 2
  action: Add an incomplete phone number
  expected: 'The asterisk is displayed below the Phone Number field | The user should
    see an error as: * Invalid Phone Number | The SAVE button remains inactive'
