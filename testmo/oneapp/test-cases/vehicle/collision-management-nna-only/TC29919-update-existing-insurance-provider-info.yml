metadata:
  id: TC29919
  name: Update existing Insurance Provider Info
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-01-10'
  updated: '2025-01-28'
  author: user_26
  testmo_id: 29919
  folder_id: 3800
description: Verify the user can successfully update and save the Insurance Provider
  field
preconditions:
- description: The user is on the Collision Report start screen
steps:
- id: 1
  action: Tap on the Edit CTA for the Insurance Provider card
  expected: The user is redirected to the Edit screen | The user navigates to the
    page and sees the insurance Provider information field pre-filled | The user should
    see the disabled Save button
- id: 2
  action: Update the existing Insurance Provider information
  expected: The user should see the enabled Save button
- id: 3
  action: Tap on Save button
  expected: The user should be redirected to the start screen | The user should see
    the updated Company Name for the Insurance Provider card
