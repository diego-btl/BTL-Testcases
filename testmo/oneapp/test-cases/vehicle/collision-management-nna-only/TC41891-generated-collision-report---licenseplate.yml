metadata:
  id: TC41891
  name: Generated Collision Report - licensePlate
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-06-10'
  updated: '2025-06-10'
  author: user_26
  testmo_id: 65550
  folder_id: 3800
description: Verify that the licensePlate is included in the CreateCollisionReport
  request and is correctly shown in the generated PDF
preconditions:
- description: A valid license plateis available for the vehicle.
- description: User is on the Photosscreen
steps:
- id: 1
  action: Tap the Generate Collision Report CTA
  expected: 'The CreateCollisionReport API request is triggered. | Observe the confirmation
    modal asking: "Generate collision report?"'
- id: 2
  action: Tap Save on the modal
  expected: The Generate report toast message appears | The CreateCollisionReport
    API request is triggered. | The licensePlate parameter is included in the request
    payload and matches the current vehicle's plate number.
- id: 3
  action: Verify that the user is redirected to the Collision Report screen.
  expected: The user is navigated to the Collision Report screen displaying the PDF.
    | The PDF is displayed and contains the correct license plate number
