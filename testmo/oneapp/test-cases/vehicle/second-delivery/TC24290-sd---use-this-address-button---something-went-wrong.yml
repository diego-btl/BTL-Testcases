steps:
- id: 1
  action: Edit an "At Home" appointment. -> Click "Use This Address". -> Observe the
    error and the removal of the original address. -> Re-enter the address and proceed.
  expected: The app should accept the current address without error, and the original
    address should remain intact unless the user explicitly changes it.
