description: 'Second Delivery - Card - Non-Prioritized. Validates that Second Delivery
  Card appears ONLY on Vehicle screen below other cards when user is outside the priority
  period (after 30 days). Card does NOT appear on Home screen.Notes:Non-prioritized
  state when: daysSincePurchased >= 30Card does NOT display on Home screenCard displays
  ONLY on Vehicle screenPositioned below other cards (not at top like prioritized
  state)Use mocks from folder "Second Delivery - MyINFINITI Expert - Discovery & CTA
  Display"Test on both light and dark modeFeature Flag: EnableSecondDelivery is set
  to true'
preconditions:
- description: Feature Flag EnableSecondDelivery is set to true
steps:
- id: 1
  action: 'Mock SecondDeliveryEligibility with: -> { "cta": { "discover": { "__typename":
    "SecondDeliveryDiscoverCTA", "prioritized": false }, "daysSincePurchased": 45
    } }Login to app'
  expected: Second Delivery Card is NOT displayed on Home screen
- id: 2
  action: Navigate to Vehicle screen
  expected: Second Delivery Card is displayed on Vehicle screen | Card appears below
    other cards (not at top) | Card title shows MyINFINITI Expert (Infiniti) | Card
    body shows Discover more about your {vehicle model} | Chevron (>) icon displayed
    on right
