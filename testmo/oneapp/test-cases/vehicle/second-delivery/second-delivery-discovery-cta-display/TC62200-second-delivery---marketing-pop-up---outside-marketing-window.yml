description: 'Second Delivery - Marketing Pop-up - Outside Marketing Window. Validates
  that the marketing popup does not appear when daysSincePurchased exceeds displayMarketingMessageThresholdInDays
  (60 days), but Second Delivery Card continues to display with its own lifecycle.Notes:Marketing
  pop-up window closes after 60 days from purchasePop-up hidden when: daysSincePurchased
  > displayMarketingMessageThresholdInDays (60)Pop-up hidden regardless of versionToDisplay
  valueSecond Delivery Card continues to display (Card has different/longer lifecycle
  than marketing popup)Marketing popup and Second Delivery Card have separate visibility
  rulesExample: At 65 days - pop-up hidden, card visible based on prioritizationUse
  mocks from folder "Second Delivery - MyINFINITI Expert - Discovery & CTA Display"Test
  on both light and dark modeFeature Flag: EnableSecondDelivery is set to true'
preconditions:
- description: Feature Flag EnableSecondDelivery is set to true
steps:
- id: 1
  action: 'Mock SecondDeliveryEligibility with: -> { "marketingMessage": { "versionToDisplay":
    "REMIND_ME_LATER", "displayMarketingMessageThresholdInDays": 60, "remindMeLaterThresholdInDays":
    8 }, "daysSincePurchased": 65 }Login to app'
  expected: 'Marketing pop-up does NOT appear | Second Delivery Card is displayed
    | Card shows MyINFINITI Expert with Discover more about your {vehicle model} |
    Chevron (>) icon displayed on right | Card visibility based on prioritization:
    | If prioritized: true (daysSincePurchased < 30): Card appears on Home screen
    AND Vehicle screen at top | If prioritized: false (daysSincePurchased >= 30):
    Card appears ONLY on Vehicle screen (not on Home screen) | At 65 days, card is
    non-prioritized, so appears on Vehicle screen only'
