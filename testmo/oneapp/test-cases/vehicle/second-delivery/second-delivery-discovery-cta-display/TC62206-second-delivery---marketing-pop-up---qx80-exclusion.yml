description: 'QX80 Exclusion - Sales Date Eligibility for Second Delivery. Validates
  that marketing popup does not appear for Infiniti QX80 vehicles with retailSalesDate
  before October 1, 2024 due to backend-controlled threshold suppression.Notes:Backend
  exclusion logic (NOT app-side):When vehicle is Infiniti QX80 sold before Oct 1,
  2024 → Backend returns displayMarketingMessageThresholdInDays: 0When vehicle is
  Infiniti QX80 sold on/after Oct 1, 2024 → Backend returns displayMarketingMessageThresholdInDays:
  60App has NO special QX80 logic - it only checks: IF daysSincePurchased <= displayMarketingMessageThresholdInDays
  THEN show popupExclusion is invisible to app - backend handles all logicExample:
  daysSincePurchased: 15 > threshold: 0 = Pop-up hiddenExample: daysSincePurchased:
  15 <= threshold: 60 = Pop-up shownThis design allows backend to change exclusion
  rules without app updatesUse mocks from folder "Second Delivery - MyINFINITI Expert
  - Discovery & CTA Display"Test on both light and dark modeFeature Flag: EnableSecondDelivery
  is set to true'
preconditions:
- description: Feature Flag EnableSecondDelivery is set to true
- description: Vehicle is Infiniti QX80
steps:
- id: 1
  action: 'Mock SecondDeliveryEligibility with: -> { "leadCar": { "brand": "Infiniti",
    "model": "QX80", "retailSalesDate": "2024-09-15" }, "marketingMessage": { "versionToDisplay":
    "REMIND_ME_LATER", "displayMarketingMessageThresholdInDays": 0, "remindMeLaterThresholdInDays":
    8 }, "daysSincePurchased": 15 }Login to app'
  expected: 'Marketing pop-up does NOT appear | Threshold check: daysSincePurchased
    (15) > displayMarketingMessageThresholdInDays (0) = Hidden | User sees only CTA
    cards (no modal popup)'
- id: 2
  action: 'Mock SecondDeliveryEligibility with: -> { "leadCar": { "brand": "Infiniti",
    "model": "QX80", "retailSalesDate": "2024-10-01" }, "marketingMessage": { "versionToDisplay":
    "REMIND_ME_LATER", "displayMarketingMessageThresholdInDays": 60, "remindMeLaterThresholdInDays":
    8 }, "daysSincePurchased": 15 }Login to app'
  expected: 'Marketing pop-up appears | Threshold check: daysSincePurchased (15) <=
    displayMarketingMessageThresholdInDays (60) = Shown | BOOK NOW and REMIND ME LATER
    buttons displayed'
