description: 'Second Delivery - Eligibility. Validates when user is eligible for Second
  Delivery program. Eligible users display Second Delivery Card on app.Notes:Eligibility
  determined by SecondDeliveryEligibility query response typeEligible: SecondDeliveryEligibilityResponseRDRRecordFoundIneligible:
  SecondDeliveryEligibilityResponseIneligibleEligible users see Second Delivery Card
  (always visible once eligible)Card visibility location based on prioritization flag
  and daysSincePurchasedUse mocks from folder "Second Delivery - MyINFINITI Expert
  - Discovery & CTA Display"Test on both light and dark modeFeature Flag: EnableSecondDelivery
  is set to true'
preconditions:
- description: User is logged in
- description: Feature Flag EnableSecondDelivery is set to true
steps:
- id: 1
  action: 'Mock SecondDeliveryEligibility with ineligible response: -> { "eligibility":
    { "__typename": "SecondDeliveryEligibilityResponseIneligible" } }Login to app'
  expected: Second Delivery Card does NOT appear | No eligibility indicators displayed
    | Only standard vehicle information shown
- id: 2
  action: 'Mock SecondDeliveryEligibility with eligible response: -> { "eligibility":
    { "__typename": "SecondDeliveryEligibilityResponseRDRRecordFound", "hub": {...},
    "leadCar": {...} }, "cta": { "discover": { "__typename": "SecondDeliveryDiscoverCTA",
    "prioritized": true }, "daysSincePurchased": 10 } }Login to app'
  expected: 'Eligibility check passed for Second Delivery program | Second Delivery
    Card is displayed | Card title: MyINFINITI Expert | Card subtitle: Discover more
    about your {vehicle model} | Chevron (>) icon displayed on right | Card visibility
    based on prioritization: | If prioritized: true (daysSincePurchased < 30): Card
    appears on Home screen AND Vehicle screen at top | If prioritized: false (daysSincePurchased
    >= 30): Card appears ONLY on Vehicle screen (not on Home screen)'
