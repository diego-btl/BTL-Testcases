  steps:
  - column_name: custom_steps
    id: 97031
    case_id: 24242
    text1: "<p>Mock <code>SecondDeliveryEligibility</code> with ineligible response:</p><pre><code>{\n\
      \  \"eligibility\": {\n    \"__typename\": \"SecondDeliveryEligibilityResponseIneligible\"\
      \n  }\n}</code></pre><p>Login to app</p>"
    text2: null
    text3: <ul><li>Second Delivery Card does NOT appear</li><li>No eligibility indicators
      displayed</li><li>Only standard vehicle information shown</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 97032
    case_id: 24242
    text1: "<p>Mock <code>SecondDeliveryEligibility</code> with eligible response:</p><pre><code>{\n\
      \  \"eligibility\": {\n    \"__typename\": \"SecondDeliveryEligibilityResponseRDRRecordFound\"\
      ,\n    \"hub\": {...},\n    \"leadCar\": {...}\n  },\n  \"cta\": {\n    \"discover\"\
      : {\n      \"__typename\": \"SecondDeliveryDiscoverCTA\",\n      \"prioritized\"\
      : true\n    },\n    \"daysSincePurchased\": 10\n  }\n}</code></pre><p>Login\
      \ to app</p>"
    text2: null
    text3: '<ul><li>Eligibility check passed for Second Delivery program</li><li>Second
      Delivery Card is displayed</li><li>Card title: <code>MyINFINITI Expert</code></li><li>Card
      subtitle: <code>Discover more about your {vehicle model}</code></li><li>Chevron
      (&gt;) icon displayed on right</li><li><strong>Card visibility based on prioritization:</strong></li><li>If
      <code>prioritized: true</code> (daysSincePurchased &lt; 30): Card appears on
      Home screen AND Vehicle screen at top</li><li>If <code>prioritized: false</code>
      (daysSincePurchased &gt;= 30): Card appears ONLY on Vehicle screen (not on Home
      screen)</li></ul>'
    text4: null
    display_order: 2
