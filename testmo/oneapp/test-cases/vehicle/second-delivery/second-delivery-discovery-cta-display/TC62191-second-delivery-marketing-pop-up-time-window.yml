test_case:
  preconditions: '<ul><li>User is not logged in (popup checked on app launch)</li><li>Feature
    Flag <code>EnableSecondDelivery</code> is set to <code>true</code></li><li>Mock
    configured with <code>daysSincePurchased: 65</code> (exceeds 60-day threshold)</li><li>Mock
    configured with <code>displayMarketingMessageThresholdInDays: 60</code></li></ul>'
  steps:
  - column_name: custom_steps
    id: 97027
    case_id: 62191
    text1: "<p>Mock <code>SecondDeliveryEligibility</code> with:</p><pre><code>{\n\
      \  \"marketingMessage\": {\n    \"versionToDisplay\": \"REMIND_ME_LATER\",\n\
      \    \"displayMarketingMessageThresholdInDays\": 60,\n    \"remindMeLaterThresholdInDays\"\
      : 8\n  },\n  \"daysSincePurchased\": 65\n}</code></pre><p>Login to app</p>"
    text2: null
    text3: '<ul><li>Marketing pop-up does NOT appear</li><li>User goes directly to
      Home screen</li><li><strong>Card visibility based on prioritization:</strong></li><li>If
      <code>prioritized: true</code> (daysSincePurchased &lt; 30): Card appears on
      Home screen AND Vehicle screen at top</li><li>If <code>prioritized: false</code>
      (daysSincePurchased &gt;= 30): Card appears ONLY on Vehicle screen (not on Home
      screen)</li><li>At 65 days, card would be non-prioritized, so appears on Vehicle
      screen only</li></ul>'
    text4: null
    display_order: 1
