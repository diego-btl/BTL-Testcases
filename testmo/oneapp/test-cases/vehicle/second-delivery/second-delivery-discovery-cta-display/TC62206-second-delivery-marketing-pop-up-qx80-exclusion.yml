test_case:
  preconditions: <ul><li>Feature Flag <code>EnableSecondDelivery</code> is set to
    <code>true</code></li><li>Vehicle is Infiniti QX80</li></ul>
  steps:
  - column_name: custom_steps
    id: 96922
    case_id: 62206
    text1: "<p>Mock <code>SecondDeliveryEligibility</code> with:</p><pre><code>{\n\
      \  \"leadCar\": {\n    \"brand\": \"Infiniti\",\n    \"model\": \"QX80\",\n\
      \    \"retailSalesDate\": \"2024-09-15\"\n  },\n  \"marketingMessage\": {\n\
      \    \"versionToDisplay\": \"REMIND_ME_LATER\",\n    \"displayMarketingMessageThresholdInDays\"\
      : 0,\n    \"remindMeLaterThresholdInDays\": 8\n  },\n  \"daysSincePurchased\"\
      : 15\n}</code></pre><p>Login to app</p>"
    text2: null
    text3: '<ul><li>Marketing pop-up does NOT appear</li><li>Threshold check: <code>daysSincePurchased
      (15) &gt; displayMarketingMessageThresholdInDays (0)</code> = Hidden</li><li>User
      sees only CTA cards (no modal popup)</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96923
    case_id: 62206
    text1: "<p>Mock <code>SecondDeliveryEligibility</code> with:</p><pre><code>{\n\
      \  \"leadCar\": {\n    \"brand\": \"Infiniti\",\n    \"model\": \"QX80\",\n\
      \    \"retailSalesDate\": \"2024-10-01\"\n  },\n  \"marketingMessage\": {\n\
      \    \"versionToDisplay\": \"REMIND_ME_LATER\",\n    \"displayMarketingMessageThresholdInDays\"\
      : 60,\n    \"remindMeLaterThresholdInDays\": 8\n  },\n  \"daysSincePurchased\"\
      : 15\n}</code></pre><p>Login to app</p>"
    text2: null
    text3: '<ul><li>Marketing pop-up appears</li><li>Threshold check: <code>daysSincePurchased
      (15) &lt;= displayMarketingMessageThresholdInDays (60)</code> = Shown</li><li><code>BOOK
