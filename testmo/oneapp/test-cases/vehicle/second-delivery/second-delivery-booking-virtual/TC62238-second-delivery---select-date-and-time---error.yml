description: 'Second Delivery - Select Date and Time - Error: Time Slot Loading Error
  HandlingValidates error handling when SecondDeliveryAppointmentsAtVirtual query
  fails to fetch available time slots. Tests that error modal is displayed with appropriate
  messaging, retry option, and cancel option when loading time slots encounters an
  error.Notes:SecondDeliveryAppointmentsAtVirtual query fetches available time slotsAPI
  error returns SecondDeliveryAppointmentTimeSlotsErrorResponse typeError modal displays
  with retry and cancel optionsUser can retry to fetch time slots or cancel to exit
  booking flowError occurs on Select Date and Time screen (Step 1 of 3)Platform Difference:
  iOS redirects to previous screen on Cancel, Android remains on Select Date and Time
  screenPreconditions:User is logged inEligible INFINITI VIN in focusEligibility:
  SecondDeliveryEligibilityResponseRDRRecordFoundFeature Flag: EnableSecondDelivery
  = trueUser has navigated to Second Delivery booking flowUser is on Select Date and
  Time screen'
steps:
- id: 1
  action: 'Mock SecondDeliveryAppointmentsAtVirtual query to return error: -> { "data":
    { "vehicle": { "__typename": "Vehicle", "secondDelivery": { "__typename": "SecondDelivery",
    "appointments": { "__typename": "SecondDeliveryAppointments", "atVirtual": { "__typename":
    "SecondDeliveryAppointmentTimeSlotsErrorResponse", "message": "Failed to fetch
    time slots. Please try again later." } } } } } }On Select Date and Time screen,
    observe time slot loading behavior'
  expected: 'SecondDeliveryAppointmentsAtVirtual query is triggered | API returns
    error response with SecondDeliveryAppointmentTimeSlotsErrorResponse type | Error
    modal is displayed with:Modal title: Something Went Wrong | Error message: Sorry,
    something went wrong. Please try again. | Cancel button (left side, secondary
    style) | Retry button (right side, primary style - blue) | User remains on Select
    Date and Time screen (background dimmed with modal overlay) | Calendar remains
    visible but time slot section is in error state'
- id: 2
  action: Tap Retry button
  expected: 'Error modal is dismissed | SecondDeliveryAppointmentsAtVirtual query
    is triggered again | If retry succeeds: Available time slots are displayed in
    the time slot list | If retry fails: Error modal is displayed again with same
    messaging and options'
- id: 3
  action: Tap Cancel button (when error modal is displayed)
  expected: 'Error modal is dismissed | iOS: User is redirected to Vehicle screen
    | Android: User remains on Select Date and Time screen'
