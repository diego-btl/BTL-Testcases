description: 'Book Second Delivery Appointment - Success (Virtual): Booking Submission
  ConfirmationValidates successful virtual appointment booking submission. Tests that
  CreateSecondDeliveryAppointment mutation is triggered with all collected booking
  data and displays success confirmation screen with proper messaging and calendar
  option.Notes:BOOK VIRTUAL APPOINTMENT button triggers CreateSecondDeliveryAppointment
  mutation with all collected booking dataSuccess redirects to Appointment Scheduled
  screenConfirmation message and Add to Calendar option displayedBooking process completed
  successfullyEligibility state changes to AppointmentBookedPreconditions:User is
  logged inEligible INFINITI VIN in focusEligibility: SecondDeliveryEligibilityResponseRDRRecordFoundFeature
  Flag: EnableSecondDelivery = trueUser is on Review screen (Step 3 of 3)Date and
  time have been selectedContact information has been entered'
steps:
- id: 1
  action: On Review screen, tap BOOK VIRTUAL APPOINTMENT button
  expected: 'CreateSecondDeliveryAppointment mutation is triggered with all booking
    details as payload (date, time, contact info, VIN, special instructions) | User
    is redirected to Appointment Scheduled screen | Screen title is Appointment Scheduled
    | Green checkmark icon is displayed (circle with white checkmark) | Success message
    is displayed: An email confirmation with an appointment personalization link has
    been sent. | ADD TO CALENDAR button is displayed | Close (X) button is displayed
    at top right | Bottom navigation is visible and accessible'
