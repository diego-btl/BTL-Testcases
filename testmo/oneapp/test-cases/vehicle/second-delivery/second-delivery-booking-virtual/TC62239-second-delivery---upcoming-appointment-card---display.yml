description: 'Second Delivery - Upcoming Appointment Card Display: Booked Appointment
  Card Validation and NavigationValidates that after successfully booking a Second
  Delivery appointment, the Upcoming Virtual Appointment card is displayed on the
  Vehicle screen with correct appointment information, proper priority placement,
  and that tapping the card navigates to the Upcoming Appointment details screen.Notes:User
  has successfully completed booking flow and appointment is confirmedEligibility
  state is SecondDeliveryEligibilityResponseAppointmentBookedUpcoming Virtual Appointment
  card displays on Vehicle screenPriority: If there are existing Schedule Service
  appointments, Second Delivery appointment card displays on top and takes priorityCard
  is tappable and navigates to Upcoming Appointment details screen'
steps:
- id: 1
  action: 'Mock the SecondDeliveryAppointment query to return: -> { "data": { "vehicle":
    { "__typename": "Vehicle", "secondDelivery": { "__typename": "SecondDelivery",
    "appointment": { "__typename": "SecondDeliveryExistingBookedAppointment", "id":
    20498452, "activityId": 20498452, "beginsAt": "2026-01-02T19:30:00.000Z", "address":
    { "__typename": "Address", "address1": "1413 test address", "address2": null,
    "city": "los angeles ", "state": "CA", "postalCode": "90012", "country": "US"
    }, "contact": { "__typename": "SecondDeliveryContactInformation", "firstName":
    "Nna", "lastName": "Qa", "phoneNumber": "5487545464", "email": "nnaqa@bethinklabs.com"
    }, "redeliveryNotes": null, "featureNotes": null, "hub": { "__typename": "SecondDeliveryHub",
    "id": 1000000, "timezone": "US/Pacific", "dealer": { "__typename": "SecondDeliveryDealer",
    "code": "999991", "address": { "__typename": "SecondDeliveryDealerAddress", "coordinates":
    null, "address1": "325 W Gardena Blvd", "address2": null, "state": "CA", "city":
    "Gardena", "country": "US", "id": 132498250, "postalCode": "90248" } } }, "mode":
    "VIRTUAL" } } } } }Navigate to Vehicle screen'
  expected: Mock data is set for SecondDeliveryAppointment query | User is on Vehicle
    screen
- id: 2
  action: Verify Upcoming Virtual Appointment card is displayed
  expected: 'Upcoming Virtual Appointment card is displayed on Vehicle screen | If
    Schedule Service appointments exist (e.g., "Upcoming Appointment" with dealer
    name), Second Delivery card displays above Schedule Service cards (takes priority)
    | Card title: Upcoming Virtual Appointment | Card displays:Calendar icon on left
    | Appointment title: MyINFINITI Expert | Appointment details in format: [Day],
    [Month] [Date], [Year] @ [Time] (e.g., "Fri, Jan 2, 2026 @ 11:30 AM") | Card is
    tappable/clickable | Second Delivery booking card is NOT displayed (user already
    has appointment booked)'
- id: 3
  action: Tap on Upcoming Virtual Appointment card
  expected: 'User is navigated to Upcoming Appointment details screen | Screen title:
    Upcoming Appointment is displayed at top | Back button (<) is visible in top-left
    corner | All appointment details are displayed (validated in separate test case)'
