description: 'Second Delivery - Upcoming Appointment Screen Display: Complete Screen
  ValidationValidates that the Upcoming Appointment details screen displays all appointment
  information correctly including header, vehicle image, Date and Time card, Contact
  Information card, appointment notes, and action buttons (Add to Calendar, Edit Appointment,
  Cancel Appointment).Notes:User has navigated from Vehicle screen by tapping Upcoming
  Virtual Appointment cardAll appointment details should match the booked appointment
  dataDate and Time format should be consistentContact information should display
  with proper formattingAction buttons should be visible and accessible'
steps:
- id: 1
  action: 'Mock the SecondDeliveryAppointment query to return: -> { "data": { "vehicle":
    { "__typename": "Vehicle", "secondDelivery": { "__typename": "SecondDelivery",
    "appointment": { "__typename": "SecondDeliveryExistingBookedAppointment", "id":
    20498452, "activityId": 20498452, "beginsAt": "2026-01-02T19:30:00.000Z", "address":
    { "__typename": "Address", "address1": "1413 test address", "address2": null,
    "city": "los angeles ", "state": "CA", "postalCode": "90012", "country": "US"
    }, "contact": { "__typename": "SecondDeliveryContactInformation", "firstName":
    "Nna", "lastName": "Qa", "phoneNumber": "5487545464", "email": "nnaqa@bethinklabs.com"
    }, "redeliveryNotes": null, "featureNotes": null, "hub": { "__typename": "SecondDeliveryHub",
    "id": 1000000, "timezone": "US/Pacific", "dealer": { "__typename": "SecondDeliveryDealer",
    "code": "999991", "address": { "__typename": "SecondDeliveryDealerAddress", "coordinates":
    null, "address1": "325 W Gardena Blvd", "address2": null, "state": "CA", "city":
    "Gardena", "country": "US", "id": 132498250, "postalCode": "90248" } } }, "mode":
    "VIRTUAL" } } } } }Navigate to Upcoming Appointment screen'
  expected: Mock data is set for SecondDeliveryAppointment query | User is on Upcoming
    Appointment screen
- id: 2
  action: Verify screen header and vehicle information is displayed
  expected: 'Screen title: Upcoming Appointment is displayed at top | Back button
    (<) is visible in top-left corner | MyINFINITI Expert header text is displayed
    | hr Virtual Appointment subtitle is displayed | Vehicle image is displayed (matching
    in-focus VIN model, e.g., red Q60)'
- id: 3
  action: Verify Date and Time card is displayed
  expected: 'Date and Time card is displayed with rounded border | Calendar icon is
    displayed on left side of card header | Card title: Date and Time is displayed
    | Date is displayed in format: [Day of Week], [Month] [Date], [Year] (e.g., "Monday,
    December 22, 2025") | Time is displayed in format: [Hour]:[Minute] [AM/PM] (e.g.,
    "10:30 AM")'
- id: 4
  action: Verify Contact Information card is displayed
  expected: 'Contact Information card is displayed with rounded border | Phone icon
    is displayed on left side of card header | Card title: Contact Information is
    displayed | Contact details are displayed:First Name: Nna | Last Name: Qa | Phone
    Number: (548) 754-5464 (formatted with parentheses and spaces) | Email: nnaqa@bethinklabs.com
    | Appt. Notes: [Displays notes if entered, or field is omitted if null]'
- id: 5
  action: Verify action buttons and navigation are displayed
  expected: ADD TO CALENDAR link/button is displayed (between Contact card and Edit
    button) | Edit Appointment button is displayed with dark background (primary style)
    | Cancel Appointment button is displayed below Edit button (secondary/outline
    style) | Bottom navigation bar is visible with all tabs (Home, Vehicle, Map, Support,
    Settings) | All elements are accessible and tappable
- id: 6
  action: Tap Back button (<)
  expected: User is navigated back to Vehicle screen | Upcoming Virtual Appointment
    card remains displayed | No changes to appointment data
