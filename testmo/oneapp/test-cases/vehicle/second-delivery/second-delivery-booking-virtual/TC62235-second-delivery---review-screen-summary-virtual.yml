description: 'Second Delivery - Review Screen Summary (Virtual). Validates the Review
  screen displays all appointment details, vehicle information, and summary cards
  correctly with proper formatting and edit functionality.Notes:Screen flow: Step
  3 of 3 (Select Date and Time → Contact and Notes → Review)UI validation only - does
  not trigger booking submissionSummary cards include Edit buttons for user modificationsVehicle
  image corresponds to in-focus VINFor complete booking workflow validation, see test
  case: "Book Second Delivery Appointment - Success"Feature Flag: EnableSecondDelivery
  is set to true'
preconditions:
- description: User logged in
- description: Eligible VIN in focus
- description: 'Eligibility: SecondDeliveryEligibilityResponseRDRRecordFound'
- description: 'Feature Flag: EnableSecondDelivery=true'
- description: User has selected a valid date/time on Select Date and Time screen
- description: User has entered contact information and optional notes on Contact
    and Notes screen
- description: User tapped NEXT on Contact and Notes and is on Review screen
steps:
- id: 1
  action: Verify Review screen is displayed
  expected: 'Screen title: Review | Progress indicator shows Step 3 of 3 | MyINFINITI
    Expert header is displayed | hr Virtual Appointment subtitle is displayed | Vehicle
    image is displayed (in-focus VIN model) | Date and Time summary card with:Calendar
    icon on left | Card title: Date and Time | Edit button on right | Date and time
    values displayed (e.g., "Date: Monday, December 22, 2025", "Time: 11:00 AM") |
    Contact Information summary card with:Phone icon on left | Card title: Contact
    Information | Edit button on right | Contact values displayed (First Name, Last
    Name, Phone Number, Email) | BOOK VIRTUAL APPOINTMENT button is visible and enabled
    | CANCEL button is visible'
