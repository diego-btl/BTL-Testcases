description: 'Second Delivery - Contact and Notes. Validates step progression, prepopulated
  contact fields, optional notes entry, and navigation to Review.Notes:Screen flow:
  Step 2 of 3 (Select Date and Time → Contact and Notes → Review)Feature Flag: EnableSecondDelivery
  is set to true'
preconditions:
- description: User logged in
- description: Eligible VIN in focus
- description: 'Eligibility: SecondDeliveryEligibilityResponseRDRRecordFound'
- description: 'Feature Flag: EnableSecondDelivery=true'
- description: User has selected a valid date/time on Select Date and Time screen
    and tapped NEXT
- description: User is on Contact and Notes screen
steps:
- id: 1
  action: Verify Contact and Notes screen is displayed
  expected: 'Screen title: Contact and Notes | Progress indicator shows Step 2 of
    3 | Contact fields are displayed and prepopulated (First Name, Last Name, Email,
    Phone Number) | NEXT button is enabled by default'
- id: 2
  action: Enter optional notes text
  expected: Notes text is accepted and persists
- id: 3
  action: Tap NEXT button
  expected: User is redirected to Review screen | Progress indicator shows Step 3
    of 3 | Selected date/time is displayed (retained) | Contact information is displayed
    (retained) | Optional notes is displayed (retained)
