  steps:
  - column_name: custom_steps
    id: 97129
    case_id: 62238
    text1: "<p>Mock <code>SecondDeliveryAppointmentsAtVirtual</code> query to return\
      \ error:</p><pre><code class=\"editor-plain language-plain code-block\">{\n\
      \  \"data\": {\n    \"vehicle\": {\n      \"__typename\": \"Vehicle\",\n   \
      \   \"secondDelivery\": {\n        \"__typename\": \"SecondDelivery\",\n   \
      \     \"appointments\": {\n          \"__typename\": \"SecondDeliveryAppointments\"\
      ,\n          \"atVirtual\": {\n            \"__typename\": \"SecondDeliveryAppointmentTimeSlotsErrorResponse\"\
      ,\n            \"message\": \"Failed to fetch time slots. Please try again later.\"\
      \n          }\n        }\n      }\n    }\n  }\n}</code></pre><p>On <code>Select\
      \ Date and Time</code> screen, observe time slot loading behavior</p>"
    text2: null
    text3: '<ul><li><code>SecondDeliveryAppointmentsAtVirtual</code> query is triggered</li><li>API
      returns error response with <code>SecondDeliveryAppointmentTimeSlotsErrorResponse</code>
      type</li><li><strong>Error modal</strong> is displayed with:<ul><li>Modal title:
      <code>Something Went Wrong</code></li><li>Error message: <code>Sorry, something
      went wrong. Please try again.</code></li><li><code>Cancel</code> button (left
      side, secondary style)</li><li><code>Retry</code> button (right side, primary
      style - blue)</li></ul></li><li>User remains on <code>Select Date and Time</code>
      screen (background dimmed with modal overlay)</li><li>Calendar remains visible
      but time slot section is in error state</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 97130
    case_id: 62238
    text1: <p>Tap <code>Retry</code> button</p>
    text2: null
    text3: '<ul><li>Error modal is dismissed</li><li><code>SecondDeliveryAppointmentsAtVirtual</code>
      query is triggered again</li><li>If retry succeeds: Available time slots are
      displayed in the time slot list</li><li>If retry fails: Error modal is displayed
      again with same messaging and options</li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 97131
    case_id: 62238
    text1: <p>Tap <code>Cancel</code> button (when error modal is displayed)</p>
    text2: null
    text3: <ul><li>Error modal is dismissed</li><li><strong>iOS:</strong> User is
      redirected to <code>Vehicle</code> screen</li><li><p><strong>Android:</strong>
      User remains on <code>Select Date and Time</code> screen</p><p> </p></li></ul>
    text4: null
