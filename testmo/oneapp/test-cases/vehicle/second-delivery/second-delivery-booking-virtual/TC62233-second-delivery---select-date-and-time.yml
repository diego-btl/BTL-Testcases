description: 'Second Delivery - Select Date and Time. Validates the date and time
  selection screen where users choose an available appointment slot and progress to
  Contact and Notes.Notes:Screen flow: Step 1 of 3 (Select Date and Time → Contact
  and Notes → Review)Time slots are fetched from SecondDeliveryAppointmentsAtVirtual
  APIFeature Flag: EnableSecondDelivery is set to true'
preconditions:
- description: User logged in
- description: Eligible VIN in focus
- description: 'Eligibility: SecondDeliveryEligibilityResponseRDRRecordFound'
- description: 'Feature Flag: EnableSecondDelivery=true'
- description: User is on Select Date and Time screen
- description: 'Time slots are available from API: SecondDeliveryAppointmentsAtVirtual'
- description: This is Step 1 of 3 in the flow (Select Date and Time → Contact and
    Notes → Review)
steps:
- id: 1
  action: Verify Select Date and Time screen is displayed with calendar
  expected: 'Screen title: Select Date and Time | Progress indicator shows Step 1
    of 3 | Calendar is displayed | At least one selectable/available date is present
    | Select an Available Time section is visible | NEXT button is disabled by default'
- id: 2
  action: Tap an available date
  expected: Date is selected | Time slots list updates for the selected date in Select
    an Available Time section
- id: 3
  action: Tap an available time slot
  expected: Time slot is selected | NEXT button becomes enabled
- id: 4
  action: Tap NEXT button
  expected: User is redirected to Contact and Notes screen | Progress indicator on
    Contact and Notes shows Step 2 of 3
