steps:
- id: 1
  action: Start editing an appointment. -> Make changes (e.g., date/time). -> Click
    "Cancel". -> Verify the appointment remains unchanged.
  expected: The appointment should remain unchanged when the user cancels the edit,
    and the user should be returned to the appointment details page.
