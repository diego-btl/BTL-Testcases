description: 'Second Delivery - Home Screen Card Entry. Validates that tapping Second
  Delivery Card on Home screen navigates user directly to virtual appointment booking
  flow (Select Date and Time screen).Notes:Entry point: Home screen Second Delivery
  Card (prioritized state, first 30 days)Card only visible on Home when prioritized:
  truePrimary entry point for new/priority usersAPI: SecondDeliveryAppointmentsAtVirtual
  called on tapRoutes directly to virtual booking (no appointment type selection)Feature
  Flag: EnableSecondDelivery is set to true'
preconditions:
- description: User logged in
- description: Eligible VIN in focus
- description: User on Home screen
- description: 'Eligibility: SecondDeliveryEligibilityResponseRDRRecordFound'
- description: 'prioritized: true'
- description: daysSincePurchased < 30
- description: 'Feature Flag: EnableSecondDelivery is set to true'
steps:
- id: 1
  action: Verify MyINFINITI Expert card is displayed on Home screen
  expected: Card is displayed
- id: 2
  action: Tap MyINFINITI Expert card body
  expected: SecondDeliveryAppointmentsAtVirtual API is called for the in-focus VIN
    | User is redirected to the Select Date and Time screen | Screen title Select
    Date and Time is displayed
