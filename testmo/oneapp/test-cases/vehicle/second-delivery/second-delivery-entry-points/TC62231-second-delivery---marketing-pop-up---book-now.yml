description: 'Second Delivery - Marketing Pop-up Book Now Entry. Validates that tapping
  BOOK NOW button in marketing pop-up navigates user directly to virtual appointment
  booking flow (Select Date and Time screen) and dismisses the pop-up.Notes:Entry
  point: Marketing pop-up BOOK NOW buttonPop-up appears when: versionToDisplay is
  "REMIND_ME_LATER" or "NO_THANKS" AND daysSincePurchased <= 60Alternative entry point
  for users with active marketing pop-upAPI: SecondDeliveryAppointmentsAtVirtual called
  on tapPop-up must be dismissed after BOOK NOW tapRoutes directly to virtual booking
  (no appointment type selection)Feature Flag: EnableSecondDelivery is set to true'
preconditions:
- description: User logged in
- description: Eligible VIN in focus
- description: 'Eligibility: SecondDeliveryEligibilityResponseRDRRecordFound'
- description: 'Feature Flag: EnableSecondDelivery=true'
- description: Marketing pop-up is displayed with BOOK NOW
steps:
- id: 1
  action: Verify marketing pop-up is displayed with BOOK NOW
  expected: Marketing pop-up is displayed with BOOK NOW button
- id: 2
  action: Tap BOOK NOW button
  expected: SecondDeliveryAppointmentsAtVirtual API is called for the in-focus VIN
    | User is redirected to the Select Date and Time screen | Screen title Select
    Date and Time is displayed
