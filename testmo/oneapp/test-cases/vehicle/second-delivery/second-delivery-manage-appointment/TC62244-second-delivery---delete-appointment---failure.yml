description: 'Second Delivery - Delete Appointment - Failure: Error HandlingValidates
  that when deleting an appointment fails, the system displays an error toast, keeps
  the user on the Upcoming Appointment screen, and allows the user to retry deletion.Notes:User
  has an existing booked Second Delivery appointmentCancelSecondDeliveryAppointment
  mutation returns failure responseError toast displays on Upcoming Appointment screenUser
  remains on Upcoming Appointment screen after failureUser can tap Cancel Appointment
  button again to retryConfirmation modal appears again on retry attempt'
steps:
- id: 1
  action: 'Mock the SecondDeliveryAppointment query to return: -> { "data": { "vehicle":
    { "__typename": "Vehicle", "secondDelivery": { "__typename": "SecondDelivery",
    "appointment": { "__typename": "SecondDeliveryExistingBookedAppointment", "id":
    20498452, "activityId": 20498452, "beginsAt": "2026-01-02T19:30:00.000Z", "address":
    { "__typename": "Address", "address1": "1413 test address", "address2": null,
    "city": "los angeles", "state": "CA", "postalCode": "90012", "country": "US" },
    "contact": { "__typename": "SecondDeliveryContactInformation", "firstName": "Nna",
    "lastName": "Qa", "phoneNumber": "5487545464", "email": "nnaqa@bethinklabs.com"
    }, "redeliveryNotes": "Test appointment notes", "featureNotes": null, "hub": {
    "__typename": "SecondDeliveryHub", "id": 1000000, "timezone": "US/Pacific", "dealer":
    { "__typename": "SecondDeliveryDealer", "code": "999991", "address": { "__typename":
    "SecondDeliveryDealerAddress", "coordinates": null, "address1": "325 W Gardena
    Blvd", "address2": null, "state": "CA", "city": "Gardena", "country": "US", "id":
    132498250, "postalCode": "90248" } } }, "mode": "VIRTUAL" } } } } }Navigate to
    Upcoming Appointment screen'
  expected: Mock data is set for SecondDeliveryAppointment query | User is on Upcoming
    Appointment screen
- id: 2
  action: Tap Cancel Appointment button
  expected: 'Confirmation modal is displayed | Modal title: Cancel Appointment? |
    Modal message: Are you sure you want to cancel your appointment? | Nevermind button
    is displayed | Yes, Cancel button is displayed | Background is dimmed/overlayed'
- id: 3
  action: 'Mock the CancelSecondDeliveryAppointment mutation to return failure: ->
    { "data": { "cancelSecondDeliveryAppointment": { "__typename": "CancelSecondDeliveryAppointmentSuccessResponse",
    "success": false } } }Tap Yes, Cancel button'
  expected: 'CancelSecondDeliveryAppointment mutation is triggered | Modal is dismissed
    | User remains on Upcoming Appointment screen | Error toast message is displayed:
    Appointment not cancelled | Appointment details remain unchanged | All cards and
    buttons remain visible | Cancel Appointment button is still available'
- id: 4
  action: Tap Cancel Appointment button again (to retry)
  expected: 'Confirmation modal is displayed again | Modal title: Cancel Appointment?
    | Modal message: Are you sure you want to cancel your appointment? | Nevermind
    button is displayed | Yes, Cancel button is displayed | User can attempt deletion
    again'
