description: 'https://www.pivotaltracker.com/story/show/185987331Stories:Android:
  [MoveTirePressure][Android] Update MIL Data Sharing card to info paneliOS: [MoveTirePressure][iOS]
  Update MIL Data Sharing card to info panelSCOPEWhen MIL Data Sharing is not enabled,
  show an info panel at the top of the MIL tab on the Vehicle Status screenIf it''s
  enabled, show this panel at the bottom of the screen and update the CTA text to
  be Manage PreferencesThis info panel should show regardless of whether there is
  an active MIL'
preconditions:
- description: AVK2 or EVO vehicle (AVK2, EVAVK2, EVO, EVEVO)
- description: User does not need to have active MILs
- description: 'User has at least one Vehicle status enabled (e.g: tire pressure PSI)'
- description: User has MECHANICAL_REPAIR capability enabled
- description: GrantMechanicalRepair FF is enabled
steps:
- id: 1
  action: Tap toggle to enable/disable Enable Data Sharing -> Wait for the failure,
    tap Ok -> Tap toggle to disable/enable Enable Data Sharing -> Wait for the failure,
    tap Ok
  expected: User should see a loading spinner while API is loading2. User should see
    a Something went wrong error modalUser should see the error modal dismiss and
    the UI revert back to the previous setting3/4. User should see the same behaviour
    as steps 2/3
- id: 2
  action: Tap toggle to enable/disable SMS/Cell/Email -> Wait for the failure, tap
    Ok -> Tap toggle to enable/disable SMS/Cell/Email -> Wait for the failure, tap
    Ok
  expected: User should see a loading spinner while API is loading2. User should see
    a Something went wrong error modalUser should see the error modal dismiss and
    the toggle revert back to the previous setting3/4. User should see the same behaviour
    as steps 2/3
