metadata:
  name: MIL Status ENABLED - Mechanical Repair card status
  priority: 12
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <ul><li>AVK2 or EVO vehicle (AVK2, EVAVK2, EVO, EVEVO)</li><li>User
    has at least one MIL status enabled</li><li>User has MECHANICAL_REPAIR capability
    enabled</li><li><code>GrantMechanicalRepair</code> FF is <strong>enabled</strong></li></ul>
  steps:
  - column_name: custom_steps
    id: 3232
    case_id: 2845
    text1: <p>Mock <code>vehicle.preferences.communication.milDataSharing.enabled
      == false</code> &gt; Tap on the MIL status card on the vehicle screen</p>
    text2: null
    text3: '<p>User should be brought to the Vehicle Status screen with the corresponding
      MIL shown and:</p><ul><li>Info panel is shown <strong>at the top</strong> of
      the tab</li><li>Panel has <strong>red border</strong> per design</li><li>CTA
      text is <strong>“Enable Data Sharing”</strong></li><li>The subtitle says: Not
      Sharing</li></ul><figure class="image"><img src="/attachments/view/8834" alt="8834"
      /></figure>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95779
    case_id: 2845
    text1: <p>Tap on the <strong>Enable Data Sharing</strong> CTA on the info panel</p>
    text2: null
    text3: <p>User is navigated to <strong>Vehicle Maintenance Data Sharing screen</strong></p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95785
    case_id: 2845
    text1: <p>Toggle ON Enabled Data Sharing toggle</p>
    text2: null
    text3: <p>Verified that a call is triggered for <code>UpdateVehiclePreferences</code>,
      the request is sent with all toggles set to true and all sub-toggles are true
      by default.</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95789
    case_id: 2845
    text1: <p>Tab on the back button </p>
    text2: null
    text3: <p>Verify the user is taken to the Vehicle Status screen and the info panel
      is shown now at the bottom of the screen</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 95790
    case_id: 2845
    text1: <p>Tap on the <strong>Manage Preferences</strong> CTA on the info panel</p>
    text2: null
    text3: <p>User is navigated to <strong>Vehicle Maintenance Data Sharing screen</strong></p><figure
      class="image"><img src="/attachments/view/8835" alt="8835" /></figure>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 95791
    case_id: 2845
    text1: <p>Toggle Off the Enable Data Sharing toggle</p>
    text2: null
    text3: <p>Verify <code>UpdateVehiclePreferences</code> api is triggered and the
      request is sent with all toggles set to false</p>
    text4: null
    display_order: 6
