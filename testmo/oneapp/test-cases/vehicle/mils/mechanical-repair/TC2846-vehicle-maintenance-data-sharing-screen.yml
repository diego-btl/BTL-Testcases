metadata:
  name: Vehicle Maintenance Data Sharing screen
  priority: 2
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: '<ul><li>AVK2 or EVO vehicle (AVK2, EVAVK2, EVO, EVEVO)</li><li>User
    does not need to have active MILs</li><li>User has at least one Vehicle status
    enabled (e.g: tire pressure PSI)</li><li>User has MECHANICAL_REPAIR capability
    enabled</li><li><code>GrantMechanicalRepair</code> FF is <strong>enabled</strong></li></ul>'
  steps:
  - column_name: custom_steps
    id: 95800
    case_id: 2846
    text1: <p>Go to the <strong>MIL</strong> tab &gt; Tab on <code>Enable data sharing</code>
      or <code>Manage Preferences</code> (depending on what <strong>VehiclePreferences</strong>
      API fetches)</p>
    text2: null
    text3: <p>User is navigated to <strong>Vehicle Maintenance Data Sharing screen. </strong></p><figure
      class="image"><img src="/attachments/view/8839" alt="8839" /></figure><figure
      class="image"><img src="/attachments/view/8841" alt="8841" /></figure>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95801
    case_id: 2846
    text1: <p>If the <code>Enabling Data Sharing</code> toggle is OFF (based on what
      we get on VehiclePreferences)</p>
    text2: null
    text3: <p>Verify no sub-toggles are displayed on the screen</p>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95802
    case_id: 2846
    text1: <p>If the <code>Enabling Data Sharing</code> toggle is ON (based on what
      we get on VehiclePreferences)</p>
    text2: null
    text3: <p>Verify sub-toggles are displayed on the screen:</p><ul><li>SMS Messages</li><li>Cell
      Phone</li><li>Email</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95803
    case_id: 2846
    text1: <p>Disable all of the Subtoggles </p>
    text2: null
    text3: <p>Verify for each one of the enable/disable actions, will trigger a call
      for <code>UpdateVehiclePreferences</code> and the main <code>Enabled Data Sharing</code>
      toggle remains active</p>
    text4: null
    display_order: 4
