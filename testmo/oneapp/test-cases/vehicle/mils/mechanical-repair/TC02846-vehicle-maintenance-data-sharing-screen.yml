description: 'https://www.pivotaltracker.com/story/show/185987327Stories:Android:
  [MoveTirePressure][Android] Update MIL Data Sharing card to info paneliOS: [MoveTirePressure][iOS]
  Update MIL Data Sharing card to info panelSCOPEWhen MIL Data Sharing is not enabled,
  show an info panel at the top of the MIL tab on the Vehicle Status screenIf it''s
  enabled, show this panel at the bottom of the screen and update the CTA text to
  be Manage PreferencesThis info panel should show regardless of whether there is
  an active MIL'
preconditions:
- description: AVK2 or EVO vehicle (AVK2, EVAVK2, EVO, EVEVO)
- description: User does not need to have active MILs
- description: 'User has at least one Vehicle status enabled (e.g: tire pressure PSI)'
- description: User has MECHANICAL_REPAIR capability enabled
- description: GrantMechanicalRepair FF is enabled
steps:
- id: 1
  action: Go to the MIL tab > Tab on Enable data sharing or Manage Preferences (depending
    on what VehiclePreferences API fetches)
  expected: User is navigated to Vehicle Maintenance Data Sharing screen.
- id: 2
  action: If the Enabling Data Sharing toggle is OFF (based on what we get on VehiclePreferences)
  expected: Verify no sub-toggles are displayed on the screen
- id: 3
  action: If the Enabling Data Sharing toggle is ON (based on what we get on VehiclePreferences)
  expected: SMS Messages | Cell Phone | Email
- id: 4
  action: Disable all of the Subtoggles
  expected: Verify for each one of the enable/disable actions, will trigger a call
    for UpdateVehiclePreferences and the main Enabled Data Sharing toggle remains
    active
