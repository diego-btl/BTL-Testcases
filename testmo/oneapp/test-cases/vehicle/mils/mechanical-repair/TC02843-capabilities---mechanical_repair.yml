metadata:
  id: TC02843
  name: Capabilities - MECHANICAL_REPAIR
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-09-13'
  updated: '2025-12-01'
  author: user_4
  testmo_id: 65683
  folder_id: 432
description: https://www.pivotaltracker.com/story/show/185988662
preconditions:
- description: AVK2 vehicle
- description: '"GrantMechanicalRepair": "{\"enabled\": true, \"checkCapability\":
    true}",'
- description: '"GrantMechanicalRepair": "{\"enabled\": true, \"checkCapability\":
    false}",'
- description: '"GrantMechanicalRepair": "{\"enabled\": false, \"checkCapability\":
    true}",'
- description: '"GrantMechanicalRepair": "{\"enabled\": false, \"checkCapability\":
    false}",'
- description: Valid response on VehiclePreferences call, e.g.
steps:
- id: 1
  action: Mock capabilities so that MECHANICAL_REPAIR is missing -> Go to Preferred
    dealer screen -> Go to MILs Status screen (with at least 1 MIL active)
  expected: /3. User should not see the Mechanical Repair card
- id: 2
  action: Mock capabilities so that MECHANICAL_REPAIR is set to false -> Go to Preferred
    dealer screen -> Go to MILs Status screen (with at least 1 MIL active)
  expected: /3. User should not see the Mechanical Repair card
- id: 3
  action: Mock capabilities so that MECHANICAL_REPAIR is set to true -> Go to Preferred
    dealer screen -> Go to MILs Status screen (with at least 1 MIL active)
  expected: /3. User should see the Mechanical Repair card
- id: 4
  action: Mock capabilities so that MECHANICAL_REPAIR is set to true -> Go to Preferred
    dealer screen -> Go to MILs Status screen (with NO MILs active and at least 1
    VehicleStatus active)
  expected: /3. User should see the Mechanical Repair card
