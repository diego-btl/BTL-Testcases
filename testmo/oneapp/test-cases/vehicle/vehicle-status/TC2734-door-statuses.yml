      />-hatch<br />-sunroof<br />-trunk<br />-overallLock</li><li>For each door,
      possible statuses include<br />-ajar:[CLOSED | OPEN]<br />-window:[CLOSED |
      OPEN] (this is also dependent on accessories details for windowstatus)<br />-lock:
      [LOCKED | UNLOCKED]</li><li>For engineHood, hatch, sunroof, possible statuses
      include<br />-ajar: [CLOSED | OPEN]</li><li>For trunk and overallLock, possible
      statuses include<br />-lock: [LOCKED | UNLOCKED]</li><li>Tap on Vehicle Status
      card on home screen or Vehicle Status warning on vehicle image</li><li>Tap on
      Vehicle Status card on vehicle screen or Vehicle Status warning on vehicle image</li></ol>'
    text2: null
    text3: <p>2. User should see corresponding vehicle status shown on home/vehicle
      screens if statuses are OPEN/UNLOCKED<br />3. User should see corresponding
      vehicle status shown on home/vehicle screens if statuses are OPEN<br />4.  User
      should see trunk vehicle status shown on home/vehicle screens if statuses are
