metadata:
  name: Verify Subscription EndDate is hidden when EndDate = null, "" or "1970-01-01T00:00:00.000Z"
  priority: 1
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: <ul><li><code>EnableTelematicsBSM</code> FF = <strong>true</strong>.</li><li>User
    logged in with the relevant subscription(s).</li><li>App is at initial launch
    state (no cached states interfering).</li><li>Mock <code>serviceType = "Subscription"</code>
    on vehicleSubscriptions api</li></ul>
  steps:
  - column_name: custom_steps
    id: 95264
    case_id: 61947
    text1: <p>Launch the app &gt; Navigate to the <strong>Vehicle screen &gt; </strong>Tap
      on <strong>Subscription Packages</strong>.</p>
    text2: null
    text3: <p>The subscriptions screen is shown successfully and populates according
      to the information fetched on VehicleSubscriptions</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 95265
    case_id: 61947
    text1: <p>Mock <code><strong>subscriptionEndDate</strong>=null</code> and serviceType
      = "Subscription" &gt;Tap on <strong>Subscription Packages</strong> card </p>
    text2: null
    text3: <ul><li>Subscription package <strong>is displayed</strong>.</li><li>The
      subtitle is <strong>hidden</strong> on the package card</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 95267
    case_id: 61947
    text1: <p>Mock <code><strong>subscriptionEndDate</strong>= "1970-01-01T00:00:00.000Z"</code>
      and serviceType = "Subscription" &gt;Tap on <strong>Subscription Packages</strong>
      card </p>
    text2: null
    text3: <ul><li>Subscription package <strong>is displayed</strong>.</li><li>The
      subtitle is <strong>hidden</strong> on the package card</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 95268
    case_id: 61947
    text1: <p>Mock <code><strong>subscriptionEndDate</strong>= "0"</code> and serviceType
      = "Subscription" &gt;Tap on <strong>Subscription Packages</strong> card </p>
    text2: null
    text3: <ul><li>Subscription package <strong>is displayed</strong>.</li><li>The
