  folder_path: vehicle/telematics-bsm-subscriptions-packages
  folder_name_ui: Telematics BSM - Subscriptions Packages
  created_at: '2025-11-12 13:50:10.206830'
  updated_at: '2025-12-09 17:23:05.883729'
  last_sync: '2026-01-30T18:21:05.326749Z'
