metadata:
  id: TC61945
  name: Verify Trial EndDate is shown on a package subtitle
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-07'
  updated: '2025-12-09'
