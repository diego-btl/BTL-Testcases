metadata:
  id: TC61948
  name: Verify Trial EndDate is hidden when EndDate = null, "" or "1970-01-01T00:00:00.000Z"
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-07'
  updated: '2025-12-09'
  author: user_15
  testmo_id: 65621
  folder_id: 3863
preconditions:
- description: EnableTelematicsBSM FF = true.
- description: User logged in with the relevant subscription(s).
- description: App is at initial launch state (no cached states interfering).
- description: Mock serviceType = "Trial" on vehicleSubscriptions api
steps:
- id: 1
  action: Launch the app > Navigate to the Vehicle screen > Tap on Subscription Packages.
  expected: The subscriptions screen is shown successfully and populates according
    to the information fetched on VehicleSubscriptions
- id: 2
  action: Mock subscriptionEndDate=null and serviceType = "Trial" >Tap on Subscription
    Packages card
  expected: Subscription package is displayed. | The subtitle is hidden on the package
    card
- id: 3
  action: Mock subscriptionEndDate= "1970-01-01T00:00:00.000Z" and serviceType = "Trial"
    >Tap on Subscription Packages card
  expected: Subscription package is displayed. | The subtitle is hidden on the package
    card
- id: 4
  action: Mock subscriptionEndDate= "0" and serviceType = "Trial" >Tap on Subscription
    Packages card
  expected: Subscription package is displayed. | The subtitle is hidden on the package
    card
