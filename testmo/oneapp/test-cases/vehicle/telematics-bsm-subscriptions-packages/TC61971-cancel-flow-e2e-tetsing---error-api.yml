preconditions:
- description: EnableTelematicsBSM FF = true
- description: 'Cancel subscription cta must be visible: For this EndDate of the package
    should be null or 0'
- description: subscriptionServiceType = "Subscription"
steps:
- id: 1
  action: On the Vehicle page, tap on the Subscription Packages card
  expected: Verify the Subscriptions screen is shown
- id: 2
  action: Tap on CANCEL SUBSCRIPTION cta again > YES, CANCEL SUBSCRIPTION cta > Select
    the checkbox > Breakpoint CancelSubscription API > Tap on YES, CANCEL SUBSCRIPTION
    cta
  expected: Go back and | Try again options
- id: 3
  action: Tap on Try again option
  expected: If it fails, Something went wrong modal is shown again | If it succeeds,
    the user continues with the flow
- id: 4
  action: Tap on Go back option
  expected: Verify app takes the user to Wait! We're sorry...screen
