metadata:
  id: TC62076
  name: BSM WiFi Upgrade CTA Hidden (usage <75%)
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-12-02'
  updated: '2025-12-09'
  author: user_15
  testmo_id: 62076
  folder_id: 3863
description: This is an NNA and NCI feature
preconditions:
- description: EnableTelematicsBSM FF ON
- description: Premium Package active
- description: Premium Plus w/Unlimited WiFi package available for purchase
- description: Login with a vehicle MY>=26
steps:
- id: 1
  action: Mock VehicleWifiConsumption to have <75% > Navigate to Vehicle screen >
    Subscription Packages
  expected: 'Subtitle: Wi-Fi Data Usage: [usageAmount] of [dataCapAmount] - [usagePercent
    ]% | Progress bar: Green | Text: Updated [MM/DD/YYYY] at [TimePM/AM] EDT (this
    comes from updatedAt parameter) | Upgrade Now CTA is not shown'
- id: 2
  action: If the VehicleWifiConsumption API returns null or fails
  expected: Verify that the Wi-Fi information is not displayed and the Premium package
    is shown without problems based on the information received on VehicleSubscriptions
