metadata:
  id: TC61946
  name: Verify subscription EndDate is shown on a package subtitle
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-07'
  updated: '2025-12-09'
  author: user_15
  testmo_id: 65613
  folder_id: 3863
preconditions:
- description: EnableTelematicsBSM FF = true.
- description: User logged in with the relevant subscription(s).
- description: App is at initial launch state (no cached states interfering).
- description: Mock serviceType = "Subscription" on vehicleSubscriptions api
steps:
- id: 1
  action: Launch the app > Navigate to the Vehicle screen > Tap on Subscription Packages.
  expected: The subscriptions screen is shown successfully and populates according
    to the information fetched on VehicleSubscriptions
- id: 2
  action: Mock subscriptionEndDate to a date in the future and serviceType = "Subscription"
    >Tap on Subscription Packages > Tap on Subscriptions package
  expected: 'Subscription package is displayed. | Subtitle on card reads: Expires:
    [date]'
