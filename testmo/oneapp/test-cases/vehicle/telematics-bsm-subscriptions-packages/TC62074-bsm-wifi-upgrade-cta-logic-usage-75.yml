      Wi-Fi Data Usage: [usageAmount] of [dataCapAmount] - [usagePercent ]%</li><li><strong>Progress
      bar</strong>:<ul><li>ORANGE (from 75 to 99)</li><li>RED (if % is 100 )</li></ul></li><li><strong>Text</strong>:
      Updated [MM/DD/YYYY] at [TimePM/AM] EDT <i>(this comes from <strong>updatedAt</strong>
      parameter)</i></li><li><strong>Upgrade Now </strong>CTA</li></ul><figure class="image"><img
      src="/attachments/view/8850" alt="8850" /></figure>'
    text4: null
    display_order: 1
