metadata:
  id: TC61952
  name: CANCEL flow E2E tetsing - SUCCESS
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-08'
  updated: '2026-01-20'
  author: user_15
  testmo_id: 61952
  folder_id: 3863
preconditions:
- description: EnableTelematicsBSM FF = true
- description: 'Cancel subscription cta must be visible: For this EndDate of the package
    should be null or 0'
- description: subscriptionServiceType = "Subscription"
steps:
- id: 1
  action: On the Vehicle page, tap on the Subscription Packages card
  expected: Verify the Subscriptions screen is shown
- id: 2
  action: Tap on the package > Tap on Cancel Subscription cta
  expected: 'Header Text: Wait! We are sorry to see you go | Body text: When you cancel
    your subscription you will immediately lose access to great features, such as...
    | services listed: These come from the services fetched on VehicleSubscription
    response for the package under testing. If there are more than 6 services, then
    list the first 6 and then the text: and so much more. | YES, CANCEL SUBSCRIPTION
    CTA | NO I CHANGED MY MIND option'
- id: 3
  action: Tap on NO, I CHANGED MY MIND option
  expected: Verify user is taken back to Package Details
- id: 4
  action: Tap on CANCEL SUBSCRIPTION cta again > YES, CANCEL SUBSCRIPTION cta
  expected: 'Header Text: Are you sure you want to cancel your subscription? | Body
    text:After cancelling your [Package name] subscription your [Package name] benefits
    will continue until the subscription end date. | You will not be billed after
    your subscription end date. | Checkbox: Yes, I confirm I want to cancel my subscription
    | YES, CANCEL SUBSCRIPTION CTA (disabled by default) | NO, I CHANGED MY MIND option'
- id: 5
  action: Tap on NO, I CHANGED MY MIND option
  expected: Verify user is taken back to Package Details
- id: 6
  action: Tap on CANCEL SUBSCRIPTION cta again > YES, CANCEL SUBSCRIPTION cta > Select
    the checkbox
  expected: Verify YES, CANCEL SUBSCRIPTION cta gets enabled
- id: 7
  action: Unselect the checkbox
  expected: Verify YES, CANCEL SUBSCRIPTION cta gets disabled
- id: 8
  action: Select the checkbox > Tap on YES, CANCEL SUBSCRIPTION cta
  expected: 'Header text: Your subscription is now cancelled | Body Text:Your confirmation
    | Your [Package Name] benefits will continue until the subscription end date on
    [EndDate of the CancelSubscription API] <<MM DD, YYYY>>. | MANAGE SERVICES CTA
    | CLOSE option'
- id: 9
  action: Taps on MANAGE SERVICES cta
  expected: Verify user is taken to Subscriptions screen with subscriptions recently
    cancelled under the Your Packages section, with EndDate updated
- id: 10
  action: Taps on CLOSE option
  expected: Verify user is taken to Home screen
