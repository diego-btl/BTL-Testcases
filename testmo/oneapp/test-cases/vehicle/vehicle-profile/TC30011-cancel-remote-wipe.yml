description: Verify to Cancel Remote Data Wipe
preconditions:
- description: User is logged-in and navigate to Vehicle tab
steps:
- id: 1
  action: Tap on Vehicle Profile button
  expected: Vehicle Profile sheet is displayed
- id: 2
  action: Tap on Remote Data Wipe card
  expected: Remote Data Wipe screen is displayed
- id: 3
  action: Tap on Delete Data button
  expected: 'User should see a verification modal alert as : Title: Delete Vehicle
    Data? | Body: Are you sure you want to delete. your vehicle data? This action
    is permanent and once initiated, it cannot be stopped or undone. | Button: No
    | Button: Yes ( background highlighted in blue)'
- id: 4
  action: Tap on No button
  expected: User should see modal alert dismiss itself and Remote Data Wipe screen
    is displayed
- id: 5
  action: Verify step1 and 2 in Demo Mode
  expected: 'User should see a modal alert as: | Title: Demo Mode | Body: Not available
    in demo mode. | Button: OK'
