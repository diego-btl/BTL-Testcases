preconditions:
- description: User is on the Emergency Contacts sheet and has less than 4 emergency
    contacts already created
steps:
- id: 1
  action: 'Tap + ADD A CONTACT2. Fill in all the required information ensuring the
    criteria is met for each field3. Tap SAVE4. Wait for saving to succeedEmergency
    Contact Criteria:First name: At least 2 characters entered (letters & numbers
    only, no special characters)Last name: At least 2 characters entered (letters
    & numbers only, no special characters)Primary phone: Exactly 10 digits enteredRelationship:
    An item selected'
  expected: 'User should be taken to the Add a Contact sheet2. User should see SAVE
    button should be enabled when they fill in all fields3. User should see all fields
    become disabled and a loading state as the saving call is being made4. User should
    be brought back to the emergency contacts screen and see updated data when saving
    succeedsNOTE: If saving fails, there should no longer be a loading state and user
    should see fields become enabled'
