description: Verify the Vehicle Capabilities in Vehicle Profile sheet
preconditions:
- description: Setup a primary and shared driver into the account
- description: User is logged-in on the Vehicle Profile sheet under Vehicles tab
steps:
- id: 1
  action: 'Remove these items from the VehicleCapabilities call: a) REMOTE_DATA_WIPEb)
    VEHICLE_HEALTH_REPORT'
  expected: Primary and Shared driver should not see below items on the Vehicle Profile
    sheeta) Remote Data Wipe | b) Vehicle Health Report
- id: 2
  action: Repeat steps 1, but disable the statuses instead of removing them from the
    capabilities list
  expected: Primary driver should see below items greyed out. a) Remote Data Wipe
    | b) Vehicle Health Report | Shared Driver should have the items hidden
- id: 3
  action: Tap on the below disabled items a) Remote Data Wipeb) Vehicle Health Report
  expected: 'User should see an alert modal that allows user to call an agent (1 855
    -444-7244) | Title:Account ExpiredBody: If you feel like this is an error, please
    use the call button to speak with an agent.Button: CancelButton: Call'
- id: 4
  action: Navigate into Vehicle Profile Sheet in Demo Mode and tap into below itemsa)
    Remote Data Wipeb) Vehicle Health Report
  expected: 'User should see an alert modal | Title :Demo ModeBody: Not available
    in demo mode. | Button: OK'
