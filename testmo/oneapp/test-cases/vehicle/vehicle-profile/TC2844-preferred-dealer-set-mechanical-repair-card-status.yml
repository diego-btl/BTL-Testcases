    id: 95804
    case_id: 2844
    text1: <p>Have a preferred dealer set then Tap on Vehicle tab &gt; Vehicle Profile
      &gt; My Dealer card</p>
    text2: null
    text3: '<p>Verify <code>Vehicle Maintenance Data Sharing</code> card is shown
      at the bottom of the screen:</p><ul><li>If <strong>VehiclePreferences</strong>
      retrieves <code>"enabled": false</code>, then the subtitle is <i><strong>Not
      Sharing</strong></i></li><li>If <strong>VehiclePreferences</strong> retrieves
      <code>"enabled": true</code>, then the subtitle is<i><strong> Sharing </strong></i>and
      subtoggles will display accordingly with retrieved on text, phone, email parameters.</li></ul>'
    text4: null
    display_order: 1
