preconditions:
- description: User has telematics enabled
steps:
- id: 1
  action: Breakpoint/mock ConnectedTermsAndConditions api to fail
  expected: User shouldnt see the Terms and Condition card
- id: 2
  action: Retrigger the API and wait for it to load/succeed
  expected: User should see the card only after api is done loading
- id: 3
  action: Tap Terms and Conditions
  expected: User should see the connected terms and conditions
- id: 4
  action: Tap on a phone number
  expected: User should see dialer open with phone number
- id: 5
  action: Tap on a web link
  expected: User should see link open in web-view or browser
