preconditions:
- description: User has a MIL status indicator active for EV/AVK
steps:
- id: 1
  action: Tap on MIL status card
  expected: User should see Vehicle Status screen with MIL tab
- id: 2
  action: Tap on active MIL
  expected: User should be able to view corresponding MIL description
- id: 3
  action: Tap on Book a Service
  expected: User should enter into Book a Service flow | User should see Dealer Details
    (if user has a preferred dealer and native scheduling is false) | User should
    see Select Services (if user has a preferred dealer and native scheduling is true)
    | User should see Find a Dealer (if user does not have a preferred dealer)
