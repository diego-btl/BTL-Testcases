description: 'Essentially, The Manual Mileage card should show when Remote Vehicle
  Status Capability is set to True. The OneApp should allow the following vehicles
  to input Manual Mileage for their accounts / vehicles. All the the telematicsProgram
  statuses NON_CONNECTED / UNKNOWN, CONNECTED, AVK, EV or AVK2 with status : EXPIRED
  / UNKNOWN / NOT_ENROLLED / FAILED should display both the Mileage Card and The Maintenance
  Schedule CardOnly the STOLEN status is excluded from all of these scenarios.'
preconditions:
- description: 'Under Capabilities api, telematics program should be either of these:
    NON_CONNECTED / UNKNOWN, CONNECTED, AVK, or AVK2'
- description: 'Status should be: status : EXPIRED / UNKNOWN / NOT_ENROLLED / FAILED'
- description: Swap steps 1, 2 and 3 for the different combination scenarios above.
- description: The mileage that's added manually in any of the entry points - Mileage
    card, maintenance schedule, schedule a service - should propagate to the other
    areas too.
steps:
- id: 1
  action: Install fresh app -> Log in -> Go to Vehicle tab
  expected: Mileage card and Maintenance card should be enabled and clickable
- id: 2
  action: Tap on Mileage card -> Enter mileage -> Save -> Go back
  expected: The mileage amount is updated on the card under Vehicle tab
- id: 3
  action: Tap on Maintenance Schedule -> If required choose driving conditions
  expected: Estimated Next Service should get populated reflecting the manual mileage
    amount added
- id: 4
  action: Tap on Schedule a service -> Choose Regular maintenance or Recall -> Go
    through the flow -> Schedule service
  expected: 'The manual mileage added should show up while scheduling service with
    the option to update it | NOTE: for avk, avk2, connected vehicles - the option
    to update mileage won''t show. but, the mileage should show as was added manually'
