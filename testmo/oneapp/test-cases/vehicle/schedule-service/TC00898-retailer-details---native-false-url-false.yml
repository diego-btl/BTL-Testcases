metadata:
  id: TC00898
  name: Retailer Details - native false, url false
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-04'
  updated: '2024-10-17'
  author: user_7
  testmo_id: 898
  folder_id: 93
preconditions:
- description: User has a preferred retailer and has not accepted or denied location
    permissions
steps:
- id: 1
  action: Tap on Schedule Service card
  expected: User should see Retailer Details with retailer information
- id: 2
  action: Tap to Accept/Deny location permissions
  expected: If user accepts location permissions, they will see a distance pill displaying
    how far they are from the retailer | If user denies location permissions, distance
    pill will be hidden
- id: 3
  action: Tap on Select a Retailer
  expected: User should see Select a Retailer screen
- id: 4
  action: Tap on Call to Schedule Service CTA
  expected: User should be brought to the dialer with servicePhone populated
- id: 5
  action: Tap on Hours of Operation
  expected: User should see bottom sheet with hours
- id: 6
  action: Tap on Get Directions
  expected: User should see maps open with direction to retailer
