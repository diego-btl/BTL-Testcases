test_case:
  preconditions: '<ul><li>User has one or more booked service appointments</li><li>Appointment
    has <code>isEditable: true</code></li><li>User has made changes in edit flow and
    returned to <code>Upcoming Appointment</code> screen</li><li><code>updateServiceAppointment</code>
    mutation fails due to network or server error</li></ul>'
  steps:
  - column_name: custom_steps
    id: 96331
    case_id: 62138
    text1: <p>Enter edit flow from any entry point (<code>Selected Services</code>,
      <code>Appointment Details</code>, <code>Transportation</code>, or <code>Contact
      Information</code>), make changes, tap <code>NEXT</code> button from any editing
      screen to reach <code>Upcoming Appointment</code> screen</p>
    text2: null
    text3: <ul><li>User is navigated back to <code>Upcoming Appointment</code> screen</li><li>Updated
      values are displayed on respective cards</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96332
    case_id: 62138
    text1: <p>Tap <code>SAVE CHANGES</code> button on <code>Upcoming Appointment</code>
      screen (when <code>updateServiceAppointment</code> mutation fails)</p>
    text2: null
    text3: '<ul><li>Error modal appears with title: <code>Error Saving Changes</code></li><li>Modal
      message: <code>Sorry, something went wrong while saving your service request
      changes. Please try again.</code></li><li><code>OK</code> button is displayed</li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96333
    case_id: 62138
    text1: <p>Tap <code>OK</code> button on error modal</p>
    text2: null
    text3: <ul><li>Modal is dismissed</li><li>User remains on <code>Upcoming Appointment</code>
      screen</li><li>Changes remain intact</li></ul>
    text4: null
    display_order: 3
