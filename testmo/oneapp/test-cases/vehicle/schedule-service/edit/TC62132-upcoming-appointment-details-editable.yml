metadata:
  name: Upcoming Appointment - Details - Editable
  priority: 1
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: '<ul><li>User has booked service appointment with <code>isEditable:
    true</code></li><li>User taps on Upcoming Appointment card</li></ul>'
  steps:
  - column_name: custom_steps
    id: 96374
    case_id: 62132
    text1: <p>Tap on Upcoming Appointment card from Vehicle Screen or Service History
      Screen</p>
    text2: null
    text3: <ul><li>User is navigated to <code>Upcoming Appointment</code> screen</li><li>Screen
      title is <code>Upcoming Appointment</code></li><li><strong>Back arrow</strong>
      is displayed at top left</li><li>Vehicle image is displayed</li><li>Vehicle
      <strong>nickname</strong> from <code>VehicleStaticData</code> is displayed</li><li>Vehicle
      <strong>year, model, and color</strong> from <code>VehicleStaticData</code>
      are displayed</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96375
    case_id: 62132
    text1: <p>Verify <code>Dealer</code> card displays correctly</p>
    text2: null
    text3: '<ul><li><strong>Location icon</strong> is displayed</li><li>Card title:
      <code>Dealer</code></li><li>Dealer name from appointment data is displayed</li><li>Dealer
      address from appointment data is displayed</li><li>Message text: <code>To change
      the dealer, please delete the request and start a new booking</code></li><li><strong>NO
      Edit button</strong> on dealer card</li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96376
    case_id: 62132
    text1: <p>Verify <code>Selected Service</code> card displays correctly</p>
    text2: null
    text3: '<ul><li><strong>Wrench icon</strong> is displayed</li><li>Card title:
      <code>Selected Service</code></li><li>Selected service name(s) from appointment
      data is displayed</li><li><strong>Edit</strong> button is visible and <strong>enabled</strong></li></ul>'
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 96377
    case_id: 62132
    text1: <p>Verify <code>Appointment Details</code> card displays correctly</p>
    text2: null
    text3: '<ul><li><strong>Calendar icon</strong> is displayed</li><li>Card title:
      <code>Appointment Details</code></li><li>Date from appointment data displayed
      in format: <code>Date: [Day], [Month] [Date], [Year]</code></li><li>Time from
      appointment data displayed in format: <code>Time: [HH:MM AM/PM]</code></li><li>Service
      Advisor name from appointment data is displayed (if selected)</li><li><strong>Edit</strong>
      button is visible and <strong>enabled</strong></li></ul>'
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 96378
    case_id: 62132
    text1: <p>Verify <code>Transportation</code> card displays correctly (if applicable)</p>
    text2: null
    text3: '<ul><li><strong>Car icon</strong> is displayed</li><li>Card title: <code>Transportation</code></li><li>Transportation
      preference from appointment data is displayed</li><li>Pick Up and Drop Off addresses
      displayed (if Valet Service selected)</li><li><strong>Edit</strong> button is
      visible and <strong>enabled</strong></li></ul>'
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 96379
    case_id: 62132
    text1: <p>Verify <code>Contact Information</code> card displays correctly</p>
    text2: null
    text3: '<ul><li><strong>Phone icon</strong> is displayed</li><li>Card title: <code>Contact
      Information</code></li><li>Email address from appointment data displayed in
      <strong>correct case</strong></li><li>Phone number from appointment data is
      displayed</li><li><strong>Edit</strong> button is visible and <strong>enabled</strong></li></ul>'
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 96380
    case_id: 62132
    text1: <p>Tap <code>CALL DEALER</code> link (NISSAN) or <code>CALL RETAILER</code>
      link (INFINITI)</p>
    text2: null
    text3: <ul><li>Phone number is retrieved from <code>VehiclePreferredDealer</code>
      query phone field</li><li><strong>Android:</strong> Phone dialer opens with
      dealer/retailer contact number</li><li><strong>iOS:</strong> Phone call drawer/sheet
      opens with dealer/retailer contact number and Call/Cancel options</li></ul>
    text4: null
    display_order: 7
  - column_name: custom_steps
    id: 96381
    case_id: 62132
    text1: <p>Verify <code>DELETE SERVICE REQUEST</code> button is available</p>
    text2: null
    text3: '<ul><li><strong>ALL CAPS</strong> button text: <code>DELETE SERVICE REQUEST</code></li><li>Button
      is visible and <strong>enabled</strong></li></ul>'
    text4: null
    display_order: 8
