description: 'Edit Schedule Service - Navigation Controls: Back Arrow, Close Button,
  and Exit ConfirmationsValidates back arrow and close button behavior during edit
  flows. Both Close (X) and Back arrow show exit confirmation modal. Tests modal button
  responses (No, Continue vs Yes, Leave) and bottom navigation behavior that abandons
  the edit session without warning.Notes:When user taps Back arrow from any editing
  screen, they are returned to Upcoming Appointment screen (entry point), NOT backwards
  through screensBack behavior is consistent regardless of which edit entry point
  was used (Selected Services, Appointment Details, Transportation, or Contact Information)Close
  (X) button and Back arrow show identical Leave Schedule Service? modalModal message:
  Any progress will be lost and you will have to submit a new request.Bottom navigation
  bypasses modal and abandons edit session without warning'
preconditions:
- description: User has one or more booked service appointments
- description: 'Appointment has isEditable: true'
- description: User is in active edit flow with unsaved changes on any of the following
    screens:Select Services
- description: Additional Information
- description: Select Date and Time
- description: Contact Information
steps:
- id: 1
  action: Tap Close (X) button from Select Services, Additional Information, Select
    Date and Time, or Contact Information screen
  expected: 'Modal appears with title: Leave Schedule Service? | Modal message: Any
    progress will be lost and you will have to submit a new request. | No, Continue
    button is displayed | Yes, Leave button is displayed'
- id: 2
  action: Enter edit flow from Selected Services, Appointment Details, Transportation,
    or Contact Information card, tap Back arrow from the respective editing screen
  expected: 'Modal appears with title: Leave Schedule Service? | Modal message: Any
    progress will be lost and you will have to submit a new request. | No, Continue
    button is displayed | Yes, Leave button is displayed'
- id: 3
  action: Tap Back arrow from Upcoming Appointment screen
  expected: User returns to Vehicle Screen or Service History Screen | No modal shown
- id: 4
  action: Tap bottom navigation tab during edit flow from any editing screen
  expected: Tap any bottom navigation tab (Home, Vehicle, Map, Support, Settings)
    | User is navigated to selected bottom navigation screen | Edit session is abandoned
    | No modal shown
- id: 5
  action: Tap No, Continue button on Leave Schedule Service? modal
  expected: Modal is dismissed | User returns to editing screen
- id: 6
  action: Tap Yes, Leave button on Leave Schedule Service? modal
  expected: Modal is dismissed | User is navigated to Upcoming Appointment screen
