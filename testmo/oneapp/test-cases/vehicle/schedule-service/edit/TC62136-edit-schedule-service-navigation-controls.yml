    Information</code></li></ul></li></ul>'
  steps:
  - column_name: custom_steps
    id: 96317
    case_id: 62136
    text1: <p>Tap <code>Close (X)</code> button from <code>Select Services</code>,
      <code>Additional Information</code>, <code>Select Date and Time</code>, or <code>Contact
      Information</code> screen</p>
    text2: null
    text3: '<ul><li>Modal appears with title: <code>Leave Schedule Service?</code></li><li>Modal
      message: <code>Any progress will be lost and you will have to submit a new request.</code></li><li><strong>No,
      Continue</strong> button is displayed</li><li><strong>Yes, Leave</strong> button
      is displayed</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96318
    case_id: 62136
    text1: <p>Enter edit flow from <code>Selected Services</code>, <code>Appointment
      Details</code>, <code>Transportation</code>, or <code>Contact Information</code>
      card, tap <strong>Back arrow</strong> from the respective editing screen</p>
    text2: null
    text3: '<ul><li>Modal appears with title: <code>Leave Schedule Service?</code></li><li>Modal
      message: <code>Any progress will be lost and you will have to submit a new request.</code></li><li><strong>No,
      Continue</strong> button is displayed</li><li><strong>Yes, Leave</strong> button
      is displayed</li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96319
    case_id: 62136
    text1: <p>Tap <strong>Back arrow</strong> from <code>Upcoming Appointment</code>
      screen</p>
    text2: null
    text3: <ul><li>User returns to Vehicle Screen or Service History Screen</li><li>No
      modal shown</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 96320
    case_id: 62136
    text1: <p>Tap bottom navigation tab during edit flow from any editing screen</p>
    text2: null
    text3: <ul><li>Tap any bottom navigation tab (Home, Vehicle, Map, Support, Settings)</li><li>User
