description: 'Create Schedule Service - Additional Information - Error Handling: API
  Failure RecoveryValidates error handling when navigation from Select Services to
  Additional Information screen fails. Tests that error modal appears with retry and
  cancel options.'
preconditions:
- description: User has selected at least one service with maintenance flag set to
    true
steps:
- id: 1
  action: Tap NEXT on Select Services screen and trigger an error
  expected: User should see Additional Information screen | Error modal should appear
    with options to cancel and retry
- id: 2
  action: Tap on Retry
  expected: User should see loading spinner as API is triggered again
- id: 3
  action: Tap on Cancel
  expected: User should see error modal dismissed
