description: 'Create Schedule Service - Review Service Request - Details - Edit: Modify
  Booking DetailsValidates users can edit previously entered information from the
  Review Service Request screen. Tests edit paths for different card types: restart
  workflow for core selections (Dealer/Services) vs direct navigation to edit screens
  for details modification (Appointment Details/Transportation/Contact Information).Notes:Edit
  on Dealer or Selected Service cards triggers restart confirmation modalTapping "Yes,
  retry" abandons current booking and starts new booking from Select ServicesEdit
  on Appointment Details or Transportation navigates directly to Select Date and Time
  screen with pre-selected valuesEdit on Contact Information navigates directly to
  Contact Information screen with pre-filled valuesRestarting Dealer/Services creates
  a NEW booking flow (not editing existing)Other edits allow modification of specific
  details and return to Review Service Request'
preconditions:
- description: User has completed all screens and arrived at Review Service Request
    screen
- description: User is ready to modify booking information
steps:
- id: 1
  action: Tap Edit button on Dealer or Selected Service card on Review Service Request
    screen
  expected: 'Modal appears with title: Restart Schedule Service? | Modal message:
    Are you sure you want to change this? You will have to start over with a new service
    appointment. | No, cancel button is displayed | Yes, retry button is displayed'
- id: 2
  action: Tap No, cancel button on Restart Schedule Service modal
  expected: Modal is dismissed | User remains on Review Service Request screen | All
    information unchanged
- id: 3
  action: Tap Edit on Dealer or Selected Service card again, then tap Yes, retry button
  expected: User is redirected to Select Services screen | No previously selected
    services are pre-selected | Service booking flow restarts as new booking with
    fresh selections
- id: 4
  action: Tap Edit button on Appointment Details or Transportation card on Review
    Service Request screen
  expected: 'User is redirected to Select Date and Time screen | Previously selected
    date and time are pre-selected/highlighted | Optional Preferences card is displayed
    with: | Transportation: pre-selected value (or -- if not selected) | Advisor:
    pre-selected name (or -- if not selected)'
- id: 5
  action: Tap Edit button on Contact Information card on Review Service Request screen,
    modify email and phone fields, then tap SAVE
  expected: 'User is redirected to Contact Information screen | Email address field
    is pre-filled with current value | Phone number field is pre-filled with current
    value | Fields are editable | User is able to modify email (local validation for
    email format) | User is able to modify phone number (local validation for 10 digits)
    | User is redirected to Review Service Request screen with updated contact information
    | Note: Modifying this contact information does not change the account''s contact
    information, this is only for this particular service request'
