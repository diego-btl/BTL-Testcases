preconditions:
- description: User has selected at least one service and entered mileage if required
steps:
- id: 1
  action: Tap NEXT on Additional Information screen and trigger an error
  expected: User should see Select Date and Time screen | Error modal should appear
    with options to cancel and retry
- id: 2
  action: Tap on Retry
  expected: User should see loading spinner as API is triggered again
- id: 3
  action: Tap on Cancel
  expected: User should see error modal dismissed
