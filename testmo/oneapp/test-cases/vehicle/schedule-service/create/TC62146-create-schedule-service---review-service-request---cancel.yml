description: 'Create Schedule Service - Cancel: Booking AbandonmentValidates cancellation
  flow with confirmation modal. Tests that user can abandon the booking process at
  Review Service Request screen and return to Vehicle Screen, or choose to continue
  with the booking.Notes:CANCEL button shows confirmation modal before leavingUser
  must confirm intention to leave booking processConfirmation required to prevent
  accidental abandonmentChoosing "Yes, Leave" abandons booking and returns to Vehicle
  ScreenChoosing "No, Continue" preserves booking and returns to Review Service Request'
preconditions:
- description: User has completed all screens and arrived at Review Service Request
    screen
- description: All booking information is filled
steps:
- id: 1
  action: On Review Service Request screen, tap CANCEL button
  expected: 'Modal appears with title: Leave Schedule Service? | Modal message: Are
    you sure you want to leave? You will have to start over if you want to schedule
    another service. | No, Continue button is displayed | Yes, Leave button is displayed'
- id: 2
  action: Tap No, Continue button on Leave Schedule Service? modal
  expected: Modal is dismissed | User remains on Review Service Request screen | All
    booking information is preserved | User can continue editing or submit booking
- id: 3
  action: Tap CANCEL button again, then tap Yes, Leave button on modal
  expected: Modal is dismissed | User is redirected to Vehicle Screen | Booking is
    abandoned (not submitted)
