description: 'Create Schedule Service - Select Services Screen Validation: Service
  Selection and Preferred Dealer DisplayValidates the Select Services screen displays
  correctly with selected dealer information and available vehicle services. This
  screen is the first booking workflow step accessed from all entry points after dealer
  selection (when preferred dealer is set or user selects dealer from Find Dealer
  screen).Entry Points That Route Here:Home Screen (Hero) - Schedule Service CTAVehicle
  Screen - Schedule Service quick action buttonVehicle Screen - Maintenance card Schedule
  Now CTAVehicle Screen - MIL Status card/Red Alert iconMaintenance Schedule Screen
  - Schedule Service CTARecall/Service Campaign Screen - Schedule Service CTAMIL Detail
  Screen - Schedule Service CTASupport Screen - Schedule Service quick action buttonNotes:If
  services with maintenance flag set to true are selected, the Estimated Next Service
  Interval section will appear, if not, then that section does not show up'
preconditions:
- description: User is logged in with a vehicle and preferred dealer/retailer with
    nativeServiceBooking= true is set
steps:
- id: 1
  action: Tap on Schedule Service CTA from any entry point listed above
  expected: Screen title is Select Services | Progress indicator shows current step
    (Step 1 of 4) | Selected dealer/retailer card displays at top with dealer/retailer
    name and chevron to modify
- id: 2
  action: Verify Selected Dealer/Retailer card information is displayed
  expected: Card shows dealer/retailer name correctly | Chevron icon present to allow
    dealer/retailer change | Call Dealer/Retailer link is available below services
    list
- id: 3
  action: Tap on any of the available services in the list
  expected: Service checkbox is marked/selected with checkmark | NEXT button becomes
    enabled (from disabled state)
- id: 4
  action: Verify multiple services can be selected
  expected: User can select multiple service checkboxes | All selected services show
    checkmarks | NEXT button remains enabled
- id: 5
  action: Tap NEXT button with at least one service selected
  expected: User proceeds to Additional Information screen | Selected services are
    passed to next step
- id: 6
  action: Tap Call Dealer link (NISSAN) or Call Retailer link (INFINITI)
  expected: 'Phone number is retrieved from VehiclePreferredDealer query phone field
    | Android: Phone dialer opens with dealer/retailer contact number | iOS: Phone
    call drawer/sheet opens with dealer/retailer contact number and Call/Cancel options'
