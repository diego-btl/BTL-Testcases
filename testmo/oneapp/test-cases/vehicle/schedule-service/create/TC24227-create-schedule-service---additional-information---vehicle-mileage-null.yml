description: 'Create Schedule Service - Additional Information - Vehicle Mileage Null:
  Manual Mileage Entry When Data UnavailableValidates that when VehicleDynamicData.Mileage.Total
  returns null, the manual mileage input section is available so the user can continue
  with the booking flow.Notes:This edge case ensures users can proceed even when vehicle
  mileage data is unavailableManual mileage entry is required to enable NEXT buttonIf
  services with maintenance flag set to true are selected, the Estimated Next Service
  Interval section will appear'
preconditions:
- description: Mock VehicleDynamicData.Mileage.Total parameter from the VehicleDynamicData
    call is returning null
- description: User is already in the Select Services page of the Schedule Service
    Flow
steps:
- id: 1
  action: Tap NEXT on Select Services screen
  expected: User is able to see Additional Information screen with text boxes corresponding
    to the selected services
- id: 2
  action: Enter comments in the text boxes
  expected: User is able to add comments in the text boxes
- id: 3
  action: Enter Vehicle Mileage and maintenance interval
  expected: User is able to manually enter vehicle mileage | If maintenance selected
    is true then user is able to also update the selected interval to view maintenance
    options for different intervals
- id: 4
  action: Tap NEXT
  expected: User should be able to proceed to Select Date and Time screen
