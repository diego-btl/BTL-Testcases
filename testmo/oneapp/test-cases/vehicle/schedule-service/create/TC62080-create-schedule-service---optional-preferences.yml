description: 'Create Schedule Service - Optional Preferences Screen Validation: Advisor
  and Transportation PreferencesValidates the Optional Preferences screen displays
  correctly and allows users to set service advisor preferences, select/deselect transportation
  options, and provide pick-up/drop-off addresses when applicable. Users can save
  their preferences or dismiss the screen.Notes:Service Advisor options are fetched
  from ServiceAdvisors query (dynamic - options vary)Transportation options are fetched
  from TransportationOptions query (dynamic - options vary, toggle behavior)Only one
  transportation option can be selected at a timeSelecting Valet Service triggers
  Pick-up Address and Drop-off Address fieldsAddress fields are auto-search enabled
  with pre-filled user address from VehicleStaticDataCheckboxes ("I don''t need my
  vehicle picked up", "I don''t need my vehicle dropped off") disable related address
  fieldsSAVE button is disabled until at least one Service Advisor or Transportation
  option is selectedIf both pick-up and drop-off checkboxes are checked, SAVE button
  is disabled'
preconditions:
- description: User has selected date and time on the Select Date and Time screen
    and tapped Add on the Optional Preferences card
steps:
- id: 1
  action: Verify user arrives on Optional Preferences screen with correct layout
  expected: Screen title is Optional Preferences | Back arrow is displayed at top
    left | Service Advisor dropdown is displayed with label Select Advisor (Optional)
    | What transportation will you need? section displays with heading | Transportation
    options are dynamically loaded from TransportationOptions query (content varies
    based on dealer/vehicle) | All transportation options are in unselected state
    (not highlighted) | SAVE button is displayed at bottom and is disabled | CALL
    DEALER/RETAILER link is displayed
- id: 2
  action: Tap Service Advisor dropdown and verify options are loaded
  expected: Dropdown opens | Advisor options are dynamically loaded from ServiceAdvisors
    query (content varies) | User can select an advisor from the list | Selected advisor
    is displayed in the dropdown field | SAVE button becomes enabled
- id: 3
  action: Tap on a transportation option toggle to select it
  expected: Transportation option is selected and highlighted in blue | SAVE button
    becomes enabled
- id: 4
  action: Tap on the same transportation option toggle to deselect it
  expected: Transportation option is deselected and no longer highlighted | Returns
    to unselected state
- id: 5
  action: Tap on Valet Service transportation option toggle (if available in TransportationOptions)
  expected: Option is selected and highlighted in blue | Pick-up Address section appears
    below with pre-filled user address from VehicleStaticData | Drop-off Address section
    appears below with pre-filled user address from VehicleStaticData | I don't need
    my vehicle picked up checkbox appears below Pick-up Address | I don't need my
    vehicle dropped off checkbox appears below Drop-off Address
- id: 6
  action: Tap on Valet Service toggle again to deselect it
  expected: Option is deselected and no longer highlighted | Pick-up Address section
    disappears | Drop-off Address section disappears | Related checkboxes disappear
- id: 7
  action: Tap on Pick-up Address and Drop-off Address fields and verify auto-search
    functionality
  expected: Address fields become active with blue border | Clear pre-filled text
    if needed | Type search text | Auto-suggestions appear as user types | User can
    tap to select an address from suggestions
- id: 8
  action: Check both I don't need my vehicle picked up and I don't need my vehicle
    dropped off checkboxes
  expected: Both checkboxes are marked with checkmarks | Both address fields become
    disabled (grayed out) | SAVE button becomes disabled (grayed out)
- id: 9
  action: Uncheck both checkboxes to re-enable address fields
  expected: Both checkboxes are unchecked | Both address fields become enabled | SAVE
    button becomes enabled (if advisor or transportation is selected)
- id: 10
  action: Tap SAVE button with at least Service Advisor or Transportation option selected
  expected: Preferences are saved | User returns to Select Date and Time screen |
    Selected preferences are reflected in Optional Preferences card
- id: 11
  action: Tap Call Dealer link (NISSAN) or Call Retailer link (INFINITI)
  expected: 'Phone number is retrieved from VehiclePreferredDealer query phone field
    | Android: Phone dialer opens with dealer/retailer contact number | iOS: Phone
    call drawer/sheet opens with dealer/retailer contact number and Call/Cancel options'
