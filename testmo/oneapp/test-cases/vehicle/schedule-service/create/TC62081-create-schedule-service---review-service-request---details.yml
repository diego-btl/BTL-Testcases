description: 'Create Schedule Service - Review Service Request - Details: Information
  ValidationValidates the Review Service Request screen displays all collected booking
  information correctly before submission. Tests that all cards (Dealer, Services,
  Appointment Details, Transportation, Contact Information) show correct values from
  previous screens with proper formatting and icons.Notes:Final review step (Step
  4 of 4) before service request submissionAll cards displayed in static view with
  values from previous screensEach card has Edit button for modifications (tested
  separately)All information should match user selections from previous screensTransportation
  card only displays if transportation option was selected'
preconditions:
- description: User has completed Select Services, Additional Information, Select
    Date and Time, and Optional Preferences screens
- description: User is on Review Service Request screen
steps:
- id: 1
  action: User navigates to Review Service Request screen after Optional Preferences
  expected: Screen title is Review Service Request | Progress indicator shows 4 blue
    tabs (Step 4 of 4) | Back arrow is displayed at top left | Close (X) button is
    displayed at top right | Vehicle image is displayed | Vehicle nickname is displayed
    | Vehicle year, model, and color are displayed
- id: 2
  action: Verify Dealer card display
  expected: 'Location icon is displayed | Card label: Dealer | Dealer name is displayed
    | Dealer address is displayed | Edit button (blue text) is displayed on right
    side'
- id: 3
  action: Verify Selected Service card display
  expected: 'Wrench icon is displayed | Card label: Selected Service | Selected service
    name is displayed | Edit button (blue text) is displayed on right side'
- id: 4
  action: Verify Appointment Details card display
  expected: 'Calendar icon is displayed | Card label: Appointment Details | Date is
    displayed in format: Date: [Day], [Month] [Date], [Year] | Time is displayed in
    format: Time: [HH:MM AM/PM] | Service Advisor name is displayed (if selected)
    | Edit button (blue text) is displayed on right side'
- id: 5
  action: Verify Transportation card display (if selected)
  expected: 'If transportation was selected in Optional Preferences:Car icon is displayed
    | Card label: Transportation | Transport type is displayed | If Valet Service
    selected: Pick Up and Drop Off addresses are displayed | Edit button (blue text)
    is displayed on right side | If transportation was NOT selected: Card is NOT displayed'
- id: 6
  action: Verify Contact Information card display
  expected: 'Phone icon is displayed | Card label: Contact Information | Email address
    is displayed | Phone number is displayed | Edit button (blue text) is displayed
    on right side'
- id: 7
  action: Verify bottom buttons display
  expected: SCHEDULE SERVICE button is displayed (black/dark button, ALL CAPS) | CANCEL
    button is displayed (outlined button, ALL CAPS)
