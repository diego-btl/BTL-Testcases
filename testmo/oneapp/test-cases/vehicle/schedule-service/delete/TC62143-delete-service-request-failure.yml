    id: 96355
    case_id: 62143
    text1: <p>Tap <code>DELETE SERVICE REQUEST</code> button from <code>Upcoming Appointment</code>
      screen (direct or during edit flow)</p>
    text2: null
    text3: '<ul><li>Confirmation modal appears with title: <code>Delete Service Request?</code></li><li>Modal
