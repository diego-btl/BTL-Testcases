      have to start over if you want to schedule another service.</code></li><li><strong>No,
      continue</strong> button is displayed</li><li><strong>Yes, delete</strong> button
      is displayed</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96356
    case_id: 62143
    text1: <p>On confirmation modal, tap <strong>Yes, delete</strong> button (when
      <code>CancelServiceAppointment</code> mutation fails)</p>
    text2: null
    text3: '<ul><li>Error modal appears with title: <code>Failed to Delete Service
      Request</code></li><li>Error message: <code>Sorry, something went wrong deleting
      your service request. Please try again.</code></li><li><code>Ok</code> button
      is displayed</li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96357
    case_id: 62143
    text1: <p>Tap <code>Ok</code> button on error modal</p>
    text2: null
    text3: '<ul><li>Modal is dismissed</li><li>User remains on <code>Upcoming Appointment</code>
      screen</li><li>Appointment is NOT deleted</li><li>If in edit flow: unsaved changes
      remain intact</li></ul>'
