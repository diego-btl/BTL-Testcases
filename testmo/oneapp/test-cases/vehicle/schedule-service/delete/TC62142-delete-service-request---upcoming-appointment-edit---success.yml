description: 'Delete Service Request - Upcoming Appointment (Edit) - Success: Deletion
  During Edit FlowValidates successful deletion of a booked service appointment from
  Upcoming Appointment screen during edit flow (after changes made but not saved).
  Tests that tapping DELETE SERVICE REQUEST button shows confirmation modal and CancelServiceAppointment
  mutation permanently deletes the appointment and discards unsaved changes.Notes:Delete
  performed after entering edit flow but before saving changesUnsaved changes are
  discarded with deletionSuccess toast message: Service request successfully deletedUser
  is redirected to Vehicle Screen after deletion'
preconditions:
- description: User has one or more booked service appointments
- description: 'Appointment has isEditable: true'
- description: User has entered edit flow from any entry point (Selected Services,
    Appointment Details, Transportation, or Contact Information)
- description: User has made changes and returned to Upcoming Appointment screen
- description: User has NOT yet tapped SAVE CHANGES
steps:
- id: 1
  action: On Upcoming Appointment screen with unsaved changes, tap DELETE SERVICE
    REQUEST button
  expected: 'Modal appears with title: Delete Service Request? | Modal message: Are
    you sure you want to delete your service request? You will have to start over
    if you want to schedule another service. | No, continue button is displayed |
    Yes, delete button is displayed'
- id: 2
  action: On confirmation modal, tap No, continue button
  expected: Modal is dismissed | User remains on Upcoming Appointment screen | Unsaved
    changes remain intact | Appointment is NOT deleted
- id: 3
  action: On confirmation modal, tap Yes, delete button
  expected: 'CancelServiceAppointment mutation is triggered | Success toast appears
    with message: Service request successfully deleted | User is redirected to Vehicle
    Screen | Appointment is permanently deleted'
