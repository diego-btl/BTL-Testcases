metadata:
  name: Delete Service Request - Upcoming Appointment (Edit) - Success
  priority: 1
  type: functional
  status: active
  automation: 'no'
  tags: []
test_case:
  preconditions: '<ul><li>User has one or more booked service appointments</li><li>Appointment
    has <code>isEditable: true</code></li><li>User has entered edit flow from any
    entry point (<code>Selected Services</code>, <code>Appointment Details</code>,
    <code>Transportation</code>, or <code>Contact Information</code>)</li><li>User
    has made changes and returned to <code>Upcoming Appointment</code> screen</li><li>User
    has NOT yet tapped <code>SAVE CHANGES</code></li></ul>'
  steps:
  - column_name: custom_steps
    id: 96349
    case_id: 62142
    text1: <p>On <code>Upcoming Appointment</code> screen with unsaved changes, tap
      <code>DELETE SERVICE REQUEST</code> button</p>
    text2: null
    text3: '<ul><li>Modal appears with title: <code>Delete Service Request?</code></li><li>Modal
      message: <code>Are you sure you want to delete your service request? You will
      have to start over if you want to schedule another service.</code></li><li><strong>No,
      continue</strong> button is displayed</li><li><strong>Yes, delete</strong> button
      is displayed</li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 96350
    case_id: 62142
    text1: <p>On confirmation modal, tap <strong>No, continue</strong> button</p>
    text2: null
    text3: <ul><li>Modal is dismissed</li><li>User remains on <code>Upcoming Appointment</code>
      screen</li><li>Unsaved changes remain intact</li><li>Appointment is NOT deleted</li></ul>
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 96351
    case_id: 62142
    text1: <p>On confirmation modal, tap <strong>Yes, delete</strong> button</p>
    text2: null
    text3: '<ul><li><code>CancelServiceAppointment</code> mutation is triggered</li><li>Success
      toast appears with message: <code>Service request successfully deleted</code></li><li>User
      is redirected to Vehicle Screen</li><li>Appointment is permanently deleted</li></ul>'
    text4: null
    display_order: 3
