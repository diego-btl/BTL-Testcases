description: 'Entry Point Validation: Home (Hero) Schedule Service CTAValidates that
  tapping the Schedule Service CTA on the Hero section redirects to the Select Services
  screen when a preferred retailer/dealer is set and nativeServiceBooking= true.Preconditions:User
  is logged in to the appPreferred retailer/dealer is set (Retailer for INFINITI,
  Dealer for NISSAN) and nativeServiceBooking= trueUser has at lease one Active Recall/Service
  Campaign on VehicleRecalls or an Active MIL on VehicleDynamicData'
steps:
- id: 1
  action: Tap on the Schedule Service CTA on the Hero section
  expected: ServiceOperations query is triggered | User is redirected to the Select
    Services screen
