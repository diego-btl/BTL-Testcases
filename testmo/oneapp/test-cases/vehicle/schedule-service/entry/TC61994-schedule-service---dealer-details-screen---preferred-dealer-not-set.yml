metadata:
  id: TC61994
  name: Schedule Service - Dealer Details Screen - Preferred Dealer Not Set
  feature: test-cases
  priority: critical
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-11-14'
  updated: '2026-01-20'
  author: user_23
  testmo_id: 65654
  folder_id: 6779
description: 'Entry Point Validation: Schedule Service CTA - No Preferred DealerValidates
  that when no preferred retailer/dealer is set, tapping Schedule Service CTA from
  any entry point routes to the Find a Dealer or Retailer screen, allowing user to
  search and select a dealer with native booking support, then routes to the Select
  Services screen.Preconditions:User is logged in; a vehicle exists on the accountNo
  preferred retailer/dealer is set for this vehicleTest data/mocks ensure ≥1 dealer
  in search results with nativeServiceBooking= truenativeServiceBooking= true'
steps:
- id: 1
  action: Home screen Hero section Schedule Service CTA -> Vehicle screen Schedule
    Service quick action button -> Vehicle screen Maintenance card Schedule Now CTA
    -> Vehicle screen MIL Status Card/Red Alert icon -> Maintenance Schedule screen
    Schedule Service CTA -> Recall/Service Campaign screen Schedule Service CTA ->
    MIL Detail screen Schedule Service CTA -> Support screen Schedule Service quick
    action button
  expected: Entry point is accessible | Schedule Service CTA is displayed
- id: 2
  action: Tap Schedule Service CTA
  expected: User is redirected to Find a Dealer or Find a Retailer screen
- id: 3
  action: Search by ZIP or Postal Code (e.g., 37067)
  expected: Search results display dealers/retailers
- id: 4
  action: Tap on a dealer/retailer from the search results that has nativeServiceBooking=
    true
  expected: User is redirected to Dealer Details screen | Schedule Service CTA is
    displayed (not "Schedule Online" or "Call to Schedule")
- id: 5
  action: Tap the Schedule Service CTA
  expected: ServiceOperations query is triggered | User is redirected to Select Services
    screen with selected dealer shown and Next button disabled until at least one
    service is selected
