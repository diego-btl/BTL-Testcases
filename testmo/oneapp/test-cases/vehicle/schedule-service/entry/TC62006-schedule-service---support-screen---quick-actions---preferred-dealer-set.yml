description: 'Entry Point Validation: Support Screen Quick Actions Schedule Service
  ButtonValidates that tapping the Schedule Service button in quick actions on the
  Support screen redirects to the Select Services screen when a preferred retailer/dealer
  is set and nativeServiceBooking= true.Preconditions:User is logged in to the appPreferred
  retailer/dealer is set (Retailer for INFINITI, Dealer for NISSAN) and nativeServiceBooking=
  trueUser is on the Support Screen'
