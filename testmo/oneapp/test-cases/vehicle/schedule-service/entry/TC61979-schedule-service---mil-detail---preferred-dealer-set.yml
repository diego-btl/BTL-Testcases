description: 'Entry Point Validation: MIL Detail Screen Schedule Service CTAValidates
  that tapping the Schedule Service CTA on MIL detail screens redirects to the Select
  Services screen when active MILs are present and a preferred retailer/dealer is
  set and nativeServiceBooking= true.Preconditions:User is logged in to the appMock
  VehicleDynamicData to have one or more active MILsPreferred retailer/dealer is set
  (Retailer for INFINITI, Dealer for NISSAN) and nativeServiceBooking= trueUser is
  on the MIL Information Screen, reached via the Home Hero alert icon, the Home MIL
  status card, the Vehicle Screen alert icon, or the Vehicle Screen MIL status card.'
steps:
- id: 1
  action: Home screen Hero alert icon -> Home screen MIL status card -> Vehicle Screen
    alert icon -> Vehicle Screen MIL status card
  expected: User is on the MIL Information screen | Schedule Service CTA button is
    displayed
- id: 2
  action: Tap Schedule Service CTA button
  expected: ServiceOperations query is triggered | User is redirected to Select Services
    screen
