test_case:
  preconditions: <p>User has an EV2 vehicle</p><p>User is on the Driving History screen</p><p>DrivingHistory
    API returns duplicate entries ("tripSummaries") for the same day, month, or year </p>
  steps:
  - column_name: custom_steps
    id: 61491
    case_id: 36691
    text1: <p>Choose the <strong>day</strong> that has duplicate entries in DrivingHistory
      API response</p>
    text2: null
    text3: <p>Driver/VIN selector is present under the Day/Month/Year selector</p><p>Driver
      option is selected by default</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 61492
    case_id: 36691
    text1: <p>Select "Driver" from the Driver/VIN selector</p>
    text2: null
    text3: <p>The displayed information includes records with a valid `{userID}` from
      DrivingHistory API response:<br /><strong>- Avg Energy Economy</strong><br /><strong>-
      Avg Energy Consumed</strong><br /><strong>- Avg energy Saved</strong><br /><strong>-
      Avg CO2 Saved</strong><br /><strong>- Total No. of Trips</strong><br /><strong>-
      Total Distance</strong><br /><strong>- Total Travel Time</strong><br /><strong>-
      Avg Speed</strong></p><p>"CO2 gas savings calculates the emissions you save
      by driving a Nissan electric vehicle." text is displayed at the bottom of the
      card<br /> </p>
    text4: null
    display_order: 2
