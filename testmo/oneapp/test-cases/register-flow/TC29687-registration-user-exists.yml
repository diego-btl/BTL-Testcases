  preconditions: <ul><li>User has already preregistered accounts.  </li><li>User is
    on the first screen of registration page</li><li>User fills out First Name and
    Last Name fields</li></ul><p>Use  mocks attached in  ticket below  to get appropriate
    response from <code>ValidateNissanID</code></p><p> <a href="https://www.pivotaltracker.com/story/show/185493300"><u>https://www.pivotaltracker.com/story/show/185493300</u></a></p>
  steps:
  - column_name: custom_steps
    id: 48348
    case_id: 29687
    text1: <p>User Inputs an Email and Confirm Email of an account that already exists
      and taps on <code>Next</code>  button.  Verify typename response from <code>ValidateNissanID</code>
       is <code>NissanIdExists</code></p>
    text2: null
    text3: <p>Red asterisk "*" is displayed at the beginning of warning message<br
      />Warning  message is displayed as "*  User already exists for this email address.
      Please SIGN_IN instead"</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 48349
    case_id: 29687
    text1: <p>User Inputs an Email and Confirm Email of an account that already exists
      and tap on<code>Next</code>  button.  Verify  typename response from  <code>ValidateNissanID</code>
