description: 'Story: [NCI] Marketing Preference screen during registration'
preconditions:
- description: '"EnableNCIMarketingPreferences": "true" FF should be on'
- description: Connect the device to Proxyman to check the APIs calls
steps:
- id: 1
  action: On Register flow continue the flow until reaching Nissan Updates screen
    > Check some boxes > Tap on Finalize Registration CTA
  expected: Verify that RegisterAccount api is triggered, sending in the request,
    the marketingPreferences section with the section or preferences selected on the
    UI.
- id: 2
  action: The response is retrieved
  expected: Verify the response is retrieved successfully
- id: 3
  action: Log into the app with the recently created account > Settings > Marketing
    Preferences
  expected: Verify Preferences selected during registrations are the same displayed
    as enabled on the Marketing Preferences UI.
