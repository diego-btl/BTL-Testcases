description: Verify name and email errors during Registration
preconditions:
- description: User is on the first registration screen
steps:
- id: 1
  action: Enter any special characters or numbers for first/last name
  expected: 'Firstname and Lastname textfields are displayed with red contour | Asterisk
    is displayed after Firstname and Lastname. | User should see an error as:'
- id: 2
  action: Tap on another textfield like Email
  expected: 'Firstname and Lastname textfields backgrounds are highlighted in red
    with a red contour | Asterisk is displayed after Firstname and Lastname. | User
    should see an error as:'
- id: 3
  action: Enter an incorrect email format
  expected: 'Email textfield backgrounds is displayed with a red contour | Asterisk
    is displayed after Email | User should see an error as:'
- id: 4
  action: Enter a different email and tap on firstname textfield
  expected: 'Email and Confirm Email textfields are highlighted in red and backgrounds
    is displayed with a red contour | Asterisk is displayed after Email and Confirm
    Email | User should see an error as:'
