description: Nissan has some users who have a "lite account" which is a registered
  profile that is missing an address and/or phone number.We would like to allow a
  lite user to update their profile in the app, so that they can experience the full
  app as intendedREGIONS/BRANDSNNA onlyINF and NIS
preconditions:
- description: Update isLiteAccount = true on USerInfo call
steps:
- id: 1
  action: Perform a Fresh install and log into the app
  expected: Login successful and Complete Profile screen is displayed
- id: 2
  action: Insert Valid data to complete all mandatory fields > Tap in NEXT cta
  expected: Verify NEXT gets enabled
- id: 3
  action: Tap on NEXT cta
  expected: Verified a loading state icon is displayed, UpdateAccount API is triggered
    and the user is taken to the Home screen reload vehicles as if a fresh login occurred
- id: 4
  action: Go to Settings > My Profile > Contact Information card
  expected: Verify all information inserted on Complete Profile screen for address
    and Phone Number is displayed correctly
