description: Verify the Registration Error Modal behaviour on final registration screen
preconditions:
- description: User is on the final registration screen
- description: Setup a breakpoint to RegisterAccount to get a 400/500 error response
steps:
- id: 1
  action: Enter valid matching passwords that follows the next rules
  expected: Upper case letters (A-Z) | Lower case letters(a -z) | Numbers(0-9) | Special
    characters( !,@,#,$,%,^,&,*)
- id: 2
  action: Check conditions box
  expected: User should see enabled Create Account button
- id: 3
  action: Tap on Create Account button
  expected: 'User should see Registration Error alert modal as follows: Header: Registration
    Error | Text: Sorry, an error occurred registering your account, please try again.
    | CTA: Ok'
- id: 4
  action: Tap on Ok button
  expected: Error modal is dismissed
