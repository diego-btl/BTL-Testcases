description: 'Story: [NCI] Marketing Preference screen during registration'
preconditions:
- description: '"EnableNCIMarketingPreferences": "true" FF should be on'
- description: Connect the device to Proxyman to check the APIs calls
steps:
- id: 1
  action: Set device in English > Tap on Register CTA from the splash screen and continue
    the flow until reaching the password screen > Tap on Create account
  expected: 'Nissan Updates (Title) | X icon (dismisses the modal) | FINALIZE REGISTRATION
    cta | I would like to receive updates about (Optional): Offers and Promotions
    - Monthly updates on sales events, accessories, promotions. News and Events -
    Don''t miss out on the latest updates, including auto shows, vehicle reveals,
    and more. Product Updates - Stay in the know of our new product launches and updates.'
- id: 2
  action: Set device in French > Tap on Register CTA from the splash screen and continue
    the flow until reaching the password screen > Tap on Create account
  expected: 'Mises à jour Nissan (Title) | X icon | FINALISER L''INSCRIPTION cta |
    J’aimerais recevoir des mises à jour sur (facultatif): Offres et promotions -
    Mises à jour mensuelles sur les événements de vente, promotions et accessoires.
    Nouvelles et événements - Ne manquez pas les dernières mises à jour, y compris
    les salons de l’auto, les révélations de véhicules et plus encore. Mises à jour
    du produit - Restez au courant des lancements et des mises à jour de nos nouveaux
    produits.'
- id: 3
  action: Interact with the checkboxes
  expected: Verify the user can select and deselect the checkboxes by tapping on them
