  steps:
  - column_name: custom_steps
    id: 71867
    case_id: 41860
    text1: <p>Set device in English &gt; Tap on Register CTA from the splash screen
      and continue the flow until reaching the password screen &gt; Tap on Create
      account</p>
    text2: null
    text3: '<p>Verify Nissan Updates screen is displayed with the following information:</p><ul><li>Nissan
      Updates (Title)</li><li>X icon (dismisses the modal)</li><li>FINALIZE REGISTRATION
      cta</li><li><pre><code class="editor-plain language-plain code-block">- I would
      like to receive updates about (Optional):



      Offers and Promotions

      - Monthly updates on sales events, accessories, promotions.


      News and Events

      - Don''t miss out on the latest updates, including auto shows, vehicle reveals,
      and more.


      Product Updates

      - Stay in the know of our new product launches and updates.</code></pre></li></ul>'
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 71854
    case_id: 41860
    text1: <p>Set device in French &gt; Tap on Register CTA from the splash screen
      and continue the flow until reaching the password screen &gt; Tap on Create
      account</p>
    text2: null
    text3: '<ul><li>Mises à jour Nissan (Title)</li><li>X icon</li><li>FINALISER L''INSCRIPTION
      cta</li><li><pre><code class="editor-plain language-plain code-block">- J’aimerais
      recevoir des mises à jour sur (facultatif):


      Offres et promotions

      - Mises à jour mensuelles sur les événements de vente, promotions et accessoires.


      Nouvelles et événements

      - Ne manquez pas les dernières mises à jour, y compris les salons de l’auto,
      les révélations de véhicules et plus encore.


      Mises à jour du produit

      - Restez au courant des lancements et des mises à jour de nos nouveaux produits.</code></pre></li></ul>'
    text4: null
    display_order: 2
