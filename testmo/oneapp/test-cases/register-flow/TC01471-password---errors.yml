description: Verify Password and Confirm password errors during Registration
preconditions:
- description: User is on the final registration screen
steps:
- id: 1
  action: Enter a password which does not satisfy 4 of the listed criteria
  expected: 'Password field is displayed with red contour and red background. User
    should see an error as * Password does not meet requirements:'
- id: 2
  action: Enter a password which is not at least 8 characters
  expected: 'Password field is displayed with red contour and red background. User
    should see an error as * Password does not meet requirements:Note: User can only
    change to Confirm Password field only when the 4 listed criteria and password
    is at least 8 chars.'
- id: 3
  action: Enter a Confirm password that does not match with Password
  expected: Password and Confirm Password fields are displayed with red contour and
    red background. User should see an error as * Password do not match
- id: 4
  action: Tap the password show/hide icon
  expected: User should be able to show and hide their password
