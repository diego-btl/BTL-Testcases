steps:
- id: 1
  action: 'Log into an account with no preferred dealer set (NIS or INF) -> Go to
    Support>Parts and Accessories -> Verify the location showing on the webpage is
    nearest Canadian dealer location -> Now go to Find a dealer -> Set a dealer with
    a hash id (Nissan: choose Woodbine Nissan - postal code - M9W0C7. For Infiniti,
    choose 401-dixie Infiniti - postal code - L4W4N3 -> Once this dealer is set, and
    you see the VehiclePreferredDealer refetched -> Go to Vehicle>Parts and Accessories
    OR Support>Parts and Accessories'
  expected: The preferred dealer's location should show.
