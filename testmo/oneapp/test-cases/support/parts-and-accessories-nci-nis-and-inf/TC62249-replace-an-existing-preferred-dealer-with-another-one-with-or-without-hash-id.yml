metadata:
  id: TC62249
  name: Replace an existing preferred dealer with another one (with or without hash
    id)
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-06'
  updated: '2026-01-19'
  author: user_24
  testmo_id: 62249
  folder_id: 6822
steps:
- id: 1
  action: Log into an account with a preferred dealer. for e.g. nci126@nissancanada.com/2023Ariya
    -> Go to Support>Parts and Accessories -> Verify the location showing on the webpage
    is the one that shows under Find a dealer as the preferred dealer -> Now on Find
    a dealer screen, -> Put any other postal code, and select a different dealer ->
    Once this dealer is set, and you see the VehiclePreferredDealer refetched -> Go
    to Vehicle>Parts and Accessories OR Support>Parts and Accessories
  expected: 'EITHER | The new dealer location will show (this means that dealer has
    a hashid) | OR | The nearest Canadian dealer location will show (this means that
    the dealer didn''t have a hash id) | NOTE: currently, the old dealer''s location
    still shows - this is known Nissan issue'
