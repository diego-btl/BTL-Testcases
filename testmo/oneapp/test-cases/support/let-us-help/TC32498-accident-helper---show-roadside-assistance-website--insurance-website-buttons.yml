metadata:
  id: TC32498
  name: Accident Helper - Show Roadside Assistance Website & Insurance Website buttons
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-02'
  updated: '2025-04-02'
  author: user_15
  testmo_id: 65299
  folder_id: 81
description: The scope of this test case is to validate the correct functioning of
  the Roadside Assistance Website and Insurance Website ctas displayed on the Accident
  Helper screen when FF are enabled.iOS[NCESI] RSA and Insurance LinkoutsANDROID[NCESI]
  RSA and Insurance Linkouts
preconditions:
- description: EnableNcesiInsuranceLink = true
- description: EnableNcesiRSALink = true
steps:
- id: 1
  action: Login to app > Go to support screen > Tap on Accident Helper cta > Tap on
    At the Scene dropdown
  expected: Verify Roadside Assistance Website cta is displayed above Call Roadside
    Assistance cta
- id: 2
  action: Tap on Roadside Assistance Website cta
  expected: 'Verify a modal is displayed with the following copy:'
- id: 3
  action: User taps on Cancel button
  expected: Verify modal gets dismissed
- id: 4
  action: Tap on Roadside Assistance Website > Continue button
  expected: The URL should be the one displayed on ContactUs under "roadsideAid" parameter
- id: 5
  action: Go back to app > Tap on Insurance dropdown
  expected: Verify Insurancewebsite button is shown.
- id: 6
  action: Tap on Insurancewebsite button
  expected: 'Verify a modal is displayed with the following copy:'
- id: 7
  action: User taps on Cancel button
  expected: Verify modal gets dismissed
- id: 8
  action: Tap on Roadside Assistance Website > Continue button
  expected: The URL should be the one displayed on ContactUs under "ncesiInsurance"
    parameter
