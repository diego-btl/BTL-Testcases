steps:
- id: 1
  action: Sign in to an account with no vehicle and view Let Us Help module
  expected: The user should not see Schedule Service button
- id: 2
  action: Sign in to an account with vehicles, select a pending vehicle, and view
    Let Us Help module
  expected: The user should see a disabled Schedule Service button
- id: 3
  action: Sign in to an account with vehicles, select a non-pending vehicle, and view
    Let Us Help module
  expected: The user should see an enabled Schedule Service button
