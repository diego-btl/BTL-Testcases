test_case:
  preconditions: <p>Enable the following FF</p><ul><li><code>EnableNcesiInsuranceLink</code>
    = true</li><li><code>EnableNcesiRSALink</code> = true</li></ul>
  steps:
  - column_name: custom_steps
    id: 53019
    case_id: 32498
    text1: <p>Login to app &gt; Go to <code>support</code> screen &gt; Tap on <code>Accident
      Helper</code> cta &gt; Tap on <code>At the Scene</code> dropdown</p>
    text2: null
    text3: <p>Verify <code>Roadside Assistance Website</code> cta is displayed above
      <code>Call Roadside Assistance</code> cta</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 53020
    case_id: 32498
    text1: <p>Tap on <code>Roadside Assistance Website</code> cta</p>
    text2: null
    text3: '<p>Verify a modal is displayed with the following copy:</p><pre><code
      class="editor-plain language-plain code-block">- Are you sure?

      - You are being redirected to Nissan''s Buy Roadside Assistance portal.

      - Cancel and Continue buttons</code></pre>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 53021
    case_id: 32498
    text1: <p>User taps on <code>Cancel</code> button</p>
    text2: null
    text3: <p>Verify modal gets dismissed</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 53022
    case_id: 32498
    text1: <p>Tap on <code>Roadside Assistance Website</code>  &gt; <code>Continue</code>
      button</p>
    text2: null
    text3: <p>Verify user is led to a browser page. </p><ul><li>The URL should be
      the one displayed on <code>ContactUs</code> under <code>"roadsideAid"</code>
      parameter</li></ul>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 53023
    case_id: 32498
    text1: <p>Go back to app &gt; Tap on <code>Insurance</code> dropdown</p>
    text2: null
    text3: <p>Verify <code>Insurancewebsite</code> button is shown.</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 53024
    case_id: 32498
