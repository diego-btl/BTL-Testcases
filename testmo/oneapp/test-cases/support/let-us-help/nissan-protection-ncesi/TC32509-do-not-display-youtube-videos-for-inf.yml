metadata:
  id: TC32509
  name: Do not display YouTube videos for INF
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-03'
  updated: '2026-01-30'
  author: user_15
  testmo_id: 32509
