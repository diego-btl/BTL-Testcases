description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Embed Youtube
  video in catalogue page for Nissan brand - 2/18ANDROID[NCESI] Embed Youtube video
  in catalogue page for Nissan brand - 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: true'
steps:
- id: 1
  action: Login to NIS app > Go to Home screen > Tap on Nissan Protection
  expected: Verify user is led to the Nissan Protection screen
- id: 2
  action: Tap on View all Nissan Protection Products cta > Tap on Added Security Plan
    card > Tap on See details options from any plan
  expected: Verify INF app does not display any videos
