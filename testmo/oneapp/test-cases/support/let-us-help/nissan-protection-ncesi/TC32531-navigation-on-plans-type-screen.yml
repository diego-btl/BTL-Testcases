description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Allow user
  to view catalogue of plans - 2/18ANDROID[NCESI] Allow user to view catalogue of
  plans - 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: true'
- description: Mock GetServiceContract response (use attached mocks ENG/FR in case
    needed)
steps:
- id: 1
  action: Login to app > Get into Nissan Protection screen > Tap on View all Nissan
    Protection Products cta > tap on any plan type (ASP, PMP, CPO)
  expected: Verify ASP, PMP, or CPO page is displayed according to designs and that
    each card has See details option
- id: 2
  action: Go to header of the screen
  expected: Added Security plan | Prepaid Maintenance Plan | Certified Pre-Owned
- id: 3
  action: Tap on any of the plans from dropdown
  expected: Verify user is taken to the correct Plan type screen
- id: 4
  action: Tap on See details option from any card
  expected: Verify user is taken to Plan detail page where coverage details are displayed
    (use figma designs for this) and Buy Online cta at the bottom
