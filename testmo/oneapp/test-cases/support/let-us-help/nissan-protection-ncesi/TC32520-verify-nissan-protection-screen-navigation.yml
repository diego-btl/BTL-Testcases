test_case:
  preconditions: '<p>Set FFs as follows</p><ul><li><code>EnableNcesiServiceContracts</code>:
    true</li><li><code>EnableNcesiCatalogue</code>: true</li><li>Mock GetServiceContract
    response (use attached mocks ENG/FR in case needed)</li></ul>'
  steps:
  - column_name: custom_steps
    id: 53144
    case_id: 32520
    text1: <p>Use mock provided &gt; Login to app &gt; Go to <code>Nissan Protection</code>
      card </p>
    text2: null
    text3: <p>Verify there is a call trigger for <code>GetServiceContract</code> API
      for the selected VIN and a loading icon is displayed in the screen until a response
      is retrieved.</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 53145
    case_id: 32520
    text1: <p>Go to Service Contract Section</p>
    text2: null
    text3: '<p>Compare mapping: </p><ul><li>Status: Displayed in hierarchal order<code>Active
      =&gt; Expiring Soon =&gt; Expired =&gt; Cancelled</code></li><li>coverageName:
      Name of the plan</li><li>coverage: This will affect the icon displayed for each
      plan.<ul><li>For <strong>Nissan</strong>:<ul><li>(English acronyms on the left,
      FR equivalent on the right)<ul><li>CPO = VOC</li><li>PMP = PEP</li><li>ASP =
      PSP</li></ul></li></ul></li><li>For <strong>Infiniti</strong>:<ul><li>(English
      acronyms on the left, FR equivalent on the right)<ul><li>[Nissan’s ASP] IPP
      = PPI</li><li>CPO = VOC</li><li>PMP = PEP</li></ul></li></ul></li></ul></li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 53206
    case_id: 32520
    text1: <p>Go to <code>Basic Coverage</code> section</p>
    text2: null
    text3: <p>Verify Roadside Assistance coverage information is displayed:</p><ul><li>Only
      months are displayed (no mileage should be shown)</li><li>Flat tires, Dead battery,
      Low fuel, locked out buttons are present.</li></ul>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 53146
    case_id: 32520
    text1: <p>Background/foreground the app </p>
    text2: null
    text3: <p>Verify <code>GetServiceContract</code> API is not called again</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 53147
    case_id: 32520
    text1: <p>Cold start the app</p>
    text2: null
    text3: <p>Verify there is a call for <code>GetServiceContract</code> API for the
      selected VIN</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 53148
    case_id: 32520
    text1: <p>Change vehicles &gt; Tap <code>Nissan Protection</code> card </p>
    text2: null
    text3: <p>Verify <code>GetServiceContract</code> API is called again for the selected
      VIN</p>
    text4: null
    display_order: 6
  - column_name: custom_steps
    id: 53149
    case_id: 32520
    text1: <p>Mock <code>GetServiceContract</code> API to fail</p>
    text2: null
    text3: <p>Verify the app displays empty state</p>
    text4: null
    display_order: 7
