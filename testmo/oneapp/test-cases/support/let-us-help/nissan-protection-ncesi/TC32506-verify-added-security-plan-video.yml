test_case:
  preconditions: '<p>Set FFs as follows</p><ul><li><code>EnableNcesiServiceContracts</code>:
    true</li><li><code>EnableNcesiCatalogue</code>: false</li></ul>'
  steps:
  - column_name: custom_steps
    id: 53072
    case_id: 32506
    text1: <p>Login to app &gt; Go to <code>Home</code> screen &gt; Tap on <code>Nissan
      Protection</code> </p>
    text2: null
    text3: <p>Verify user is led to the <code>Nissan Protection</code> screen</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 53073
    case_id: 32506
    text1: <p>Tap on <code>View all Nissan Protection Products</code> cta &gt; Tap
      on <code>Added Security Plan</code> card &gt; Tap on <code>See details</code>
      options from any plan</p>
    text2: null
    text3: '<p>Verify on the plan details screen a video is displayed. The video displayed
      should come from <code>ContactUS</code> response:</p><p><strong>ENG</strong>:</p><pre><code
      class="editor-plain language-plain code-block">"nissanAddedSecurityPlanVideo":
      "https://www.youtube.com/watch?v=nSAoQ7z7mv0&amp;list=PLA8ZGzsP1Qb98jOMEASBM_pKnJAvz3RIT&amp;index=8"</code></pre><p><strong>FR</strong>:</p><pre><code
      class="editor-plain language-plain code-block">"nissanAddedSecurityPlanVideo":
      "https://www.youtube.com/watch?v=VCvx-krxQCM&amp;list=PLA8ZGzsP1Qb99L7ZkeJdgMriJVxWVPUZa&amp;index=8"</code></pre>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 53074
    case_id: 32506
    text1: <p>Tap to play the video</p>
    text2: null
    text3: <p>Verify the video plays on the same screen, user can pause it, see it
      on full size in landscape or portrait mode.</p>
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 53075
    case_id: 32506
    text1: <p>If the user is seeing the video on full-size &gt; Tap on X icon</p>
    text2: null
    text3: <p>The window will minimize again and take the user to the same plan details
      screen</p>
    text4: null
    display_order: 4
  - column_name: custom_steps
    id: 53076
    case_id: 32506
    text1: <p>User goes back to the previous screen while video is playing</p>
    text2: null
    text3: <p>Verify upon return the video is in an unplayed state</p>
    text4: null
    display_order: 5
  - column_name: custom_steps
    id: 53077
    case_id: 32506
    text1: <p>User goes background the app while video is playing</p>
    text2: null
    text3: <p>Verify when doing a foreground, the video displays paused</p>
    text4: null
    display_order: 6
