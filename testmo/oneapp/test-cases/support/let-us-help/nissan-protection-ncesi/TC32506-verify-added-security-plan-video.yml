metadata:
  id: TC32506
  name: Verify Added Security Plan video
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2025-04-03'
  updated: '2026-01-30'
  author: user_15
  testmo_id: 32506
  folder_id: 4164
description: The scope of this test case is to validate the correct functioning of
  the embedded YouTube video when FF are enabled. Nissan NCI will be the only brand
  and region showing the videos; INF NCI will not display themiOS[NCESI] Embed Youtube
  video in catalogue page for Nissan brand - 2/18ANDROID[NCESI] Embed Youtube video
  in catalogue page for Nissan brand - 2/18
preconditions:
- description: 'EnableNcesiServiceContracts: true'
- description: 'EnableNcesiCatalogue: false'
steps:
- id: 1
  action: Login to app > Go to Home screen > Tap on Nissan Protection
  expected: Verify user is led to the Nissan Protection screen
- id: 2
  action: Tap on View all Nissan Protection Products cta > Tap on Added Security Plan
    card > Tap on See details options from any plan
  expected: 'Verify on the plan details screen a video is displayed. The video displayed
    should come from ContactUS response: | ENG: | "nissanAddedSecurityPlanVideo":
    "https://www.youtube.com/watch?v=nSAoQ7z7mv0&list=PLA8ZGzsP1Qb98jOMEASBM_pKnJAvz3RIT&index=8"FR:'
- id: 3
  action: Tap to play the video
  expected: Verify the video plays on the same screen, user can pause it, see it on
    full size in landscape or portrait mode.
- id: 4
  action: If the user is seeing the video on full-size > Tap on X icon
  expected: The window will minimize again and take the user to the same plan details
    screen
- id: 5
  action: User goes back to the previous screen while video is playing
  expected: Verify upon return the video is in an unplayed state
- id: 6
  action: User goes background the app while video is playing
  expected: Verify when doing a foreground, the video displays paused
