  Story: https://www.pivotaltracker.com/story/show/188217570'
preconditions:
- description: 'Vehicle model: QX80'
- description: 'Year of Vehicle: 2025'
steps:
- id: 1
  action: Login to the app
  expected: The user logs in successfully
- id: 2
  action: Select QX80 vehicle
  expected: Vehicle selected successfully
- id: 3
  action: Go to Support > customer care
  expected: Text for CEC sectionContact your dedicated QX80 Client Experience Coordinator
    with any questions Mon – Fri 8AM – 5PM CT | CTAs:Call Client Experience Coordinator
    | Email Client Experience Coordinator
- id: 4
  action: Tap on the Call Client Experience Coordinator CTA
  expected: 'Native modal is prompted to call the number: 1-877-980-4968'
- id: 5
  action: Tap on Cancel
  expected: Action dismiss the modal
- id: 6
  action: Tap on the Call Client Experience Coordinator CTA
  expected: Modal displayed again
- id: 7
  action: Tap on Call 1(877)980-4968 option
  expected: App will display the native caller
- id: 8
  action: Tap on the Email Client Experience Coordinator CTA
  expected: Email address is QX80ClientExperienceCoordinator@Infiniti.com
