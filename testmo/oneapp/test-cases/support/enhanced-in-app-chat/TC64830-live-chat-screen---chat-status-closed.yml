metadata:
  id: TC64830
  name: Live Chat Screen - Chat Status Closed
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-27'
  updated: '2026-01-28'
  author: user_23
  testmo_id: 65310
  folder_id: 7146
description: 'Validates Live Chat screen UI elements display correctly when chat departments
  are closed (availableNow: false), including info icon and after-hours message modal.Preconditions:EnableEnhancedInAppChat
  FF = trueUser is logged inLiveChatHours query returns availableNow: false for departments'
steps:
- id: 1
  action: Navigate to Support screen and tap Chat card
  expected: User is redirected to Live Chat screen | Screen displays back button,
    title, brand-specific header text, and instruction text
- id: 2
  action: Validate department cards display with Closed status and info icon
  expected: 'Two department cards displayed with Chat Status: Closed | Cards are in
    disabled state | Info icon (i) displayed on right side of each card'
- id: 3
  action: Tap info icon on first department card
  expected: Modal displays with department title, close button, and afterHourMessage
    from response
- id: 4
  action: Close modal and tap info icon on second department card
  expected: Modal displays with department title, close button, and afterHourMessage
    for that department
- id: 5
  action: Validate GO TO CHAT button and cards remain disabled
  expected: GO TO CHAT button remains disabled | Cards remain disabled and cannot
    be selected
- id: 6
  action: Validate SMS support section displays
  expected: Text and link displayed
