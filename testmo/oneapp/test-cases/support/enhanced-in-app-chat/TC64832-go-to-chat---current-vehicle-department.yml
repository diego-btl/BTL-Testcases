description: 'Validates Salesforce payload content when user selects Current Vehicle
  department and taps GO TO CHAT. Preconditions: EnableEnhancedInAppChat FF = true
  User is logged in LiveChatHours query returns availableNow: true for departments
  User is on Live Chat screen'
steps:
- id: 1
  action: Tap on Current Vehicle card (e.g., My Current INFINITI Vehicle or My Current
    Nissan Vehicle), then tap GO TO CHAT button
  expected: Enhanced Chat UI loads
- id: 2
  action: Validate payload sent to Salesforce endpoint nissanna.my.salesforce-scrt.com/iamessage/v1/conversation
  expected: 'Payload includes:conversationId: UUID format | routingAttributes (all
    values from VehicleStaticData):Services: Brand-specific Current Vehicle department:INFINITI:
    InfinitiCAMobile | Nissan: MyCurrentNissan | Zipcode, Street, City, State: User
    address | PhoneNumber, myfirstName, mylastName, myEmail: User contact info | OwnerVehicleInformation:
    Comma-separated list of vehicles with format: Brand Model Year VIN | OSVersion:
    Device OS version | DeviceManufacturer: Device manufacturer name | AppVersion:
    App version | AppName: Brand-specific app name (MyINFINITI or MyNISSAN) | language:
    en-US'
