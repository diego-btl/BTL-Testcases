metadata:
  id: TC64829
  name: Live Chat Screen - Chat Status Open
  feature: test-cases
  priority: high
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2026-01-27'
  updated: '2026-01-28'
  author: user_23
  testmo_id: 64829
  folder_id: 7146
description: 'Validates Live Chat screen UI elements display correctly when chat departments
  are open (availableNow: true).Preconditions:EnableEnhancedInAppChat FF = trueUser
  is logged inLiveChatHours query returns availableNow: true for departments'
steps:
- id: 1
  action: Navigate to Support screen and tap Chat card
  expected: 'User is redirected to Live Chat screen | Screen displays:Back button
    in top left | Title: Live Chat | Brand-specific header text:Nissan: Chat with
    a Nissan agent | INFINITI: Chat with an INFINITI agent | Text: Please select one
    topic from the following'
- id: 2
  action: Validate department cards display with Open status
  expected: 'Two department cards are displayed:Brand-specific card names:Nissan:
    MyNISSAN App Support and My Current Nissan Vehicle | INFINITI: MyINFINITI App
    Support and My Current INFINITI Vehicle | Each card shows: Chat Status: Open (green
    text)'
- id: 3
  action: Validate GO TO CHAT button state
  expected: GO TO CHAT button is displayed | Button is initially disabled (grey)
- id: 4
  action: Tap on one department card (e.g., MyNISSAN App Support)
  expected: Green checkmark icon appears on the right side of selected card | GO TO
    CHAT button becomes enabled (active)
- id: 5
  action: Validate SMS support section displays
  expected: 'Text: Need support by SMS/Text? is displayed | Link: APP SUPPORT BY SMS
    is displayed'
