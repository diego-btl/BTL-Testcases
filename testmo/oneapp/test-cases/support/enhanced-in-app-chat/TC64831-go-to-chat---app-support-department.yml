description: 'Validates Salesforce payload content when user selects App Support department
  and taps GO TO CHAT. Preconditions: EnableEnhancedInAppChat FF = true User is logged
  in LiveChatHours query returns availableNow: true for departments User is on Live
  Chat screen'
steps:
- id: 1
  action: Tap on App Support card (e.g., MyINFINITI App Support or MyNISSAN App Support),
    then tap GO TO CHAT button
  expected: Enhanced Chat UI loads
- id: 2
  action: Validate payload sent to Salesforce endpoint nissanna.my.salesforce-scrt.com/iamessage/v1/conversation
  expected: 'Payload includes:conversationId: UUID format | routingAttributes (all
    values from VehicleStaticData):Services: Brand-specific App Support department:INFINITI:
    InfinitiConnectionMobile | Nissan: NissanConnect | Zipcode, Street, City, State:
    User address | PhoneNumber, myfirstName, mylastName, myEmail: User contact info
    | OwnerVehicleInformation: Comma-separated list of vehicles with format: Brand
    Model Year VIN | OSVersion: Device OS version | DeviceManufacturer: Device manufacturer
    name | AppVersion: App version | AppName: Brand-specific app name (MyINFINITI
    or MyNISSAN) | language: en-US'
