    text1: <p>Tap on Current Vehicle card (e.g., <code>My Current INFINITI Vehicle</code>
      or <code>My Current Nissan Vehicle</code>), then tap <code>GO TO CHAT</code>
      button</p>
    text2: null
    text3: <ul><li>Enhanced Chat UI loads</li></ul>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 102497
    case_id: 64832
    text1: <p>Validate payload sent to Salesforce endpoint <code>nissanna.my.salesforce-scrt.com/iamessage/v1/conversation</code></p>
    text2: null
    text3: '<ul><li>Payload includes:<ul><li><code>conversationId</code>: UUID format</li><li><code>routingAttributes</code>
      (all values from <code>VehicleStaticData</code>):<ul><li><code>Services</code>:
      Brand-specific Current Vehicle department:<ul><li>INFINITI: <code>InfinitiCAMobile</code></li><li>Nissan:
      <code>MyCurrentNissan</code></li></ul></li><li><code>Zipcode</code>, <code>Street</code>,
      <code>City</code>, <code>State</code>: User address</li><li><code>PhoneNumber</code>,
      <code>myfirstName</code>, <code>mylastName</code>, <code>myEmail</code>: User
      contact info</li><li><code>OwnerVehicleInformation</code>: Comma-separated list
      of vehicles with format: <code>Brand Model Year VIN</code></li><li><code>OSVersion</code>:
      Device OS version</li><li><code>DeviceManufacturer</code>: Device manufacturer
      name</li><li><code>AppVersion</code>: App version</li><li><code>AppName</code>:
      Brand-specific app name (<code>MyINFINITI</code> or <code>MyNISSAN</code>)</li></ul></li><li><code>language</code>:
      <code>en-US</code></li></ul></li></ul>'
    text4: null
    display_order: 2
