description: CONTEXTThere's a Canadian legislation named Quebec Bill 29, “An Act to
  protect consumers against planned obsolescence and to promote the durability, repairability
  and maintenance of goods”, which comes into effect on October 5, 2025.For Nissan
  Canada Inc. (NCI), this means they're required to clearly communicate the availability
  of replacement parts and repair services to consumers across provinces.This feature
  ensures compliance by adding explanatory copy in user manuals and warranty pages
  within the MyNissan and MyInfiniti apps. https://www.figma.com/design/Wc99oBzCMjx1g0lmm3SkH6/-Share--MyNissan-1.5--NCI-?t=C4Ep3ioKvCk6E3qh-0https://www.figma.com/design/YCob43R7CpbqmSvdvIalfu/-SHARE--MyInfiniti-1.5--NCI-?t=FBAKWDYV97qZCHX6-0
