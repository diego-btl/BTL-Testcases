metadata:
  id: TC00555
  name: Sign in screen links
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2025-10-06'
  author: user_2
  testmo_id: 65059
  folder_id: 40
preconditions:
- description: App is fresh installed or cache cleared
- description: User is already on the Login page
- description: User has never logged into the app
steps:
- id: 1
  action: Tap on the Forgot Password? link
  expected: The app should open an external browser page, and navigate the user to
    the proper location
- id: 2
  action: Return to the app and tap on Privacy & Terms
  expected: Privacy Policy | Terms of Service | Do Not Sell My Personal Information
    | Cancel
- id: 3
  action: Tap on Privacy Policy
  expected: 'An external webview is displayed on a browser directing to Privacy Policy
    website.Note: IOS users are able to return using back arrow on top left corner,
    whereas Android users need to tap on device back button to return to the app)'
- id: 4
  action: Tap on the top right back button
  expected: User should be driven back to the Login page
- id: 5
  action: Tap on Privacy & Terms and select Terms of Service
  expected: A webview should be displayed with a title that says "Terms of Service"
- id: 6
  action: Tap on the top right back button to return to the Login page -> Tap on Privacy
    & Terms and select Do Not Sell My Personal Information
  expected: 'An external webview is displayed on a browser directing to Data Privacy
    website.Note: IOS users are able to return using back arrow on top left corner,
    whereas Android users need to tap on device back button to return to the app)'
- id: 7
  action: Tap on the top right back button to return to the Login page -> Tap on Privacy
    & Terms and select Cancel
  expected: The half screen modal should be dismissed
- id: 8
  action: Return to the app and tap on the Back button, located at the top left of
    the app
  expected: The user should be driven to the Landing screen
- id: 9
  action: Login to the app and navigate into Settings
  expected: Terms of Service | Privacy Policy | Do Not Sell My Personal Information
- id: 10
  action: Tap on Privacy Policy
  expected: A webview should be displayed with a title that says "Privacy Policy"
- id: 11
  action: Tap on Do Not Sell My Personal Information
  expected: A webview should be displayed with a title that says "Data Privacy"
- id: 12
  action: Tap on Privacy & Terms and select Terms of Service
  expected: A webview should be displayed with a title that says "Terms of Service"
