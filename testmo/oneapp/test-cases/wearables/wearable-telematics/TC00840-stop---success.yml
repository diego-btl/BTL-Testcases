preconditions:
- description: User has sent a start command and is on the telematics screen
steps:
- id: 1
  action: Tap the Stop button2. Tap Yes3. Wait for call to succeed
  expected: User should see a confirmation modal2. Stop command should be sent and
    user should see modal dismiss itself. User should see status updates as the call
    is being made3. User should see the start countdown stop, an engine off message,
    the start button in the inactive state, and stop button become disabled
- id: 2
  action: Tap the Stop button2. Tap No
  expected: The modal should be dismissed and command should not be sent
