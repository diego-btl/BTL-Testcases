preconditions:
- description: User has a vehicle that supports lock/unlock and is on the telematics
    screen
steps:
- id: 1
  action: Tap the Lock button -> Tap Yes
  expected: User should see a confirmation modal | Lock command should be sent and
    user should see modal dismiss itself. User should see status updates as the call
    is being made. User should see the final lock status when the call complete successfully
- id: 2
  action: Tap the Lock button -> Tap No
  expected: The modal should be dismissed and command should not be sent
