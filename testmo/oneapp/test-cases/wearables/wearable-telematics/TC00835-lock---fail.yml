metadata:
  id: TC00835
  name: Lock - Fail
  feature: test-cases
  priority: medium
  platforms:
  - iOS
  - Android
  regions:
  - USA
  tags: []
  created: '2023-08-01'
  updated: '2024-10-17'
  author: user_2
  testmo_id: 835
  folder_id: 76
preconditions:
- description: User has a vehicle that supports lock/unlock and is on the telematics
    screen
steps:
- id: 1
  action: Tap the Lock button -> Tap Yes -> Force call to fail -> Try again
  expected: User should see a confirmation modal | Lock command should be sent and
    user should see the modal dismiss itself. User should see status updates as the
    call is being made. User should see the status updates as the call is being made
    | User should see a failure modal when the call fails | User should see Lock flow
    try again
- id: 2
  action: Tap the Lock button -> Tap Yes -> Force call to fail -> Tap No
  expected: The modal should be dismissed and command should not be sent
