- description: Choose Ariya in Vehicle Selector
steps:
- id: 1
  action: Connect device to proxy -> Login into the App -> Wait for all initial APIs
    to finish loading -> Modify VehicleClimateStatus so that data.state is ON -> Modify
    ClimateServiceRequest so that data.checkRemoteClimateRequest.status is SUCCESS
    -> Modify RefreshClimateStatus so that refreshClimateStatus.success is TRUE ->
    BG/FG the app -> Observe the lock status in the home hero
  expected: See in the Home Hero modal that the climate status was successfully sfuly
    turned on
