preconditions:
- description: User has already sent a start command and is on the telematics screen
steps:
- id: 1
  action: Tap the Start button -> Tap Yes -> Wait for call to succeed
  expected: User should see a confirmation modal | Start command should be sent and
    user should see modal dismiss itself. User should see status updates as the call
    is being made | User should see the start countdown and the start button in the
    active state while it is running. User should also see stop button become enabled
- id: 2
  action: Tap the Start button -> Tap No
  expected: The modal should be dismissed and command should not be sent
