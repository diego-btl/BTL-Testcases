preconditions:
- description: User has a vehicle that supports start/stop and is on the telematics
    screen
steps:
- id: 1
  action: 1. Tap the Start button 2. Tap Yes 3. Force call to fail 4. Try again
  expected: '1. User should see a confirmation modal 2. Start command should be sent
    and user should see the modal dismiss itself. User should see status updates as
    the call is being made. User should see the status updates as the call is being
    made 3. User should see a failure modal when the call fails 4. User should see
    Start flow try again Note: If user taps No on any of the modals, modal should
    be dismissed and command should not be sent'
