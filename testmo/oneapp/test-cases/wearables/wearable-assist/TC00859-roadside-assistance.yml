preconditions:
- description: User is on the Assist screen and has the Roadside Assistance capability
steps:
- id: 1
  action: Tap Roadside Assistance -> Tap Call
  expected: 'User should see a modal to call the Roadside Assistance phone number
    | User should be able to call:Nissan - NNA: 1-800-225-2476 | Nissan - NCI: 1-800-267-5936
    | Infiniti - NNA: 1-800-835-0221 | Infiniti - NCI: 1-800-361-4792'
- id: 2
  action: Tap Roadside Assistance -> Tap Call -> Tap Cancel
  expected: Modal should dismiss itself
- id: 3
  action: Tap Roadside Assistance -> Tap Get Roadside Assistance Online
  expected: The user should be redirect to > https://responseroadservice.com/auth/signin
