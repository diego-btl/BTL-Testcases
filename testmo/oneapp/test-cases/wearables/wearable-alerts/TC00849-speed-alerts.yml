preconditions:
- description: User is on the Alerts page
steps:
- id: 1
  action: Tap Speed Alerts -> User should see a list of all existing speed alerts
    -> The user tap in the toggle button -> The request was successful
  expected: User should be able to toggle the alert on/off and see a spinner until
    the call is complete | When The Alert Success the toggle gets updated properly
- id: 2
  action: Tap Speed Alerts -> User should see a list of all existing speed alerts
    -> The user tap in the toggle button -> The request fails
  expected: The toggle reverts to the previous position | When The Alert Fails the
    "Your Speed alert failed to turn on, Please try your request again" message should
    be displayed
