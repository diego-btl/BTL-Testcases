  - column_name: custom_steps
    id: 49007
    case_id: 30086
    text1: <p>First and Last Name</p>
    text2: null
    text3: '<ul><li>Both First and Last Name can accept spaces</li><li>It should accept
      accents (á, é, ê, ã,õ, ç)</li><li>It should <mark class="marker-yellow"><strong>NOT</strong></mark>
      accept:<ul><li>Special characters:  <code>@, $, %, &amp;</code></li><li>Quotes:
      <code>", '',</code></li><li>Brackets: <code> (, ), [, ], {, }</code></li><li>Symbols: <code>
      &lt;, &gt;, /, \, |, ;, : </code><br /> </li></ul></li></ul>'
    text4: null
    display_order: 2
  - column_name: custom_steps
    id: 49008
    case_id: 30086
    text1: <p>CPF</p>
    text2: null
    text3: "<ul><li>Same digit CPFs should not be allowed (i.e <code>00000000000</code>\
      \ , <code>11111111111</code>, <code>22222222222</code>, <code>33333333333</code>,\
      \ etc.)</li></ul><pre><code class=\"editor-plain language-plain code-block\"\
      >First digit validation\n- for each of the first nine digits of the CPF, assign\
      \ a multiplier from 10 to 2\n- Multiply each of the digits by each multiplier\
      \ and sum up\n- Divide the result by 11\n- If the remainder is smaller than\
      \ 2, DV = 0\n- If not, DV = 11 - remainder (modulo)\n- DV should be the first\
      \ digit</code></pre><p> </p><pre><code class=\"editor-plain language-plain code-block\"\
      >Second digit validation\n- for each of the first 10 digits of the CPF, assign\
      \ a multiplier from 11 to 2\n- Multiply each of the digits by each multiplier\
      \ and sum up\n- Divide the result by 11 and obtain the remainder (modulo)\n\
      - If the remainder is smaller than 2, DV = 0\n- If not, DV = 11 - remainder</code></pre><pre><code\
      \ class=\"editor-plain language-plain code-block\">Example:\nCPF: 14063203077\n\
      - Expected value for First DV (FDV): 7\n - Sum = 10*1 + 9*4 + 8*0 + 7*6 + 6*3\
      \ + 5*2 + 4*0 + 3*3 + 2*0 = 125\n - 125%11 = 4\n - First DV = 11 - 4 = 7\n\n\
      - Expected value for Second DV (FDV): 7\n - Sum = 11*1 + 10*4 + 9*0 + 8*6 +\
      \ 7*3 + 6*2 + 5*0 + 4*3 + 3*0 + 2*7= 158\n - 158%11 = 4\n - Second DV = 11 -\
      \ 4 = 7\n\n</code></pre>"
    text4: null
    display_order: 3
  - column_name: custom_steps
    id: 49009
    case_id: 30086
    text1: <p>Phone Number</p>
    text2: null
    text3: <ul><li>Phone number will have 10 or 11 numeric digits:</li><li>Format
