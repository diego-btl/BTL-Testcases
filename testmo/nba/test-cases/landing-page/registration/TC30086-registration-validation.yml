  - column_name: custom_steps
    id: 49010
    case_id: 30086
    text1: <p>Email</p>
    text2: null
    text3: '<p>For email, it should have the same validation logic as NNA:</p><ul><li>at
      least one character before <code>@</code></li><li>at least one character after
      <code>@</code></li><li>at least two characters after <code>.</code></li><li>This
      feature should respect the NNA behavior for warning messages</li><li>iOS: always
      displayed at the bottom</li><li>Android: always displayed right below the correspondent
      text box</li></ul>'
    text4: null
    display_order: 5
