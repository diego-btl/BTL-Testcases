  tags: []
test_case:
  preconditions: <p>First, set the feature flag <code>NewCarCampaignCard</code> to
    one of <code>EnableNewSUV</code>, <code>EnablePreSale</code>, or <code>EnableNewKicks</code>
    in FirebaseConfig, then change it to <code>FALSE</code>.</p>
  steps:
  - column_name: custom_steps
    id: 48750
    case_id: 29863
    text1: <p>Open the application when <code>NewCarCampaignCard</code> is set to
      one of the enabled states and verify the corresponding card appears.</p>
    text2: null
    text3: <p>The corresponding card should be displayed.</p>
    text4: null
    display_order: 1
  - column_name: custom_steps
    id: 48751
    case_id: 29863
    text1: <ol><li>Change <code>NewCarCampaignCard</code> to <code>FALSE</code> in
      FirebaseConfig.</li><li>Restart application.</li></ol>
    text2: null
    text3: <p>The previously displayed card should no longer be visible.</p>
    text4: null
    display_order: 2
